<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seksuele straatintimidatie — JS Legal Force</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--blauw:#1a2a5e;--blauw-licht:#2d4099;--blauw-mid:#243580;--grijs-licht:#f2f4f8;--grijs-mid:#dde2ef;--wit:#fff;--groen:#1a7a4a;--groen-licht:#e6f4ed;--oranje:#e6960a;--oranje-licht:#fff8e6;--rood:#b52a2a;--rood-licht:#faeaea;--tekst:#1a2a5e;--tekst-mid:#4a5578;--zilver:#8a9ab5;--radius:12px;--shadow:0 4px 24px rgba(26,42,94,.09);--shadow-sm:0 2px 10px rgba(26,42,94,.06);--ui:'Outfit',system-ui,sans-serif;--lees:'Source Serif 4',Georgia,serif;--kolom:1180px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ui);background:var(--grijs-licht);color:var(--tekst);line-height:1.5;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--blauw-licht);outline-offset:2px;border-radius:8px}
header.app{position:sticky;top:0;z-index:40}
.bar{background:var(--blauw);color:#fff;display:flex;align-items:center;justify-content:center;gap:14px;padding:11px}
.bar .shield{position:relative;width:38px;height:42px;display:grid;place-items:center}.bar .shield svg{width:38px;height:42px;color:rgba(255,255,255,.16)}.bar .shield .js{position:absolute;font:800 12px/1 var(--ui);color:#fff}
.bar .merk{font-weight:800;font-size:1.2rem}
.substrip{background:var(--blauw-mid);color:#b9c3e6;text-align:center;font-size:.7rem;font-weight:700;letter-spacing:.15em;padding:6px 12px;text-transform:uppercase}
main{max-width:var(--kolom);margin:0 auto;padding:16px 20px 26px}
@media(max-width:640px){main{padding:14px 14px 24px}}
.status{margin-bottom:11px}
.status-row{display:flex;justify-content:space-between;align-items:baseline;color:var(--zilver);font-size:.8rem;font-weight:600;margin-bottom:6px}
.status-row .soort{color:var(--blauw-licht);text-transform:uppercase;letter-spacing:.08em;font-size:.72rem}
.pbar{height:5px;background:var(--grijs-mid);border-radius:99px;overflow:hidden}.pbar>i{display:block;height:100%;background:var(--blauw);border-radius:99px;transition:width .35s}
.card{background:var(--wit);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--grijs-mid);border-top:4px solid var(--blauw);padding:22px 34px 24px}
@media(max-width:640px){.card{padding:18px 18px}}
.ptitle{font-weight:800;font-size:1.5rem;letter-spacing:-.01em;margin:0 0 10px;padding-bottom:2px}
.pintro{color:var(--tekst-mid);font-size:1rem;margin:-6px 0 14px}
.main p{font-family:var(--lees);font-size:1.06rem;line-height:1.65;margin:0 0 11px;text-align:left}.main p:last-child{margin-bottom:0}
.lees{font-family:var(--lees);font-size:1.06rem;line-height:1.55;margin:0 0 10px}
sup.fn{font-family:var(--ui);font-size:.62em;font-weight:700;color:var(--blauw-licht);vertical-align:super;line-height:0;margin-left:1px;padding:0 1px}
.bronnen-blok{margin-top:16px;padding-top:12px;border-top:1px solid var(--grijs-mid)}
.bb-t{font-family:var(--ui);font-weight:700;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tekst-mid);margin-bottom:8px}
.bb-l{list-style:none;counter-reset:bron;margin:0;padding:0}
.bb-l li{font-family:var(--lees);font-style:italic;font-size:.84rem;line-height:1.55;color:var(--tekst-mid);margin:4px 0;padding-left:22px;position:relative;counter-increment:bron}
.bb-l li::before{content:counter(bron);position:absolute;left:2px;top:1px;font-family:var(--ui);font-style:normal;font-weight:700;font-size:.7rem;color:var(--blauw-licht)}
.tophead{display:flex;gap:12px;align-items:center;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--grijs-mid)}
.itile{width:40px;height:40px;border-radius:11px;background:var(--grijs-licht);border:1px solid var(--grijs-mid);display:grid;place-items:center;flex-shrink:0}.itile svg{width:22px;height:22px;color:var(--blauw-licht)}
.tophead .ohint{color:var(--zilver);font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tophead .otitel{font-weight:800;font-size:1.05rem;line-height:1.2}
ul.lo{list-style:none}ul.lo li{display:flex;gap:11px;align-items:flex-start;margin:8px 0;font-family:var(--lees);font-size:1.04rem}
ul.opsom{list-style:none;margin:8px 0 0}ul.opsom li{position:relative;padding-left:22px;margin:10px 0;font-family:var(--lees);font-size:1.04rem;line-height:1.5;color:var(--tekst)}ul.opsom li::before{content:"";position:absolute;left:4px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--blauw-licht)}
.lo-ic{width:22px;height:22px;color:var(--groen);flex-shrink:0;margin-top:1px}.lo-ic svg{width:22px;height:22px}
.kaart{border-radius:12px;padding:12px 18px;margin:12px 0 0;border:1px solid var(--grijs-mid);box-shadow:var(--shadow-sm);border-left:4px solid var(--zilver);background:var(--wit)}
.kaart-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}.kaart-ic{width:20px;height:20px;flex-shrink:0}.kaart-ic svg{width:20px;height:20px}
.kaart-lab{font-weight:800;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.kaart-t{font-weight:700;font-size:1.02rem;margin:0 0 5px}
.kaart-b p,.kaart-b li{font-family:var(--lees);font-size:1rem;line-height:1.54;margin:0 0 5px}.kaart-b p:last-child,.kaart-b li:last-child{margin-bottom:0}
.kaart-b .wet{font-style:italic}
.kaart-b .punten{list-style:none}.kaart-b .punten li{position:relative;padding-left:18px}.kaart-b .punten li::before{content:"";position:absolute;left:2px;top:.7em;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5}
.k-kader{border-left-color:var(--blauw-licht);background:#f7f9fd}.k-kader .kaart-ic,.k-kader .kaart-lab{color:var(--blauw-licht)}
.k-praktijk{border-left-color:#217373;background:#f0f8f8}.k-praktijk .kaart-ic,.k-praktijk .kaart-lab{color:#217373}
.k-voorbeeld{border-left-color:var(--blauw-mid);background:var(--grijs-licht)}.k-voorbeeld .kaart-ic,.k-voorbeeld .kaart-lab{color:var(--blauw-mid)}
.k-letop{border-left-color:var(--oranje);background:var(--oranje-licht)}.k-letop .kaart-ic,.k-letop .kaart-lab{color:#a06c00}
.k-onthoud{border-left-color:var(--groen);background:var(--groen-licht)}.k-onthoud .kaart-ic,.k-onthoud .kaart-lab{color:var(--groen)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:var(--ui);font-weight:700;font-size:1rem;border:none;border-radius:10px;padding:12px 22px;cursor:pointer;transition:filter .15s,transform .05s,background .15s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--blauw);color:#fff}.btn-primary:hover{filter:brightness(1.13)}.btn-primary[disabled]{background:var(--grijs-mid);color:var(--zilver);cursor:not-allowed;filter:none}
.btn-ghost{background:transparent;color:var(--blauw);border:1.5px solid var(--grijs-mid)}.btn-ghost:hover{background:var(--grijs-licht)}
.btn-groen{background:var(--groen);color:#fff}.btn-groen:hover{filter:brightness(1.08)}
.nav .btn{min-width:130px}.nav .sp{flex:1}
@media(max-width:520px){.nav .btn{min-width:0;flex:1;padding:14px 12px}}
label.f{display:block;font-weight:700;font-size:.95rem;margin:16px 0 7px}label.f .opt{color:var(--zilver);font-weight:600}label.f .req{color:var(--rood)}
input.f{width:100%;font-family:var(--ui);font-size:1rem;color:var(--tekst);background:var(--wit);border:1.5px solid var(--grijs-mid);border-radius:10px;padding:13px 15px}
input.f::placeholder{color:var(--zilver)}input.f:focus{outline:none;border-color:var(--blauw-licht);box-shadow:0 0 0 3px rgba(45,64,153,.12)}
.err{color:var(--rood);font-size:.85rem;margin-top:8px;display:none}.err.on{display:block}
.pill{display:inline-block;background:var(--blauw);color:#fff;font-weight:700;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;padding:7px 12px;border-radius:8px;margin-bottom:14px}
h1.wk{font-weight:800;font-size:2rem;margin:0 0 8px}.wk-sub{color:var(--blauw-licht);font-weight:700;font-size:1.05rem;margin:0 0 14px}.wk-in{color:var(--tekst-mid);margin:0 0 6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}@media(max-width:600px){.stats{grid-template-columns:1fr}}
.stat{background:var(--grijs-licht);border:1px solid var(--grijs-mid);border-radius:12px;padding:20px;text-align:center}.stat .n{font-weight:800;font-size:1.9rem;color:var(--blauw)}.stat .l{color:var(--tekst-mid);font-size:.88rem;margin-top:2px}
.q-soort{display:inline-block;background:var(--grijs-mid);color:var(--blauw-mid);font-weight:800;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:7px;margin-bottom:8px}
.q-lab{font-weight:800;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blauw-licht);margin:6px 0 4px}
.q-text{font-family:var(--lees);font-size:1.14rem;line-height:1.45;font-weight:600;margin:2px 0 10px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;background:var(--wit);border:1.5px solid var(--grijs-mid);border-radius:11px;padding:10px 14px;cursor:pointer;font-family:var(--lees);font-size:1.02rem;line-height:1.42;color:var(--tekst);transition:border-color .12s,background .12s,box-shadow .12s}
.opt:hover:not(.locked){border-color:var(--blauw-licht);background:#fafbff}
.opt .lt{width:30px;height:30px;flex-shrink:0;background:var(--grijs-licht);border:1.5px solid var(--grijs-mid);border-radius:8px;display:grid;place-items:center;font-family:var(--ui);font-weight:800;color:var(--blauw-mid);font-size:.9rem;margin-top:1px}
.opt .ot{flex:1;padding-top:3px}
.opt.sel{border-color:var(--blauw);background:#eef1fb;box-shadow:0 0 0 2px rgba(26,42,94,.12)}.opt.sel .lt{background:var(--blauw);border-color:var(--blauw);color:#fff}
.opt.goed{border-color:var(--groen);background:var(--groen-licht)}.opt.goed .lt{background:var(--groen);border-color:var(--groen);color:#fff}
.opt.fout{border-color:var(--rood);background:var(--rood-licht)}.opt.fout .lt{background:var(--rood);border-color:var(--rood);color:#fff}
.opt.locked{cursor:default}
.opt .tagje{margin-left:auto;align-self:center;font-family:var(--ui);font-weight:800;font-size:.72rem;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.opt .tagje svg{width:15px;height:15px}
.opt.goed .tagje{color:var(--groen)}.opt.fout .tagje{color:var(--rood)}
.fb{border-radius:12px;margin:20px 0 0;overflow:hidden;border:1px solid var(--grijs-mid);box-shadow:var(--shadow-sm)}
.fb-top{display:flex;align-items:center;gap:10px;padding:14px 18px;font-weight:800}.fb-top svg{width:22px;height:22px}
.fb.ok .fb-top{background:var(--groen-licht);color:var(--groen)}.fb.no .fb-top{background:var(--rood-licht);color:var(--rood)}
.fb-body{padding:16px 18px;background:var(--wit)}
.fb-sec{margin:0 0 14px}.fb-sec:last-child{margin-bottom:0}
.fb-h{font-weight:800;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blauw-mid);margin:0 0 4px}
.fb-p{font-family:var(--lees);font-size:1rem;line-height:1.65;margin:0}
.fb-ans{font-family:var(--lees);font-size:1rem;font-weight:600}.fb-ans.g{color:var(--groen)}.fb-ans.r{color:var(--rood)}
.fb-kern{background:var(--grijs-licht);border-left:4px solid var(--blauw);border-radius:8px;padding:12px 14px}.fb-kern .fb-h{color:var(--blauw)}
.fb .bronnen-blok{margin-top:14px}
.res-h{text-align:center;font-weight:800;font-size:2rem;margin:0 0 4px}
.res-sub{color:var(--tekst-mid);text-align:center;margin:0 0 20px}
.score{max-width:330px;margin:0 auto;background:var(--blauw);color:#fff;border-radius:14px;padding:24px;text-align:center}
.score .p{font-weight:800;font-size:2.9rem;line-height:1}.score .pl{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.72);margin-top:6px}.score .g{margin-top:6px;color:#c7d2fe;font-size:.94rem}
.verdict{width:max-content;margin:18px auto 0;font-weight:800;letter-spacing:.05em;padding:10px 20px;border-radius:10px;display:flex;align-items:center;gap:8px}.verdict svg{width:20px;height:20px}
.verdict.ok{background:var(--groen-licht);color:var(--groen)}.verdict.no{background:var(--rood-licht);color:var(--rood)}
.advies{text-align:center;color:var(--tekst-mid);margin:14px auto 0;max-width:560px}
.seclab{font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blauw-mid);margin:26px 0 12px}
.qrow{border:1px solid var(--grijs-mid);border-left:4px solid var(--zilver);border-radius:10px;margin:8px 0;overflow:hidden;background:var(--wit)}.qrow.g100{border-left-color:var(--groen)}.qrow.gfout{border-left-color:var(--rood)}
.qrow-h{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.qrow .qn{font-weight:800;color:var(--blauw-mid);font-size:.9rem;min-width:22px}.qrow .qo{flex:1;font-size:.94rem;color:var(--tekst)}
.qrow .qs{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.78rem}.qrow .qs svg{width:16px;height:16px}
.qrow.g100 .qs{color:var(--groen)}.qrow.gfout .qs{color:var(--rood)}
.qrow .chev{color:var(--zilver);transition:transform .2s;display:inline-flex}.qrow .chev svg{width:18px;height:18px;display:block}.qrow.open .chev{transform:rotate(90deg)}
.qrow-d{display:none;padding:0 14px 14px 48px;font-size:.92rem;color:var(--tekst-mid)}.qrow.open .qrow-d{display:block}.qrow-d .ln{margin:3px 0}.qrow-d .ln b{color:var(--blauw-mid)}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.acts .btn{flex:1;min-width:200px}
.cert{border:2px solid var(--blauw);border-radius:14px;padding:38px;text-align:center;position:relative;background:var(--wit)}
.cert::before{content:"";position:absolute;inset:10px;border:1px solid var(--grijs-mid);border-radius:9px;pointer-events:none}
.cert .top{position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--blauw),var(--blauw-licht))}
.cert .sh{width:58px;height:58px;margin:4px auto 12px;color:var(--blauw)}.cert .k{font-size:.73rem;letter-spacing:.2em;text-transform:uppercase;color:var(--blauw-licht);font-weight:700}
.cert h2{font-size:1.9rem;color:var(--blauw);margin:6px 0 14px}.cert .lead{font-family:var(--lees);color:var(--tekst-mid);margin:0 0 8px}
.cert .naam{font-family:var(--lees);font-size:1.55rem;font-weight:600;border-bottom:2px solid var(--grijs-mid);display:inline-block;padding:0 22px 6px;margin-bottom:12px}
.cert .opl{font-family:var(--lees);font-size:1.05rem;margin:8px 0 18px}.cert .opl b{color:var(--blauw)}
.cert .meta{display:flex;justify-content:center;gap:32px;flex-wrap:wrap;border-top:1px solid var(--grijs-mid);padding-top:15px}.cert .meta .mk{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--zilver)}.cert .meta .mv{font-weight:800;color:var(--blauw)}
.foot{text-align:center;color:var(--zilver);font-size:.78rem;padding:12px 20px}
figure.illu{margin:4px auto 12px;max-width:480px;color:var(--blauw)}
figure.illu.wide{max-width:560px}
.figcap{font-family:var(--ui);font-weight:700;font-size:1.02rem;color:var(--blauw-mid);margin:0 0 8px;line-height:1.25}
figure.illu svg{width:100%;height:auto;display:block}
figure.illu svg text.il-sub,figure.illu svg text.il-sub4,figure.illu svg text.il-note{font-size:15px}
figure.illu svg text.il-main{font-size:16px}
@media(max-width:640px){figure.illu svg text.il-sub{font-size:19px}figure.illu svg text.il-note{font-size:15.5px}figure.illu svg text.il-sub4{font-size:16.5px}figure.illu svg text.il-main{font-size:18px}}
@media print{header.app,.nav,.acts,.foot{display:none!important}main{padding:0;max-width:none}.card{box-shadow:none;border:none}}

/* ── JS Legal Force professioneel iconensysteem ── */
:root{
  --icoon-tegel:44px;
  --icoon-radius:11px;
  --icoon-bg:#eef2fa;
  --icoon-lijn:#1a2a5e;
  --icoon-praktijk:#217373;
}
.itile{
  width:var(--icoon-tegel);height:var(--icoon-tegel);border-radius:var(--icoon-radius);
  background:var(--icoon-bg);border:1px solid #dfe6f3;display:grid;place-items:center;
  flex:0 0 var(--icoon-tegel);box-shadow:none;
}
.itile svg{width:24px;height:24px;color:var(--icoon-lijn);stroke-width:1.9}
.kaart{
  padding:18px 20px;margin:16px 0 0;border-left-width:1px;
  box-shadow:0 2px 12px rgba(26,42,94,.045);
}
.kaart-h{align-items:center;gap:12px;margin-bottom:10px}
.kaart-ic{
  width:40px;height:40px;border-radius:10px;background:var(--icoon-bg);
  border:1px solid #dfe6f3;display:grid;place-items:center;flex:0 0 40px;
}
.kaart-ic svg{width:22px;height:22px;stroke-width:1.9}
.kaart-lab{font-size:.74rem;letter-spacing:.075em}
.k-kader{border-left:4px solid var(--blauw-licht)}
.k-praktijk{border-left:4px solid var(--icoon-praktijk)}
.k-voorbeeld{border-left:4px solid var(--blauw-mid)}
.k-letop{border-left:4px solid var(--oranje)}
.k-onthoud{border-left:4px solid var(--groen)}
.k-praktijk .kaart-ic{background:#e9f5f4;border-color:#cfe6e3}
.k-letop .kaart-ic{background:#fff4d8;border-color:#efd79b}
.k-onthoud .kaart-ic{background:#e7f4ed;border-color:#c9e5d6}
.q-lab,.bb-t,.seclab{display:flex;align-items:center;gap:8px}
.label-icon{
  width:28px;height:28px;border-radius:8px;background:var(--icoon-bg);
  border:1px solid #dfe6f3;display:inline-grid;place-items:center;flex:0 0 28px;
  color:var(--blauw);
}
.label-icon svg{width:16px;height:16px;stroke-width:2}
.q-soort{display:inline-flex;align-items:center;gap:7px}
.q-soort .inline-icon{width:17px;height:17px;display:inline-flex;color:var(--blauw-mid)}
.q-soort .inline-icon svg{width:17px;height:17px}
.nav .btn{min-height:44px}
.nav-icon{display:inline-flex;width:19px;height:19px;flex:0 0 19px}
.nav-icon svg{width:19px;height:19px;stroke-width:2}
.kaart-b .punten li{padding-left:27px}
.kaart-b .punten li::before{display:none}
.list-icon{
  position:absolute;left:1px;top:.34em;width:17px;height:17px;color:var(--blauw-licht);
  display:inline-flex;
}
.list-icon svg{width:17px;height:17px;stroke-width:2}
.icon-legend{
  display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--grijs-mid);color:var(--tekst-mid);font-size:.78rem;
}
@media(max-width:640px){
  :root{--icoon-tegel:40px}
  .kaart{padding:16px 15px}
  .kaart-ic{width:38px;height:38px;flex-basis:38px}
  .kaart-ic svg{width:21px;height:21px}
  .tophead{align-items:flex-start}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}
}


/* Zichtbare iconen naast iedere paginakop en relevante opsomming */
.ptitle.with-page-icon{
  display:flex;align-items:center;gap:13px;line-height:1.22;margin-bottom:12px;
}
.page-title-icon{
  width:42px;height:42px;border-radius:11px;background:var(--icoon-bg);

<script>window.__DATA__={"aantalOnderwerpen":6,"drempel":70,"eindtoets":[{"casus":false,"juist":1,"opties":["Dat het gezag in de openbare ruimte zonder problemen kan werken.","Dat mensen zich vrij en veilig in de openbare ruimte kunnen bevinden en bewegen.","De eerbaarheid en de goede zeden als belangrijkste belangen van de oude zedendelicten.","De goede naam van de persoon die wordt aangesproken."],"thema":"Achtergrond","uitleg":"Juist is B. Artikel 429ter Sr beschermt de vrijheid en veiligheid van mensen in de openbare ruimte. De kern van het verwijt is dat iemand daar tegen zijn of haar wil als seksueel object wordt benaderd (MvT, p. 116; Nota, p. 12). De andere antwoorden noemen belangen die hier niet het belangrijkst zijn.","vraag":"Welk belang wil artikel 429ter Sr volgens de wetgever vooral beschermen?"},{"casus":false,"juist":2,"opties":["De wet heeft alleen een symbolisch doel en geldt sinds 1 januari 2024.","De wet regelt vooral schadevergoeding en geldt sinds 1 juli 2025.","De wet maakt de norm duidelijk en probeert het gedrag te voorkomen. Het artikel geldt sinds 1 juli 2024.","De wet verplicht het Openbaar Ministerie iedere melding te vervolgen en geldt sinds 1 juli 2024."],"thema":"Achtergrond","uitleg":"Juist is C. De strafbaarstelling heeft een normerende en een preventieve functie. Dit betekent dat de wet de norm duidelijk maakt en het gedrag probeert te voorkomen. Het artikel geldt sinds 1 juli 2024 (Nota, p. 12 en 50; MvT, p. 26; Stb. 2024, 61). De andere antwoorden noemen een verkeerde datum of een verkeerd doel.","vraag":"Welke andere doelen heeft artikel 429ter Sr naast handhaving, en sinds wanneer geldt het artikel?"},{"casus":false,"juist":3,"opties":["Eén bestanddeel is genoeg, bijvoorbeeld dat de opmerking vreesaanjagend is.","Alleen een aanraking kan dit delict opleveren.","De verdachte is alleen strafbaar als opzet op de intimidatie wordt bewezen.","Alle bestanddelen moeten aanwezig zijn. Ontbreekt er één, dan is het delict niet voltooid."],"thema":"Wettelijke bestanddelen","uitleg":"Juist is D. Alle vier de bestanddelen moeten aanwezig zijn. Het gedrag vindt plaats in het openbaar. De verdachte benadert een ander indringend en seksueel. Dit gebeurt door opmerkingen, gebaren, geluiden of aanrakingen. De benadering is volgens algemene maatstaven vreesaanjagend, vernederend, kwetsend óf onterend (MvT, p. 114). Opzet is geen bestanddeel.","vraag":"Wat geldt voor de bestanddelen van artikel 429ter Sr?"},{"casus":false,"juist":1,"opties":["Nee. Het gaat alleen om fysieke openbare plaatsen.","Ja. De online omgeving moet dan voor veel mensen toegankelijk zijn en vergelijkbaar zijn met een openbare plaats.","Ja. Ieder bericht op sociale media is openbaar, ook als maar een paar mensen het zien.","Ja. Ook iedere besloten en afgeschermde chatgroep is openbaar."],"thema":"Wettelijke bestanddelen","uitleg":"Juist is B. ‘In het openbaar’ gaat niet alleen over fysieke plaatsen. Het kan ook gaan om een online omgeving die voor veel mensen toegankelijk is en vergelijkbaar is met een openbare plaats (MvT, p. 116). Een besloten of afgeschermde omgeving is niet openbaar (Nota, p. 54).","vraag":"Kan ‘in het openbaar’ ook gelden voor gedrag op internet?"},{"casus":false,"juist":2,"opties":["De inhoud en de omstandigheden worden volledig los van elkaar beoordeeld.","Alleen de omstandigheden tellen. De inhoud is niet belangrijk.","De inhoud en de omstandigheden beïnvloeden elkaar.","Alleen de inhoud telt. De omstandigheden kunnen het oordeel niet veranderen."],"thema":"Context","uitleg":"Juist is C. De wetgever noemt de inhoud en de omstandigheden ‘communicerende vaten’. Dit betekent dat ze elkaar beïnvloeden. Een uiting die op zichzelf niet voldoende is, kan door de omstandigheden toch onder de strafbepaling vallen (MvT, p. 117).","vraag":"Wat bedoelt de wetgever met ‘communicerende vaten’?"},{"casus":false,"juist":0,"opties":["Nee. De omstandigheden kunnen het oordeel veranderen. Gedrag op een druk plein bij daglicht kan anders worden beoordeeld dan hetzelfde gedrag in een donker steegje.","Ja. De omstandigheden mogen geen rol spelen.","Nee, maar alleen als de aangesproken persoon letsel heeft.","Nee, maar alleen als de verdachte de bedoeling had om te intimideren."],"thema":"Context","uitleg":"Juist is A. De plaats, het tijdstip en andere omstandigheden kunnen het oordeel veranderen. De wetgever noemt het voorbeeld van een plein bij daglicht en een smal steegje in het donker (Nota, p. 54). Letsel en opzet zijn geen voorwaarden.","vraag":"Een collega zegt dat hetzelfde gedrag altijd dezelfde juridische beoordeling krijgt. Klopt dat?"},{"casus":false,"juist":3,"opties":["Zonder aangifte van het slachtoffer is geen veroordeling mogelijk.","Alleen camerabeelden kunnen voldoende bewijs opleveren.","Naast een proces-verbaal is altijd nog ander onafhankelijk bewijs nodig.","Goed vastgelegde waarnemingen van opsporingsambtenaren kunnen voldoende bewijs opleveren."],"thema":"Jurisprudentie","uitleg":"Juist is D. In ECLI:NL:RBROT:2024:9612 was de veroordeling gebaseerd op twee processen-verbaal van opsporingsambtenaren. Er was geen aangifte en er waren geen camerabeelden. Een aangifte of camerabeeld is dus niet altijd nodig.","vraag":"Wat leert de eerste gepubliceerde zaak over artikel 429ter Sr over het bewijs?"},{"casus":false,"juist":0,"opties":["Artikel 429ter Sr noemt vier mogelijke kenmerken. Het slachtoffer hoeft dus niet bang te zijn.","Zonder angst bij het slachtoffer kan het artikel niet worden overtreden.","De rechter moet altijd dezelfde kwalificatie kiezen als het Openbaar Ministerie.","Het kenmerk ‘vernederend’ geldt alleen als het slachtoffer een ambtenaar is."],"thema":"Jurisprudentie","uitleg":"Juist is A. Artikel 429ter Sr noemt vier mogelijke kenmerken: vreesaanjagend, vernederend, kwetsend of onterend. Het gedrag hoeft niet aan alle vier te voldoen. Vrees bij het slachtoffer is daarom niet vereist (ECLI:NL:RBMNE:2024:5727).","vraag":"De rechter vond een seksuele opmerking vernederend, kwetsend en onterend, maar niet vreesaanjagend. Wat betekent dit?"},{"casus":false,"juist":3,"opties":["Dat de verdachte de bedoeling had om de ander te intimideren.","Dat het slachtoffer zich echt geïntimideerd voelde.","Dat de verdachte dit gedrag vaker heeft vertoond.","De wettelijke bestanddelen. Opzet of schuld hoeft niet te worden bewezen."],"thema":"Bewijs","uitleg":"Juist is D. Artikel 429ter Sr is een overtreding. Opzet en schuld staan niet als bestanddeel in deze strafbepaling. Je bewijst daarom de wettelijke bestanddelen (MvT, p. 114). De persoonlijke ervaring van het slachtoffer en herhaald gedrag zijn geen aparte voorwaarden.","vraag":"Wat moet je bij artikel 429ter Sr bewijzen?"},{"casus":false,"juist":1,"opties":["Alleen een bekentenis van de verdachte.","Onder andere eigen waarnemingen van opsporingsambtenaren, een aangifte en een bekentenis.","Alleen een rapport van een deskundige.","Alleen camerabeelden."],"thema":"Bewijs","uitleg":"Juist is B. In de besproken uitspraken gebruikte de rechter verschillende soorten bewijs: eigen waarnemingen van opsporingsambtenaren, een aangifte en een bekennende verklaring. Camerabeelden kunnen informatie leveren. Leg dan vast wie de beelden heeft bekeken en wat daarop is waargenomen.","vraag":"Welke soorten bewijs zijn gebruikt in de besproken rechtspraak over artikel 429ter Sr?"},{"casus":false,"juist":0,"opties":["Beschrijf de letterlijke woorden of gedraging, de plaats, de tijd, de omstandigheden en de zichtbare reactie.","Schrijf alleen jouw juridische conclusie op, bijvoorbeeld: ‘Hij intimideerde haar.’","Noteer alleen de persoonsgegevens van de verdachte.","Noteer alleen één juridisch kenmerk, bijvoorbeeld ‘vreesaanjagend’."],"thema":"Proces-verbaal","uitleg":"Juist is A. Beschrijf de feiten zo precies mogelijk. De rechter beoordeelt de bestanddelen en bepaalt uiteindelijk de kwalificatie. Een juridisch oordeel zonder de feiten is niet voldoende.","vraag":"Hoe leg je jouw waarneming het beste vast in een proces-verbaal?"},{"casus":false,"juist":3,"opties":["In een verkort proces-verbaal hoef je niet alle bestanddelen met feiten te onderbouwen.","De wet verplicht een tik-proces-verbaal bij iedere overtreding.","Een tik-proces-verbaal mag alleen worden gebruikt als de verdachte bekent.","Ook een verkort proces-verbaal moet de belangrijke feiten en alle bestanddelen bevatten. Bij een ingewikkelde of betwiste zaak kies je een uitgebreid proces-verbaal."],"thema":"Proces-verbaal","uitleg":"Juist is D. Verkort betekent niet minder zorgvuldig. De feiten moeten alle bestanddelen kunnen onderbouwen (MvT, p. 114). Bij een ingewikkelde of betwiste situatie past een uitgebreid proces-verbaal beter. De vorm van een tik-proces-verbaal is niet wettelijk voorgeschreven.","vraag":"Wat geldt voor een verkort proces-verbaal bij dit delict?"},{"casus":true,"juist":1,"opties":["Het gedrag valt niet onder artikel 429ter Sr, omdat de man de vrouw niet heeft aangeraakt.","Het gedrag kan onder artikel 429ter Sr vallen. De plaats, het tijdstip, de herhaling en de korte afstand tellen mee bij de beoordeling.","Het gedrag is alleen strafbaar als de vrouw aangifte doet.","Het gedrag is alleen strafbaar als wordt bewezen dat de man haar wilde intimideren."],"thema":"Casus","uitleg":"Juist is B. De feiten kunnen passen bij alle bestanddelen. Het gedrag vindt plaats in het openbaar. De man benadert de vrouw indringend en seksueel door opmerkingen. De plaats, het tijdstip, de herhaling en de korte afstand tellen mee bij de beoordeling volgens algemene maatstaven (MvT, p. 114–117). Een aanraking, aangifte of bewijs van opzet is niet vereist. De rechter maakt de definitieve beoordeling.","vraag":"Praktijkcasus. Het is laat in de avond. In een verlaten portiek blokkeert een man kort de doorgang van een onbekende vrouw. Hij maakt van dichtbij meerdere seksuele opmerkingen en lacht om haar reactie. De vrouw kijkt angstig. Welke beoordeling past het beste?"},{"casus":true,"juist":2,"opties":["Schrijf alleen jouw conclusie op dat het seksuele intimidatie was.","Wacht op een aangifte, want zonder aangifte is er geen bruikbaar bewijs.","Beschrijf precies wat je zag en hoorde, waaronder de woorden, plaats, tijd, afstand, herhaling en zichtbare reactie.","Vraag eerst om een bekentenis, want zonder bekentenis kan de zaak niet doorgaan."],"thema":"Casus","uitleg":"Juist is C. Leg de feiten duidelijk en controleerbaar vast. Volgens artikel 344, tweede lid, Sv kan één proces-verbaal van een opsporingsambtenaar voldoende bewijs zijn. Het proces-verbaal moet dan wel aan de wettelijke eisen voldoen. Een aangifte, camerabeeld of bekentenis is niet altijd nodig.","vraag":"Praktijkcasus. Je hebt het gedrag uit de vorige casus zelf gezien en gehoord. Er is geen aangifte en geen camerabeeld. Hoe maak je een bruikbaar proces-verbaal?"}],"eindtoetsDrempel":80,"kaderLabel":"Art. 429ter Sr — Referentie-opleiding","opleiding":"Seksuele straatintimidatie","peildatum":"31 juli 2026","subtitel":"SEKSUELE STRAATINTIMIDATIE — E-LEARNING VOOR OPSPORINGSAMBTENAREN","topics":[{"icoon":"megafoon","id":"m1","kader":"Opleiding","nr":1,"pages":[{"html":"<h2 class=\"ptitle\">Leerdoelen</h2><p class=\"pintro\">Wat je na dit onderwerp kunt.</p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>weet je hoe deze opleiding is opgebouwd;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>ken je de leerdoelen en weet je hoe de toetsen zijn opgebouwd;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>weet je wat van je wordt verwacht om het certificaat te behalen.</span></li></ul>","kind":"lo","titel":"Leerdoelen"},{"html":"<h2 class=\"ptitle\">Welkom</h2><div class=\"main\"><p>Welkom bij de opleiding Seksuele straatintimidatie. Je leert in deze opleiding drie dingen. Je leert het delict van artikel 429ter Sr herkennen. Je leert wat dit delict juridisch betekent. En je leert hoe je een situatie in de praktijk goed beoordeelt en vastlegt.</p><p>Je sluit de opleiding af met een eindtoets. Haal je de eindtoets, dan krijg je een certificaat.</p></div>","kind":"theory","titel":"Welkom"},{"html":"<h2 class=\"ptitle\">Opzet van de opleiding</h2><div class=\"main\"><p>De opleiding bestaat uit acht onderwerpen. Je begint met deze introductie. Daarna volgen zes inhoudelijke onderwerpen. Het laatste onderwerp is een samenvatting. Daarna maak je de eindtoets.</p><p>Elk inhoudelijk onderwerp begint met de leerdoelen. Daarna krijg je korte stukken theorie. Die wisselen af met wetsartikelen, rechtspraak, praktijkvoorbeelden en kennisvragen. Je voortgang wordt bewaard op dit apparaat. Je kunt dus later verdergaan waar je gebleven was.</p></div>","kind":"theory","titel":"Opzet van de opleiding"},{"html":"<div class=\"figcap\">Opzet van de opleiding</div><figure class=\"illu\"><svg viewBox=\"0 0 560 356\" role=\"img\" aria-labelledby=\"lr-t lr-d\" font-family=\"'Outfit',system-ui,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n<title id=\"lr-t\">Opbouw van de opleiding</title>\n<desc id=\"lr-d\">De route: introductie, zes inhoudelijke onderwerpen, samenvatting, de eindtoets (ten minste tachtig procent) en het certificaat. De voortgang wordt bewaard, zodat je later kunt verdergaan.</desc>\n<rect x=\"70\" y=\"14\" width=\"420\" height=\"44\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/><text x=\"280\" y=\"41\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Introductie</text>\n<line x1=\"280\" y1=\"58\" x2=\"280\" y2=\"72\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/><path d=\"M273 66l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<rect x=\"70\" y=\"74\" width=\"420\" height=\"44\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/><text x=\"280\" y=\"101\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Zes inhoudelijke onderwerpen</text>\n<line x1=\"280\" y1=\"118\" x2=\"280\" y2=\"132\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/><path d=\"M273 126l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<rect x=\"70\" y=\"134\" width=\"420\" height=\"44\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/><text x=\"280\" y=\"161\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Samenvatting</text>\n<line x1=\"280\" y1=\"178\" x2=\"280\" y2=\"192\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/><path d=\"M273 186l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<rect x=\"70\" y=\"194\" width=\"420\" height=\"44\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw)\" stroke-width=\"2.2\"/><text x=\"280\" y=\"221\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Eindtoets · ten minste 80%</text>\n<line x1=\"280\" y1=\"238\" x2=\"280\" y2=\"252\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/><path d=\"M273 246l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<rect x=\"70\" y=\"254\" width=\"420\" height=\"44\" rx=\"12\" fill=\"var(--groen-licht)\" stroke=\"var(--groen)\" stroke-width=\"2\"/><text x=\"280\" y=\"281\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"var(--groen)\">Certificaat</text>\n<text x=\"280\" y=\"330\" text-anchor=\"middle\" class=\"il-note\" font-style=\"italic\" fill=\"var(--tekst-mid)\">Je voortgang wordt bewaard; je kunt later verdergaan.</text>\n</svg></figure>","kind":"figuur","titel":"Opzet van de opleiding"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>Acht onderwerpen. Daarna volgt de eindtoets. Haal je die, dan krijg je een certificaat.</li><li>Zes inhoudelijke onderwerpen gaan over de achtergrond, de wettelijke bestanddelen, de context, de rechtspraak, het bewijs en het proces-verbaal.</li><li>Theorie, wet, rechtspraak, praktijk en toetsing wisselen elkaar af.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"}],"titel":"Introductie","type":"intro","vragen":[]},{"icoon":"balans","id":"m2","kader":"Art. 429ter Sr","nr":2,"pages":[{"html":"<h2 class=\"ptitle\">Leerdoelen</h2><p class=\"pintro\">Wat je na dit onderwerp kunt.</p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen waarom seksuele intimidatie in het openbaar apart strafbaar is gesteld;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen welke problemen volgens de wetgever aanleiding waren voor de nieuwe wet;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>in grote lijnen uitleggen wat het doel van artikel 429ter Sr is en welke norm de wet duidelijk maakt;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>het verschil uitleggen tussen het doel van de wet en de wettelijke bestanddelen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen waarom je de context en het bewijs zorgvuldig moet beoordelen.</span></li></ul>","kind":"lo","titel":"Leerdoelen"},{"html":"<h2 class=\"ptitle\">Inleiding</h2><div class=\"main\"><p>Seksuele intimidatie in het openbaar is een zelfstandige overtreding. Die overtreding staat in artikel 429ter Sr. Dit artikel is in het Wetboek van Strafrecht gekomen door de Wet seksuele misdrijven.<sup class=\"fn\">1</sup> Het artikel geldt sinds 1 juli 2024.<sup class=\"fn\">2</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Stb. 2024, 59 (Wet seksuele misdrijven).</li><li>Stb. 2024, 61 (inwerkingtredingsbesluit).</li></ol></div>","kind":"theory","titel":"Inleiding"},{"html":"<h2 class=\"ptitle\">Inleiding (vervolg)</h2><div class=\"main\"><p>Dit onderwerp gaat over de achtergrond en het doel van de strafbaarstelling. De delictsomschrijving is de omschrijving van het strafbare feit in de wet. In het volgende onderwerp behandelen we deze delictsomschrijving en de bestanddelen één voor één.</p></div>","kind":"theory","titel":"Inleiding (vervolg)"},{"html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Een herkenbare situatie</h2><p class=\"lees\">Je surveilleert in een drukke winkelstraat. Iemand maakt steeds opmerkingen tegen een voorbijganger. Diegene blijft ook opvallend dicht bij haar lopen. Je ziet dat de voorbijganger zich zichtbaar ongemakkelijk voelt. De vraag is dan: welke rol speelt het strafrecht in zo'n situatie?</p>","kind":"casus","titel":"Een herkenbare situatie"},{"html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Een herkenbare situatie — betekenis</h2><div class=\"kaart k-voorbeeld\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/></svg></span><span class=\"kaart-lab\">Voorbeeld</span></div><div class=\"kaart-t\">Betekenis voor de praktijk</div><div class=\"kaart-b\"><p>In dit onderwerp geven we nog geen juridisch eindoordeel over deze situatie. Je leert hier eerst de achtergrond en het doel van de strafbaarstelling. Dat is het kader. In de volgende onderwerpen toets je zulke situaties aan de bestanddelen en aan de context.</p></div></div>","kind":"casus","titel":"Een herkenbare situatie — betekenis"},{"html":"<h2 class=\"ptitle\">Achtergrond in de samenleving</h2><div class=\"main\"><p>Veel mensen krijgen te maken met seksuele intimidatie. Dat gebeurt in de openbare ruimte en online. Tegelijk beseffen steeds meer mensen in de samenleving hoe vaak dit voorkomt en hoe schadelijk het is.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 10.</li></ol></div>","kind":"theory","titel":"Achtergrond in de samenleving"},{"html":"<h2 class=\"ptitle\">Achtergrond in de samenleving (vervolg)</h2><div class=\"main\"><p>De toelichting onderbouwt dit met cijfers van het Centraal Bureau voor de Statistiek. Die cijfers laten zien dat straatintimidatie vaak voorkomt. Vooral jonge vrouwen krijgen ermee te maken.<sup class=\"fn\">1</sup> Let op: het gaat om straatintimidatie zoals mensen die zelf hebben ervaren. Dat is niet hetzelfde als een bewezen strafbaar feit in de zin van artikel 429ter Sr.</p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 5–6.</li></ol></div>","kind":"theory","titel":"Achtergrond in de samenleving (vervolg)"},{"html":"<h2 class=\"ptitle\">Achtergrond in de samenleving (vervolg)</h2><div class=\"main\"><p>De wetgever gaat uit van een sociale norm. Die norm is: iedereen moet zich vrij en ongehinderd in het openbaar kunnen bewegen, zonder angst voor ongewenste seksuele toenadering. Seksuele intimidatie tast die sociale veiligheid aan.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 10.</li></ol></div>","kind":"theory","titel":"Achtergrond in de samenleving (vervolg)"},{"html":"<h2 class=\"ptitle\">Waarom een aparte strafbaarstelling?</h2><div class=\"main\"><p>Vóór deze wet had seksuele intimidatie in de openbare ruimte geen duidelijke, eigen plaats in het Wetboek van Strafrecht. Daarom moesten verschillende wetsartikelen worden gebruikt om dit gedrag te vervolgen.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 10.</li></ol></div>","kind":"theory","titel":"Waarom een aparte strafbaarstelling?"},{"html":"<h2 class=\"ptitle\">Waarom een aparte strafbaarstelling? (vervolg)</h2><div class=\"main\"><p>Er zijn ook regelingen in het civiele recht en het arbeidsrecht. Volgens de wetgever losten die regels het probleem niet goed genoeg op. Ook maakten ze niet duidelijk waarom dit gedrag strafbaar moest zijn.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 11.</li></ol></div>","kind":"theory","titel":"Waarom een aparte strafbaarstelling? (vervolg)"},{"html":"<h2 class=\"ptitle\">Waarom een aparte strafbaarstelling? (vervolg)</h2><div class=\"main\"><p>Ook regels van gemeenten boden geen goede oplossing. Rotterdam had straatintimidatie verboden in de lokale verordening. Het gerechtshof Den Haag oordeelde dat deze regel onverbindend was. Dat betekent dat de regel niet mocht worden toegepast. Iemand kon daarom niet op basis van deze regel worden gestraft.</p><p>Het hof gaf daarvoor twee redenen. Ten eerste beperkt zo’n verbod de vrijheid van meningsuiting. Alleen de regering en het parlement mogen samen zo’n beperking in een wet vastleggen. Een gemeente mag dit dus niet zelf regelen. Ten tweede was uit de tekst niet duidelijk genoeg welk gedrag precies verboden was.</p><p>Daarom kon seksuele straatintimidatie niet goed worden aangepakt met alleen een regel van de gemeente.</p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Hof Den Haag 19 december 2019, ECLI:NL:GHDHA:2019:3293.</li></ol></div>","kind":"theory","titel":"Waarom een aparte strafbaarstelling? (vervolg)"},{"html":"<h2 class=\"ptitle\">Waarom een aparte strafbaarstelling? (vervolg)</h2><div class=\"main\"><p>De wetgever legt uit dat alleen regels van gemeenten geen goede juridische oplossing boden.<sup class=\"fn\">1</sup></p><p>Het Wetboek van Strafrecht is een wet in formele zin. Dat betekent dat de regering en het parlement deze wet samen hebben gemaakt. Daarom koos de wetgever voor een aparte strafbaarstelling die in heel Nederland geldt.<sup class=\"fn\">2</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 11.</li><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 26.</li></ol></div>","kind":"theory","titel":"Waarom een aparte strafbaarstelling? (vervolg)"},{"html":"<h2 class=\"ptitle\">Juridisch kader</h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span class=\"kaart-lab\">Juridisch kader</span></div><div class=\"kaart-t\">Artikel 429ter Sr · Wetboek van Strafrecht</div><div class=\"kaart-b\"><p class=\"law-intro\">Artikel 429ter Sr is de strafbaarstelling van seksuele intimidatie in het openbaar. Dit is het artikel waarmee je als opsporingsambtenaar in de praktijk werkt. Het geldt sinds 1 juli 2024.</p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/></svg></span><span>Wettekst</span></div><p class=\"wet law-text\">«Degene die <mark class=\"law-part\">in het openbaar</mark> een ander <mark class=\"law-part\">indringend seksueel benadert</mark> door middel van <mark class=\"law-part\">opmerkingen, gebaren, geluiden of aanrakingen</mark> op een wijze die <mark class=\"law-part\">vreesaanjagend, vernederend, kwetsend of onterend</mark> is te achten, wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete van de derde categorie.»<sup class=\"fn\">1</sup></p></div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span>Wat betekent dit?</span></div><p>Het gaat om een overtreding. Het artikel staat in het Derde Boek, Titel II, van het Wetboek van Strafrecht.</p></section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/></svg></span><span>Belangrijk voor de praktijk</span></div><p>Het artikel beschrijft welk gedrag onder bepaalde voorwaarden strafbaar kan zijn. Het kan bijvoorbeeld gaan om opmerkingen, gebaren, geluiden of aanrakingen. Niet elke seksuele opmerking of gedraging is dus automatisch strafbaar. Daarvoor moet aan alle bestanddelen van artikel 429ter Sr zijn voldaan.</p></section></div><div class=\"law-definition\"><span class=\"law-definition-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><p><strong>Bestanddelen</strong> zijn de onderdelen die aanwezig moeten zijn voordat er sprake is van het delict. We leggen ze in het volgende onderwerp stap voor stap uit.</p></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Artikel 429ter Sr (Wetboek van Strafrecht), geldend vanaf 1 juli 2024; Stb. 2024, 59.</li></ol></div>","kind":"kader","titel":"Juridisch kader"},{"html":"<h2 class=\"ptitle\">Wettelijke inbedding</h2><div class=\"main\"><p>Artikel 429ter Sr is een overtreding. Het artikel staat in het Derde Boek, Titel II, van het Wetboek van Strafrecht. Die titel gaat over overtredingen betreffende de openbare orde.<sup class=\"fn\">1</sup></p><p>Het artikel geldt sinds 1 juli 2024. Een apart besluit bepaalde deze ingangsdatum.<sup class=\"fn\">2</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 26.</li><li>Stb. 2024, 61 (inwerkingtredingsbesluit).</li></ol></div>","kind":"theory","titel":"Wettelijke inbedding"},{"html":"<h2 class=\"ptitle\">Doel van de strafbaarstelling</h2><div class=\"main\"><p>De wetgever wil met de strafbaarstelling een norm nadrukkelijk duidelijk maken. Die norm is: seksueel intimiderend gedrag in de openbare ruimte is niet aanvaardbaar.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 26.</li></ol></div>","kind":"theory","titel":"Doel van de strafbaarstelling"},{"html":"<h2 class=\"ptitle\">Doel van de strafbaarstelling (vervolg)</h2><div class=\"main\"><p>Het artikel maakt strafrechtelijk optreden mogelijk als aan de wettelijke voorwaarden is voldaan. Daarnaast heeft deze strafbaarstelling twee andere functies.</p><p>De wetgever maakt er duidelijk mee dat seksueel intimiderend gedrag in het openbaar niet wordt geaccepteerd en strafbaar kan zijn. Dit heet de normerende functie: de wet maakt de norm duidelijk. Ook moet de strafbaarstelling mensen ontmoedigen om dit gedrag te vertonen. Dit heet de preventieve functie: de wet probeert het gedrag te voorkomen. Het artikel geeft dus een signaal aan mogelijke daders. De wetgever hoopt dat mensen zich hier meer bewust van worden. Dat kan op termijn helpen om gedrag te veranderen. Zo kan er minder seksuele intimidatie komen.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 12.</li></ol></div>","kind":"theory","titel":"Doel van de strafbaarstelling (vervolg)"},{"html":"<h2 class=\"ptitle\">Doel van de strafbaarstelling (vervolg)</h2><div class=\"main\"><p>Een strafbaarstelling werkt alleen als er in de praktijk ook echt wordt opgetreden tegen strafbaar gedrag. De regering vindt effectieve handhaving daarom van groot belang. Door op te treden laat je zien dat dit gedrag niet wordt geaccepteerd. Zo krijgt het artikel betekenis in de praktijk en worden mensen ervan weerhouden om dit gedrag te vertonen.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 50.</li></ol></div>","kind":"theory","titel":"Doel van de strafbaarstelling (vervolg)"},{"html":"<h2 class=\"ptitle\">Beschermd belang</h2><div class=\"main\"><p>Een strafbepaling wil een bepaald belang beschermen. Artikel 429ter Sr beschermt de vrijheid en veiligheid van mensen in de openbare ruimte.<sup class=\"fn\">1</sup><sup class=\"fn\">2</sup> Het woord ‘verkeren’ betekent hier dat je ergens bent of je daar beweegt.</p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 116.</li><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 12.</li></ol></div>","kind":"theory","titel":"Beschermd belang"},{"html":"<h2 class=\"ptitle\">Beschermd belang (vervolg)</h2><div class=\"main\"><p>De kern van het verwijt is dat iemand in een openbare omgeving tegen zijn of haar wil als seksueel object wordt benaderd.<sup class=\"fn\">1</sup></p><p>De bescherming geldt in de fysieke openbare ruimte. Ze geldt ook in online omgevingen die voor een breed publiek toegankelijk zijn.<sup class=\"fn\">2</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 12.</li><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 13.</li></ol></div>","kind":"theory","titel":"Beschermd belang (vervolg)"},{"html":"<h2 class=\"ptitle\">Wanneer kan de strafbepaling gelden?</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Wanneer kan de strafbepaling gelden?</div><div class=\"kaart-b\"><p>Niet elke seksueel getinte opmerking of benadering is strafbaar. Met het bestanddeel «indringend» legt de wetgever een ondergrens vast. Er moet sprake zijn van een sterk opdringerige benadering met een intimiderend effect. Respectvol contact leggen of flirten valt daar niet onder.<sup class=\"fn\">1</sup> In het volgende onderwerp behandelen we de bestanddelen één voor één.</p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 46 en 49.</li></ol></div>","kind":"kaart","titel":"Wanneer kan de strafbepaling gelden?"},{"html":"<h2 class=\"ptitle\">Betekenis voor de opsporingsambtenaar</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Betekenis voor de opsporingsambtenaar</div><div class=\"kaart-b\"><p>De achtergrond en het doel van de strafbaarstelling komen niet in de plaats van de wettelijke bestanddelen. Je moet in iedere zaak apart vaststellen of aan de bestanddelen is voldaan.</p></div></div>","kind":"kaart","titel":"Betekenis voor de opsporingsambtenaar"},{"html":"<h2 class=\"ptitle\">Betekenis voor de opsporingsambtenaar (vervolg)</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Betekenis voor de opsporingsambtenaar</div><div class=\"kaart-b\"><p>De wetsgeschiedenis bestaat uit documenten waarin de wetgever de wet uitlegt. Daarin staat dat optreden vaak zal gebeuren bij heterdaad. Dat betekent dat een opsporingsambtenaar het feit ziet gebeuren. Dat geldt ook als een opsporingsambtenaar of buitengewoon opsporingsambtenaar het zelf waarneemt, en als er steun is van getuigen of camerabeelden.<sup class=\"fn\">1</sup> Leg de omstandigheden daarom zorgvuldig en feitelijk vast.</p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 12.</li></ol></div>","kind":"kaart","titel":"Betekenis voor de opsporingsambtenaar (vervolg)"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>Seksuele intimidatie in het openbaar is een zelfstandige overtreding in artikel 429ter Sr. Dat is geregeld in de Wet seksuele misdrijven. Het artikel geldt vanaf 1 juli 2024.</li><li>Er waren twee redenen voor de nieuwe wet. De bestaande regels waren niet voldoende. Ook mocht de lokale regel van Rotterdam niet worden toegepast.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>De bepaling beschermt het vrij en veilig verkeren in de openbare ruimte. De wet maakt de norm duidelijk en probeert dit gedrag te voorkomen.</li><li>De achtergrond en het doel van de wetgever zijn niet hetzelfde als de wettelijke bewijsvoorwaarden.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Vooruitblik: Wettelijke bestanddelen</h2><div class=\"main\"><p>Het volgende onderwerp heet Wettelijke bestanddelen. Daarin halen we de delictsomschrijving uit elkaar. Je leert welke onderdelen je moet vaststellen.</p><p>Daarbij komen deze begrippen aan bod: «indringend», «seksueel benaderen», het geobjectiveerde criterium «vreesaanjagend, vernederend, kwetsend of onterend» en «in het openbaar».</p></div>","kind":"theory","titel":"Vooruitblik: Wettelijke bestanddelen"}],"titel":"Achtergrond en doel van de strafbaarstelling","type":"content","vragen":[{"artikel":"Art. 429ter Sr","juist":2,"kernregel":"Seksuele intimidatie in het openbaar had geen eigen plaats in het Wetboek van Strafrecht. Ook mocht de lokale regel van Rotterdam niet worden toegepast. Daarom kwam er een aparte strafbaarstelling.","opties":["Omdat de bestaande regels dit gedrag al helemaal strafbaar stelden, maar bijna nooit werden gebruikt.","Omdat gemeenten dit gedrag wel mochten verbieden, maar allemaal andere regels gebruikten.","Omdat het gedrag geen eigen plaats had in het Wetboek van Strafrecht en de lokale regel van Rotterdam niet mocht worden toegepast.","Omdat alleen de regering zonder het parlement nieuw gedrag strafbaar mag stellen."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is C. Seksuele intimidatie in het openbaar had geen duidelijke eigen plaats in het Wetboek van Strafrecht. Daardoor werden verschillende wetsartikelen gebruikt. Rotterdam had een eigen verbod in de lokale verordening. Het gerechtshof oordeelde dat deze regel onverbindend was. Dat betekent dat de regel niet mocht worden toegepast. Een beperking van de vrijheid van meningsuiting moet worden vastgelegd in een wet die de regering en het parlement samen maken.[[1]] In de andere antwoorden staat steeds iets dat niet klopt.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 10–11."],"vraag":"Waarom heeft de wetgever seksuele intimidatie in het openbaar apart strafbaar gesteld?","wet":"Wetboek van Strafrecht"},{"artikel":"Art. 429ter Sr","juist":0,"kernregel":"Artikel 429ter Sr is niet alleen bedoeld om strafbaar gedrag te bestraffen. De wet maakt ook de norm duidelijk en probeert dit gedrag te voorkomen.","opties":["De wet maakt de norm duidelijk en probeert het gedrag te voorkomen.","De wet heeft alleen een symbolische betekenis en is niet bedoeld om te handhaven.","De wet maakt het bewijs automatisch voldoende zodra iemand aangifte doet.","De wet verplicht het Openbaar Ministerie om iedere melding te vervolgen."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is A. De strafbaarstelling heeft een normerende en een preventieve functie. Normerend betekent dat de wet duidelijk maakt welk gedrag niet wordt geaccepteerd. Preventief betekent dat de wet probeert te voorkomen dat mensen dit gedrag vertonen.[[1]][[2]] Goed optreden in de praktijk helpt om deze norm duidelijk te maken.[[3]] De wet maakt het bewijs niet automatisch voldoende. Het Openbaar Ministerie is ook niet verplicht om iedere melding te vervolgen.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 12.","Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 26.","Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 50."],"vraag":"Welke andere doelen heeft artikel 429ter Sr naast het straffen van gedrag?","wet":"Wetboek van Strafrecht"},{"artikel":"Art. 429ter Sr","juist":3,"kernregel":"Artikel 429ter Sr beschermt de vrijheid en veiligheid van mensen in de openbare ruimte.","opties":["Dat het gezag in de openbare ruimte zonder problemen kan werken.","De eerbaarheid en de goede zeden als belangrijkste belangen van de oude zedendelicten.","Alleen de lichamelijke veiligheid tegen ongewenste seksuele aanrakingen.","Dat mensen zich vrij en veilig in de openbare ruimte kunnen bevinden en bewegen."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is D. Mensen moeten zich vrij en veilig in de openbare ruimte kunnen bevinden en bewegen. De kern van het verwijt is dat iemand daar tegen zijn of haar wil als seksueel object wordt benaderd.[[1]][[2]] Het gaat niet vooral om het gezag, de goede zeden of alleen om lichamelijke veiligheid. Ook opmerkingen, gebaren en geluiden kunnen namelijk onder de strafbepaling vallen.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 12.","Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 116."],"vraag":"Welk belang wil artikel 429ter Sr volgens de wetgever vooral beschermen?","wet":"Wetboek van Strafrecht"},{"artikel":"Art. 429ter Sr","juist":1,"kernregel":"Het doel van de wet bepaalt niet of een bepaalde situatie strafbaar is. Daarvoor moet aan alle wettelijke bestanddelen zijn voldaan.","opties":["Ja. Het gevoel van het slachtoffer is altijd voldoende om het gedrag strafbaar te maken.","Nee. Je moet in iedere zaak apart vaststellen of aan alle wettelijke bestanddelen is voldaan.","Gedeeltelijk. Het gevoel van het slachtoffer is beslissend als die persoon aangifte doet.","Nee. De verdachte is alleen strafbaar als hij of zij de bedoeling had om te intimideren."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is B. Het doel van de wet legt uit waarom dit gedrag strafbaar is gesteld. Voor een bepaalde zaak moet je alle wettelijke bestanddelen apart beoordelen. Er moet bijvoorbeeld sprake zijn van een indringende seksuele benadering.[[1]] Alleen het gevoel van het slachtoffer is niet beslissend. Een aangifte verandert dat niet. Ook hoef je niet te bewijzen dat de verdachte de bedoeling had om de ander te intimideren.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 46 en 49."],"vraag":"Een collega zegt: ‘Zodra iemand zich geïntimideerd voelt, is artikel 429ter Sr overtreden.’ Klopt dat?","wet":"Wetboek van Strafrecht"}]},{"icoon":"wet","id":"m3","kader":"Art. 429ter Sr","nr":3,"pages":[{"html":"<h2 class=\"ptitle\">Leerdoelen</h2><p class=\"pintro\">Wat je na dit onderwerp kunt.</p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>de wettelijke bestanddelen van artikel 429ter Sr benoemen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen wat «in het openbaar», «indringend» en «seksueel benaderen» inhouden;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>herkennen om welke gedragingen het kan gaan: opmerkingen, gebaren, geluiden en aanrakingen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen wat het geobjectiveerde criterium betekent: je beoordeelt het gedrag volgens algemene maatstaven;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>benoemen dat opzet of schuld niet hoeft te worden bewezen.</span></li></ul>","kind":"lo","titel":"Leerdoelen"},{"html":"<h2 class=\"ptitle\">Introductie: van achtergrond naar bestanddelen</h2><div class=\"main\"><p>Het vorige onderwerp ging over de achtergrond en het doel van de strafbaarstelling. In dit onderwerp halen we de delictsomschrijving uit elkaar. Je leert welke onderdelen aanwezig moeten zijn voordat er sprake is van het delict. Die onderdelen heten bestanddelen.</p><p>Alle bestanddelen moeten vervuld zijn. Ontbreekt er één bestanddeel, dan is het delict niet voltooid. Hierna bespreken we de bestanddelen één voor één.</p></div>","kind":"theory","titel":"Introductie: van achtergrond naar bestanddelen"},{"html":"<h2 class=\"ptitle\">Juridisch kader</h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span class=\"kaart-lab\">Juridisch kader</span></div><div class=\"kaart-t\">Artikel 429ter Sr · Wetboek van Strafrecht</div><div class=\"kaart-b\"><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/></svg></span><span>Wettekst</span></div><p class=\"wet law-text\">«Degene die <mark class=\"law-part\">in het openbaar</mark> een ander <mark class=\"law-part\">indringend seksueel benadert</mark> door middel van <mark class=\"law-part\">opmerkingen, gebaren, geluiden of aanrakingen</mark> op een wijze die <mark class=\"law-part\">vreesaanjagend, vernederend, kwetsend of onterend</mark> is te achten, wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete van de derde categorie.»<sup class=\"fn\">1</sup></p></div><div class=\"law-definition\"><span class=\"law-definition-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><p>Hierna bespreken we de bestanddelen van deze bepaling één voor één.</p></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Artikel 429ter Sr (Wetboek van Strafrecht), geldend vanaf 1 juli 2024.</li></ol></div>","kind":"kader","titel":"Juridisch kader"},{"html":"<h2 class=\"ptitle\">Bestanddeel 1: «in het openbaar»</h2><div class=\"main\"><p>Het bestanddeel «in het openbaar» gaat over de plaats waar het feit gebeurt. De juridische term daarvoor is pleegplaats. Denk aan de openbare weg, het openbaar vervoer of een gebouw dat voor het publiek toegankelijk is, zoals een winkel of een uitgaansgelegenheid.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 116.</li></ol></div>","kind":"theory","titel":"Bestanddeel 1: «in het openbaar»"},{"html":"<h2 class=\"ptitle\">Bestanddeel 1: «in het openbaar» (vervolg)</h2><div class=\"main\"><p>Dit bestanddeel geldt niet alleen op een fysieke plaats. Het kan ook gelden op internet. De online omgeving moet dan voor veel mensen toegankelijk zijn. Denk bijvoorbeeld aan een openbaar bericht op sociale media.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 116.</li></ol></div>","kind":"theory","titel":"Bestanddeel 1: «in het openbaar» (vervolg)"},{"html":"<h2 class=\"ptitle\">Bestanddeel 1: «in het openbaar» (vervolg)</h2><div class=\"main\"><p>Het gaat om fysieke en online plaatsen die voor veel mensen toegankelijk zijn. Een besloten of afgeschermde online groep is niet openbaar.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 54.</li></ol></div>","kind":"theory","titel":"Bestanddeel 1: «in het openbaar» (vervolg)"},{"html":"<h2 class=\"ptitle\">Bestanddeel 2: «een ander indringend seksueel benaderen»</h2><div class=\"main\"><p>Het woord «indringend» geeft aan wanneer de seksuele benadering ernstig genoeg kan zijn voor deze strafbepaling. De benadering moet een bepaalde intensiteit hebben. Dat betekent dat iemand op een sterk overheersende en opdringerige manier contact zoekt. Gewoon contact leggen en flirten vallen daar niet onder.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114.</li></ol></div>","kind":"theory","titel":"Bestanddeel 2: «een ander indringend seksueel benaderen»"},{"html":"<h2 class=\"ptitle\">Bestanddeel 2: «een ander indringend seksueel benaderen» (vervolg)</h2><div class=\"main\"><p>Eén keer nafluiten is op zichzelf nog geen indringende benadering. Dat geldt ook voor een compliment over iemands uiterlijk.<sup class=\"fn\">1</sup> Respectvol flirten valt er ook niet onder.<sup class=\"fn\">2</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 53.</li><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 46.</li></ol></div>","kind":"theory","titel":"Bestanddeel 2: «een ander indringend seksueel benaderen» (vervolg)"},{"html":"<h2 class=\"ptitle\">Bestanddeel 2: «een ander indringend seksueel benaderen» (vervolg)</h2><div class=\"main\"><p>Het bestanddeel «seksueel» betekent dat de handeling een seksuele lading heeft. Bij opmerkingen, gebaren of geluiden blijkt die seksuele lading meestal uit wat iemand zegt of doet. Het totaalbeeld is daarbij beslissend.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114.</li></ol></div>","kind":"theory","titel":"Bestanddeel 2: «een ander indringend seksueel benaderen» (vervolg)"},{"html":"<h2 class=\"ptitle\">Bestanddeel 2: «een ander indringend seksueel benaderen» (vervolg)</h2><div class=\"main\"><p>De benadering is gericht op «een ander». Dat kan één persoon zijn, maar ook meerdere personen tegelijk.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 49.</li></ol></div>","kind":"theory","titel":"Bestanddeel 2: «een ander indringend seksueel benaderen» (vervolg)"},{"html":"<h2 class=\"ptitle\">Bestanddeel 3: «door opmerkingen, gebaren, geluiden of aanrakingen»</h2><div class=\"main\"><p>De seksuele benadering gebeurt door opmerkingen, gebaren, geluiden of aanrakingen. Dat kan om één vorm gaan. Het kan ook om een combinatie van deze vormen gaan.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114.</li></ol></div>","kind":"theory","titel":"Bestanddeel 3: «door opmerkingen, gebaren, geluiden of aanrakingen»"},{"html":"<h2 class=\"ptitle\">Bestanddeel 3: «door opmerkingen, gebaren, geluiden of aanrakingen» (vervolg)</h2><div class=\"main\"><p>Bij geluiden kun je denken aan het nafluiten van een ander. Ook het zogenoemde sissen of klakken hoort hierbij. Bij aanrakingen gaat het om korte gedragingen met weinig lichamelijk contact.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 115.</li></ol></div>","kind":"theory","titel":"Bestanddeel 3: «door opmerkingen, gebaren, geluiden of aanrakingen» (vervolg)"},{"html":"<h2 class=\"ptitle\">Bestanddeel 3: «door opmerkingen, gebaren, geluiden of aanrakingen» (vervolg)</h2><div class=\"main\"><p>Het aanraken van seksuele lichaamsdelen valt niet onder deze overtreding. Zo'n aanraking kan wel onder een zwaarder delict vallen, zoals aanranding.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114-115.</li></ol></div>","kind":"theory","titel":"Bestanddeel 3: «door opmerkingen, gebaren, geluiden of aanrakingen» (vervolg)"},{"html":"<h2 class=\"ptitle\">Bestanddeel 4: «vreesaanjagend, vernederend, kwetsend of onterend» (geobjectiveerd)</h2><div class=\"main\"><p>De benadering moet gebeuren op een manier die «vreesaanjagend, vernederend, kwetsend of onterend is te achten». Dit criterium is geobjectiveerd. Dat betekent dat je het gedrag beoordeelt volgens algemene maatstaven.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 115.</li></ol></div>","kind":"theory","titel":"Bestanddeel 4: «vreesaanjagend, vernederend, kwetsend of onterend» (geobjectiveerd)"},{"html":"<h2 class=\"ptitle\">Bestanddeel 4: «vreesaanjagend, vernederend, kwetsend of onterend» (geobjectiveerd) (vervolg)</h2><div class=\"main\"><p>Je beoordeelt volgens algemene maatstaven of de benadering intimiderend is. Het is niet nodig dat de dader dit zo heeft bedoeld. Ook hoef je niet te bewijzen dat het slachtoffer de benadering zelf zo heeft ervaren. Het genoemde gevolg hoeft niet echt te zijn ontstaan.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 47 en p. 55.</li></ol></div>","kind":"theory","titel":"Bestanddeel 4: «vreesaanjagend, vernederend, kwetsend of onterend» (geobjectiveerd) (vervolg)"},{"html":"<h2 class=\"ptitle\">Context kleurt de bestanddelen in</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Context kleurt de bestanddelen in</div><div class=\"kaart-b\"><p>Inhoud en context beïnvloeden elkaar. Is de inhoud op zichzelf niet genoeg? Dan kan de context de benadering alsnog strafbaar maken.<sup class=\"fn\">1</sup> Omstandigheden zoals de duur, hoe vaak het gebeurt en de plaats spelen daarbij een rol.<sup class=\"fn\">2</sup></p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 117.</li><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 47.</li></ol></div>","kind":"kaart","titel":"Context kleurt de bestanddelen in"},{"html":"<h2 class=\"ptitle\">Context kleurt de bestanddelen in (vervolg)</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Context kleurt de bestanddelen in</div><div class=\"kaart-b\"><p>Neem dezelfde gedraging op twee plekken. Op een plein bij daglicht valt die gedraging niet onder de delictsomschrijving. In een smal steegje in het donker kan dezelfde gedraging wél een indringende seksuele benadering zijn.<sup class=\"fn\">1</sup> De uitgebreide contextbeoordeling behandelen we in het volgende onderwerp.</p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 54.</li></ol></div>","kind":"kaart","titel":"Context kleurt de bestanddelen in (vervolg)"},{"html":"<h2 class=\"ptitle\">Geen opzet of schuld nodig; strafmaat</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Geen opzet of schuld
