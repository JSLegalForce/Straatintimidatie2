ath d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg></span><span class=\"kaart-lab\">Let op</span></div><div class=\"kaart-t\">Let op: bevoegdheid en afbakening</div><div class=\"kaart-b\"><p>Artikel 429ter Sr bepaalt wannéér gedrag onder de strafbaarstelling kan vallen. Het artikel bepaalt niet welke opsporingsbevoegdheid je in een bepaalde situatie hebt. Voor een buitengewoon opsporingsambtenaar hangt die bevoegdheid onder andere af van:</p><ul class=\"opsom\"><li>het domein;</li><li>de akte van opsporingsbevoegdheid;</li><li>de geldende aanwijzingen en werkafspraken.</li></ul><p>Deze e-learning geeft je geen extra bevoegdheden. Ze vervangt ook geen lokale instructie.</p></div></div>","kind":"kaart","titel":"Let op: bevoegdheid en afbakening"},{"html":"<h2 class=\"ptitle\">Let op: bevoegdheid en afbakening (vervolg)</h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg></span><span class=\"kaart-lab\">Let op</span></div><div class=\"kaart-t\">Let op: bevoegdheid en afbakening</div><div class=\"kaart-b\"><p>Controleer bij twijfel je eigen bevoegdheid en werkwijze, en schakel zo nodig de politie of de officier van justitie in.</p></div></div>","kind":"kaart","titel":"Let op: bevoegdheid en afbakening (vervolg)"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>Het bewijs gaat over de bestanddelen. Opzet of schuld hoef je niet aan te tonen.<sup class=\"fn\">1</sup></li><li>De wettige bewijsmiddelen zijn: de eigen waarneming van de rechter, verklaringen van de verdachte, getuigen en deskundigen, en schriftelijke stukken. Het proces-verbaal is een schriftelijk bescheid (art. 152 en 339 Sv). Volgens art. 344 lid 2 Sv kan het proces-verbaal van één opsporingsambtenaar het bewijs dragen: het kan op zichzelf voldoende bewijs zijn.<sup class=\"fn\">2</sup></li><li>In de bevestigde rechtspraak rust het bewijs op de eigen waarneming van de opsporingsambtenaar, de aangifte en de bekennende verklaring.</li></ul></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114.</li><li>Wetboek van Strafvordering, art. 152, 339 en 344 lid 2.</li></ol></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>Leg vooral de feiten en de omstandigheden vast. De rechter bepaalt uiteindelijk de kwalificatie: de juridische naam van het bewezen feit.</li><li>Vermijd de veelgemaakte fouten: een conclusie zonder feiten, parafrase, ontbrekende context en een aanname als waarneming.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Vooruitblik: Tik-proces-verbaal</h2><div class=\"main\"><p>Bij eenvoudige en duidelijke zaken wordt in de praktijk soms een verkort proces-verbaal opgemaakt. Dat heet een tik-proces-verbaal.</p><p>In het volgende onderwerp zie je hoe zo'n verkorte vastlegging eruitziet. Je leert ook welke bestanddelen daarin niet mogen ontbreken.</p></div>","kind":"theory","titel":"Vooruitblik: Tik-proces-verbaal"}],"titel":"Bewijs en proces-verbaal","type":"content","vragen":[{"artikel":"Art. 429ter Sr","juist":1,"kernregel":"Leg de feiten en omstandigheden duidelijk en controleerbaar vast. De rechter bepaalt de juridische kwalificatie.","opties":["Alleen de conclusie dat de man de vrouw seksueel heeft geïntimideerd.","De letterlijke opmerkingen, het volgen, de plaats, het tijdstip, de afstand en de zichtbare reactie van de vrouw.","Alleen de persoonsgegevens van de verdachte en een verwijzing naar artikel 429ter Sr.","Alleen dat de situatie vreesaanjagend was, zonder de waargenomen feiten te beschrijven."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is B. Beschrijf zo precies mogelijk wat je zelf zag en hoorde. Noteer de letterlijke opmerkingen, het volgen, de plaats, het tijdstip, de afstand en de zichtbare reactie. Met deze feiten kan de rechter de bestanddelen beoordelen. Schrijf dus niet alleen een juridische conclusie op. Volgens artikel 344, tweede lid, Sv kan een goed proces-verbaal van één opsporingsambtenaar voldoende bewijs zijn.","voetnoten":["Wetboek van Strafvordering, art. 344 lid 2."],"vraag":"Praktijkcasus. Je ziet dat een man een onbekende vrouw kort volgt en twee keer een seksuele opmerking maakt. De vrouw gaat sneller lopen. Wat schrijf je in het proces-verbaal?","wet":"Wetboek van Strafvordering"},{"artikel":"Art. 429ter Sr","juist":2,"kernregel":"Bij artikel 429ter Sr kunnen verschillende soorten bewijs een rol spelen.","opties":["Alleen een bekentenis van de verdachte.","Alleen een aangifte van het slachtoffer.","Onder andere een eigen waarneming, een aangifte, een getuigenverklaring en een bekentenis.","Alleen camerabeelden, zonder dat iemand beschrijft wat daarop is waargenomen."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is C. In de besproken uitspraken gebruikte de rechter verschillende soorten bewijs. Het ging om eigen waarnemingen van opsporingsambtenaren, een aangifte en een bekennende verklaring. Camerabeelden kunnen informatie geven. Leg dan vast wie de beelden heeft bekeken en wat daarop is waargenomen. De rechter gebruikt uiteindelijk de wettige bewijsmiddelen die in artikel 339 Sv staan.","voetnoten":["Rb Rotterdam 2 oktober 2024, ECLI:NL:RBROT:2024:9612; Rb Midden-Nederland 7 oktober 2024, ECLI:NL:RBMNE:2024:5727."],"vraag":"Welke soorten bewijs kunnen een rol spelen bij artikel 429ter Sr?","wet":"Rechtspraak"},{"artikel":"Art. 429ter Sr","juist":2,"kernregel":"De omstandigheden tellen mee bij de juridische beoordeling. Beschrijf ze daarom feitelijk in het proces-verbaal.","opties":["Dat hoeft niet. Alleen de gedraging zelf telt.","Alleen om de privacy van het slachtoffer te beschermen.","Omdat deze omstandigheden meetellen bij de juridische beoordeling.","Alleen om later de hoogte van de straf te bepalen."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is C. De inhoud van het gedrag en de omstandigheden beïnvloeden elkaar. Zonder een duidelijke beschrijving kan de rechter de situatie niet volledig beoordelen.[[1]] De omstandigheden zijn dus niet alleen belangrijk voor de privacy of de hoogte van de straf.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 117."],"vraag":"Waarom beschrijf je de plaats, het tijdstip en de reactie in het proces-verbaal?","wet":"Wetboek van Strafrecht"}]},{"icoon":"document","id":"m7","kader":"Art. 429ter Sr","nr":7,"pages":[{"html":"<h2 class=\"ptitle\">Leerdoelen</h2><p class=\"pintro\">Wat je na dit onderwerp kunt.</p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen wat een tik-proces-verbaal is en wanneer het geschikt is;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>noemen welke bestanddelen ook in een verkort proces-verbaal moeten staan;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>de onderdelen van een verkort proces-verbaal koppelen aan de wettelijke bestanddelen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>herkennen wanneer je beter een uitgebreid proces-verbaal kunt maken.</span></li></ul>","kind":"lo","titel":"Leerdoelen"},{"html":"<h2 class=\"ptitle\">Over deze werkwijze</h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg></span><span class=\"kaart-lab\">Let op</span></div><div class=\"kaart-t\">Over deze werkwijze</div><div class=\"kaart-b\"><p>Er is geen officiële, openbare bron die de vorm van een tik-proces-verbaal voorschrijft. De wet, de wetsgeschiedenis en gepubliceerde uitspraken schrijven deze vorm niet voor. Dit onderwerp geeft daarom uitleg voor de praktijk. De eisen aan de inhoud en het bewijs komen wel uit officiële bronnen. Die eisen blijven helemaal gelden. Die eisen gaan over de vraag welke bestanddelen je moet vastleggen en hoe je het bewijs levert.</p></div></div>","kind":"kaart","titel":"Over deze werkwijze"},{"html":"<h2 class=\"ptitle\">Wat is een tik-proces-verbaal?</h2><div class=\"main\"><p>Een tik-proces-verbaal is een verkort proces-verbaal. In de praktijk gebruik je het bij eenvoudige, duidelijke overtredingen. Het is korter dan een uitgebreid proces-verbaal. Toch blijft het een proces-verbaal met dezelfde functie: je legt je waarneming feitelijk vast als bewijsmiddel.</p><p>Verkort betekent niet minder zorgvuldig. Ook in een tik-proces-verbaal beschrijf je duidelijk welke feiten de bestanddelen bewijzen.</p></div>","kind":"theory","titel":"Wat is een tik-proces-verbaal?"},{"html":"<h2 class=\"ptitle\">Wat mag niet ontbreken?</h2><div class=\"main\"><p>Ook een verkort proces-verbaal moet alle bestanddelen van artikel 429ter Sr dekken. Beschrijf dus dat het feit in het openbaar plaatsvond. Beschrijf dat er sprake was van een indringende seksuele benadering. Beschrijf door welke gedraging dat gebeurde: een opmerking, een gebaar, een geluid of een aanraking. Beschrijf ook de omstandigheden. Daaruit moet blijken waarom de benadering volgens algemene maatstaven vreesaanjagend, vernederend, kwetsend óf onterend kan zijn.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114.</li></ol></div>","kind":"theory","titel":"Wat mag niet ontbreken?"},{"html":"<h2 class=\"ptitle\">Wat mag niet ontbreken? (vervolg)</h2><div class=\"main\"><p>Leg daarom ten minste deze punten vast:</p><ul class=\"opsom\"><li>de plaats en het tijdstip;</li><li>de letterlijke opmerking of een feitelijke beschrijving van de gedraging;</li><li>de context, zoals de omgeving en de reactie van de betrokkene;</li><li>wie de situatie zelf heeft waargenomen.</li></ul></div>","kind":"theory","titel":"Wat mag niet ontbreken? (vervolg)"},{"html":"<div class=\"figcap\">Wat mag niet ontbreken?</div><figure class=\"illu\"><svg viewBox=\"0 0 560 316\" role=\"img\" aria-labelledby=\"pv-t pv-d\" font-family=\"'Outfit',system-ui,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n<title id=\"pv-t\">Verkort en uitgebreid proces-verbaal</title>\n<desc id=\"pv-d\">Een tik-proces-verbaal (verkort) past bij een eenvoudige, duidelijke zaak; een uitgebreid proces-verbaal bij een complexe of betwiste zaak. Beide moeten alle bestanddelen dekken. Verkort betekent niet minder zorgvuldig.</desc>\n<rect x=\"20\" y=\"20\" width=\"250\" height=\"170\" rx=\"14\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<g transform=\"translate(133,40) scale(1.1)\" stroke=\"var(--blauw-licht)\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></g>\n<text x=\"145\" y=\"112\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Tik-pv (verkort)</text>\n<text x=\"145\" y=\"150\" text-anchor=\"middle\" class=\"il-sub\" fill=\"var(--tekst-mid)\">eenvoudige,</text>\n<text x=\"145\" y=\"170\" text-anchor=\"middle\" class=\"il-sub\" fill=\"var(--tekst-mid)\">duidelijke zaak</text>\n<rect x=\"290\" y=\"20\" width=\"250\" height=\"170\" rx=\"14\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<g transform=\"translate(403,40) scale(1.1)\" stroke=\"var(--blauw-licht)\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></g>\n<text x=\"415\" y=\"112\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Uitgebreid pv</text>\n<text x=\"415\" y=\"150\" text-anchor=\"middle\" class=\"il-sub\" fill=\"var(--tekst-mid)\">complexe of</text>\n<text x=\"415\" y=\"170\" text-anchor=\"middle\" class=\"il-sub\" fill=\"var(--tekst-mid)\">betwiste zaak</text>\n<rect x=\"20\" y=\"206\" width=\"520\" height=\"42\" rx=\"10\" fill=\"var(--grijs-licht)\" stroke=\"var(--grijs-mid)\" stroke-width=\"1.5\"/>\n<text x=\"280\" y=\"232\" text-anchor=\"middle\" class=\"il-sub\" font-weight=\"700\" fill=\"currentColor\">Beide dekken álle bestanddelen.</text>\n<text x=\"280\" y=\"286\" text-anchor=\"middle\" class=\"il-note\" font-style=\"italic\" fill=\"var(--tekst-mid)\">Verkort betekent niet minder zorgvuldig.</text>\n</svg></figure>","kind":"figuur","titel":"Wat mag niet ontbreken?"},{"html":"<h2 class=\"ptitle\">Praktijkvoorbeeld</h2><div class=\"main\"><p>Het voorbeeld hieronder is fictief. Het laat alleen de opbouw zien. Het is geen officieel model.</p></div>","kind":"theory","titel":"Praktijkvoorbeeld"},{"html":"<h2 class=\"ptitle\">Praktijkvoorbeeld (vervolg)</h2><div class=\"main\"><p>«Op [datum] omstreeks [tijd] bevond ik, verbalisant, mij op het [plein] te [plaats], een voor het publiek toegankelijke plaats. Ik zag en hoorde dat een man, later herkend als de verdachte, een hem onbekende vrouw op korte afstand volgde en tweemaal luid de opmerking maakte: '[letterlijke opmerking]'. Ik zag dat de vrouw haar pas versnelde en wegkeek. Het was op dat moment rustig op het plein.»</p></div>","kind":"theory","titel":"Praktijkvoorbeeld (vervolg)"},{"html":"<h2 class=\"ptitle\">Wat maakt dit voorbeeld bruikbaar?</h2><div class=\"main\"><p>Het voorbeeld noemt de plaats. Daaruit blijkt dat het om een openbare plaats gaat. Het noemt de gedraging: een herhaalde letterlijke opmerking. Het noemt de context, zoals de afstand, de reactie en hoe druk het was. En het noemt de waarnemer.</p><p>Juist aan deze punten kan de rechter de bestanddelen toetsen.</p></div>","kind":"theory","titel":"Wat maakt dit voorbeeld bruikbaar?"},{"html":"<h2 class=\"ptitle\">Welke omstandigheden kun je daarnaast nog vastleggen?</h2><div class=\"main\"><p>Bij de beoordeling van seksuele straatintimidatie zijn de omstandigheden erg belangrijk. Leg daarom in het proces-verbaal niet alleen de gedraging zelf vast, maar ook de omstandigheden waarin deze plaatsvond.</p><p>Denk bijvoorbeeld aan de volgende feiten en omstandigheden.</p></div>","kind":"theory","titel":"Welke omstandigheden kun je daarnaast nog vastleggen?"},{"html":"<h2 class=\"ptitle\">Welke omstandigheden kun je daarnaast nog vastleggen? (vervolg)</h2><ul class=\"opsom\"><li>de afstand tussen de verdachte en de betrokkene;</li><li>de duur van de gedraging;</li><li>of de verdachte de betrokkene heeft gevolgd;</li><li>hoe vaak de opmerkingen, gebaren of geluiden werden gemaakt;</li><li>de exacte bewoordingen van de uitingen (zo letterlijk mogelijk);</li><li>de toon waarop de uitingen werden gedaan (bijvoorbeeld schreeuwen of luid roepen);</li><li>eventuele seksuele gebaren;</li></ul>","kind":"lijst","titel":"Welke omstandigheden kun je daarnaast nog vastleggen? (vervolg)"},{"html":"<h2 class=\"ptitle\">Welke omstandigheden kun je daarnaast nog vastleggen? (vervolg)</h2><ul class=\"opsom\"><li>eventuele aanrakingen;</li><li>de reactie van de betrokkene (bijvoorbeeld versnellen, weglopen, afwijzen, zichtbaar schrikken of negeren);</li><li>de reactie van de verdachte nadat de betrokkene afwijzend reageerde;</li><li>of de verdachte ondanks een afwijzende reactie bleef doorgaan;</li><li>de locatie waar de gedraging plaatsvond;</li><li>de drukte op de locatie;</li><li>het tijdstip van de gedraging;</li></ul>","kind":"lijst","titel":"Welke omstandigheden kun je daarnaast nog vastleggen? (vervolg)"},{"html":"<h2 class=\"ptitle\">Welke omstandigheden kun je daarnaast nog vastleggen? (vervolg)</h2><ul class=\"opsom\"><li>de lichtomstandigheden;</li><li>de aanwezigheid van omstanders;</li><li>de aanwezigheid van getuigen;</li><li>de aanwezigheid van camerabeelden of bodycambeelden;</li><li>jouw eigen waarnemingen als opsporingsambtenaar;</li><li>eventuele spontane uitlatingen van de verdachte;</li><li>overige feiten en omstandigheden die objectief waarneembaar zijn en die belangrijk kunnen zijn voor de beoordeling.</li></ul>","kind":"lijst","titel":"Welke omstandigheden kun je daarnaast nog vastleggen? (vervolg)"},{"html":"<h2 class=\"ptitle\">Praktijktip</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Praktijktip</div><div class=\"kaart-b\"><p>Leg zoveel mogelijk feiten en omstandigheden vast die je zelf kunt waarnemen. Beschrijf duidelijk wat je zelf hebt waargenomen en maak onderscheid tussen:</p><ul class=\"punten\"><li>eigen waarnemingen;</li><li>verklaringen van betrokkenen;</li><li>verklaringen van getuigen;</li><li>conclusies die je op basis van de feiten trekt.</li></ul><p>Met een duidelijke beschrijving kunnen de officier van justitie en de rechter het gedrag juridisch beoordelen.</p></div></div>","kind":"kaart","titel":"Praktijktip"},{"html":"<h2 class=\"ptitle\">Belangrijk</h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg></span><span class=\"kaart-lab\">Let op</span></div><div class=\"kaart-t\">Belangrijk</div><div class=\"kaart-b\"><p>De punten hierboven zijn geen wettelijke checklist. Welke omstandigheden belangrijk zijn, hangt af van de situatie.</p></div></div>","kind":"kaart","titel":"Belangrijk"},{"html":"<h2 class=\"ptitle\">Wanneer geen tik-proces-verbaal?</h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg></span><span class=\"kaart-lab\">Let op</span></div><div class=\"kaart-t\">Wanneer geen tik-proces-verbaal?</div><div class=\"kaart-b\"><p>Een verkort proces-verbaal past niet bij complexe of betwiste situaties. Denk aan deze gevallen. Het gedrag is op zichzelf niet duidelijk seksueel. De omstandigheden bepalen dan sterk of het gedrag strafbaar is. Of er zijn tegenstrijdige verklaringen. Of de leeftijd, eventueel letsel of meerdere feiten spelen een rol. In die gevallen is een uitgebreid proces-verbaal de logische keuze.</p></div></div>","kind":"kaart","titel":"Wanneer geen tik-proces-verbaal?"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>Het tik-proces-verbaal is een verkorte praktijkwerkwijze voor eenvoudige, duidelijke zaken. Voor de vorm bestaat geen officiële bron.</li><li>Een verkort proces-verbaal is niet minder zorgvuldig: alle bestanddelen moeten gedekt blijven.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>Leg ten minste vast: plaats en tijdstip, de letterlijke gedraging, de context en de waarnemer.</li><li>Bij complexe of betwiste zaken is een uitgebreid proces-verbaal de juiste keuze.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Vooruitblik: Samenvatting van de opleiding</h2><div class=\"main\"><p>Je hebt nu de achtergrond, de bestanddelen, de context, de rechtspraak, het bewijs en het proces-verbaal doorlopen.</p><p>In het laatste onderwerp vatten we de rode draad van de opleiding samen.</p></div>","kind":"theory","titel":"Vooruitblik: Samenvatting van de opleiding"}],"titel":"Tik-proces-verbaal","type":"content","vragen":[{"artikel":"Art. 429ter Sr","juist":3,"kernregel":"Een tik-proces-verbaal is een werkwijze uit de praktijk. De wettelijke eisen aan de inhoud en het bewijs blijven gelden.","opties":["Ja. Deze vorm staat in het Wetboek van Strafvordering.","Ja. Deze vorm staat in gepubliceerde uitspraken over artikel 429ter Sr.","Ja. Een landelijke aanwijzing van het Openbaar Ministerie schrijft deze vorm verplicht voor.","Nee. Het is een werkwijze uit de praktijk. De wettelijke eisen aan de inhoud en het bewijs blijven wel gelden."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is D. Er is geen officiële, openbare bron gevonden die de vorm van een tik-proces-verbaal voorschrijft. Het is een verkorte werkwijze uit de praktijk. De regels over de bestanddelen en het bewijs blijven wel helemaal gelden.[[1]] De wet, gepubliceerde rechtspraak en een landelijke aanwijzing schrijven deze vorm niet voor.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114."],"vraag":"Is de vorm van een tik-proces-verbaal officieel voorgeschreven?","wet":"Praktijkuitleg"},{"artikel":"Art. 429ter Sr","juist":0,"kernregel":"Ook een verkort proces-verbaal moet met feiten duidelijk maken waarom aan de bestanddelen kan zijn voldaan.","opties":["De feiten die de bestanddelen onderbouwen, zoals plaats, tijd, gedraging, omstandigheden en waarneming.","Alleen de persoonsgegevens van de verdachte.","Alleen het juridische eindoordeel van de opsporingsambtenaar.","Alleen een verwijzing naar een ander proces-verbaal, zonder de feiten te beschrijven."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is A. Verkort betekent niet minder zorgvuldig. Beschrijf ten minste de plaats en de tijd, de letterlijke gedraging, de omstandigheden en wat je zelf hebt waargenomen.[[1]] Alleen persoonsgegevens, een juridisch oordeel of een verwijzing zonder feiten is niet voldoende.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114."],"vraag":"Wat moet in een verkort proces-verbaal in ieder geval staan?","wet":"Praktijkuitleg"},{"artikel":"Art. 429ter Sr","juist":1,"kernregel":"Bij een ingewikkelde of betwiste zaak past een uitgebreid proces-verbaal beter.","opties":["Bij een eenvoudige en duidelijke zaak waarin weinig discussie over de feiten bestaat.","Bij een ingewikkelde of betwiste zaak, bijvoorbeeld als verklaringen elkaar tegenspreken.","Bij iedere zaak die op een voor het publiek toegankelijke plaats gebeurde.","Bij iedere zaak waarin het slachtoffer geen aangifte deed."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is B. Maak bij een ingewikkelde of betwiste zaak een uitgebreid proces-verbaal. Dat geldt bijvoorbeeld als de omstandigheden sterk bepalen of het gedrag strafbaar is of als verklaringen elkaar tegenspreken.[[1]] Een openbare plaats of het ontbreken van een aangifte is op zichzelf geen reden voor een uitgebreid proces-verbaal.","voetnoten":["Rb Den Haag 8 september 2025, ECLI:NL:RBDHA:2025:20482."],"vraag":"Wanneer kun je beter een uitgebreid proces-verbaal maken?","wet":"Praktijkuitleg"}]},{"icoon":"list","id":"m8","kader":"Terugblik","nr":8,"pages":[{"html":"<h2 class=\"ptitle\">Leerdoelen</h2><p class=\"pintro\">Wat je na dit onderwerp kunt.</p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>de belangrijkste punten uit de opleiding samenvatten;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>de belangrijkste regels van artikel 429ter Sr uitleggen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>je voorbereiden op de eindtoets.</span></li></ul>","kind":"lo","titel":"Leerdoelen"},{"html":"<h2 class=\"ptitle\">Terugblik</h2><div class=\"main\"><p>In de vorige onderwerpen kwam dit na elkaar aan bod: de achtergrond van de strafbaarstelling, de bestanddelen, de context, de rechtspraak, het bewijs en het proces-verbaal.</p><p>Deze samenvatting brengt de kernpunten bij elkaar. Er komt geen nieuwe juridische inhoud bij. Alle punten zijn in de vorige onderwerpen onderbouwd met officiële bronnen.</p></div>","kind":"theory","titel":"Terugblik"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-t\">1. Achtergrond en doel</div><div class=\"kaart-b\"><ul class=\"punten\"><li>Artikel 429ter Sr geldt sinds 1 juli 2024. Het beschermt het vrij en veilig kunnen verkeren in de openbare ruimte.</li><li>De strafbaarstelling maakt handhaving mogelijk. Daarnaast maakt de wet de norm duidelijk en probeert zij dit gedrag te voorkomen.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-t\">2. Wettelijke bestanddelen</div><div class=\"kaart-b\"><ul class=\"punten\"><li>Alle bestanddelen moeten aanwezig zijn. Het zijn er vier:</li></ul><ul class=\"opsom\"><li>in het openbaar;</li><li>een ander indringend seksueel benaderen;</li><li>door opmerkingen, gebaren, geluiden of aanrakingen;</li><li>op een manier die volgens algemene maatstaven vreesaanjagend, vernederend, kwetsend óf onterend is.</li></ul><ul class=\"punten\"><li>Het criterium is geobjectiveerd. Het gaat om een overtreding. Je hoeft daarom geen opzet of schuld te bewijzen.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-t\">3. Contextbeoordeling</div><div class=\"kaart-b\"><ul class=\"punten\"><li>De inhoud en de omstandigheden beïnvloeden elkaar. De wetgever noemt dit ‘communicerende vaten’. De omstandigheden beïnvloeden de beoordeling.</li><li>De duur, hoe vaak het gebeurt, de plaats en de omgeving tellen mee. Dezelfde gedraging kan door de context wel of niet strafbaar zijn. Je beoordeelt het gedrag volgens algemene maatstaven. Je hoeft niet te bewijzen hoe het slachtoffer het gedrag persoonlijk heeft beleefd.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-t\">4. Rechtspraak</div><div class=\"kaart-b\"><ul class=\"punten\"><li>De eerste strafzaken, gepubliceerd vanaf oktober 2024, laten zien dat waarnemingen van opsporingsambtenaren voldoende bewijs kunnen opleveren.</li><li>De rechter toetst de bestanddelen zelf en kiest de kwalificatie. Die kwalificatie is soms beperkter dan de tenlastelegging. De rechter weegt daarbij de context mee.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-t\">5. Bewijs en proces-verbaal</div><div class=\"kaart-b\"><ul class=\"punten\"><li>De bestanddelen worden bewezen met de eigen waarneming, verklaringen van verdachte, getuige of deskundige en schriftelijke stukken. Camerabeelden kunnen informatie leveren. Leg dan vast wie de beelden heeft bekeken en wat daarop is waargenomen.</li><li>Leg de feiten en de context vast, niet de kwalificatie. Schrijf geen conclusies op zonder feiten die ze onderbouwen.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-t\">6. Tik-proces-verbaal</div><div class=\"kaart-b\"><ul class=\"punten\"><li>Een verkort proces-verbaal is bedoeld voor eenvoudige, duidelijke zaken. Voor de vorm bestaat geen officiële bron.</li><li>Ook in een verkort proces-verbaal moeten alle bestanddelen herkenbaar zijn. Bij complexe of betwiste zaken is een uitgebreid proces-verbaal de juiste keuze.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Beslishulp: kan artikel 429ter Sr van toepassing zijn?</h2><div class=\"main\"><p>De beslishulp zet de bestanddelen op een rij. Je kunt hiermee een situatie stap voor stap controleren. De rechter beoordeelt uiteindelijk het bewijs en de kwalificatie.</p></div>","kind":"theory","titel":"Beslishulp: kan artikel 429ter Sr van toepassing zijn?"},{"html":"<div class=\"figcap\">Beslishulp: kan artikel 429ter Sr van toepassing zijn?</div><figure class=\"illu\"><svg viewBox=\"0 0 560 432\" role=\"img\" aria-labelledby=\"bs-t bs-d\" font-family=\"'Outfit',system-ui,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n<title id=\"bs-t\">Beslishulp: kan artikel 429ter Sr van toepassing zijn?</title>\n<desc id=\"bs-d\">Doorloop vier voorwaarden. Is het in het openbaar (fysiek of online)? Is sprake van een indringende seksuele benadering? Gebeurt dit door een opmerking, gebaar, geluid of aanraking? Is de benadering volgens algemene maatstaven intimiderend? Dit is het geobjectiveerde criterium. Zijn alle antwoorden ‘ja’? Dan kan artikel 429ter Sr gelden. Is één antwoord ‘nee’? Dan is niet aan alle bestanddelen voldaan. Opzet of schuld hoeft niet te worden bewezen; bij twijfel legt de opsporingsambtenaar de feiten zorgvuldig vast en beoordeelt de rechter.</desc>\n<text x=\"280\" y=\"12\" text-anchor=\"middle\" class=\"il-note\" fill=\"var(--tekst-mid)\">Elke voorwaarde ‘ja’ → volgende stap · één ‘nee’ → valt buiten</text>\n<rect x=\"20\" y=\"20\" width=\"520\" height=\"46\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<circle cx=\"52\" cy=\"43\" r=\"15\" fill=\"var(--blauw-licht)\"/><text x=\"52\" y=\"48\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--wit)\">1</text>\n<text x=\"80\" y=\"49\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">In het openbaar? (fysiek of online)</text>\n<line x1=\"280\" y1=\"66\" x2=\"280\" y2=\"82\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/><path d=\"M273 76l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"292\" y=\"79\" font-size=\"12\" font-weight=\"700\" fill=\"var(--blauw-licht)\">ja</text>\n<rect x=\"20\" y=\"84\" width=\"520\" height=\"46\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<circle cx=\"52\" cy=\"107\" r=\"15\" fill=\"var(--blauw-licht)\"/><text x=\"52\" y=\"112\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--wit)\">2</text>\n<text x=\"80\" y=\"113\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Indringende seksuele benadering?</text>\n<line x1=\"280\" y1=\"130\" x2=\"280\" y2=\"146\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/><path d=\"M273 140l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"292\" y=\"143\" font-size=\"12\" font-weight=\"700\" fill=\"var(--blauw-licht)\">ja</text>\n<rect x=\"20\" y=\"148\" width=\"520\" height=\"46\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<circle cx=\"52\" cy=\"171\" r=\"15\" fill=\"var(--blauw-licht)\"/><text x=\"52\" y=\"176\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--wit)\">3</text>\n function iconMarkup(name,cls){

      button.insertAdjacentHTML('beforeend',iconMarkup('arrowRight','nav-icon'));
    }

function chooseTopicIcon(text){
  const t=String(text||'').toLowerCase();
  if(/introductie/.test(t))return 'bookOpen';
  if(/achtergrond|doel van de strafbaarstelling/.test(t))return 'info';
  if(/wettelijke bestanddelen|bestanddelen/.test(t))return 'balans';
  if(/context|omstandigheden/.test(t))return 'usersDistance';
  if(/rechtspraak/.test(t))return 'landmark';
  if(/bewijs/.test(t))return 'fileSearch';
  if(/proces-verbaal|proces verbaal/.test(t))return 'filePen';
  if(/samenvatting/.test(t))return 'clipboardCheck';
  return 'bookOpen';
}
function choosePageTitleIcon(text){
  const t=String(text||'').toLowerCase();
  if(/leerdoel/.test(t))return 'target';
  if(/samengevat|samenvatting|kernpunten|overzicht/.test(t))return 'clipboardCheck';
  if(/rechtspraak|gerechtshof|rechtbank|rechter|arrest/.test(t))return 'landmark';
  if(/proces-verbaal|proces verbaal|\bpv\b|vastleggen/.test(t))return 'filePen';
  if(/bewijs|camerabeeld|waarneming|getuige/.test(t))return 'fileSearch';
  if(/letterlijke|woorden|uitlating|gezegd/.test(t))return 'quote';
  if(/afstand|gedrag|benaderen|context/.test(t))return 'usersDistance';
  if(/plaats|tijd|openbaar/.test(t))return 'calendarClock';
  if(/wet|artikel|bestanddeel|strafbaar|juridisch|delict/.test(t))return 'balans';
  if(/voorbeeld|situatie|casus|praktijk/.test(t))return 'oog';
  if(/let op|valkuil|aandacht/.test(t))return 'waarschuwing';
  if(/onthoud/.test(t))return 'shieldCheck';
  if(/toets|vraag/.test(t))return 'helpCircle';
  if(/opzet|stap|werkwijze/.test(t))return 'list';
  return 'bookOpen';
}

    title.classList.add('with-page-icon');
  });
  document.querySelectorAll('.main ul:not(.lo):not(.punten):not(.bb-l)>li').forEach(li=>{
    if(!li.querySelector(':scope > .list-icon'))li.insertAdjacentHTML('afterbegin',iconMarkup('vink','list-icon'));

}

  const body=esc(text).replace(/\[\[(\d+)\]\]/g,(_,d)=>{const c=(voetnoten||[])[(+d)-1];if(!c)return '';let n=kaart[c];if(!n){n=lijst.length+1;kaart[c]=n;lijst.push(c);}return '<sup class="fn">'+n+'</sup>';});
  let bron='';
  if(lijst.length) bron='<div class="bronnen-blok"><div class="bb-t">Bronnen</div><ol class="bb-l">'+lijst.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ol></div>';
  return {body,bron};
}
function shuffle(n){const a=[];for(let i=0;i<n;i++)a.push(i);for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function buildSteps(){steps=[];D.topics.forEach((t,ti)=>{t.pages.forEach((p,pi)=>steps.push({type:'page',ti,pi}));t.vragen.forEach((q,qi)=>steps.push({type:'q',ti,qi}));});}
const qAnsweredCount=()=>Object.keys(answers).length;
const onderwerpenKlaar=()=>qAnsweredCount()>=D.totaalVragen;
function setScreen(html){app.innerHTML=html;enhanceIconSystem();enhanceVisibleIcons();window.scrollTo(0,0);}
const vnv=id=>document.getElementById(id).value.trim();

function intake(){
  phase='intake';
  const sv=load();
  const kanHervatten=sv&&sv.profiel&&sv.phase&&sv.phase!=='intake';
  let html='<div class="card"><span class="pill">Stap 1 — Gegevens</span><h1 class="wk">Jouw gegevens</h1>';
  if(kanHervatten){
    html+='<p class="wk-in">We hebben opgeslagen voortgang gevonden voor <b>'+esc(sv.profiel.voornaam+' '+sv.profiel.achternaam)+'</b>. Je kunt verdergaan waar je was gebleven of opnieuw beginnen.</p>'
     +'<div class="nav"><button class="btn btn-ghost" id="opnieuw">Opnieuw beginnen</button><span class="sp"></span><button class="btn btn-primary" id="verder">Verdergaan →</button></div></div>';
    setScreen(html);
    document.getElementById('verder').onclick=()=>hervat(sv);
    document.getElementById('opnieuw').onclick=()=>{wis();intake();};
    return;
  }
  html+='<p class="wk-in">Vul je naam in voordat je begint. We gebruiken deze gegevens alleen voor het certificaat. Ze blijven op dit apparaat staan.</p>'
   +'<label class="f">Voornaam <span class="req">*</span></label><input class="f" id="vn" placeholder="bijv. Jan">'
   +'<label class="f">Achternaam <span class="req">*</span></label><input class="f" id="an" placeholder="bijv. de Vries">'
   +'<label class="f">Organisatie <span class="opt">(optioneel)</span></label><input class="f" id="og" placeholder="bijv. Gemeente Amsterdam">'
   +'<p class="err" id="er">Vul je voor- en achternaam in.</p>'
   +'<div class="nav"><span class="sp"></span><button class="btn btn-primary" id="go">Verder naar de e-learning →</button></div></div>';
  setScreen(html);
  document.getElementById('go').onclick=()=>{const vn=vnv('vn'),an=vnv('an'),og=vnv('og');if(!vn||!an){document.getElementById('er').classList.add('on');return;}profiel={voornaam:vn,achternaam:an,org:og};welkom();};
}
function hervat(sv){
  profiel=sv.profiel;answers=sv.answers||{};si=sv.si||0;ex=sv.ex||null;phase=sv.phase;
  if(phase==='leren'){buildSteps();render();}
  else if(phase==='eindtoets'&&ex){exVraag();}
  else if(phase==='exresult'&&ex){exResult();}
  else if(phase==='certificaat'&&ex){certificaat(ex.pct);}
  else welkom();
}
function welkom(){
  phase='welkom';save();
  setScreen('<div class="card"><span class="pill">'+esc(D.kaderLabel)+'</span><h1 class="wk">Welkom, '+esc(profiel.voornaam)+'</h1>'
   +'<p class="wk-sub">'+esc(D.opleiding)+'</p>'
   +'<p class="wk-in">Elk onderwerp begint met korte theorie. Daarna volgen enkele oefenvragen met directe feedback. Na alle onderwerpen maak je een eindtoets over de hele opleiding. Haal je die, dan krijg je een certificaat.</p>'
   +'<div class="stats"><div class="stat"><div class="n">'+D.aantalOnderwerpen+'</div><div class="l">Onderwerpen met oefenvragen</div></div>'
   +'<div class="stat"><div class="n">'+D.eindtoets.length+'</div><div class="l">Vragen in de eindtoets</div></div>'
   +'<div class="stat"><div class="n">'+D.eindtoetsDrempel+'%</div><div class="l">Nodig voor certificaat</div></div></div>'
   +'<div class="nav"><span class="sp"></span><button class="btn btn-primary" id="go">Start de e-learning →</button></div></div>');
  document.getElementById('go').onclick=()=>{answers={};ex=null;buildSteps();si=0;phase='leren';render();};
}
function render(){const st=steps[si];if(!st)return eindtoetsIntro();phase='leren';save();return st.type==='page'?pageScreen(st):qScreen(st);}
function topHead(t,hint){return '<div class="tophead"><div class="itile">'+(IC[t.icoon]||IC.document)+'</div><div><div class="ohint">Onderwerp '+t.nr+' · '+esc(hint)+'</div><div class="otitel">'+esc(t.titel)+'</div></div></div>';}
function statusRow(left,soort,frac){return '<div class="status"><div class="status-row"><span>'+esc(left)+'</span>'+(soort?'<span class="soort">'+esc(soort)+'</span>':'')+'</div><div class="pbar"><i style="width:'+Math.round(frac*100)+'%"></i></div></div>';}
function isLaatsteLerenStap(){return si===steps.length-1;}
function pageScreen(st){
  const t=D.topics[st.ti],p=t.pages[st.pi],n=st.pi+1,tot=t.pages.length,last=isLaatsteLerenStap();
  setScreen(statusRow('Pagina '+n+' van '+tot,null,(si+1)/steps.length)
   +'<div class="card">'+topHead(t,'Pagina '+n+'/'+tot)+p.html
   +'<div class="nav"><button class="btn btn-ghost" id="prev"'+(si===0?' style="visibility:hidden"':'')+'>← Vorige</button><span class="sp"></span><button class="btn btn-primary" id="next">'+(last?'Naar de eindtoets →':'Volgende →')+'</button></div></div>');
  const pv=document.getElementById('prev');if(pv)pv.onclick=()=>{if(si>0){si--;render();}};
  document.getElementById('next').onclick=()=>{if(last){eindtoetsIntro();}else{si++;render();}};
}
function qScreen(st){
  const t=D.topics[st.ti],q=t.vragen[st.qi];
  const done=qAnsweredCount(),qn=globalQNum(st);
  let html=statusRow('Vraag '+qn+' van '+D.totaalVragen,q.soort,done/D.totaalVragen);
  html+='<div class="card">'+topHead(t,'Oefenvragen')+'<span class="q-soort">'+esc(q.soort)+'</span>'
   +'<div class="q-lab">De vraag</div><p class="q-text">'+esc(q.vraag)+'</p>'
   +'<div class="opts" id="opts">'+q.opties.map((o,i)=>'<button class="opt" data-i="'+i+'"><span class="lt">'+L(i)+'</span><span class="ot">'+esc(o)+'</span></button>').join('')+'</div>'
   +'<div id="fb"></div>'
   +'<div class="nav"><button class="btn btn-ghost" id="prev"'+(si===0?' style="visibility:hidden"':'')+'>← Vorige</button><span class="sp"></span><button class="btn btn-primary" id="act" disabled>Controleer antwoord</button></div></div>';
  setScreen(html);
  const pv=document.getElementById('prev');if(pv)pv.onclick=()=>{if(si>0){si--;render();}};
  if(answers[key(st)]!==undefined){lockAndReveal(st,answers[key(st)]);return;}
  let sel=null;const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.onclick=()=>{if(b.classList.contains('locked'))return;sel=+b.dataset.i;opts.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');document.getElementById('act').disabled=false;});
  document.getElementById('act').onclick=()=>{if(sel===null)return;answers[key(st)]={sel,goed:sel===q.juist};save();lockAndReveal(st,answers[key(st)]);};
}
function key(st){return st.ti+'-'+st.qi;}
function globalQNum(st){let n=0;for(let i=0;i<D.topics.length;i++)for(let j=0;j<D.topics[i].vragen.length;j++){n++;if(i===st.ti&&j===st.qi)return n;}return n;}
function lockAndReveal(st,ans){
  const t=D.topics[st.ti],q=t.vragen[st.qi],last=isLaatsteLerenStap();
  [...document.querySelectorAll('.opt')].forEach(b=>{const i=+b.dataset.i;b.classList.add('locked');b.classList.remove('sel');b.onclick=null;
    if(i===q.juist){b.classList.add('goed');b.insertAdjacentHTML('beforeend','<span class="tagje">'+vink+(i===ans.sel?'Jouw antwoord · juist':'Juiste antwoord')+'</span>');}
    else if(i===ans.sel){b.classList.add('fout');b.insertAdjacentHTML('beforeend','<span class="tagje">'+kruis+'Jouw antwoord · onjuist</span>');}});
  document.getElementById('fb').innerHTML=feedbackHTML(q,ans);
  const act=document.getElementById('act');
  act.disabled=false;act.textContent=last?'Naar de eindtoets →':'Volgende vraag →';act.onclick=()=>{if(last){eindtoetsIntro();}else{si++;render();}};
}
function feedbackHTML(q,ans){
  const goed=ans.goed,jouw=L(ans.sel)+'. '+q.opties[ans.sel],juist=L(q.juist)+'. '+q.opties[q.juist];
  const uit=fnRender(q.uitleg,q.voetnoten);
  let h='<div class="fb '+(goed?'ok':'no')+'"><div class="fb-top">'+(goed?vink:kruis)+(goed?'Juist beantwoord':'Onjuist beantwoord')+'</div><div class="fb-body">';
  h+='<div class="fb-sec"><div class="fb-h">Jouw antwoord</div><p class="fb-ans '+(goed?'g':'r')+'">'+esc(jouw)+'</p></div>';
  if(!goed)h+='<div class="fb-sec"><div class="fb-h">Juiste antwoord</div><p class="fb-ans g">'+esc(juist)+'</p></div>';
  h+='<div class="fb-sec"><div class="fb-h">Toelichting</div><p class="fb-p">'+uit.body+'</p></div>';
  if(q.kernregel)h+='<div class="fb-sec fb-kern"><div class="fb-h">Kernregel</div><p class="fb-p">'+esc(q.kernregel)+'</p></div>';
  if(uit.bron)h+='<div class="fb-sec">'+uit.bron+'</div>';
  h+='</div></div>';return h;
}
const kort=s=>{s=s.replace(/\[\[\d+\]\]/g,'').replace(/\s+/g,' ').trim();return s.length>70?s.slice(0,68)+'…':s;};

/* ── EINDTOETS (afzonderlijk; feedback pas na afronding) ── */
function nieuweEindtoets(){
  const N=D.eindtoets.length;
  ex={order:shuffle(N),perm:[],sel:[],i:0,submitted:false,pct:0,goed:0};
  for(let p=0;p<N;p++){ex.perm.push(shuffle(4));ex.sel.push(null);}
}
function eindtoetsIntro(){
  phase='eindtoets';
  if(!ex||ex.submitted){/* verse toets */}
  nieuweEindtoets();save();
  setScreen('<div class="card"><span class="pill">Eindtoets</span><h1 class="wk">Eindtoets</h1>'
   +'<p class="wk-in">Je hebt alle onderwerpen doorlopen. De eindtoets bevat <b>'+D.eindtoets.length+' vragen</b> over de hele opleiding, waaronder enkele praktijkcasussen. Je krijgt <b>geen</b> feedback per vraag. De toelichting verschijnt pas nadat je de toets hebt afgerond.</p>'
   +'<p class="wk-in">Je kunt binnen de toets terugbladeren en je antwoord wijzigen zolang je nog niet hebt afgerond. Voor een certificaat is ten minste <b>'+D.eindtoetsDrempel+'%</b> nodig. Haal je de toets niet, dan kun je hem opnieuw maken. De volgorde van vragen en antwoorden wisselt dan.</p>'
   +'<div class="nav"><button class="btn btn-ghost" id="terug">← Terug naar start</button><span class="sp"></span><button class="btn btn-primary" id="go">Start de eindtoets →</button></div></div>');
  document.getElementById('go').onclick=()=>{ex.i=0;exVraag();};
  document.getElementById('terug').onclick=()=>{welkom();};
}
function exVraag(){
  phase='eindtoets';
  const N=D.eindtoets.length,p=ex.i,q=D.eindtoets[ex.order[p]],perm=ex.perm[p];
  const beantwoord=ex.sel.filter(x=>x!==null).length,last=(p===N-1);
  let html=statusRow('Eindtoets · vraag '+(p+1)+' van '+N,q.casus?'Praktijkcasus':(q.thema||'Kennisvraag'),beantwoord/N);
  html+='<div class="card"><div class="tophead"><div class="itile">'+(IC.balans||IC.document)+'</div><div><div class="ohint">Eindtoets · '+esc(q.thema||'')+'</div><div class="otitel">Vraag '+(p+1)+' van '+N+'</div></div></div>'
   +'<span class="q-soort">'+(q.casus?'Praktijkcasus':'Kennisvraag')+'</span>'
   +'<div class="q-lab">De vraag</div><p class="q-text">'+esc(q.vraag)+'</p>'
   +'<div class="opts" id="opts">'+perm.map((orig,slot)=>{const selCls=(ex.sel[p]===orig)?' sel':'';return '<button class="opt'+selCls+'" data-orig="'+orig+'"><span class="lt">'+L(slot)+'</span><span class="ot">'+esc(q.opties[orig])+'</span></button>';}).join('')+'</div>'
   +'<div class="nav"><button class="btn btn-ghost" id="prev"'+(p===0?' style="visibility:hidden"':'')+'>← Vorige</button><span class="sp"></span><button class="btn btn-primary" id="act"'+(ex.sel[p]===null?' disabled':'')+'>'+(last?'Toets afronden →':'Volgende →')+'</button></div></div>';
  setScreen(html);
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.onclick=()=>{ex.sel[p]=+b.dataset.orig;opts.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');document.getElementById('act').disabled=false;save();});
  const pv=document.getElementById('prev');if(pv)pv.onclick=()=>{if(ex.i>0){ex.i--;save();exVraag();}};
  document.getElementById('act').onclick=()=>{
    if(ex.sel[p]===null)return;
    if(last){const leeg=ex.sel.filter(x=>x===null).length;if(leeg>0){ex.i=ex.sel.indexOf(null);save();exVraag();return;}exSubmit();}
    else{ex.i++;save();exVraag();}
  };
}
function exSubmit(){
  const N=D.eindtoets.length;let goed=0;
  for(let p=0;p<N;p++){const q=D.eindtoets[ex.order[p]];if(ex.sel[p]===q.juist)goed++;}
  ex.goed=goed;ex.pct=Math.round(goed/N*100);ex.submitted=true;phase='exresult';save();exResult();
}
function exResult(){
  phase='exresult';save();
  const N=D.eindtoets.length,pass=ex.pct>=D.eindtoetsDrempel,klaar=onderwerpenKlaar();
  let rows='';
  for(let p=0;p<N;p++){const q=D.eindtoets[ex.order[p]],sel=ex.sel[p],ok=(sel===q.juist);
    rows+='<div class="qrow '+(ok?'g100':'gfout')+'"><div class="qrow-h"><span class="qn">'+(p+1)+'</span><span class="qo">'+esc(kort(q.vraag))+'</span><span class="qs">'+(ok?vink+'Juist':kruis+'Onjuist')+'</span><span class="chev">'+chev+'</span></div>'
      +'<div class="qrow-d"><div class="ln"><b>Jouw antwoord:</b> '+esc(sel!=null?q.opties[sel]:'—')+'</div><div class="ln"><b>Juiste antwoord:</b> '+esc(q.opties[q.juist])+'</div><div class="ln" style="margin-top:6px">'+esc(q.uitleg)+'</div></div></div>';}
  let acts='';
  if(pass&&klaar)acts+='<button class="btn btn-groen" id="cert">Certificaat bekijken</button>';
  if(!pass)acts+='<button class="btn btn-primary" id="her">Eindtoets opnieuw maken</button>';
  if(pass&&!klaar)acts+='<button class="btn btn-primary" id="terugleren">Onderwerpen afronden</button>';
  acts+='<button class="btn btn-ghost" id="dash">Terug naar start</button>';
  setScreen('<div class="card"><h1 class="res-h">Resultaat eindtoets</h1><p class="res-sub">'+esc(profiel.voornaam+' '+profiel.achternaam)+(profiel.org?' — '+esc(profiel.org):'')+'</p>'
   +'<div class="score"><div class="p">'+ex.pct+'%</div><div class="pl">Behaald percentage</div><div class="g">'+ex.goed+' van de '+N+' vragen juist</div></div>'
   +'<div class="verdict '+(pass?'ok':'no')+'">'+(pass?vink:kruis)+(pass?'GESLAAGD':'NIET GESLAAGD')+'</div>'
   +'<p class="advies">'+(pass?(klaar?'Je hebt de eindtoets gehaald. Je certificaat staat klaar.':'Je hebt de eindtoets gehaald. Rond eerst alle onderwerpen af voor het certificaat.'):'Voor een certificaat is ten minste '+D.eindtoetsDrempel+'% nodig. Bekijk de nabespreking hieronder en maak de eindtoets opnieuw. De volgorde wisselt dan.')+'</p>'
   +'<div class="seclab">Nabespreking per vraag</div>'+rows
   +'<div class="acts">'+acts+'</div></div>');
  [...document.querySelectorAll('.qrow-h')].forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('open'));
  const c=document.getElementById('cert');if(c)c.onclick=()=>certificaat(ex.pct);
  const her=document.getElementById('her');if(her)her.onclick=()=>{eindtoetsIntro();};
  const tl=document.getElementById('terugleren');if(tl)tl.onclick=()=>{buildSteps();si=0;phase='leren';render();};
  document.getElementById('dash').onclick=()=>{welkom();};
}
function certificaat(pct){
  phase='certificaat';save();
  const jaar=new Date().getFullYear();
  let nr=(ex&&ex.nr)?ex.nr:('JSLF-SI-'+jaar+'-'+Math.random().toString(36).slice(2,8).toUpperCase());
  if(ex){ex.nr=nr;save();}
  const datum=new Date().toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'});
  setScreen('<div class="card"><div class="cert"><div class="top"></div><div class="sh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 3l7.5 3.2V12c0 4.6-3.1 7.9-7.5 9.2C7.6 19.9 4.5 16.6 4.5 12V6.2L12 3z"/></svg></div>'
   +'<div class="k">JS Legal Force · Certificaat</div><h2>CERTIFICAAT</h2><p class="lead">Hierbij wordt verklaard dat</p>'
   +'<div class="naam">'+esc(profiel.voornaam+' '+profiel.achternaam)+'</div>'
   +'<p class="opl">de eindtoets van de e-learning <b>'+esc(D.opleiding)+'</b> met goed gevolg heeft afgerond.</p>'
   +'<div class="meta"><div><div class="mk">Score eindtoets</div><div class="mv">'+pct+'%</div></div><div><div class="mk">Datum</div><div class="mv">'+datum+'</div></div><div><div class="mk">Juridische peildatum</div><div class="mv">'+esc(D.peildatum)+'</div></div><div><div class="mk">Certificaatnr.</div><div class="mv">'+nr+'</div></div></div></div>'
   +'<div class="acts"><button class="btn btn-primary" id="dl">↓ Download certificaat (PDF)</button><button class="btn btn-ghost" id="terug">← Terug naar resultaat</button></div></div>');
  document.getElementById('dl').onclick=()=>window.print();
  document.getElementById('terug').onclick=()=>exResult();
}
intake();
</script>
<script>
(function(){function c(){const x=document.querySelector('#app > .card,main .card');if(!x)return;x.classList.remove('learning-page','law-page','question-page','case-page');const t=(x.textContent||'').toLowerCase();if(x.querySelector('.q-text,.opts'))x.classList.add('question-page');else{x.classList.add('learning-page');if(t.includes('artikel 429ter')&&(t.includes('wettekst')||t.includes('juridisch kader')))x.classList.add('law-page');if(t.includes('praktijkcasus')||t.includes('situatie'))x.classList.add('case-page')}}const a=document.getElementById('app')||document.body;new MutationObserver(c).observe(a,{childList:true,subtree:true});c()})();
</script>

</body>
</html>
