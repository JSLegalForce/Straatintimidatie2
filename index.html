t op</span></div><div class=\"kaart-t\">Wanneer geen tik-proces-verbaal?</div><div class=\"kaart-b\"><p>Een verkort proces-verbaal is niet passend bij complexe of betwiste situaties. Dat is bijvoorbeeld het geval wanneer de gedraging op zichzelf niet duidelijk seksueel is en de strafbaarheid sterk van de context afhangt, wanneer sprake is van tegenstrijdige verklaringen, of wanneer de leeftijd, eventueel letsel of meerdere feiten een rol spelen. In die gevallen ligt een uitgebreid proces-verbaal in de rede.</p></div></div>"},{"titel":"Kort samengevat","kind":"onthoud","html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>Het tik-proces-verbaal is een verkorte praktijkwerkwijze voor eenvoudige, duidelijke zaken; voor de vorm bestaat geen officiële bron.</li><li>Een verkort proces-verbaal is niet minder zorgvuldig: alle bestanddelen moeten gedekt blijven.</li></ul></div></div>"},{"titel":"Kort samengevat","kind":"onthoud","html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>Leg ten minste vast: plaats en tijdstip, de letterlijke gedraging, de context en de waarnemer.</li><li>Bij complexe of betwiste zaken is een uitgebreid proces-verbaal aangewezen.</li></ul></div></div>"},{"titel":"Vooruitblik: Samenvatting van de opleiding","kind":"theory","html":"<h2 class=\"ptitle\">Vooruitblik: Samenvatting van de opleiding</h2><div class=\"main\"><p>Hiermee zijn de achtergrond, de bestanddelen, de context, de rechtspraak, het bewijs en het proces-verbaal doorlopen.</p><p>In het laatste onderwerp wordt de rode draad van de opleiding samengevat.</p></div>"}],"vragen":[{"soort":"Kennisvraag","vraag":"Wat is de juridische status van het 'tik-proces-verbaal' als vorm?","opties":["Het is voorgeschreven in het Wetboek van Strafvordering.","Het is vastgelegd in gepubliceerde rechtspraak over artikel 429ter Sr.","Het is neergelegd in een landelijke aanwijzing van het openbaar ministerie, die de vorm en de minimuminhoud van dit type proces-verbaal bindend voorschrijft.","Er is geen officiële bron die de vorm voorschrijft; het is een praktijkwerkwijze, terwijl de bewijseisen onverkort gelden."],"juist":3,"uitleg":"Het juiste antwoord is D. Voor het tik-proces-verbaal als format is geen officiële, gepubliceerde bron aanwijsbaar; het betreft een verkorte praktijkwerkwijze. De inhoudelijke eisen, te weten welke bestanddelen worden vastgelegd en hoe deze worden bewezen, vloeien wel uit officiële bronnen voort en blijven onverkort gelden.[[1]] De overige antwoorden veronderstellen voor de vorm een officiële grondslag die ontbreekt, of deze nu in de wet, in de rechtspraak of in een aanwijzing van het openbaar ministerie zou zijn gelegen.","kernregel":"Het tik-proces-verbaal is een vormvrije praktijkwerkwijze; de inhoudelijke bewijseisen van artikel 429ter Sr blijven onverkort gelden.","artikel":"Art. 429ter Sr","wet":"Praktijkuitleg","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114."]},{"soort":"Kennisvraag","vraag":"Wat mag in een verkort (tik-)proces-verbaal niet ontbreken?","opties":["De feiten die alle bestanddelen dragen: plaats en tijd, de gedraging, de context en de waarnemer.","Uitsluitend de personalia van de verdachte.","Uitsluitend de juridische eindconclusie van de verbalisant.","Een beknopte samenvatting die voor de onderbouwing naar het volledige proces-verbaal verwijst, zonder de dragende feiten daarin nogmaals te herhalen."],"juist":0,"uitleg":"Het juiste antwoord is A. Een verkorte vorm betekent niet dat minder zorgvuldig te werk mag worden gegaan: ook een tik-proces-verbaal dient alle bestanddelen te dekken.[[1]] Ten minste de plaats en tijd, de letterlijke gedraging, de context en de waarnemer behoren daarin te worden opgenomen. De overige antwoorden laten juist de dragende feiten weg, door zich te beperken tot de personalia, tot een juridische eindconclusie, of tot een enkele verwijzing naar een ander proces-verbaal zonder de feiten zelf vast te leggen.","kernregel":"Ook een verkort proces-verbaal moet alle bestanddelen van artikel 429ter Sr feitelijk dragen.","artikel":"Art. 429ter Sr","wet":"Praktijkuitleg","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114."]},{"soort":"Kennisvraag","vraag":"In welke situatie kun je beter géén verkort proces-verbaal gebruiken?","opties":["Bij een eenvoudige, op het eerste gezicht duidelijke zaak met een bekennende verdachte, waarin over de toedracht en de context geen enkel misverstand kan bestaan.","Bij een complexe of betwiste zaak, bijvoorbeeld wanneer de strafbaarheid sterk van de context afhangt of verklaringen elkaar tegenspreken.","Bij elke zaak die zich op een openbare plaats afspeelt.","Bij elke zaak waarin geen aangifte is gedaan."],"juist":1,"uitleg":"Het juiste antwoord is B. Bij complexe of betwiste situaties, bijvoorbeeld wanneer een op zichzelf niet-seksuele handeling pas door de context strafbaar wordt[[1]] of wanneer sprake is van tegenstrijdige verklaringen, is een uitgebreid proces-verbaal passender. De overige antwoorden zijn onjuist: bij een eenvoudige, duidelijke zaak volstaat juist een verkorte vorm, de enkele omstandigheid dat een zaak zich op een openbare plaats afspeelt is niet bepalend, en het ontbreken van een aangifte noopt op zichzelf niet tot een uitgebreid proces-verbaal, nu de eigen waarneming kan volstaan.","kernregel":"Bij complexe of betwiste zaken, waarin de strafbaarheid sterk van de context afhangt, verdient een uitgebreid proces-verbaal de voorkeur boven een verkorte vorm.","artikel":"Art. 429ter Sr","wet":"Praktijkuitleg","voetnoten":["Rb Den Haag 8 september 2025, ECLI:NL:RBDHA:2025:20482."]}]},{"id":"m8","nr":8,"titel":"Samenvatting","kader":"Terugblik","icoon":"list","type":"samenvatting","pages":[{"titel":"Leerdoelen","kind":"lo","html":"<h2 class=\"ptitle\">Leerdoelen</h2><p class=\"pintro\">Wat je na dit onderwerp kunt.</p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>de kernpunten van de opleiding samenbrengen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>de rode draad van artikel 429ter Sr overzien;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>zich voorbereiden op de eindtoets.</span></li></ul>"},{"titel":"Terugblik","kind":"theory","html":"<h2 class=\"ptitle\">Terugblik</h2><div class=\"main\"><p>In de voorgaande onderwerpen zijn achtereenvolgens de achtergrond van de strafbaarstelling, de bestanddelen, de context, de rechtspraak, het bewijs en het proces-verbaal aan de orde gekomen.</p><p>Deze samenvatting brengt de kernpunten bijeen. Er wordt geen nieuwe juridische inhoud toegevoegd; alle punten zijn in de voorgaande onderwerpen met officiële bronnen onderbouwd.</p></div>"},{"titel":"Kort samengevat","kind":"onthoud","html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-t\">1. Achtergrond en doel</div><div class=\"kaart-b\"><ul class=\"punten\"><li>Artikel 429ter Sr, in werking getreden op 1 juli 2024, beschermt het vrij en veilig kunnen verkeren in de openbare ruimte.</li><li>De strafbaarstelling heeft naast de handhavingsfunctie een normerende en preventieve functie.</li></ul></div></div>"},{"titel":"Kort samengevat","kind":"onthoud","html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-t\">2. Wettelijke bestanddelen</div><div class=\"kaart-b\"><ul class=\"punten\"><li>De bestanddelen moeten alle aanwezig zijn: in het openbaar, een ander indringend seksueel benaderen, door opmerkingen, gebaren, geluiden of aanrakingen, op een geobjectiveerd vreesaanjagende, vernederende, kwetsende of onterende wijze.</li><li>Het criterium is geobjectiveerd, en omdat het een overtreding betreft hoeft geen opzet of schuld te worden bewezen.</li></ul></div></div>"},{"titel":"Kort samengevat","kind":"onthoud","html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-t\">3. Contextbeoordeling</div><div class=\"kaart-b\"><ul class=\"punten\"><li>Inhoud en context zijn communicerende vaten; de omstandigheden kleuren de beoordeling in.</li><li>Duur, frequentie, pleegplaats en omgeving wegen mee. Dezelfde gedraging kan door de context wel of niet strafbaar zijn, beoordeeld naar algemene maatstaven en niet naar de subjectieve beleving van het slachtoffer.</li></ul></div></div>"},{"titel":"Kort samengevat","kind":"onthoud","html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-t\">4. Jurisprudentie</div><div class=\"kaart-b\"><ul class=\"punten\"><li>De eerste strafzaken, gepubliceerd vanaf oktober 2024, laten zien dat waarnemingen van opsporingsambtenaren zelfstandig bewijs kunnen opleveren.</li><li>De rechter toetst de bestanddelen zelf, kiest de kwalificatie, die soms enger is dan de tenlastelegging, en weegt de context mee.</li></ul></div></div>"},{"titel":"Kort samengevat","kind":"onthoud","html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-t\">5. Bewijs en proces-verbaal</div><div class=\"kaart-b\"><ul class=\"punten\"><li>De bestanddelen worden bewezen met de eigen waarneming, verklaringen van verdachte, getuige of deskundige en schriftelijke bescheiden zoals camerabeelden.</li><li>Leg de feiten en de context vast en niet de kwalificatie; vermijd conclusies zonder onderbouwende feiten.</li></ul></div></div>"},{"titel":"Kort samengevat","kind":"onthoud","html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-t\">6. Tik-proces-verbaal</div><div class=\"kaart-b\"><ul class=\"punten\"><li>Een verkort proces-verbaal voor eenvoudige, duidelijke zaken; voor de vorm bestaat geen officiële bron.</li><li>Ook verkort moeten alle bestanddelen herkenbaar zijn. Bij complexe of betwiste zaken is een uitgebreid proces-verbaal aangewezen.</li></ul></div></div>"},{"titel":"Beslishulp: kan artikel 429ter Sr van toepassing zijn?","kind":"theory","html":"<h2 class=\"ptitle\">Beslishulp: kan artikel 429ter Sr van toepassing zijn?</h2><div class=\"main\"><p>De volgende beslishulp vat de bestanddelen samen tot een praktische controle. De rechter beoordeelt uiteindelijk het bewijs en de kwalificatie.</p></div>"},{"titel":"Beslishulp: kan artikel 429ter Sr van toepassing zijn?","kind":"figuur","html":"<div class=\"figcap\">Beslishulp: kan artikel 429ter Sr van toepassing zijn?</div><figure class=\"illu\"><svg viewBox=\"0 0 560 432\" role=\"img\" aria-labelledby=\"bs-t bs-d\" font-family=\"'Outfit',system-ui,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n<title id=\"bs-t\">Beslishulp: kan artikel 429ter Sr van toepassing zijn?</title>\n<desc id=\"bs-d\">Doorloop vier voorwaarden. Is het in het openbaar (fysiek of online)? Is sprake van een indringende seksuele benadering? Gebeurt dit door een opmerking, gebaar, geluid of aanraking? Is het naar algemene maatstaven intimiderend (het geobjectiveerde criterium)? Is elk antwoord ja, dan kan artikel 429ter Sr van toepassing zijn; is één antwoord nee, dan valt het erbuiten. Opzet of schuld hoeft niet te worden bewezen; bij twijfel legt de opsporingsambtenaar de feiten zorgvuldig vast en beoordeelt de rechter.</desc>\n<text x=\"280\" y=\"12\" text-anchor=\"middle\" class=\"il-note\" fill=\"var(--tekst-mid)\">Elke voorwaarde ‘ja’ → volgende stap · één ‘nee’ → valt buiten</text>\n<rect x=\"20\" y=\"20\" width=\"520\" height=\"46\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<circle cx=\"52\" cy=\"43\" r=\"15\" fill=\"var(--blauw-licht)\"/><text x=\"52\" y=\"48\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--wit)\">1</text>\n<text x=\"80\" y=\"49\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">In het openbaar? (fysiek of online)</text>\n<line x1=\"280\" y1=\"66\" x2=\"280\" y2=\"82\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/><path d=\"M273 76l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"292\" y=\"79\" font-size=\"12\" font-weight=\"700\" fill=\"var(--blauw-licht)\">ja</text>\n<rect x=\"20\" y=\"84\" width=\"520\" height=\"46\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<circle cx=\"52\" cy=\"107\" r=\"15\" fill=\"var(--blauw-licht)\"/><text x=\"52\" y=\"112\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--wit)\">2</text>\n<text x=\"80\" y=\"113\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Indringende seksuele benadering?</text>\n<line x1=\"280\" y1=\"130\" x2=\"280\" y2=\"146\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/><path d=\"M273 140l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"292\" y=\"143\" font-size=\"12\" font-weight=\"700\" fill=\"var(--blauw-licht)\">ja</text>\n<rect x=\"20\" y=\"148\" width=\"520\" height=\"46\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<circle cx=\"52\" cy=\"171\" r=\"15\" fill=\"var(--blauw-licht)\"/><text x=\"52\" y=\"176\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--wit)\">3</text>\n<text x=\"80\" y=\"177\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Opmerking, gebaar, geluid of aanraking?</text>\n<line x1=\"280\" y1=\"194\" x2=\"280\" y2=\"210\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/><path d=\"M273 204l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"292\" y=\"207\" font-size=\"12\" font-weight=\"700\" fill=\"var(--blauw-licht)\">ja</text>\n<rect x=\"20\" y=\"212\" width=\"520\" height=\"58\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<circle cx=\"52\" cy=\"241\" r=\"15\" fill=\"var(--blauw-licht)\"/><text x=\"52\" y=\"246\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--wit)\">4</text>\n<text x=\"80\" y=\"237\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Naar algemene maatstaven intimiderend?</text>\n<text x=\"80\" y=\"259\" class=\"il-sub4\" fill=\"var(--tekst-mid)\">geobjectiveerd criterium</text>\n<line x1=\"280\" y1=\"270\" x2=\"280\" y2=\"286\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/>\n<path d=\"M120 300 L120 286 L280 286\" fill=\"none\" stroke=\"var(--zilver)\" stroke-width=\"2\"/><path d=\"M440 300 L440 286 L280 286\" fill=\"none\" stroke=\"var(--blauw)\" stroke-width=\"2\"/>\n<path d=\"M113 294l7 8l7 -8\" fill=\"none\" stroke=\ const chev='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
let profiel=null, steps=[], si=0, answers={}, phase='intake';
let ex=null; /* eindtoetsstaat: {order,perm,sel,i,submitted,pct,goed} */

/* ── lokale voortgang (best effort; faalt stil waar niet beschikbaar) ── */
const SKEY='jslf-si-v13';
function save(){try{localStorage.setItem(SKEY,JSON.stringify({v:13,profiel,phase,si,answers,ex}));}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(SKEY)||'null');}catch(e){return null;}}
function wis(){try{localStorage.removeItem(SKEY);}catch(e){}}

/* superscript-voetnoten in vraaguitleg (pagina-gebonden) */
function fnRender(text,voetnoten){
  const lijst=[],kaart={};
  const body=esc(text).replace(/\[\[(\d+)\]\]/g,(_,d)=>{const c=(voetnoten||[])[(+d)-1];if(!c)return '';let n=kaart[c];if(!n){n=lijst.length+1;kaart[c]=n;lijst.push(c);}return '<sup class="fn">'+n+'</sup>';});
  let bron='';
  if(lijst.length) bron='<div class="bronnen-blok"><div class="bb-t">Bronnen</div><ol class="bb-l">'+lijst.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ol></div>';
  return {body,bron};
}
function shuffle(n){const a=[];for(let i=0;i<n;i++)a.push(i);for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function buildSteps(){steps=[];D.topics.forEach((t,ti)=>{t.pages.forEach((p,pi)=>steps.push({type:'page',ti,pi}));t.vragen.forEach((q,qi)=>steps.push({type:'q',ti,qi}));});}
const qAnsweredCount=()=>Object.keys(answers).length;
const onderwerpenKlaar=()=>qAnsweredCount()>=D.totaalVragen;
function setScreen(html){app.innerHTML=html;window.scrollTo(0,0);}
const vnv=id=>document.getElementById(id).value.trim();

function intake(){
  phase='intake';
  const sv=load();
  const kanHervatten=sv&&sv.profiel&&sv.phase&&sv.phase!=='intake';
  let html='<div class="card"><span class="pill">Stap 1 — Gegevens</span><h1 class="wk">Jouw gegevens</h1>';
  if(kanHervatten){
    html+='<p class="wk-in">Er is opgeslagen voortgang gevonden voor <b>'+esc(sv.profiel.voornaam+' '+sv.profiel.achternaam)+'</b>. Je kunt verdergaan waar je was gebleven of opnieuw beginnen.</p>'
     +'<div class="nav"><button class="btn btn-ghost" id="opnieuw">Opnieuw beginnen</button><span class="sp"></span><button class="btn btn-primary" id="verder">Verdergaan →</button></div></div>';
    setScreen(html);
    document.getElementById('verder').onclick=()=>hervat(sv);
    document.getElementById('opnieuw').onclick=()=>{wis();intake();};
    return;
  }
  html+='<p class="wk-in">Vul je naam in voordat je begint. Deze gegevens worden uitsluitend gebruikt voor het certificaat en blijven lokaal op dit apparaat.</p>'
   +'<label class="f">Voornaam <span class="req">*</span></label><input class="f" id="vn" placeholder="bijv. Jan">'
   +'<label class="f">Achternaam <span class="req">*</span></label><input class="f" id="an" placeholder="bijv. de Vries">'
   +'<label class="f">Organisatie <span class="opt">(optioneel)</span></label><input class="f" id="og" placeholder="bijv. Gemeente Amsterdam">'
   +'<p class="err" id="er">Vul je voor- en achternaam in.</p>'
   +'<div class="nav"><span class="sp"></span><button class="btn btn-primary" id="go">Verder naar de e-learning →</button></div></div>';
  setScreen(html);
  document.getElementById('go').onclick=()=>{const vn=vnv('vn'),an=vnv('an'),og=vnv('og');if(!vn||!an){document.getElementById('er').classList.add('on');return;}profiel={voornaam:vn,achternaam:an,org:og};welkom();};
}
function hervat(sv){
  profiel=sv.profiel;answers=sv.answers||{};si=sv.si||0;ex=sv.ex||null;phase=sv.phase;
  if(phase==='leren'){buildSteps();render();}
  else if(phase==='eindtoets'&&ex){exVraag();}
  else if(phase==='exresult'&&ex){exResult();}
  else if(phase==='certificaat'&&ex){certificaat(ex.pct);}
  else welkom();
}
function welkom(){
  phase='welkom';save();
  setScreen('<div class="card"><span class="pill">'+esc(D.kaderLabel)+'</span><h1 class="wk">Welkom, '+esc(profiel.voornaam)+'</h1>'
   +'<p class="wk-sub">'+esc(D.opleiding)+'</p>'
   +'<p class="wk-in">Elk onderwerp begint met een beknopte theoretische uiteenzetting, gevolgd door enkele oefenvragen met directe feedback. Daarna volgt een afzonderlijke eindtoets over de hele opleiding. Bij een voldoende op de eindtoets ontvang je een certificaat.</p>'
   +'<div class="stats"><div class="stat"><div class="n">'+D.aantalOnderwerpen+'</div><div class="l">Onderwerpen met oefenvragen</div></div>'
   +'<div class="stat"><div class="n">'+D.eindtoets.length+'</div><div class="l">Vragen in de eindtoets</div></div>'
   +'<div class="stat"><div class="n">'+D.eindtoetsDrempel+'%</div><div class="l">Vereist voor certificaat</div></div></div>'
   +'<div class="nav"><span class="sp"></span><button class="btn btn-primary" id="go">Start de e-learning →</button></div></div>');
  document.getElementById('go').onclick=()=>{answers={};ex=null;buildSteps();si=0;phase='leren';render();};
}
function render(){const st=steps[si];if(!st)return eindtoetsIntro();phase='leren';save();return st.type==='page'?pageScreen(st):qScreen(st);}
function topHead(t,hint){return '<div class="tophead"><div class="itile">'+(IC[t.icoon]||IC.document)+'</div><div><div class="ohint">Onderwerp '+t.nr+' · '+esc(hint)+'</div><div class="otitel">'+esc(t.titel)+'</div></div></div>';}
function statusRow(left,soort,frac){return '<div class="status"><div class="status-row"><span>'+esc(left)+'</span>'+(soort?'<span class="soort">'+esc(soort)+'</span>':'')+'</div><div class="pbar"><i style="width:'+Math.round(frac*100)+'%"></i></div></div>';}
function isLaatsteLerenStap(){return si===steps.length-1;}
function pageScreen(st){
  const t=D.topics[st.ti],p=t.pages[st.pi],n=st.pi+1,tot=t.pages.length,last=isLaatsteLerenStap();
  setScreen(statusRow('Pagina '+n+' van '+tot,null,(si+1)/steps.length)
   +'<div class="card">'+topHead(t,'Pagina '+n+'/'+tot)+p.html
   +'<div class="nav"><button class="btn btn-ghost" id="prev"'+(si===0?' style="visibility:hidden"':'')+'>← Vorige</button><span class="sp"></span><button class="btn btn-primary" id="next">'+(last?'Naar de eindtoets →':'Volgende →')+'</button></div></div>');
  const pv=document.getElementById('prev');if(pv)pv.onclick=()=>{if(si>0){si--;render();}};
  document.getElementById('next').onclick=()=>{if(last){eindtoetsIntro();}else{si++;render();}};
}
function qScreen(st){
  const t=D.topics[st.ti],q=t.vragen[st.qi];
  const done=qAnsweredCount(),qn=globalQNum(st);
  let html=statusRow('Vraag '+qn+' van '+D.totaalVragen,q.soort,done/D.totaalVragen);
  html+='<div class="card">'+topHead(t,'Oefenvragen')+'<span class="q-soort">'+esc(q.soort)+'</span>'
   +'<div class="q-lab">De vraag</div><p class="q-text">'+esc(q.vraag)+'</p>'
   +'<div class="opts" id="opts">'+q.opties.map((o,i)=>'<button class="opt" data-i="'+i+'"><span class="lt">'+L(i)+'</span><span class="ot">'+esc(o)+'</span></button>').join('')+'</div>'
   +'<div id="fb"></div>'
   +'<div class="nav"><button class="btn btn-ghost" id="prev"'+(si===0?' style="visibility:hidden"':'')+'>← Vorige</button><span class="sp"></span><button class="btn btn-primary" id="act" disabled>Controleer antwoord</button></div></div>';
  setScreen(html);
  const pv=document.getElementById('prev');if(pv)pv.onclick=()=>{if(si>0){si--;render();}};
  if(answers[key(st)]!==undefined){lockAndReveal(st,answers[key(st)]);return;}
  let sel=null;const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.onclick=()=>{if(b.classList.contains('locked'))return;sel=+b.dataset.i;opts.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');document.getElementById('act').disabled=false;});
  document.getElementById('act').onclick=()=>{if(sel===null)return;answers[key(st)]={sel,goed:sel===q.juist};save();lockAndReveal(st,answers[key(st)]);};
}
function key(st){return st.ti+'-'+st.qi;}
function globalQNum(st){let n=0;for(let i=0;i<D.topics.length;i++)for(let j=0;j<D.topics[i].vragen.length;j++){n++;if(i===st.ti&&j===st.qi)return n;}return n;}
function lockAndReveal(st,ans){
  const t=D.topics[st.ti],q=t.vragen[st.qi],last=isLaatsteLerenStap();
  [...document.querySelectorAll('.opt')].forEach(b=>{const i=+b.dataset.i;b.classList.add('locked');b.classList.remove('sel');b.onclick=null;
    if(i===q.juist){b.classList.add('goed');b.insertAdjacentHTML('beforeend','<span class="tagje">'+vink+(i===ans.sel?'Jouw antwoord · juist':'Juiste antwoord')+'</span>');}
    else if(i===ans.sel){b.classList.add('fout');b.insertAdjacentHTML('beforeend','<span class="tagje">'+kruis+'Jouw antwoord · onjuist</span>');}});
  document.getElementById('fb').innerHTML=feedbackHTML(q,ans);
  const act=document.getElementById('act');
  act.disabled=false;act.textContent=last?'Naar de eindtoets →':'Volgende vraag →';act.onclick=()=>{if(last){eindtoetsIntro();}else{si++;render();}};
}
function feedbackHTML(q,ans){
  const goed=ans.goed,jouw=L(ans.sel)+'. '+q.opties[ans.sel],juist=L(q.juist)+'. '+q.opties[q.juist];
  const uit=fnRender(q.uitleg,q.voetnoten);
  let h='<div class="fb '+(goed?'ok':'no')+'"><div class="fb-top">'+(goed?vink:kruis)+(goed?'Juist beantwoord':'Onjuist beantwoord')+'</div><div class="fb-body">';
  h+='<div class="fb-sec"><div class="fb-h">Jouw antwoord</div><p class="fb-ans '+(goed?'g':'r')+'">'+esc(jouw)+'</p></div>';
  if(!goed)h+='<div class="fb-sec"><div class="fb-h">Juiste antwoord</div><p class="fb-ans g">'+esc(juist)+'</p></div>';
  h+='<div class="fb-sec"><div class="fb-h">Toelichting</div><p class="fb-p">'+uit.body+'</p></div>';
  if(q.kernregel)h+='<div class="fb-sec fb-kern"><div class="fb-h">Kernregel</div><p class="fb-p">'+esc(q.kernregel)+'</p></div>';
  if(uit.bron)h+='<div class="fb-sec">'+uit.bron+'</div>';
  h+='</div></div>';return h;
}
const kort=s=>{s=s.replace(/\[\[\d+\]\]/g,'').replace(/\s+/g,' ').trim();return s.length>70?s.slice(0,68)+'…':s;};

/* ── EINDTOETS (afzonderlijk; feedback pas na afronding) ── */
function nieuweEindtoets(){
  const N=D.eindtoets.length;
  ex={order:shuffle(N),perm:[],sel:[],i:0,submitted:false,pct:0,goed:0};
  for(let p=0;p<N;p++){ex.perm.push(shuffle(4));ex.sel.push(null);}
}
function eindtoetsIntro(){
  phase='eindtoets';
  if(!ex||ex.submitted){/* verse toets */}
  nieuweEindtoets();save();
  setScreen('<div class="card"><span class="pill">Eindtoets</span><h1 class="wk">Eindtoets</h1>'
   +'<p class="wk-in">Je hebt alle onderwerpen doorlopen. De eindtoets bevat <b>'+D.eindtoets.length+' vragen</b> over de hele opleiding, waaronder enkele praktijkcasussen. Je krijgt <b>geen</b> feedback per vraag; de toelichting verschijnt pas nadat je de toets hebt afgerond.</p>'
   +'<p class="wk-in">Je kunt binnen de toets terugbladeren en je antwoord wijzigen zolang je nog niet hebt afgerond. Voor een certificaat is ten minste <b>'+D.eindtoetsDrempel+'%</b> vereist. Bij onvoldoende kun je de toets opnieuw maken; de volgorde van vragen en antwoorden wisselt dan.</p>'
   +'<div class="nav"><button class="btn btn-ghost" id="terug">← Terug naar start</button><span class="sp"></span><button class="btn btn-primary" id="go">Start de eindtoets →</button></div></div>');
  document.getElementById('go').onclick=()=>{ex.i=0;exVraag();};
  document.getElementById('terug').onclick=()=>{welkom();};
}
function exVraag(){
  phase='eindtoets';
  const N=D.eindtoets.length,p=ex.i,q=D.eindtoets[ex.order[p]],perm=ex.perm[p];
  const beantwoord=ex.sel.filter(x=>x!==null).length,last=(p===N-1);
  let html=statusRow('Eindtoets · vraag '+(p+1)+' van '+N,q.casus?'Praktijkcasus':(q.thema||'Kennisvraag'),beantwoord/N);
  html+='<div class="card"><div class="tophead"><div class="itile">'+(IC.balans||IC.document)+'</div><div><div class="ohint">Eindtoets · '+esc(q.thema||'')+'</div><div class="otitel">Vraag '+(p+1)+' van '+N+'</div></div></div>'
   +'<span class="q-soort">'+(q.casus?'Praktijkcasus':'Kennisvraag')+'</span>'
   +'<div class="q-lab">De vraag</div><p class="q-text">'+esc(q.vraag)+'</p>'
   +'<div class="opts" id="opts">'+perm.map((orig,slot)=>{const selCls=(ex.sel[p]===orig)?' sel':'';return '<button class="opt'+selCls+'" data-orig="'+orig+'"><span class="lt">'+L(slot)+'</span><span class="ot">'+esc(q.opties[orig])+'</span></button>';}).join('')+'</div>'
   +'<div class="nav"><button class="btn btn-ghost" id="prev"'+(p===0?' style="visibility:hidden"':'')+'>← Vorige</button><span class="sp"></span><button class="btn btn-primary" id="act"'+(ex.sel[p]===null?' disabled':'')+'>'+(last?'Toets afronden →':'Volgende →')+'</button></div></div>';
  setScreen(html);
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.onclick=()=>{ex.sel[p]=+b.dataset.orig;opts.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');document.getElementById('act').disabled=false;save();});
  const pv=document.getElementById('prev');if(pv)pv.onclick=()=>{if(ex.i>0){ex.i--;save();exVraag();}};
  document.getElementById('act').onclick=()=>{
    if(ex.sel[p]===null)return;
    if(last){const leeg=ex.sel.filter(x=>x===null).length;if(leeg>0){ex.i=ex.sel.indexOf(null);save();exVraag();return;}exSubmit();}
    else{ex.i++;save();exVraag();}
  };
}
function exSubmit(){
  const N=D.eindtoets.length;let goed=0;
  for(let p=0;p<N;p++){const q=D.eindtoets[ex.order[p]];if(ex.sel[p]===q.juist)goed++;}
  ex.goed=goed;ex.pct=Math.round(goed/N*100);ex.submitted=true;phase='exresult';save();exResult();
}
function exResult(){
  phase='exresult';save();
  const N=D.eindtoets.length,pass=ex.pct>=D.eindtoetsDrempel,klaar=onderwerpenKlaar();
  let rows='';
  for(let p=0;p<N;p++){const q=D.eindtoets[ex.order[p]],sel=ex.sel[p],ok=(sel===q.juist);
    rows+='<div class="qrow '+(ok?'g100':'gfout')+'"><div class="qrow-h"><span class="qn">'+(p+1)+'</span><span class="qo">'+esc(kort(q.vraag))+'</span><span class="qs">'+(ok?vink+'Juist':kruis+'Onjuist')+'</span><span class="chev">'+chev+'</span></div>'
      +'<div class="qrow-d"><div class="ln"><b>Jouw antwoord:</b> '+esc(sel!=null?q.opties[sel]:'—')+'</div><div class="ln"><b>Juiste antwoord:</b> '+esc(q.opties[q.juist])+'</div><div class="ln" style="margin-top:6px">'+esc(q.uitleg)+'</div></div></div>';}
  let acts='';
  if(pass&&klaar)acts+='<button class="btn btn-groen" id="cert">Certificaat bekijken</button>';
  if(!pass)acts+='<button class="btn btn-primary" id="her">Eindtoets opnieuw maken</button>';
  if(pass&&!klaar)acts+='<button class="btn btn-primary" id="terugleren">Onderwerpen afronden</button>';
  acts+='<button class="btn btn-ghost" id="dash">Terug naar start</button>';
  setScreen('<div class="card"><h1 class="res-h">Resultaat eindtoets</h1><p class="res-sub">'+esc(profiel.voornaam+' '+profiel.achternaam)+(profiel.org?' — '+esc(profiel.org):'')+'</p>'
   +'<div class="score"><div class="p">'+ex.pct+'%</div><div class="pl">Behaald percentage</div><div class="g">'+ex.goed+' van de '+N+' vragen juist</div></div>'
   +'<div class="verdict '+(pass?'ok':'no')+'">'+(pass?vink:kruis)+(pass?'GESLAAGD':'NIET GESLAAGD')+'</div>'
   +'<p class="advies">'+(pass?(klaar?'Je hebt de eindtoets met goed gevolg afgerond. Het certificaat staat gereed.':'Je hebt de eindtoets gehaald. Rond eerst alle onderwerpen af voor het certificaat.'):'Voor een certificaat is ten minste '+D.eindtoetsDrempel+'% vereist. Bekijk de nabespreking hieronder en maak de eindtoets opnieuw; de volgorde wisselt dan.')+'</p>'
   +'<div class="seclab">Nabespreking per vraag</div>'+rows
   +'<div class="acts">'+acts+'</div></div>');
  [...document.querySelectorAll('.qrow-h')].forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('open'));
  const c=document.getElementById('cert');if(c)c.onclick=()=>certificaat(ex.pct);
  const her=document.getElementById('her');if(her)her.onclick=()=>{eindtoetsIntro();};
  const tl=document.getElementById('terugleren');if(tl)tl.onclick=()=>{buildSteps();si=0;phase='leren';render();};
  document.getElementById('dash').onclick=()=>{welkom();};
}
function certificaat(pct){
  phase='certificaat';save();
  const jaar=new Date().getFullYear();
  let nr=(ex&&ex.nr)?ex.nr:('JSLF-SI-'+jaar+'-'+Math.random().toString(36).slice(2,8).toUpperCase());
  if(ex){ex.nr=nr;save();}
  const datum=new Date().toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'});
  setScreen('<div class="card"><div class="cert"><div class="top"></div><div class="sh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 3l7.5 3.2V12c0 4.6-3.1 7.9-7.5 9.2C7.6 19.9 4.5 16.6 4.5 12V6.2L12 3z"/></svg></div>'
   +'<div class="k">JS Legal Force · Certificaat</div><h2>CERTIFICAAT</h2><p class="lead">Hierbij wordt verklaard dat</p>'
   +'<div class="naam">'+esc(profiel.voornaam+' '+profiel.achternaam)+'</div>'
   +'<p class="opl">de eindtoets van de e-learning <b>'+esc(D.opleiding)+'</b> met goed gevolg heeft afgerond.</p>'
   +'<div class="meta"><div><div class="mk">Score eindtoets</div><div class="mv">'+pct+'%</div></div><div><div class="mk">Datum</div><div class="mv">'+datum+'</div></div><div><div class="mk">Juridische peildatum</div><div class="mv">'+esc(D.peildatum)+'</div></div><div><div class="mk">Certificaatnr.</div><div class="mv">'+nr+'</div></div></div></div>'
   +'<div class="acts"><button class="btn btn-primary" id="dl">↓ Download certificaat (PDF)</button><button class="btn btn-ghost" id="terug">← Terug naar resultaat</button></div></div>');
  document.getElementById('dl').onclick=()=>window.print();
  document.getElementById('terug').onclick=()=>exResult();
}
intake();
</script>
</body>
</html>
