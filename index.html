 tijdstip</text>\n<circle cx=\"300\" cy=\"208\" r=\"3.5\" fill=\"var(--blauw-licht)\"/><text x=\"314\" y=\"213\" class=\"il-sub\" fill=\"var(--tekst-mid)\">reactie op afwijzing</text>\n<circle cx=\"300\" cy=\"236\" r=\"3.5\" fill=\"var(--blauw-licht)\"/><text x=\"314\" y=\"241\" class=\"il-sub\" fill=\"var(--tekst-mid)\">kwetsbare positie</text>\n<line x1=\"280\" y1=\"270\" x2=\"280\" y2=\"300\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/>\n<path d=\"M273 294l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<rect x=\"20\" y=\"306\" width=\"520\" height=\"64\" rx=\"14\" fill=\"var(--oranje-licht)\" stroke=\"var(--oranje)\" stroke-width=\"2\"/>\n<circle cx=\"58\" cy=\"338\" r=\"15\" fill=\"none\" stroke=\"var(--oranje)\" stroke-width=\"2.5\"/><circle cx=\"58\" cy=\"338\" r=\"4\" fill=\"var(--oranje)\"/>\n<text x=\"92\" y=\"331\" font-size=\"21\" font-weight=\"700\" fill=\"currentColor\">Totaalbeeld</text>\n<text x=\"92\" y=\"356\" class=\"il-sub\" fill=\"var(--tekst-mid)\">naar algemene maatstaven beoordeeld</text>\n<text x=\"280\" y=\"394\" text-anchor=\"middle\" class=\"il-note\" font-style=\"italic\" fill=\"var(--tekst-mid)\">Geen enkele omstandigheid is op zichzelf beslissend;</text>\n<text x=\"280\" y=\"416\" text-anchor=\"middle\" class=\"il-note\" font-style=\"italic\" fill=\"var(--tekst-mid)\">het totaalbeeld bepaalt de beoordeling.</text>\n</svg></figure>"},{"titel":"Welke omstandigheden wegen mee?","kind":"theory","html":"<h2 class=\"ptitle\">Welke omstandigheden wegen mee?</h2><div class=\"main\"><p>Tot de omstandigheden die de beoordeling kunnen inkleuren behoren onder meer de duur en de frequentie van de seksuele benadering, de specifieke verschijningsvorm of verschijningsvormen daarvan en de omgeving of situatie waarin de benadering plaatsvindt.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 117.</li></ol></div>"},{"titel":"Welke omstandigheden wegen mee? (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Welke omstandigheden wegen mee? (vervolg)</h2><div class=\"main\"><p>Ook de nota naar aanleiding van het verslag noemt de duur, de frequentie en de pleegplaats als in dit verband relevante omstandigheden.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 47.</li></ol></div>"},{"titel":"Zelfde gedraging, andere context","kind":"figuur","html":"<div class=\"figcap\">Zelfde gedraging, andere context</div><figure class=\"illu\"><svg viewBox=\"0 0 560 300\" role=\"img\" aria-labelledby=\"cx2-t cx2-d\" font-family=\"'Outfit',system-ui,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n<title id=\"cx2-t\">Zelfde gedraging, andere context</title>\n<desc id=\"cx2-d\">Een gedraging die op een druk plein bij daglicht meestal geen indringende seksuele benadering oplevert, kan dat in een verlaten, donker steegje wel zijn. Dezelfde gedraging; de context bepaalt de uitkomst.</desc>\n<rect x=\"20\" y=\"20\" width=\"250\" height=\"196\" rx=\"14\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<circle cx=\"145\" cy=\"66\" r=\"16\" fill=\"none\" stroke=\"var(--oranje)\" stroke-width=\"2.2\"/>\n<g stroke=\"var(--oranje)\" stroke-width=\"2.2\" stroke-linecap=\"round\"><line x1=\"145\" y1=\"40\" x2=\"145\" y2=\"46\"/><line x1=\"145\" y1=\"86\" x2=\"145\" y2=\"92\"/><line x1=\"119\" y1=\"66\" x2=\"125\" y2=\"66\"/><line x1=\"165\" y1=\"66\" x2=\"171\" y2=\"66\"/><line x1=\"127\" y1=\"48\" x2=\"131\" y2=\"52\"/><line x1=\"159\" y1=\"80\" x2=\"163\" y2=\"84\"/><line x1=\"163\" y1=\"48\" x2=\"159\" y2=\"52\"/><line x1=\"131\" y1=\"80\" x2=\"127\" y2=\"84\"/></g>\n<text x=\"145\" y=\"128\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Plein · daglicht</text>\n<text x=\"145\" y=\"150\" text-anchor=\"middle\" class=\"il-sub\" fill=\"var(--tekst-mid)\">druk, zichtbaar</text>\n<text x=\"145\" y=\"190\" text-anchor=\"middle\" class=\"il-note\" fill=\"var(--tekst-mid)\">meestal geen delict</text>\n<rect x=\"290\" y=\"20\" width=\"250\" height=\"196\" rx=\"14\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<path d=\"M425 54a16 16 0 1 0 10 26a13 13 0 0 1 -10 -26z\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/>\n<text x=\"415\" y=\"128\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Steegje · donker</text>\n<text x=\"415\" y=\"150\" text-anchor=\"middle\" class=\"il-sub\" fill=\"var(--tekst-mid)\">verlaten</text>\n<text x=\"415\" y=\"190\" text-anchor=\"middle\" class=\"il-note\" font-weight=\"700\" fill=\"var(--oranje)\">kan wél een delict zijn</text>\n<text x=\"280\" y=\"250\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"800\" fill=\"var(--zilver)\">≠</text>\n<text x=\"280\" y=\"284\" text-anchor=\"middle\" class=\"il-note\" font-style=\"italic\" fill=\"currentColor\">Dezelfde gedraging; de context bepaalt de uitkomst.</text>\n</svg></figure>"},{"titel":"Zelfde gedraging, andere context","kind":"casus","html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Zelfde gedraging, andere context</h2><p class=\"lees\">De wetgever geeft zelf een sprekend voorbeeld.</p>"},{"titel":"Zelfde gedraging, andere context (vervolg)","kind":"casus","html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Zelfde gedraging, andere context (vervolg)</h2><p class=\"lees\">Gedragingen die bij daglicht op een plein niet als een indringende seksuele benadering worden aangemerkt, kunnen dat wél zijn wanneer zij plaatsvinden in een smal steegje in het donker.<sup class=\"fn\">1</sup><sup class=\"fn\">2</sup></p><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 54.</li><li>Vergelijk Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 117-118.</li></ol></div>"},{"titel":"Zelfde gedraging, andere context — betekenis","kind":"casus","html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Zelfde gedraging, andere context — betekenis</h2><div class=\"kaart k-voorbeeld\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/></svg></span><span class=\"kaart-lab\">Voorbeeld</span></div><div class=\"kaart-t\">Betekenis voor de praktijk</div><div class=\"kaart-b\"><p>Praktijkvoorbeeld: welke omstandigheden zou je hier vastleggen om de context te kunnen beoordelen? De uiteindelijke kwalificatie volgt uit de bestanddelen en het bewijs, die in latere onderwerpen aan bod komen.</p></div></div>"},{"titel":"Context en het geobjectiveerde criterium","kind":"kaart","html":"<h2 class=\"ptitle\">Context en het geobjectiveerde criterium</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Context en het geobjectiveerde criterium</div><div class=\"kaart-b\"><p>Van belang is dat het criterium geobjectiveerd is. De context helpt bepalen of de benadering naar algemene maatstaven als intimiderend is te achten, en niet of een concreet slachtoffer zich daadwerkelijk zo heeft gevoeld.<sup class=\"fn\">1</sup></p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 47.</li></ol></div>"},{"titel":"Leg de omstandigheden vast","kind":"kaart","html":"<h2 class=\"ptitle\">Leg de omstandigheden vast</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Leg de omstandigheden vast</div><div class=\"kaart-b\"><p>In de praktijk (geen letterlijk standpunt van de wetgever): omdat de context bepalend kan zijn, is het van belang de omstandigheden feitelijk en volledig vast te leggen, zoals de plaats, het tijdstip, de duur, de frequentie, de wijze van benaderen en de zichtbare reactie. Hoe dit in een proces-verbaal wordt verwerkt, komt in een later onderwerp aan bod.</p></div></div>"},{"titel":"Kort samengevat","kind":"onthoud","html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>De bestanddelen worden ingevuld aan de hand van de omstandigheden van het geval.</li><li>Inhoud en context zijn communicerende vaten.</li><li>Duur, frequentie, pleegplaats en omgeving wegen mee.</li></ul></div></div>"},{"titel":"Kort samengevat","kind":"onthoud","html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>Dezelfde gedraging kan door de context wél of niet strafbaar zijn.</li><li>Leg de omstandigheden zorgvuldig en feitelijk vast.</li></ul></div></div>"},{"titel":"Vooruitblik: Jurisprudentie","kind":"theory","html":"<h2 class=\"ptitle\">Vooruitblik: Jurisprudentie</h2><div class=\"main\"><p>In het volgende onderwerp wordt getoond hoe rechters de bestanddelen en de context in concrete zaken toepassen.</p><p>Zo ontstaat een beeld van waar de grens in de praktijk ligt; dit onderwerp geeft daarover nog geen vaste beslisregel.</p></div>"}],"vragen":[{"soort":"Kennisvraag","vraag":"Wat bedoelt de wetgever met «communicerende vaten» bij artikel 429ter Sr?","opties":["Inhoud en context beïnvloeden elkaar; een op zichzelf onvoldoende inhoud kan door de context alsnog strafbaar worden.","De inhoud van de uiting is doorslaggevend; de context kan het oordeel niet meer wijzigen.","De context is doorslaggevend; de concrete inhoud van de uiting doet niet ter zake.","Inhoud en context worden volledig onafhankelijk van elkaar beoordeeld en, als afzonderlijke gedragingen, ook afzonderlijk in de tenlastelegging opgenomen."],"juist":0,"uitleg":"Het juiste antwoord is A. De wetgever duidt inhoud en context aan als 'communicerende vaten': zij beïnvloeden elkaar, zodat een op zichzelf onvoldoende inhoud door de context alsnog tot strafbaarheid kan leiden.[[1]] De overige antwoorden ontkennen deze wisselwerking, door hetzij de inhoud, hetzij de context als op zichzelf doorslaggevend voor te stellen, dan wel door beide geheel los van elkaar te beoordelen.","kernregel":"Inhoud en context beïnvloeden elkaar, zodat de context een op zichzelf onvoldoende inhoud kan aanvullen tot strafbaarheid.","artikel":"Art. 429ter Sr","wet":"Wetboek van Strafrecht","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 117."]},{"soort":"Kennisvraag","vraag":"Welke omstandigheden noemt de wetsgeschiedenis als relevant voor de beoordeling?","opties":["Uitsluitend het aantal aanwezige omstanders.","Uitsluitend de justitiële documentatie van de verdachte.","Onder meer de duur, de frequentie, de verschijningsvorm en de pleegplaats.","Uitsluitend of tussen de betrokkenen reeds vóór het incident een persoonlijke of affectieve relatie had bestaan."],"juist":2,"uitleg":"Het juiste antwoord is C. De wetsgeschiedenis noemt onder meer de duur, de frequentie, de verschijningsvorm en de pleegplaats of omgeving als factoren die de beoordeling inkleuren.[[1]][[2]] De overige antwoorden verheffen telkens één willekeurige omstandigheid tot beslissende maatstaf, terwijl de bronnen juist een samenstel van omstandigheden noemen.","kernregel":"Onder meer de duur, de frequentie en de pleegplaats bepalen mede of sprake is van een strafbare benadering.","artikel":"Art. 429ter Sr","wet":"Wetboek van Strafrecht","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 117.","Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 47."]},{"soort":"Kennisvraag","vraag":"Kan dezelfde gedraging in de ene situatie wél en in de andere niet onder artikel 429ter Sr vallen?","opties":["Nee, een gedraging wordt steeds gelijk beoordeeld, ongeacht de omstandigheden.","Ja; de context, zoals plaats en tijdstip, kan bepalend zijn, zodat dezelfde gedraging verschillend kan uitvallen.","Ja, maar uitsluitend indien bij de aangesprokene letsel of schade is ontstaan.","Nee, uitsluitend de door de dader gekozen bewoordingen zijn beslissend voor de strafbaarheid; de plaats, het tijdstip en de overige omstandigheden blijven buiten beschouwing."],"juist":1,"uitleg":"Het juiste antwoord is B. De wetgever geeft zelf het voorbeeld dat een gedraging die op een plein bij daglicht niet als indringende seksuele benadering geldt, in een smal steegje in het donker wel als zodanig kan worden aangemerkt.[[1]] De overige antwoorden miskennen de rol van de context, voegen een eis van letsel toe die de wet niet stelt, of beperken de beoordeling ten onrechte tot de gekozen bewoordingen.","kernregel":"Dezelfde gedraging kan door de context in het ene geval wel en in het andere niet onder artikel 429ter Sr vallen.","artikel":"Art. 429ter Sr","wet":"Wetboek van Strafrecht","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 54."]},{"soort":"Kennisvraag","vraag":"Hoe verhoudt de contextbeoordeling zich tot het geobjectiveerde criterium?","opties":["De context bepaalt of het slachtoffer zich feitelijk geïntimideerd heeft gevoeld.","De context brengt mee dat naast het gedrag ook opzet moet worden bewezen.","De context vervangt de objectieve maatstaf door de indruk van de opsporingsambtenaar.","De context dient de geobjectiveerde toets; de subjectieve beleving hoeft niet te worden bewezen."],"juist":3,"uitleg":"Het juiste antwoord is D. De context helpt te bepalen of de benadering naar algemene maatstaven als intimiderend is te achten; het geobjectiveerde criterium verlangt niet dat de subjectieve beleving van het slachtoffer wordt bewezen.[[1]] De overige antwoorden betrekken een subjectieve eis, een opzeteis of de persoonlijke indruk van de opsporingsambtenaar bij de beoordeling, die de wetgever juist niet stelt.","kernregel":"De context dient de geobjectiveerde toets en vervangt deze niet door de subjectieve beleving van het slachtoffer.","artikel":"Art. 429ter Sr","wet":"Wetboek van Strafrecht","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 47."]}]},{"id":"m5","nr":5,"titel":"Jurisprudentie","kader":"Art. 429ter Sr","icoon":"book","type":"content","pages":[{"titel":"Leerdoelen","kind":"lo","html":"<h2 class=\"ptitle\">Leerdoelen</h2><p class=\"pintro\">Wat je na dit onderwerp kunt.</p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>benoemen hoe rechters de bestanddelen van artikel 429ter Sr in concrete zaken toepassen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>herkennen dat de rechter een geobjectiveerd criterium hanteert (algemene maatstaven, niet de beleving van het slachtoffer of de bedoeling van de dader);</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen welke rol de context speelt in de beoordeling door de rechter;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>herkennen dat waarnemingen van opsporingsambtenaren als zelfstandig bewijs kunnen dienen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>begrijpen dat de rechter de kwalificatie soms enger vaststelt dan de tenlastelegging.</span></li></ul>"},{"titel":"Inleiding: waarom rechtspraak lezen?","kind":"theory","html":"<h2 class=\"ptitle\">Inleiding: waarom rechtspraak lezen?</h2><div class=\"main\"><p>Artikel 429ter Sr geldt sinds 1 juli 2024. In de eerste periode na de inwerkingtreding zijn op rechtspraak.nl de eerste strafzaken gepubliceerd. Deze uitspraken tonen op welke wijze de rechter de in de voorgaande onderwerpen besproken bestanddelen en context in concrete gevallen toepast.</p></div>"},{"titel":"Inleiding: waarom rechtspraak lezen? (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Inleiding: waarom rechtspraak lezen? (vervolg)</h2><div class=\"main\"><p>De hierna besproken uitspraken betreffen officieel gepubliceerde uitspraken, herkenbaar aan het ECLI-nummer. Zij vormen rechtspraak en daarmee een zelfstandige bronsoort naast de wettekst en de parlementaire geschiedenis. Een uitspraak van een rechtbank bindt andere rechters niet; zij geeft een beeld van de toepassing van de bepaling en geen vaste beslisregel.</p></div>"},{"titel":"Inleiding: waarom rechtspraak lezen?","kind":"figuur","html":"<div class=\"figcap\">Inleiding: waarom rechtspraak lezen?</div><figure class=\"illu\"><svg viewBox=\"0 0 560 372\" role=\"img\" aria-labelledby=\"tl-t tl-d\" font-family=\"'Outfit',system-ui,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n<title id=\"tl-t\">Eerste gepubliceerde strafzaken over artikel 429ter Sr</title>\n<desc id=\"tl-d\">Sinds de inwerkingtreding op 1 juli 2024 zijn onder meer gepubliceerd: rechtbank Rotterdam 2 oktober 2024 (eerste strafzaak), rechtbank Midden-Nederland 7 oktober 2024 (kwalificatie vernederend) en rechtbank Amsterdam 21 februari 2025 (meervoudige kamer).</desc>\n<line x1=\"44\" y1=\"40\" x2=\"44\" y2=\"300\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/>\n<circle cx=\"44\" cy=\"66\" r=\"8\" fill=\"var(--blauw)\"/>\n<rect x=\"72\" y=\"34\" width=\"468\" height=\"66\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<text x=\"92\" y=\"64\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Rb Rotterdam — 2 okt 2024</text><text x=\"92\" y=\"86\" class=\"il-sub\" fill=\"var(--tekst-mid)\">eerste strafzaak</text>\n<circle cx=\"44\" cy=\"166\" r=\"8\" fill=\"var(--blauw)\"/>\n<rect x=\"72\" y=\"134\" width=\"468\" height=\"66\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<text x=\"92\" y=\"164\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Rb Midden-Nederland — 7 okt 2024</text><text x=\"92\" y=\"186\" class=\"il-sub\" fill=\"var(--tekst-mid)\">kwalificatie: vernederend</text>\n<circle cx=\"44\" cy=\"266\" r=\"8\" fill=\"var(--blauw)\"/>\n<rect x=\"72\" y=\"234\" width=\"468\" height=\"66\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<text x=\"92\" y=\"264\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Rb Amsterdam — 21 feb 2025</text><text x=\"92\" y=\"286\" class=\"il-sub\" fill=\"var(--tekst-mid)\">meervoudige kamer</text>\n<text x=\"280\" y=\"344\" text-anchor=\"middle\" class=\"il-note\" font-style=\"italic\" fill=\"var(--tekst-mid)\">Eerste gepubliceerde strafzaken sinds 1 juli 2024.</text>\n</svg></figure>"},{"titel":"Rb Rotterdam 2 oktober 2024: de eerste strafzaak","kind":"casus","html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Rb Rotterdam 2 oktober 2024: de eerste strafzaak</h2><p class=\"lees\">De kantonrechter van de rechtbank Rotterdam heeft op 2 oktober 2024 de eerste strafzaak onder artikel 429ter Sr beoordeeld.<sup class=\"fn\">1</sup> Op het Schouwburgplein pakte de verdachte een voor hem wildvreemde vrouw bij de heupen vast.</p><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Rb Rotterdam 2 oktober 2024, ECLI:NL:RBROT:2024:9612.</li></ol></div>"},{"titel":"Rb Rotterdam 2 oktober 2024: de eerste strafzaak (vervolg)","kind":"casus","html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Rb Rotterdam 2 oktober 2024: de eerste strafzaak (vervolg)</h2><p class=\"lees\">Het bewijs bestond uit twee processen-verbaal van in burger surveillerende opsporingsambtenaren; een aangifte en camerabeelden ontbraken. De kantonrechter legde een geldboete van € 280 op, waarvan € 180 voorwaardelijk.</p>"},{"titel":"Rb Rotterdam 2 oktober 2024: de eerste strafzaak — betekenis","kind":"casus","html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Rb Rotterdam 2 oktober 2024: de eerste strafzaak — betekenis</h2><div class=\"kaart k-voorbeeld\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/></svg></span><span class=\"kaart-lab\">Voorbeeld</span></div><div class=\"kaart-t\">Betekenis voor de praktijk</div><div class=\"kaart-b\"><p>Voor de praktijk is van belang dat het hier de eerste gepubliceerde strafzaak onder de nieuwe bepaling betreft. De waarnemingen van de opsporingsambtenaren vormden op zichzelf voldoende bewijs; een aangifte van het slachtoffer is niet vereist.<sup class=\"fn\">1</sup> In de zaak kwam voorts de proportionaliteit van het optreden aan de orde, in het bijzonder het onderscheid tussen undercover- en lokinzet. Hieruit volgt dat de eigen, feitelijke waarneming de dragende bewijsgrond kan zijn en dat deze daarom nauwkeurig moet worden vastgelegd.</p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Rb Rotterdam 2 oktober 2024, ECLI:NL:RBROT:2024:9612.</li></ol></div>"},{"titel":"Rb Midden-Nederland 7 oktober 2024: kwalificatie «vernederend»","kind":"casus","html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Rb Midden-Nederland 7 oktober 2024: kwalificatie «vernederend»</h2><p class=\"lees\">De kantonrechter van de rechtbank Midden-Nederland heeft op 7 oktober 2024 een zaak beoordeeld waarin de verdachte tegen twee politieagentes in functie een expliciet seksuele opmerking maakte.<sup class=\"fn\">1</sup></p><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Rb Midden-Nederland 7 oktober 2024, ECLI:NL:RBMNE:2024:5727.</li></ol></div>"},{"titel":"Rb Midden-Nederland 7 oktober 2024: kwalificatie «vernederend» (vervolg)","kind":"casus","html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Rb Midden-Nederland 7 oktober 2024: kwalificatie «vernederend» (vervolg)</h2><p class=\"lees\">De rechter kwalificeerde de gedraging als vernederend, kwetsend en onterend, en niet zonder meer als vreesaanjagend.</p>"},{"titel":"Rb Midden-Nederland 7 oktober 2024: kwalificatie «vernederend» — betekenis","kind":"casus","html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Rb Midden-Nederland 7 oktober 2024: kwalificatie «vernederend» — betekenis</h2><div class=\"kaart k-voorbeeld\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/></svg></span><span class=\"kaart-lab\">Voorbeeld</span></div><div class=\"kaart-t\">Betekenis voor de praktijk</div><div class=\"kaart-b\"><p>Van belang is dat artikel 429ter Sr meerdere gevolgvarianten kent; niet vereist is dat het slachtoffer bang wordt. Een feitelijke beschrijving van hetgeen is gezegd of gedaan stelt de rechter in staat de passende kwalificatie te kiezen.<sup class=\"fn\">1</sup></p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Rb Midden-Nederland 7 oktober 2024, ECLI:NL:RBMNE:2024:5727.</li></ol></div>"},{"titel":"Rb Amsterdam 21 februari 2025: meervoudige kamer","kind":"casus","html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Rb Amsterdam 21 februari 2025: meervoudige kamer</h2><p class=\"lees\">De meervoudige kamer van de rechtbank Amsterdam heeft op 21 februari 2025 uitspraak gedaan in een zaak waarin, naast andere feiten, artikel 429ter Sr aan de orde was.<sup class=\"fn\">1</sup> De bepaling kan aldus onderdeel uitmaken van een bredere strafzaak.</p><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Rb Amsterdam 21 februari 2025, ECLI:NL:RBAMS:2025:1220.</li></ol></div>"},{"titel":"Rb Amsterdam 21 februari 2025: meervoudige kamer — betekenis","kind":"casus","html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Rb Amsterdam 21 februari 2025: meervoudige kamer — betekenis</h2><div class=\"kaart k-voorbeeld\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/></svg></span><span class=\"kaart-lab\">Voorbeeld</span></div><div class=\"kaart-t\">Betekenis voor de praktijk</div><div class=\"kaart-b\"><p>Uit deze uitspraak volgt dat ook een meervoudige kamer de bepaling toepast en dat een overtreding onderdeel kan zijn van een breder feitencomplex.<sup class=\"fn\">1</sup> Een zorgvuldig proces-verbaal levert daarvoor de bouwstenen.</p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Rb Amsterdam 21 februari 2025, ECLI:NL:RBAMS:2025:1220.</li></ol></div>"},{"titel":"Over de aangehaalde rechtspraak","kind":"kaart","html":"<h2 class=\"ptitle\">Over de aangehaalde rechtspraak</h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg></span><span class=\"kaart-lab\">Let op</span></div><div class=\"kaart-t\">Over de aangehaalde rechtspraak</div><div class=\"kaart-b\"><p>In deze opleiding zijn uitsluitend officieel bevestigde uitspraken als leerstof opgenomen. De hierna volgende leerpunten steunen op de wettekst, de parlementaire geschiedenis en die bevestigde rechtspraak.</p></div></div>"},{"titel":"De rode draad in de rechtspraak","kind":"kaart","html":"<h2 class=\"ptitle\">De rode draad in de rechtspraak</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">De rode draad in de rechtspraak</div><div class=\"kaart-b\"><p>Uit de bevestigde uitspraken en de wetsgeschiedenis laat zich een aantal lijnen afleiden; het betreft een praktische synthese en geen zelfstandige rechtsregel. In de eerste plaats hanteert de rechter een geobjectiveerd criterium, dat wil zeggen algemene maatstaven en niet de beleving van het slachtoffer of de bedoeling van de dader.<sup class=\"fn\">1</sup></p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 117.</li></ol></div>"},{"titel":"De rode draad in de rechtspraak (vervolg)","kind":"kaart","html":"<h2 class=\"ptitle\">De rode draad in de rechtspraak (vervolg)</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">De rode draad in de rechtspraak</div><div class=\"kaart-b\"><p>In de tweede plaats kunnen waarnemingen van opsporingsambtenaren zelfstandig bewijs vormen, ook zonder aangifte.<sup class=\"fn\">1</sup> In de derde plaats kleurt de context de ernst en de kwalificatie in.<sup class=\"fn\">2</sup></p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Rb Rotterdam 2 oktober 2024, ECLI:NL:RBROT:2024:9612.</li><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 117.</li></ol></div>"},{"titel":"De rode draad in de rechtspraak (vervolg)","kind":"kaart","html":"<h2 class=\"ptitle\">De rode draad in de rechtspraak (vervolg)</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">De rode draad in de rechtspraak</div><div class=\"kaart-b\"><p>In de vierde plaats kiest de rechter zelf de kwalificatie en stelt hij deze soms enger vast dan de tenlastelegging, zoals bij de kwalificatie vernederend, kwetsend en onterend in plaats van vreesaanjagend.<sup class=\"fn\">1</sup></p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Rb Midden-Nederland 7 oktober 2024, ECLI:NL:RBMNE:2024:5727.</li></ol></div>"},{"titel":"Kort samengevat","kind":"onthoud","html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>De eerste strafzaken onder artikel 429ter Sr zijn vanaf oktober 2024 gepubliceerd; de rechtbank Rotterdam ging daarin voorop.<sup class=\"fn\">1</sup></li><li>Waarnemingen van opsporingsambtenaren kunnen zelfstandig bewijs vormen; een aangifte is niet vereist.<sup class=\"fn\">1</sup></li><li>De rechter toetst de bestanddelen zelf en kiest zelf de kwalificatie, die hij soms enger vaststelt dan de tenlastelegging.<sup class=\"fn\">2</sup></li></ul></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Rb Rotterdam 2 oktober 2024, ECLI:NL:RBROT:2024:9612.</li><li>Rb Midden-Nederland 7 oktober 2024, ECLI:NL:RBMNE:2024:5727.</li></ol></div>"},{"titel":"Kort samengevat","kind":"onthoud","html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>De context, waaronder plaats, tijdstip en reactie, kleurt de ernst en de kwalificatie in.<sup class=\"fn\">1</sup></li><li>Het bestanddeel «in het openbaar» is ruim en omvat ook voor het publiek toegankelijke ruimten.<sup class=\"fn\">1</sup></li></ul></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 116-117.</li></ol></div>"},{"titel":"Vooruitblik: Bewijs en proces-verbaal","kind":"theory","html":"<h2 class=\"ptitle\">Vooruitblik: Bewijs en proces-verbaal</h2><div class=\"main\"><p>In de uitspraken zag je telkens welke bewijsmiddelen de rechter gebruikte: eigen waarnemingen van opsporingsambtenaren, aangiften en bekentenissen.</p><p>In het volgende onderwerp leer je hoe je die bewijsmiddelen zelf opbouwt en vastlegt in een proces-verbaal.</p></div>"}],"vragen":[{"soort":"Praktijkcasus","vraag":"In de eerste gepubliceerde strafzaak onder artikel 429ter Sr (Rb Rotterdam, 2 oktober 2024) bestond het bewijs uit twee processen-verbaal van opsporingsambtenaren, zonder aangifte of camerabeelden. Wat leert deze zaak over het bewijs?","opties":["Zonder aangifte van het slachtoffer kan geen veroordeling volgen.","Naast het proces-verbaal van de opsporingsambtenaar is voor een veroordeling ten minste één onafhankelijk steunbewijs vereist, zoals een aangifte of camerabeelden.","De eigen waarneming van opsporingsambtenaren kan, vastgelegd in proces-verbaal, op zichzelf voldoende bewijs vormen.","Alleen camerabeelden gelden als voldoende bewijs."],"juist":2,"uitleg":"Het juiste antwoord is C. In de eerste strafzaak onder artikel 429ter Sr berustte de veroordeling op twee processen-verbaal van in burger surveillerende opsporingsambtenaren, zonder aangifte of camerabeelden.[[1]] De eigen waarneming van de opsporingsambtenaar kan derhalve de dragende bewijsgrond vormen. De overige antwoorden stellen bewijseisen die de wet niet kent: een aangifte is niet vereist, een afzonderlijk bewijsminimum evenmin, nu bij een overtreding het proces-verbaal van één opsporingsambtenaar kan volstaan, en camerabeelden vormen geen noodzakelijke voorwaarde.","kernregel":"De eigen waarneming van een opsporingsambtenaar, vastgelegd in een proces-verbaal, kan op zichzelf voldoende bewijs opleveren.","artikel":"Art. 429ter Sr","wet":"Rechtspraak","voetnoten":["Rb Rotterdam 2 oktober 2024, ECLI:NL:RBROT:2024:9612."]},{"soort":"Praktijkcasus","vraag":"In de zaak Rb Midden-Nederland (7 oktober 2024) riep de verdachte «ik ga je beffen» tegen twee agentes. De rechter kwalificeerde dit als vernederend, kwetsend en onterend — niet als vreesaanjagend. Wat volgt hieruit?","opties":["Artikel 429ter Sr kent meerdere gevolgvarianten; vrees bij het slachtoffer is niet vereist.","Zonder vrees bij het slachtoffer kan de bepaling niet worden overtreden.","De rechter is gebonden aan de in de tenlastelegging gekozen kwalificatie.","De variant 'vernederend' geldt alleen wanneer het slachtoffer een ambtenaar in functie is."],"juist":0,"uitleg":"Het juiste antwoord is A. In deze zaak koos de rechter de kwalificatie vernederend, kwetsend en onterend en niet vreesaanjagend.[[1]] Artikel 429ter Sr kent meerdere gevolgvarianten, te weten vreesaanjagend, vernederend, kwetsend of onterend, zodat vrees bij het slachtoffer geen vereiste is. De overige antwoorden zijn onjuist: het delict kan ook zonder vrees worden overtreden, de rechter is niet gebonden aan de in de tenlastelegging gekozen kwalificatie, en de kwalificatie is niet afhankelijk van de hoedanigheid van het slachtoffer.","kernregel":"Artikel 429ter Sr kent meerdere gevolgvarianten, zodat vrees bij het slachtoffer geen voorwaarde voor strafbaarheid is.","artikel":"Art. 429ter Sr","wet":"Rechtspraak","voetnoten":["Rb Midden-Nederland 7 oktober 2024, ECLI:NL:RBMNE:2024:5727."]},{"soort":"Praktijkcasus","vraag":"Wie beoordeelt uiteindelijk of aan de bestanddelen van artikel 429ter Sr is voldaan, en wat betekent dat voor jouw proces-verbaal?","opties":["Jij toetst dat in het proces-verbaal en neemt de eindconclusie op dat aan alle bestanddelen is voldaan.","Het openbaar ministerie stelt de kwalificatie vast en jij neemt die zonder meer over in het proces-verbaal.","Zonder een juridische eindconclusie in het proces-verbaal is dat proces-verbaal ongeldig.","De rechter toetst de bestanddelen; jij legt de feiten en waarnemingen vast en laat de kwalificatie aan de rechter."],"juist":3,"uitleg":"Het juiste antwoord is D. De juridische kwalificatie en de toetsing aan de bestanddelen zijn aan de rechter voorbehouden; de taak van de opsporingsambtenaar bestaat uit het feitelijk en volledig vastleggen van de waarnemingen. De overige antwoorden keren deze rolverdeling om, door de ambtenaar of het openbaar ministerie de kwalificatie te laten vaststellen, of door ten onrechte een juridische eindconclusie als geldigheidsvereiste te stellen.","kernregel":"De rechter toetst de bestanddelen; de opsporingsambtenaar legt de feiten vast en laat de kwalificatie aan de rechter.","artikel":"Art. 429ter Sr","wet":"Wetboek van Strafvordering","voetnoten":[]},{"soort":"Kennisvraag","vraag":"Geldt artikel 429ter Sr ook wanneer de gedraging plaatsvindt in een voor het publiek toegankelijke ruimte, zoals een winkel of uitgaansgelegenheid?","opties":["Nee, 'in het openbaar' ziet uitsluitend op de openbare weg en het openbaar vervoer.","Ja: 'in het openbaar' omvat mede voor het publiek toegankelijke plaatsen, zoals een winkel of een uitgaansgelegenheid.","Ja, maar uitsluitend wanneer de gedraging op camerabeelden is vastgelegd.","Nee, binnen een winkel geldt het huisrecht van de ondernemer, zodat de bepaling daar niet van toepassing is."],"juist":1,"uitleg":"Het juiste antwoord is B. Het bestanddeel 'in het openbaar' ziet op de pleegplaats en omvat niet alleen de openbare weg, maar ook voor het publiek toegankelijke plaatsen zoals een winkel of een uitgaansgelegenheid; ook een voor een breed publiek toegankelijke online omgeving valt eronder.[[1]] De overige antwoorden zijn onjuist: de reikwijdte is niet beperkt tot de openbare weg, camerabeelden zijn geen voorwaarde, en het huisrecht van een ondernemer neemt het openbare karakter van een voor het publiek toegankelijke ruimte niet weg.","kernregel":"Het bestanddeel 'in het openbaar' omvat ook voor het publiek toegankelijke plaatsen, zoals een winkel.","artikel":"Art. 429ter Sr","wet":"Wetboek van Strafrecht","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 116."]},{"soort":"Kennisvraag","vraag":"Wat is de status van een uitspraak van een rechtbank (bijvoorbeeld een kantonrechter) voor de beoordeling van latere zaken?","opties":["Zij is een bindende regel die andere rechters moeten volgen.","Zij bindt rechtbanken van gelijke rang, maar niet de gerechtshoven.","Zij illustreert de toepassing van bestanddelen en context, maar bindt andere rechters niet en vormt geen vaste beslisregel.","Zij gaat, als meest recente rechtsbron, op grond van de lex-posterior-regel vóór op zowel de wettekst als de daaraan voorafgaande parlementaire geschiedenis."],"juist":2,"uitleg":"Het juiste antwoord is C. Rechtbankuitspraken tonen hoe de bestanddelen en de context in concrete zaken worden toegepast, maar zij binden andere rechters niet en vormen geen vaste beslisregel.[[1]] De overige antwoorden overschatten de bindende kracht van dergelijke uitspraken, veronderstellen ten onrechte een gebondenheid van rechtbanken van gelijke rang, of stellen rechtspraak boven de wettekst en de parlementaire geschiedenis, terwijl rechtspraak daarnaast en niet daarboven staat.","kernregel":"Rechtbankuitspraken illustreren de toepassing van de bestanddelen, maar binden andere rechters niet.","artikel":"Art. 429ter Sr","wet":"Rechtspraak","voetnoten":["Rb Amsterdam 21 februari 2025, ECLI:NL:RBAMS:2025:1220."]}]},{"id":"m6","nr":6,"titel":"Bewijs en proces-verbaal","kader":"Art. 429ter Sr","icoon":"document","type":"content","pages":[{"titel":"Leerdoelen","kind":"lo","html":"<h2 class=\"ptitle\">Leerdoelen</h2><p class=\"pintro\">Wat je na dit onderwerp kunt.</p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen wat je bij artikel 429ter Sr precies moet bewijzen (de bestanddelen, geen opzet of schuld);</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>de bewijsmiddelen benoemen die in de rechtspraak zijn gebruikt (eigen waarneming, aangifte/getuige, bekentenis);</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>je eigen waarneming feitelijk en toetsbaar vastleggen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>de context en omstandigheden zo beschrijven dat de rechter de bestanddelen kan toetsen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>veelgemaakte fouten in de vastlegging herkennen en vermijden.</span></li></ul>"},{"titel":"Wat moet je bewijzen?","kind":"theory","html":"<h2 class=\"ptitle\">Wat moet je bewijzen?</h2><div class=\"main\"><p>Artikel 429ter Sr is een overtreding. Voor de bewijsvoering betekent dit dat geen opzet of schuld hoeft te worden aangetoond; bepalend is uitsluitend het geobjectiveerde, uiterlijk waarneembare gedrag.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114.</li></ol></div>"},{"titel":"Wat moet je bewijzen? (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Wat moet je bewijzen? (vervolg)</h2><div class=\"main\"><p>De bewijsvoering richt zich daarmee op de bestanddelen die in het onderwerp Wettelijke bestanddelen zijn behandeld: dat het feit in het openbaar plaatsvond, dat sprake was van een indringende seksuele benadering door opmerkingen, gebaren, geluiden of aanrakingen, en dat deze benadering naar algemene maatstaven als vreesaanjagend, vernederend, kwetsend of onterend is aan te merken.</p></div>"},{"titel":"Het wettelijk kader: bewijsmiddelen en proces-verbaal","kind":"theory","html":"<h2 class=\"ptitle\">Het wettelijk kader: bewijsmiddelen en proces-verbaal</h2><div class=\"main\"><p>Opsporingsambtenaren leggen hun bevindingen vast in een proces-verbaal. Deze verbaliseringsplicht is neergelegd in artikel 152 Sv.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Wetboek van Strafvordering, art. 152 (proces-verbaalplicht), art. 339 (wettige bewijsmiddelen) en art. 344 lid 2 (proces-verbaal van één opsporingsambtenaar).</li></ol></div>"},{"titel":"Het wettelijk kader: bewijsmiddelen en proces-verbaal (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Het wettelijk kader: bewijsmiddelen en proces-verbaal (vervolg)</h2><div class=\"main\"><p>Het Wetboek van Strafvordering kent een gesloten stelsel van wettige bewijsmiddelen: de eigen waarneming van de rechter, de verklaringen van de verdachte, van een getuige en van een deskundige, en schriftelijke bescheiden. Een proces-verbaal is zo'n schriftelijk bescheid. Dit stelsel is neergelegd in artikel 339 Sv.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Wetboek van Strafvordering, art. 152 (proces-verbaalplicht), art. 339 (wettige bewijsmiddelen) en art. 344 lid 2 (proces-verbaal van één opsporingsambtenaar).</li></ol></div>"},{"titel":"Het wettelijk kader: bewijsmiddelen en proces-verbaal (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Het wettelijk kader: bewijsmiddelen en proces-verbaal (vervolg)</h2><div class=\"main\"><p>De bewijskracht is bij een overtreding als artikel 429ter Sr ruim: op grond van artikel 344, tweede lid, Sv kan het proces-verbaal van één opsporingsambtenaar het bewijs dragen. Er geldt in zoverre geen aanvullend bewijsminimum.</p></div>"},{"titel":"Het wettelijk kader: bewijsmiddelen en proces-verbaal (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Het wettelijk kader: bewijsmiddelen en proces-verbaal (vervolg)</h2><div class=\"main\"><p>Het proces-verbaal is daarmee in de praktijk vaak het dragende bewijsmiddel, en de kwaliteit van de vastlegging bepaalt of de rechter de bestanddelen kan vaststellen.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Wetboek van Strafvordering, art. 152 (proces-verbaalplicht), art. 339 (wettige bewijsmiddelen) en art. 344 lid 2 (proces-verbaal van één opsporingsambtenaar).</li></ol></div>"},{"titel":"Welke bewijsmiddelen gebruikt de rechter in de praktijk?","kind":"figuur","html":"<div class=\"figcap\">Welke bewijsmiddelen gebruikt de rechter in de praktijk?</div><figure class=\"illu wide\"><svg viewBox=\"0 0 720 468\" role=\"img\" aria-labelledby=\"bw-t bw-d\" font-family=\"'Outfit',system-ui,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n<title id=\"bw-t\">Bewijsopbouw bij artikel 429ter Sr</title>\n<desc id=\"bw-d\">Zes zelfstandige, mogelijke bronnen van bewijs — de eigen waarneming van de opsporingsambtenaar, de verklaring van het slachtoffer, verklaringen van getuigen, camera- of bodycambeelden, de verklaring van de verdachte en overige relevante informatie — kunnen samen bijdragen aan de bewijsconstructie. Niet alle bewijsmiddelen zijn vereist en zij hebben niet dezelfde bewijskracht; de inhoud en de onderlinge samenhang bepalen de bewijswaarde. De opsporingsambtenaar legt de feiten vast; de rechter beoordeelt het bewijs. Kernregel: leg vast wat je zelf ziet en hoort en maak onderscheid tussen waarneming, verklaring en conclusie.</desc>\n<rect x=\"20\" y=\"16\" width=\"330\" height=\"72\" rx=\"11\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.6\"/><circle cx=\"50\" cy=\"52\" r=\"14\" fill=\"var(--blauw-licht)\"/><text x=\"50\" y=\"57\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--wit)\">1</text><text x=\"74\" y=\"47\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Eigen waarneming</text><text x=\"74\" y=\"69\" class=\"il-sub\" fill=\"var(--tekst-mid)\">woorden, gebaren, afstand</text>\n<rect x=\"370\" y=\"16\" width=\"330\" height=\"72\" rx=\"11\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.6\"/><circle cx=\"400\" cy=\"52\" r=\"14\" fill=\"var(--blauw-licht)\"/><text x=\"400\" y=\"57\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--wit)\">2</text><text x=\"424\" y=\"47\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Slachtofferverklaring</text><text x=\"424\" y=\"69\" class=\"il-sub\" fill=\"var(--tekst-mid)\">waargenomen; woorden</text>\n<rect x=\"20\" y=\"96\" width=\"330\" height=\"72\" rx=\"11\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.6\"/><circle cx=\"50\" cy=\"132\" r=\"14\" fill=\"var(--blauw-licht)\"/><text x=\"50\" y=\"137\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--wit)\">3</text><text x=\"74\" y=\"127\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Getuigenverklaring</text><text x=\"74\" y=\"149\" class=\"il-sub\" fill=\"var(--tekst-mid)\">wat zij zelf zagen</text>\n<rect x=\"370\" y=\"96\" width=\"330\" height=\"72\" rx=\"11\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.6\"/><circle cx=\"400\" cy=\"132\" r=\"14\" fill=\"var(--blauw-licht)\"/><text x=\"400\" y=\"137\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--wit)\">4</text><text x=\"424\" y=\"127\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Camera-/bodycam</text><text x=\"424\" y=\"149\" class=\"il-sub\" fill=\"var(--tekst-mid)\">gedraging, duur, context</text>\n<rect x=\"20\" y=\"176\" width=\"330\" height=\"72\" rx=\"11\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.6\"/><circle cx=\"50\" cy=\"212\" r=\"14\" fill=\"var(--blauw-licht)\"/><text x=\"50\" y=\"217\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--wit)\">5</text><text x=\"74\" y=\"207\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Verklaring verdachte</text><text x=\"74\" y=\"229\" class=\"il-sub\" fill=\"var(--tekst-mid)\">erkenning, ontkenning</text>\n<rect x=\"370\" y=\"176\" width=\"330\" height=\"72\" rx=\"11\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.6\"/><circle cx=\"400\" cy=\"212\" r=\"14\" fill=\"var(--blauw-licht)\"/><text x=\"400\" y=\"217\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--wit)\">6</text><text x=\"424\" y=\"207\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Overige informatie</text><text x=\"424\" y=\"229\" class=\"il-sub\" fill=\"var(--tekst-mid)\">locatie, tijdstip, data</text>\n<line x1=\"185\" y1=\"256\" x2=\"535\" y2=\"256\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.6\"/>\n<line x1=\"360\" y1=\"256\" x2=\"360\" y2=\"272\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/>\n<path d=\"M353 266l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<rect x=\"20\" y=\"274\" width=\"680\" height=\"58\" rx=\"13\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw)\" stroke-width=\"2.2\"/>\n<text x=\"360\" y=\"302\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"currentColor\">Bewijsconstructie</text>\n<text x=\"360\" y=\"323\" text-anchor=\"middle\" class=\"il-sub\" fill=\"var(--tekst-mid)\">beoordeling in onderlinge samenhang</text>\n<line x1=\"360\" y1=\"332\" x2=\"360\" y2=\"348\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/>\n<path d=\"M353 342l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<rect x=\"220\" y=\"352\" width=\"280\" height=\"44\" rx=\"11\" fill=\"var(--wit)\" stroke=\"var(--grijs-mid)\" stroke-width=\"1.6\"/>\n<g transform=\"translate(238,362) scale(0.75)\" stroke=\"var(--tekst-mid)\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/></g>\n<text x=\"272\" y=\"379\" font-size=\"15\" font-weight=\"600\" fill=\"var(--tekst-mid)\">Beoordeling door de rechter</text>\n<rect x=\"20\" y=\"406\" width=\"680\" height=\"52\" rx=\"11\" fill=\"var(--grijs-licht)\"/>\n<rect x=\"20\" y=\"406\" width=\"6\" height=\"52\" fill=\"var(--oranje)\"/>\n<text x=\"40\" y=\"430\" font-size=\"15\" font-weight=\"700\" fill=\"currentColor\">Leg vast wat je zelf ziet en hoort.</text>\n<text x=\"40\" y=\"450\" class=\"il-note\" fill=\"var(--tekst-mid)\">Maak onderscheid tussen waarneming, verklaring en conclusie.</text>\n</svg></figure>"},{"titel":"Welke bewijsmiddelen gebruikt de rechter in de praktijk?","kind":"theory","html":"<h2 class=\"ptitle\">Welke bewijsmiddelen gebruikt de rechter in de praktijk?</h2><div class=\"main\"><p>In de praktijk dragen verschillende bewijsmiddelen samen het bewijs. Het overzicht vat de mogelijke bronnen samen; de bevestigde rechtspraak volgt op de volgende pagina.</p></div>"},{"titel":"De bewijsmiddelen in de bevestigde rechtspraak","kind":"theory","html":"<h2 class=\"ptitle\">De bewijsmiddelen in de bevestigde rechtspraak</h2><div class=\"main\"><p>Eigen waarneming — Rb Rotterdam 2 oktober 2024: veroordeling op twee processen-verbaal, zonder aangifte of camerabeelden.<sup class=\"fn\">1</sup></p><p>Aangifte of getuige — Rb Midden-Nederland 7 oktober 2024: een aangifte naast het proces-verbaal.<sup class=\"fn\">2</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Rb Rotterdam 2 oktober 2024, ECLI:NL:RBROT:2024:9612.</li><li>Rb Midden-Nederland 7 oktober 2024, ECLI:NL:RBMNE:2024:5727.</li></ol></div>"},{"titel":"De bewijsmiddelen in de bevestigde rechtspraak (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">De bewijsmiddelen in de bevestigde rechtspraak (vervolg)</h2><div class=\"main\"><p>Verklaring verdachte — Rb Amsterdam 21 februari 2025: de bekennende verklaring speelde een rol.<sup class=\"fn\">1</sup></p><p>Camerabeelden — wettig bewijsmiddel (art. 339 en 344 Sv), mits is vastgelegd wie ze wanneer bekeek en wat te zien was.<sup class=\"fn\">2</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Rb Amsterdam 21 februari 2025, ECLI:NL:RBAMS:2025:1220.</li><li>Wetboek van Strafvordering, art. 339 en 344 (schriftelijke bescheiden).</li></ol></div>"},{"titel":"Leg je eigen waarneming feitelijk vast","kind":"kaart","html":"<h2 class=\"ptitle\">Leg je eigen waarneming feitelijk vast</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Leg je eigen waarneming feitelijk vast</div><div class=\"kaart-b\"><p>Praktijkuitleg: beschrijf zo feitelijk mogelijk wat je zelf hebt gezien en gehoord. Noteer de letterlijke opmerking of het gebaar, de plaats en het tijdstip, de afstand tot de betrokkene, de duur en de frequentie, en de zichtbare reactie. Vermijd samenvattende oordelen als 'hij intimideerde haar'.</p></div></div>"},{"titel":"Leg je eigen waarneming feitelijk vast (vervolg)","kind":"kaart","html":"<h2 class=\"ptitle\">Leg je eigen waarneming feitelijk vast (vervolg)</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Leg je eigen waarneming feitelijk vast</div><div class=\"kaart-b\"><p>De juridische kwalificatie is aan de rechter; de taak van de opsporingsambtenaar is het vastleggen van de feiten waarop die kwalificatie kan rusten.</p></div></div>"},{"titel":"Context en omstandigheden in het proces-verbaal","kind":"theory","html":"<h2 class=\"ptitle\">Context en omstandigheden in het proces-verbaal</h2><div class=\"main\"><p>Uit de voorgaande onderwerpen volgt dat inhoud en context zich verhouden als communicerende vaten en dat omstandigheden als plaats, tijdstip en reactie de ernst van het feit inkleuren.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 117.</li></ol></div>"},{"titel":"Context en omstandigheden in het proces-verbaal (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Context en omstandigheden in het proces-verbaal (vervolg)</h2><div class=\"main\"><p>Beschrijf daarom niet alleen de gedraging zelf, maar ook de omgeving waarin zij plaatsvond. Van belang is onder meer of het druk of verlaten was, licht of donker, en hoe de betrokkene reageerde. Op die manier kan de rechter de context wegen die de kwalificatie bepaalt.</p></div>"},{"titel":"Veelgemaakte fouten","kind":"kaart","html":"<h2 class=\"ptitle\">Veelgemaakte fouten</h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg></span><span class=\"kaart-lab\">Let op</span></div><div class=\"kaart-t\">Veelgemaakte fouten</div><div class=\"kaart-b\"><p>Praktijkuitleg (geen zelfstandige rechtsregel).</p></div></div>"},{"titel":"Veelgemaakte fouten (vervolg)","kind":"kaart","html":"<h2 class=\"ptitle\">Veelgemaakte fouten (vervolg)</h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg></span><span class=\"kaart-lab\">Let op</span></div><div class=\"kaart-t\">Veelgemaakte fouten</div><div class=\"kaart-b\"><p>In de vastlegging keren enkele fouten telkens terug: (1) alleen een juridische conclusie opschrijven, zoals 'het was intimidatie', zonder de feiten die haar dragen; (2) de letterlijke opmerking niet noteren, maar parafraseren; (3) de context weglaten, zoals plaats, tijdstip en reactie, terwijl die de kwalificatie mede kan bepalen; (4) eigen waarneming en aanname door elkaar halen, terwijl uitsluitend de eigen waarneming mag worden vastgelegd; (5) camerabeelden noemen zonder te beschrijven wie ze wanneer heeft bekeken en wat daarop te zien is.</p></div></div>"},{"titel":"Let op: bevoegdheid en afbakening","kind":"kaart","html":"<h2 class=\"ptitle\">Let op: bevoegdheid en afbakening</h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg></span><span class=\"kaart-lab\">Let op</span></div><div class=\"kaart-t\">Let op: bevoegdheid en afbakening</div><div class=\"kaart-b\"><p>Artikel 429ter Sr bepaalt wannéér gedrag onder de strafbaarstelling kan vallen. Het bepaalt niet welke opsporingsbevoegdheid je in een concreet geval hebt. Die bevoegdheid hangt voor een buitengewoon opsporingsambtenaar mede af van het domein, de akte van opsporingsbevoegdheid en de geldende aanwijzingen en werkafspraken. Deze e-learning breidt geen bevoegdheden uit en vervangt geen lokale instructie.</p></div></div>"},{"titel":"Let op: bevoegdheid en afbakening (vervolg)","kind":"kaart","html":"<h2 class=\"ptitle\">Let op: bevoegdheid en afbakening (vervolg)</h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg></span><span class=\"kaart-lab\">Let op</span></div><div class=\"kaart-t\">Let op: bevoegdheid en afbakening</div><div class=\"kaart-b\"><p>Controleer bij twijfel je eigen bevoegdheid en werkwijze, en betrek zo nodig de politie of de officier van justitie.</p></div></div>"},{"titel":"Kort samengevat","kind":"onthoud","html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>De bewijsvoering richt zich op de bestanddelen; opzet of schuld hoeft niet te worden aangetoond.<sup class=\"fn\">1</sup></li><li>De wettige bewijsmiddelen zijn de eigen waarneming, de verklaringen van verdachte, getuige en deskundige en de schriftelijke bescheiden; het proces-verbaal is een schriftelijk bescheid (art. 152 en 339 Sv), en op grond van art. 344 lid 2 Sv kan het proces-verbaal van één opsporingsambtenaar het bewijs dragen.<sup class=\"fn\">2</sup></li><li>In de bevestigde rechtspraak wordt het bewijs gedragen door de eigen waarneming van de opsporingsambtenaar, de aangifte en de bekennende verklaring.</li></ul></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114.</li><li>Wetboek van Strafvordering, art. 152, 339 en 344 lid 2.</li></ol></div>"},{"titel":"Kort samengevat","kind":"onthoud","html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>Leg de feiten en de context vast, niet de kwalificatie; die is voorbehouden aan de rechter.</li><li>Vermijd de veelgemaakte fouten: een conclusie zonder feiten, parafrase, ontbrekende context en een aanname als waarneming.</li></ul></div></div>"},{"titel":"Vooruitblik: Tik-proces-verbaal","kind":"theory","html":"<h2 class=\"ptitle\">Vooruitblik: Tik-proces-verbaal</h2><div class=\"main\"><p>Voor eenvoudige en duidelijke zaken wordt in de praktijk soms een verkort proces-verbaal opgemaakt: het zogenoemde tik-proces-verbaal.</p><p>Het volgende onderwerp behandelt hoe een dergelijke verkorte vastlegging eruitziet en welke bestanddelen daarin niet mogen ontbreken.</p></div>"}],"vragen":[{"soort":"Praktijkcasus","vraag":"Praktijkcasus. Je hebt zelf waargenomen dat een man een onbekende vrouw kort volgde en tweemaal een expliciet seksuele opmerking maakte; zij versnelde haar pas. Je maakt een proces-verbaal op. Welke aanpak legt de bestanddelen het best toetsbaar vast?","opties":["Je noteert je conclusie dat de man de vrouw seksueel intimideerde, zodat de kwalificatie meteen vaststaat.","Je beschrijft feitelijk de letterlijke opmerkingen, het volgen, de plaats, het tijdstip, de afstand en haar zichtbare reactie, en laat de kwalificatie aan de rechter.","Je volstaat met de personalia van de verdachte en een verwijzing naar artikel 429ter Sr.","Je neemt uitsluitend op dat sprake was van een vreesaanjagende situatie, omdat dat het zwaarste gevolg is."],"juist":1,"uitleg":"Het juiste antwoord is B. Het proces-verbaal moet de feiten dragen waaraan de rechter de bestanddelen toetst; beschrijf daarom zo concreet mogelijk wat je zag en hoorde: de letterlijke opmerkingen, het volgen, de plaats en het tijdstip, de afstand en de zichtbare reactie. De kwalificatie is aan de rechter. Bij een overtreding kan het proces-verbaal van één opsporingsambtenaar bovendien het bewijs dragen.[[1]] De overige antwoorden schrijven een conclusie op zonder de dragende feiten, beperken zich tot personalia, of lichten ten onrechte één gevolgvariant eruit.","kernregel":"Leg de feiten concreet en toetsbaar vast; de kwalificatie is aan de rechter, en het proces-verbaal van één opsporingsambtenaar kan het bewijs dragen.","artikel":"Art. 429ter Sr","wet":"Wetboek van Strafvordering","voetnoten":["Wetboek van Strafvordering, art. 344 lid 2."]},{"soort":"Kennisvraag","vraag":"Welke bewijsmiddelen kunnen bij artikel 429ter Sr het bewijs dragen?","opties":["Uitsluitend een bekennende verklaring van de verdachte.","Uitsluitend een aangifte van het slachtoffer.","Onder meer de eigen waarneming van de opsporingsambtenaar, een aangifte of getuigenverklaring en een bekentenis.","Uitsluitend camerabeelden die door een opsporingsambtenaar zijn bekeken en beschreven."],"juist":2,"uitleg":"Het juiste antwoord is C. In de bevestigde rechtspraak dragen verschillende bewijsmiddelen het bewijs: de eigen waarneming van de opsporingsambtenaar, een aangifte of getuigenverklaring en een bekennende verklaring; ook schriftelijke bescheiden zoals camerabeelden kunnen als wettig bewijsmiddel dienen.[[1]] De overige antwoorden beperken het bewijs ten onrechte tot één middel.","kernregel":"Verschillende bewijsmiddelen kunnen het bewijs bij artikel 429ter Sr dragen; het is niet tot één middel beperkt.","artikel":"Art. 429ter Sr","wet":"Rechtspraak","voetnoten":["Rb Rotterdam 2 oktober 2024, ECLI:NL:RBROT:2024:9612; Rb Midden-Nederland 7 oktober 2024, ECLI:NL:RBMNE:2024:5727."]},{"soort":"Kennisvraag","vraag":"Waarom neem je de omstandigheden (plaats, tijdstip, reactie) op in het proces-verbaal?","opties":["Dat is niet nodig; uitsluitend de gedraging zelf telt.","Uitsluitend om de persoonlijke levenssfeer van het slachtoffer te beschermen.","Omdat de context de ernst en de kwalificatie mede bepaalt en de rechter die moet kunnen wegen.","Uitsluitend om een eventuele straftoemeting te kunnen onderbouwen."],"juist":2,"uitleg":"Het juiste antwoord is C. Inhoud en context zijn 'communicerende vaten': de omstandigheden kleuren de ernst en de kwalificatie mede in.[[1]] Zonder een feitelijke beschrijving van de context kan de rechter die weging niet maken. De overige antwoorden miskennen de bepalende rol van de context door haar overbodig te achten of haar betekenis te beperken tot de persoonlijke levenssfeer of de straftoemeting.","kernregel":"De context bepaalt mede de ernst en de kwalificatie en moet daarom feitelijk in het proces-verbaal worden vastgelegd.","artikel":"Art. 429ter Sr","wet":"Wetboek van Strafrecht","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 117."]}]},{"id":"m7","nr":7,"titel":"Tik-proces-verbaal","kader":"Art. 429ter Sr","icoon":"document","type":"content","pages":[{"titel":"Leerdoelen","kind":"lo","html":"<h2 class=\"ptitle\">Leerdoelen</h2><p class=\"pintro\">Wat je na dit onderwerp kunt.</p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen wat een tik-proces-verbaal is en wanneer het geschikt is;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>benoemen welke bestanddelen ook in een verkort proces-verbaal niet mogen ontbreken;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>de onderdelen van een verkort proces-verbaal koppelen aan de wettelijke bestanddelen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>herkennen wanneer een verkort proces-verbaal juist niet passend is.</span></li></ul>"},{"titel":"Over deze werkwijze","kind":"kaart","html":"<h2 class=\"ptitle\">Over deze werkwijze</h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg></span><span class=\"kaart-lab\">Let op</span></div><div class=\"kaart-t\">Over deze werkwijze</div><div class=\"kaart-b\"><p>Voor het tik-proces-verbaal als vorm bestaat geen officiële, gepubliceerde bron; er is geen wet, parlementaire geschiedenis of gepubliceerde rechtspraak die deze vorm voorschrijft. Dit onderwerp betreft daarom uitdrukkelijk praktijkuitleg. De inhoudelijke eisen, te weten welke bestanddelen moeten worden vastgelegd en op welke wijze het bewijs wordt geleverd, vloeien wel voort uit officiële bronnen en blijven onverkort gelden.</p></div></div>"},{"titel":"Wat is een tik-proces-verbaal?","kind":"theory","html":"<h2 class=\"ptitle\">Wat is een tik-proces-verbaal?</h2><div class=\"main\"><p>Een tik-proces-verbaal is een verkort proces-verbaal dat in de praktijk wordt gebruikt voor eenvoudige, duidelijke overtredingen. Het is beknopter dan een uitgebreid proces-verbaal, maar het blijft een proces-verbaal met dezelfde functie: het feitelijk vastleggen van de waarneming als bewijsmiddel.</p><p>Verkort betekent niet minder zorgvuldig. Ook in een tik-proces-verbaal moeten de feiten die de bestanddelen dragen, controleerbaar zijn vastgelegd.</p></div>"},{"titel":"Wat mag niet ontbreken?","kind":"theory","html":"<h2 class=\"ptitle\">Wat mag niet ontbreken?</h2><div class=\"main\"><p>Ook in verkorte vorm dient het proces-verbaal alle bestanddelen van artikel 429ter Sr te dekken: dat het feit in het openbaar plaatsvond, dat sprake was van een indringende seksuele benadering, door welke gedraging in de vorm van een opmerking, gebaar, geluid of aanraking dit geschiedde, en de omstandigheden waaruit blijkt dat die benadering naar algemene maatstaven vreesaanjagend, vernederend, kwetsend of onterend is aan te merken.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114.</li></ol></div>"},{"titel":"Wat mag niet ontbreken? (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Wat mag niet ontbreken? (vervolg)</h2><div class=\"main\"><p>Het verdient daarom aanbeveling ten minste vast te leggen: de plaats en het tijdstip, de letterlijke opmerking of een feitelijke beschrijving van de gedraging, de context zoals de omgeving en de reactie van betrokkene, en de persoon die de waarneming heeft gedaan.</p></div>"},{"titel":"Wat mag niet ontbreken?","kind":"figuur","html":"<div class=\"figcap\">Wat mag niet ontbreken?</div><figure class=\"illu\"><svg viewBox=\"0 0 560 316\" role=\"img\" aria-labelledby=\"pv-t pv-d\" font-family=\"'Outfit',system-ui,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n<title id=\"pv-t\">Verkort en uitgebreid proces-verbaal</title>\n<desc id=\"pv-d\">Een tik-proces-verbaal (verkort) past bij een eenvoudige, duidelijke zaak; een uitgebreid proces-verbaal bij een complexe of betwiste zaak. Beide moeten alle bestanddelen dekken. Verkort betekent niet minder zorgvuldig.</desc>\n<rect x=\"20\" y=\"20\" width=\"250\" height=\"170\" rx=\"14\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<g transform=\"translate(133,40) scale(1.1)\" stroke=\"var(--blauw-licht)\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></g>\n<text x=\"145\" y=\"112\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Tik-pv (verkort)</text>\n<text x=\"145\" y=\"150\" text-anchor=\"middle\" class=\"il-sub\" fill=\"var(--tekst-mid)\">eenvoudige,</text>\n<text x=\"145\" y=\"170\" text-anchor=\"middle\" class=\"il-sub\" fill=\"var(--tekst-mid)\">duidelijke zaak</text>\n<rect x=\"290\" y=\"20\" width=\"250\" height=\"170\" rx=\"14\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<g transform=\"translate(403,40) scale(1.1)\" stroke=\"var(--blauw-licht)\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></g>\n<text x=\"415\" y=\"112\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Uitgebreid pv</text>\n<text x=\"415\" y=\"150\" text-anchor=\"middle\" class=\"il-sub\" fill=\"var(--tekst-mid)\">complexe of</text>\n<text x=\"415\" y=\"170\" text-anchor=\"middle\" class=\"il-sub\" fill=\"var(--tekst-mid)\">betwiste zaak</text>\n<rect x=\"20\" y=\"206\" width=\"520\" height=\"42\" rx=\"10\" fill=\"var(--grijs-licht)\" stroke=\"var(--grijs-mid)\" stroke-width=\"1.5\"/>\n<text x=\"280\" y=\"232\" text-anchor=\"middle\" class=\"il-sub\" font-weight=\"700\" fill=\"currentColor\">Beide dekken álle bestanddelen.</text>\n<text x=\"280\" y=\"286\" text-anchor=\"middle\" class=\"il-note\" font-style=\"italic\" fill=\"var(--tekst-mid)\">Verkort betekent niet minder zorgvuldig.</text>\n</svg></figure>"},{"titel":"Praktijkvoorbeeld","kind":"theory","html":"<h2 class=\"ptitle\">Praktijkvoorbeeld</h2><div class=\"main\"><p>Het onderstaande voorbeeld is fictief en dient uitsluitend ter illustratie van de opbouw; het is geen officieel model.</p></div>"},{"titel":"Praktijkvoorbeeld (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Praktijkvoorbeeld (vervolg)</h2><div class=\"main\"><p>«Op [datum] omstreeks [tijd] bevond ik, verbalisant, mij op het [plein] te [plaats], een voor het publiek toegankelijke plaats. Ik zag en hoorde dat een man, later herkend als de verdachte, een hem onbekende vrouw op korte afstand volgde en tweemaal luid de opmerking maakte: '[letterlijke opmerking]'. Ik zag dat de vrouw haar pas versnelde en wegkeek. Het was op dat moment rustig op het plein.»</p></div>"},{"titel":"Wat maakt dit voorbeeld bruikbaar?","kind":"theory","html":"<h2 class=\"ptitle\">Wat maakt dit voorbeeld bruikbaar?</h2><div class=\"main\"><p>Het voorbeeld vermeldt de plaats, en daarmee het openbare karakter, de gedraging in de vorm van een herhaalde letterlijke opmerking, de context zoals de afstand, de reactie en de mate van drukte, en de waarnemer.</p><p>Dit zijn juist de elementen waaraan de rechter de bestanddelen kan toetsen.</p></div>"},{"titel":"Welke omstandigheden kun je daarnaast nog vastleggen?","kind":"theory","html":"<h2 class=\"ptitle\">Welke omstandigheden kun je daarnaast nog vastleggen?</h2><div class=\"main\"><p>Bij de beoordeling van seksuele straatintimidatie is de context van groot belang. Leg daarom in het proces-verbaal niet alleen de gedraging zelf vast, maar ook de omstandigheden waaronder deze plaatsvond.</p><p>Denk bijvoorbeeld aan de volgende feiten en omstandigheden.</p></div>"},{"titel":"Welke omstandigheden kun je daarnaast nog vastleggen? (vervolg)","kind":"lijst","html":"<h2 class=\"ptitle\">Welke omstandigheden kun je daarnaast nog vastleggen? (vervolg)</h2><ul class=\"opsom\"><li>de afstand tussen de verdachte en de betrokkene;</li><li>de duur van de gedraging;</li><li>of de verdachte de betrokkene heeft gevolgd;</li><li>hoe vaak de opmerkingen, gebaren of geluiden werden gemaakt;</li><li>de exacte bewoordingen van de uitingen (zo letterlijk mogelijk);</li><li>de toon waarop de uitingen werden gedaan (bijvoorbeeld schreeuwen of luid roepen);</li><li>eventuele seksuele gebaren;</li></ul>"},{"titel":"Welke omstandigheden kun je daarnaast nog vastleggen? (vervolg)","kind":"lijst","html":"<h2 class=\"ptitle\">Welke omstandigheden kun je daarnaast nog vastleggen? (vervolg)</h2><ul class=\"opsom\"><li>eventuele aanrakingen;</li><li>de reactie van de betrokkene (bijvoorbeeld versnellen, weglopen, afwijzen, zichtbaar schrikken of negeren);</li><li>de reactie van de verdachte nadat de betrokkene afwijzend reageerde;</li><li>of de verdachte ondanks een afwijzende reactie bleef doorgaan;</li><li>de locatie waar de gedraging plaatsvond;</li><li>de drukte op de locatie;</li><li>het tijdstip van de gedraging;</li></ul>"},{"titel":"Welke omstandigheden kun je daarnaast nog vastleggen? (vervolg)","kind":"lijst","html":"<h2 class=\"ptitle\">Welke omstandigheden kun je daarnaast nog vastleggen? (vervolg)</h2><ul class=\"opsom\"><li>de lichtomstandigheden;</li><li>de aanwezigheid van omstanders;</li><li>de aanwezigheid van getuigen;</li><li>de aanwezigheid van camerabeelden of bodycambeelden;</li><li>jouw eigen waarnemingen als opsporingsambtenaar;</li><li>eventuele spontane uitlatingen van de verdachte;</li><li>overige objectief waarneembare feiten en omstandigheden die van belang kunnen zijn voor de beoordeling.</li></ul>"},{"titel":"Praktijktip","kind":"kaart","html":"<h2 class=\"ptitle\">Praktijktip</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Praktijktip</div><div class=\"kaart-b\"><p>Leg zoveel mogelijk objectieve feiten en omstandigheden vast. Beschrijf duidelijk wat je zelf hebt waargenomen en maak onderscheid tussen:</p><ul class=\"punten\"><li>eigen waarnemingen;</li><li>verklaringen van betrokkenen;</li><li>verklaringen van getuigen;</li><li>eventuele conclusies.</li></ul><p>Hoe vollediger de context wordt beschreven, hoe beter de officier van justitie en uiteindelijk de rechter de gedraging juridisch kunnen beoordelen.</p></div></div>"},{"titel":"Belangrijk","kind":"kaart","html":"<h2 class=\"ptitle\">Belangrijk</h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg></span><span class=\"kaart-lab\">Let op</span></div><div class=\"kaart-t\">Belangrijk</div><div class=\"kaart-b\"><p>Bovenstaande punten vormen geen wettelijke checklist. Welke omstandigheden relevant zijn, hangt altijd af van de concrete situatie.</p></div></div>"},{"titel":"Wanneer geen tik-proces-verbaal?","kind":"kaart","html":"<h2 class=\"ptitle\">Wanneer geen tik-proces-verbaal?</h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg></span><span class=\"kaart-lab\">Le
