vrouw draaide en naar haar keek.</span><br><span class=\"pv-zin\">Ik hoorde de man met luide stem in de richting van de vrouw roepen: 'Hé, lekker ding!'</span><br><span class=\"pv-zin\">Ik zag dat de vrouw niet reageerde en in dezelfde richting doorliep.</span></p><p class=\"pv-alinea\"><span class=\"pv-zin\">Ik zag dat de man vervolgens achter de vrouw aan liep.</span><br><span class=\"pv-zin\">Ik zag dat de man daarbij in dezelfde looprichting als de vrouw liep.</span><br><span class=\"pv-zin\">Ik zag dat de afstand tussen de man en de vrouw kleiner werd.</span></p><p class=\"pv-alinea\"><span class=\"pv-zin\">Ik hoorde de man in de richting van de vrouw roepen: 'Hé, schatje!'</span><br><span class=\"pv-zin\">Ik zag dat de vrouw haar pas versnelde en haar hoofd van de man afwendde.</span></p><p class=\"pv-alinea\"><span class=\"pv-zin\">Ik zag dat de man achter de vrouw bleef lopen.</span><br><span class=\"pv-zin\">Ik zag dat de afstand tussen de man en de vrouw op dat moment ongeveer vijf meter bedroeg.</span><br><span class=\"pv-zin\">Ik hoorde de man opnieuw in de richting van de vrouw roepen: 'Schatje!'</span></p><p class=\"pv-alinea\"><span class=\"pv-zin\">Ik zag dat de vrouw haar pas opnieuw versnelde.</span><br><span class=\"pv-zin\">Ik zag dat de vrouw niet in de richting van de man keek en verder liep in de richting van het station.</span></p><p class=\"pv-alinea\"><span class=\"pv-zin\">Ik zag dat de man de vrouw gedurende ongeveer [afstand/tijdsduur] bleef volgen.</span><br><span class=\"pv-zin\">Ik zag dat de man daarbij in dezelfde richting achter de vrouw bleef lopen.»</span></p></div>","kind":"theory","titel":"Praktijkvoorbeeld"},{"html":"<h2 class=\"ptitle\">Wat maakt dit voorbeeld bruikbaar?</h2><div class=\"main\"><p>De tekst beschrijft de plaats, de gedraging, de letterlijke uiting, de afstand, de herhaling, de zichtbare reactie en de omstandigheden. Ook is duidelijk wat de verbalisant zelf heeft gezien en gehoord.</p><p>Met zulke concrete feiten kan het OM de zaak beoordelen. Wordt de zaak aan de rechter voorgelegd, dan kan de rechter het bewijs en de juridische kwalificatie beoordelen.</p></div>","kind":"theory","titel":"Wat maakt dit voorbeeld bruikbaar?"},{"html":"<h2 class=\"ptitle\">Leg de context vast</h2><div class=\"main\"><p>De context kan bepalend zijn voor de beoordeling. Denk daarom, als dat relevant is, aan:</p><ul class=\"opsom\"><li>de locatie en het tijdstip;</li><li>drukte, omgeving en lichtomstandigheden;</li><li>de afstand tussen verdachte en betrokkene;</li><li>de duur en herhaling van het gedrag;</li><li>volgen, blokkeren of doorgaan na een afwijzende reactie;</li><li>de zichtbare reactie van de betrokkene.</li></ul></div>","kind":"theory","titel":"Leg de context vast"},{"html":"<h2 class=\"ptitle\">Leg relevante bewijsmiddelen vast</h2><div class=\"main\"><p>Naast je eigen waarneming kunnen andere bewijsmiddelen van belang zijn. Denk aan verklaringen van de betrokkene, getuigen of verdachte en aan camera- of bodycambeelden.</p><p>Maak duidelijk wie iets heeft verklaard of waargenomen. Bij beelden leg je vast wie de beelden heeft bekeken en wat daarop is waargenomen.</p></div>","kind":"theory","titel":"Leg relevante bewijsmiddelen vast"},{"html":"<h2 class=\"ptitle\">Gebruikte bevoegdheden</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Gebruikte bevoegdheden</div><div class=\"kaart-b\"><p>Heb je tijdens het optreden bevoegdheden gebruikt? Leg dan vast welke handelingen je hebt verricht en welke feiten en omstandigheden daarbij van belang waren.</p><p>Zo blijft achteraf controleerbaar wat je hebt gedaan en waarop dat was gebaseerd.</p></div></div>","kind":"kaart","titel":"Gebruikte bevoegdheden"},{"html":"<h2 class=\"ptitle\">Veelgemaakte fouten</h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-lab\">Let op</span></div><div class=\"kaart-t\">Veelgemaakte fouten</div><div class=\"kaart-b\"><ul class=\"punten\"><li>alleen een juridische conclusie opschrijven;</li><li>een letterlijke opmerking alleen in eigen woorden navertellen;</li><li>relevante context weglaten;</li><li>eigen waarneming en aannames door elkaar halen;</li><li>beelden noemen zonder vast te leggen wie ze heeft bekeken en wat daarop is waargenomen.</li></ul><p>Deze fouten kunnen leiden tot een onvolledig proces-verbaal, wat kan zorgen voor seponering of vrijspraak.</p></div></div>","kind":"kaart","titel":"Veelgemaakte fouten"},{"html":"<h2 class=\"ptitle\">Controle vóór afronding</h2><div class=\"main\"><p>Controleer je proces-verbaal voordat je het afrondt.</p><ul class=\"opsom\"><li>Heb ik de gedraging zo concreet mogelijk beschreven?</li><li>Zijn de relevante bestanddelen met feiten en omstandigheden onderbouwd?</li><li>Heb ik de context beschreven?</li><li>Is duidelijk wat ik zelf heb waargenomen?</li><li>Zijn verklaringen herkenbaar als verklaringen?</li><li>Heb ik relevante beelden en andere bewijsmiddelen beschreven?</li><li>Kan iemand die er niet bij was begrijpen wat er gebeurde?</li></ul></div>","kind":"theory","titel":"Controle vóór afronding"},{"html":"<h2 class=\"ptitle\">Geen vaste wettelijke checklist</h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-lab\">Let op</span></div><div class=\"kaart-t\">Geen vaste wettelijke checklist</div><div class=\"kaart-b\"><p>Welke feiten en omstandigheden belangrijk zijn, hangt af van de concrete situatie. Gebruik de voorbeelden in dit onderwerp daarom als praktische aandachtspunten en niet als een vaste wettelijke checklist.</p></div></div>","kind":"kaart","titel":"Geen vaste wettelijke checklist"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>Schrijf feitelijk, concreet en controleerbaar.</li><li>Maak onderscheid tussen eigen waarnemingen, verklaringen en conclusies.</li><li>Leg de relevante context en bewijsmiddelen vast.</li><li>Onderbouw de wettelijke bestanddelen met feiten en omstandigheden.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Vooruitblik: Samenvatting van de opleiding</h2><div class=\"main\"><p>Je hebt nu de achtergrond, de bestanddelen, de context, de rechtspraak, het bewijs en het proces-verbaal doorlopen.</p><p>In het laatste onderwerp vatten we de rode draad van de opleiding samen.</p></div>","kind":"theory","titel":"Vooruitblik: Samenvatting van de opleiding"}],"titel":"Proces-verbaal in de praktijk","type":"content","vragen":[{"artikel":"Art. 429ter Sr","juist":1,"kernregel":"Beschrijf concrete feiten en omstandigheden. Een juridische conclusie alleen is niet voldoende.","opties":["Alleen: ‘De verdachte intimideerde de vrouw seksueel.’","De letterlijke opmerkingen, gedragingen, plaats, tijd, afstand, herhaling en relevante context.","Alleen de persoonsgegevens van de verdachte en artikel 429ter Sr.","Alleen dat de situatie volgens jou vreesaanjagend was."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is B. Een bruikbaar proces-verbaal beschrijft de concrete feiten en omstandigheden waarop de zaak kan worden beoordeeld.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114-117."],"vraag":"Wat is de beste manier om een waargenomen situatie vast te leggen?","wet":"Praktijkuitleg"},{"artikel":"Art. 429ter Sr","juist":2,"kernregel":"Maak duidelijk wat je zelf hebt waargenomen en wat door anderen is verklaard.","opties":["Alles in één doorlopend verhaal zetten zonder de bron van de informatie te noemen.","Alleen verklaringen opnemen en je eigen waarneming weglaten.","Duidelijk onderscheiden wat je zelf zag of hoorde en wat een betrokkene of getuige heeft verklaard.","Zelf conclusies trekken over wat een getuige waarschijnlijk heeft bedoeld."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is C. Voor een controleerbaar proces-verbaal moet duidelijk zijn waar de informatie vandaan komt.","vraag":"Hoe ga je om met eigen waarnemingen en verklaringen?","wet":"Praktijkuitleg"},{"artikel":"Art. 429ter Sr","juist":3,"kernregel":"De relevante context kan belangrijk zijn voor de beoordeling van artikel 429ter Sr.","opties":["Context is niet nodig als je de persoonsgegevens van de verdachte hebt.","Alleen het tijdstip is relevant.","Alleen de reactie van de betrokkene bepaalt of het feit strafbaar is.","Leg relevante omstandigheden vast, zoals plaats, tijd, afstand, duur, herhaling en de manier van benaderen."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is D. De inhoud en context moeten in samenhang kunnen worden beoordeeld. Welke omstandigheden relevant zijn, hangt af van de concrete situatie.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 116-117."],"vraag":"Welke aanpak past het beste bij het vastleggen van de context?","wet":"Praktijkuitleg"},{"artikel":"Art. 429ter Sr","juist":3,"kernregel":"Twijfel over een voltooid delict betekent niet automatisch dat je niets kunt doen. Je handelt altijd binnen je bevoegdheden en werkwijze.","opties":["Je houdt de man direct aan voor seksuele straatintimidatie, omdat de vrouw niet op hem reageert en zijn opmerking daarom volgens jou strafbaar is.","Je doet niets. Als artikel 429ter Sr niet aantoonbaar is voltooid, heb je als boa geen rol meer en hoef je ook niets vast te leggen.","Je schrijft direct een proces-verbaal voor artikel 429ter Sr, zonder verder waar te nemen, en laat het OM achteraf bepalen of het gedrag strafbaar was.","Je blijft waarnemen, beoordeelt of een passende interventie mogelijk is, gaat zo nodig in gesprek en legt relevante waarnemingen vast binnen je bevoegdheden en werkwijze."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is D. Twijfel over een voltooid delict betekent niet automatisch dat je niets kunt doen. Blijf waarnemen en beoordeel of een passende interventie mogelijk is. Je kunt de persoon aanspreken, uitleggen wat je ziet en waarom het gedrag niet wenselijk is. Leg relevante waarnemingen vast voor zover dat binnen je bevoegdheden en werkwijze mogelijk is. Nieuwe gedragingen of omstandigheden kunnen aanleiding zijn om de situatie opnieuw te beoordelen.","vraag":"Je ziet in een uitgaansgebied dat een man een onbekende vrouw aanspreekt en een opmerking over haar uiterlijk maakt. De vrouw reageert niet en loopt door. De man roept nog iets achter haar aan, maar volgt haar niet. Op basis van wat je hebt waargenomen, twijfel je of sprake is van een voltooid strafbaar feit van artikel 429ter Sr. Wat is de beste handelwijze?","wet":"Praktijkuitleg"}]},{"icoon":"list","id":"m8","kader":"Terugblik","nr":8,"pages":[{"html":"<h2 class=\"ptitle\">Leerdoelen</h2><p class=\"pintro\">Wat je na dit onderwerp kunt.</p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>de belangrijkste punten uit de opleiding samenvatten;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>de belangrijkste regels van artikel 429ter Sr uitleggen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>je voorbereiden op de eindtoets.</span></li></ul>","kind":"lo","titel":"Leerdoelen"},{"html":"<h2 class=\"ptitle\">Terugblik</h2><div class=\"main\"><p>In de vorige onderwerpen kwam dit na elkaar aan bod: de achtergrond van de strafbaarstelling, de bestanddelen, de context, de rechtspraak, het bewijs en het proces-verbaal.</p><p>Deze samenvatting brengt de kernpunten bij elkaar. Er komt geen nieuwe juridische inhoud bij. Alle punten zijn in de vorige onderwerpen onderbouwd met officiële bronnen.</p></div>","kind":"theory","titel":"Terugblik"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-t\">1. Achtergrond en doel</div><div class=\"kaart-b\"><ul class=\"punten\"><li>Artikel 429ter Sr geldt sinds 1 juli 2024. Het beschermt het vrij en veilig kunnen verkeren in de openbare ruimte.</li><li>De strafbaarstelling maakt handhaving mogelijk. Daarnaast maakt de wet de norm duidelijk en probeert zij dit gedrag te voorkomen.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-t\">2. Wettelijke bestanddelen</div><div class=\"kaart-b\"><ul class=\"punten\"><li>Alle bestanddelen moeten aanwezig zijn. Het zijn er vier:</li></ul><ul class=\"opsom\"><li>in het openbaar;</li><li>een ander indringend seksueel benaderen;</li><li>door opmerkingen, gebaren, geluiden of aanrakingen;</li><li>op een manier die volgens algemene maatstaven vreesaanjagend, vernederend, kwetsend óf onterend is.</li></ul><ul class=\"punten\"><li>Het criterium is geobjectiveerd. Het gaat om een overtreding. Je hoeft daarom geen opzet of schuld te bewijzen.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-t\">3. Contextbeoordeling</div><div class=\"kaart-b\"><ul class=\"punten\"><li>De inhoud en de omstandigheden beïnvloeden elkaar. De wetgever noemt dit ‘communicerende vaten’. De omstandigheden beïnvloeden de beoordeling.</li><li>De duur, hoe vaak het gebeurt, de plaats en de omgeving tellen mee. Dezelfde gedraging kan door de context wel of niet strafbaar zijn. Je beoordeelt het gedrag volgens algemene maatstaven. Je hoeft niet te bewijzen hoe het slachtoffer het gedrag persoonlijk heeft beleefd.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-t\">4. Rechtspraak</div><div class=\"kaart-b\"><ul class=\"punten\"><li>De eerste strafzaken, gepubliceerd vanaf oktober 2024, laten zien dat waarnemingen van opsporingsambtenaren voldoende bewijs kunnen opleveren.</li><li>De rechter toetst de bestanddelen zelf en kiest de kwalificatie. Die kwalificatie is soms beperkter dan de tenlastelegging. De rechter weegt daarbij de context mee.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-t\">5. Bewijs en proces-verbaal</div><div class=\"kaart-b\"><ul class=\"punten\"><li>De bestanddelen worden bewezen met de eigen waarneming, verklaringen van verdachte, getuige of deskundige en schriftelijke stukken. Camerabeelden kunnen informatie leveren. Leg dan vast wie de beelden heeft bekeken en wat daarop is waargenomen.</li><li>Leg de feiten en de context vast, niet de kwalificatie. Schrijf geen conclusies op zonder feiten die ze onderbouwen.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-t\">6. Proces-verbaal in de praktijk</div><div class=\"kaart-b\"><ul class=\"punten\"><li>Beschrijf concrete feiten en omstandigheden, niet alleen een juridische conclusie.</li><li>Maak duidelijk onderscheid tussen eigen waarnemingen, verklaringen en conclusies.</li><li>Leg de relevante context en bewijsmiddelen duidelijk en controleerbaar vast.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Beslishulp: kan artikel 429ter Sr van toepassing zijn?</h2><div class=\"main\"><p>De beslishulp zet de bestanddelen op een rij. Je kunt hiermee een situatie stap voor stap controleren. Jouw taak is om de feiten en omstandigheden zorgvuldig vast te leggen. Het OM beoordeelt daarna de zaak en beslist over de afdoening.</p></div>","kind":"theory","titel":"Beslishulp: kan artikel 429ter Sr van toepassing zijn?"},{"html":"<div class=\"figcap\">Beslishulp: kan artikel 429ter Sr van toepassing zijn?</div><figure class=\"illu\"><svg viewBox=\"0 0 560 432\" role=\"img\" aria-labelledby=\"bs-t bs-d\" font-family=\"'Outfit',system-ui,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n<title id=\"bs-t\">Beslishulp: kan artikel 429ter Sr van toepassing zijn?</title>\n<desc id=\"bs-d\">Doorloop vier voorwaarden. Is het in het openbaar (fysiek of online)? Is sprake van een indringende seksuele benadering? Gebeurt dit door een opmerking, gebaar, geluid of aanraking? Is de benadering volgens algemene maatstaven intimiderend? Dit is het geobjectiveerde criterium. Zijn alle antwoorden ‘ja’? Dan kan artikel 429ter Sr gelden. Is één antwoord ‘nee’? Dan is niet aan alle bestanddelen voldaan. Opzet of schuld hoeft niet te worden bewezen; bij twijfel legt de opsporingsambtenaar de feiten zorgvuldig vast. Het OM beoordeelt daarna de zaak en beslist over de afdoening. Komt de zaak bij de rechter, dan beoordeelt de rechter de zaak.</desc>\n<text x=\"280\" y=\"12\" text-anchor=\"middle\" class=\"il-note\" fill=\"var(--tekst-mid)\">Elke voorwaarde ‘ja’ → volgende stap · één ‘nee’ → valt buiten</text>\n<rect x=\"20\" y=\"20\" width=\"520\" height=\"46\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<circle cx=\"52\" cy=\"43\" r=\"15\" fill=\"var(--blauw-licht)\"/><text x=\"52\" y=\"48\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--wit)\">1</text>\n<text x=\"80\" y=\"49\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">In het openbaar? (fysiek of online)</text>\n<line x1=\"280\" y1=\"66\" x2=\"280\" y2=\"82\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/><path d=\"M273 76l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"292\" y=\"79\" font-size=\"12\" font-weight=\"700\" fill=\"var(--blauw-licht)\">ja</text>\n<rect x=\"20\" y=\"84\" width=\"520\" height=\"46\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<circle cx=\"52\" cy=\"107\" r=\"15\" fill=\"var(--blauw-licht)\"/><text x=\"52\" y=\"112\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--wit)\">2</text>\n<text x=\"80\" y=\"113\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Indringende seksuele benadering?</text>\n<line x1=\"280\" y1=\"130\" x2=\"280\" y2=\"146\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/><path d=\"M273 140l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"292\" y=\"143\" font-size=\"12\" font-weight=\"700\" fill=\"var(--blauw-licht)\">ja</text>\n<rect x=\"20\" y=\"148\" width=\"520\" height=\"46\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<circle cx=\"52\" cy=\"171\" r=\"15\" fill=\"var(--blauw-licht)\"/><text x=\"52\" y=\"176\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--wit)\">3</text>\n<text x=\"80\" y=\"177\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Opmerking, gebaar, geluid of aanraking?</text>\n<line x1=\"280\" y1=\"194\" x2=\"280\" y2=\"210\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/><path d=\"M273 204l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"292\" y=\"207\" font-size=\"12\" font-weight=\"700\" fill=\"var(--blauw-licht)\">ja</text>\n<rect x=\"20\" y=\"212\" width=\"520\" height=\"58\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=
