<script>window.__DATA__={"aantalOnderwerpen":6,"drempel":70,"eindtoets":[{"casus":false,"juist":1,"opties":["Dat het gezag in de openbare ruimte zonder problemen kan werken.","Dat mensen zich vrij en veilig in de openbare ruimte kunnen bevinden en bewegen.","De eerbaarheid en de goede zeden als belangrijkste belangen van de oude zedendelicten.","De goede naam van de persoon die wordt aangesproken."],"thema":"Achtergrond","uitleg":"Dit is het juiste antwoord. Artikel 429ter Sr beschermt de vrijheid en veiligheid van mensen in de openbare ruimte. De kern van het verwijt is dat iemand daar tegen zijn of haar wil als seksueel object wordt benaderd (MvT, p. 116; Nota, p. 12). De andere antwoorden noemen belangen die hier niet het belangrijkst zijn.","vraag":"Welk belang wil artikel 429ter Sr volgens de wetgever vooral beschermen?"},{"casus":false,"juist":2,"opties":["De wet heeft alleen een symbolisch doel en geldt sinds 1 januari 2024.","De wet regelt vooral schadevergoeding en geldt sinds 1 juli 2025.","De wet maakt de norm duidelijk en probeert het gedrag te voorkomen. Het artikel geldt sinds 1 juli 2024.","De wet verplicht het Openbaar Ministerie iedere melding te vervolgen en geldt sinds 1 juli 2024."],"thema":"Achtergrond","uitleg":"Dit is het juiste antwoord. De strafbaarstelling heeft een normerende en een preventieve functie. Dit betekent dat de wet de norm duidelijk maakt en het gedrag probeert te voorkomen. Het artikel geldt sinds 1 juli 2024 (Nota, p. 12 en 50; MvT, p. 26; Stb. 2024, 61). De andere antwoorden noemen een verkeerde datum of een verkeerd doel.","vraag":"Welke andere doelen heeft artikel 429ter Sr naast handhaving, en sinds wanneer geldt het artikel?"},{"casus":false,"juist":3,"opties":["Eén bestanddeel is genoeg, bijvoorbeeld dat de opmerking vreesaanjagend is.","Alleen een aanraking kan dit delict opleveren.","De verdachte is alleen strafbaar als opzet op de intimidatie wordt bewezen.","Alle bestanddelen moeten aanwezig zijn. Ontbreekt er één, dan is het delict niet voltooid."],"thema":"Wettelijke bestanddelen","uitleg":"Dit is het juiste antwoord. Alle vier de bestanddelen moeten aanwezig zijn. Het gedrag vindt plaats in het openbaar. De verdachte benadert een ander indringend en seksueel. Dit gebeurt door opmerkingen, gebaren, geluiden of aanrakingen. De benadering is volgens algemene maatstaven vreesaanjagend, vernederend, kwetsend óf onterend (MvT, p. 114). Opzet is geen bestanddeel.","vraag":"Wat geldt voor de bestanddelen van artikel 429ter Sr?"},{"art":"scene-et-online-chat","artPos":"100% 50%","artRatio":"9/8","casus":false,"juist":1,"opties":["Nee. Het gaat alleen om fysieke openbare plaatsen.","Ja. De online omgeving moet dan voor veel mensen toegankelijk zijn en vergelijkbaar zijn met een openbare plaats.","Ja. Ieder bericht op sociale media is openbaar, ook als maar een paar mensen het zien.","Ja. Ook iedere besloten en afgeschermde chatgroep is openbaar."],"thema":"Wettelijke bestanddelen","uitleg":"Dit is het juiste antwoord. ‘In het openbaar’ gaat niet alleen over fysieke plaatsen. Het kan ook gaan om een online omgeving die voor veel mensen toegankelijk is en vergelijkbaar is met een openbare plaats (MvT, p. 116). Een besloten of afgeschermde omgeving is niet openbaar (Nota, p. 54).","vraag":"Kan ‘in het openbaar’ ook gelden voor gedrag op internet?"},{"casus":false,"juist":2,"opties":["De inhoud en de omstandigheden worden volledig los van elkaar beoordeeld.","Alleen de omstandigheden tellen. De inhoud is niet belangrijk.","De inhoud en de omstandigheden beïnvloeden elkaar.","Alleen de inhoud telt. De omstandigheden kunnen het oordeel niet veranderen."],"thema":"Context","uitleg":"Dit is het juiste antwoord. De wetgever noemt de inhoud en de omstandigheden ‘communicerende vaten’. Dit betekent dat ze elkaar beïnvloeden. Een uiting die op zichzelf niet voldoende is, kan door de omstandigheden toch onder de strafbepaling vallen (MvT, p. 117).","vraag":"Wat bedoelt de wetgever met ‘communicerende vaten’?"},{"casus":false,"juist":0,"opties":["Nee. De omstandigheden kunnen het oordeel veranderen. Gedrag op een druk plein bij daglicht kan anders worden beoordeeld dan hetzelfde gedrag in een donker steegje.","Ja. De omstandigheden mogen geen rol spelen.","Nee, maar alleen als de aangesproken persoon letsel heeft.","Nee, maar alleen als de verdachte de bedoeling had om te intimideren."],"thema":"Context","uitleg":"Dit is het juiste antwoord. De plaats, het tijdstip en andere omstandigheden kunnen het oordeel veranderen. De wetgever noemt het voorbeeld van een plein bij daglicht en een smal steegje in het donker (Nota, p. 54). Letsel en opzet zijn geen voorwaarden.","vraag":"Een collega zegt dat hetzelfde gedrag altijd dezelfde juridische beoordeling krijgt. Klopt dat?"},{"casus":false,"juist":3,"opties":["Zonder aangifte van het slachtoffer is geen veroordeling mogelijk.","Alleen camerabeelden kunnen voldoende bewijs opleveren.","Naast een proces-verbaal is altijd nog ander onafhankelijk bewijs nodig.","Goed vastgelegde waarnemingen van opsporingsambtenaren kunnen voldoende bewijs opleveren."],"thema":"Jurisprudentie","uitleg":"Dit is het juiste antwoord. In ECLI:NL:RBROT:2024:9612 was de veroordeling gebaseerd op twee processen-verbaal van opsporingsambtenaren. Er was geen aangifte en er waren geen camerabeelden. Een aangifte of camerabeeld is dus niet altijd nodig.","vraag":"Wat leert de eerste gepubliceerde zaak over artikel 429ter Sr over het bewijs?"},{"art":"scene-et-rechter","artPos":"45% 35%","artRatio":"1/1","casus":false,"juist":0,"opties":["Artikel 429ter Sr noemt vier mogelijke kenmerken. Het slachtoffer hoeft dus niet bang te zijn.","Zonder angst bij het slachtoffer kan het artikel niet worden overtreden.","De rechter moet altijd dezelfde kwalificatie kiezen als het Openbaar Ministerie.","Het kenmerk ‘vernederend’ geldt alleen als het slachtoffer een ambtenaar is."],"thema":"Jurisprudentie","uitleg":"Dit is het juiste antwoord. Artikel 429ter Sr noemt vier mogelijke kenmerken: vreesaanjagend, vernederend, kwetsend of onterend. Het gedrag hoeft niet aan alle vier te voldoen. Vrees bij het slachtoffer is daarom niet vereist (ECLI:NL:RBMNE:2024:5727).","vraag":"De rechter vond een seksuele opmerking vernederend, kwetsend en onterend, maar niet vreesaanjagend. Wat betekent dit?"},{"casus":false,"juist":3,"opties":["Dat de verdachte de bedoeling had om de ander te intimideren.","Dat het slachtoffer zich echt geïntimideerd voelde.","Dat de verdachte dit gedrag vaker heeft vertoond.","De wettelijke bestanddelen. Opzet of schuld hoeft niet te worden bewezen."],"thema":"Bewijs","uitleg":"Dit is het juiste antwoord. Artikel 429ter Sr is een overtreding. Opzet en schuld staan niet als bestanddeel in deze strafbepaling. Je bewijst daarom de wettelijke bestanddelen (MvT, p. 114). De persoonlijke ervaring van het slachtoffer en herhaald gedrag zijn geen aparte voorwaarden.","vraag":"Wat moet je bij artikel 429ter Sr bewijzen?"},{"art":"scene-et-uitgaan2","artWide":true,"artPos":"50% 40%","artRatio":"3/2","casus":true,"juist":3,"opties":["Je houdt de man direct aan voor seksuele straatintimidatie, omdat de vrouw niet op hem reageert.","Je beëindigt je bemoeienis, omdat je niet zeker weet of alle bestanddelen van artikel 429ter Sr zijn vervuld.","Je maakt direct proces-verbaal op voor artikel 429ter Sr en laat de verdere beoordeling volledig aan het OM over.","Je blijft waarnemen, beoordeelt of een passende interventie mogelijk is, gaat zo nodig met de persoon in gesprek en legt relevante waarnemingen binnen je bevoegdheden en werkwijze vast."],"thema":"Optreden in de praktijk","uitleg":"Dit is het juiste antwoord. Twijfel over een voltooid delict betekent niet automatisch dat je niets kunt doen. Blijf waarnemen en beoordeel of een passende interventie mogelijk en passend is. Je kunt de persoon aanspreken, uitleggen wat je ziet en waarom het gedrag niet wenselijk is. Leg relevante waarnemingen vast voor zover dat binnen je bevoegdheden en werkwijze mogelijk is. Nieuwe gedragingen of omstandigheden kunnen aanleiding zijn om de situatie opnieuw te beoordelen.","vraag":"Praktijkcasus. In een uitgaansgebied maakt een man een opmerking over het uiterlijk van een onbekende vrouw. Zij reageert niet en loopt door. De man roept haar nog iets na, maar volgt haar niet. Je twijfelt of alle bestanddelen van artikel 429ter Sr zijn vervuld. Wat is de beste handelwijze?"},{"art":"scene-et-pv-computer","artWide":true,"artPos":"50% 35%","artRatio":"3/2","casus":false,"juist":0,"opties":["Beschrijf de letterlijke woorden of gedraging, de plaats, de tijd, de omstandigheden en de zichtbare reactie.","Schrijf alleen jouw juridische conclusie op, bijvoorbeeld: ‘Hij intimideerde haar.’","Noteer alleen de persoonsgegevens van de verdachte.","Noteer alleen één juridisch kenmerk, bijvoorbeeld ‘vreesaanjagend’."],"thema":"Proces-verbaal","uitleg":"Dit is het juiste antwoord. Beschrijf de feiten zo precies mogelijk. Het OM beoordeelt de zaak en beslist over de afdoening. Wordt de zaak aan de rechter voorgelegd, dan beoordeelt de rechter het bewijs en de juridische kwalificatie. Een juridisch oordeel zonder de feiten is niet voldoende.","vraag":"Hoe leg je jouw waarneming het beste vast in een proces-verbaal?"},{"art":"scene-et-waarneming","artPos":"50% 30%","casus":true,"juist":1,"opties":["Ik stelde vast dat de man de vrouw seksueel intimideerde, omdat zijn opmerkingen duidelijk voor haar bedoeld waren.","Ik zag dat de man zijn hoofd in de richting van de vrouw draaide en naar haar keek. Ik hoorde hem zeggen: ‘Schatje, jij ziet er lekker uit vanavond.’ Ik zag dat de vrouw snel wegkeek van de man.","Ik hoorde van de vrouw dat de man haar seksueel intimideerde. Ik nam daarom als eigen waarneming op dat de man seksuele opmerkingen tegen haar maakte.","Ik zag dat de verdachte zich intimiderend gedroeg en hoorde dat hij ongepaste opmerkingen tegen de vrouw maakte."],"thema":"Proces-verbaal","uitleg":"Dit is het juiste antwoord. Hier beschrijft de BOA precies wat zij zelf ziet en hoort. Zij trekt geen conclusie, maar beschrijft de feiten.","vraag":"Welk deel legt de eigen waarneming het meest duidelijk en controleerbaar vast?"},{"art":"scene-et-portiek","artWide":true,"artPos":"50% 30%","artRatio":"3/2","casus":true,"juist":1,"opties":["Het gedrag valt niet onder artikel 429ter Sr, omdat de man de vrouw niet heeft aangeraakt.","Het gedrag kan onder artikel 429ter Sr vallen. De plaats, het tijdstip, de herhaling en de korte afstand tellen mee bij de beoordeling.","Het gedrag is alleen strafbaar als de vrouw aangifte doet.","Het gedrag is alleen strafbaar als wordt bewezen dat de man haar wilde intimideren."],"thema":"Casus","uitleg":"Dit is het juiste antwoord. De feiten kunnen passen bij alle bestanddelen. Het gedrag vindt plaats in het openbaar. De man benadert de vrouw indringend en seksueel door opmerkingen. De plaats, het tijdstip, de herhaling en de korte afstand tellen mee bij de beoordeling volgens algemene maatstaven (MvT, p. 114–117). Een aanraking, aangifte of bewijs van opzet is niet vereist. Het OM beoordeelt de zaak en beslist over de afdoening. Het OM kan seponeren, een strafbeschikking opleggen of de zaak aan de rechter voorleggen. Met een strafbeschikking kan het OM bijvoorbeeld een geldboete of taakstraf opleggen. De verdachte kan daartegen in verzet gaan. Het OM beoordeelt de zaak dan opnieuw. Blijft het verzet bestaan, dan wordt de zaak aan de rechter voorgelegd.","vraag":"Praktijkcasus. Het is laat in de avond. In een verlaten portiek blokkeert een man kort de doorgang van een onbekende vrouw. Hij maakt van dichtbij meerdere seksuele opmerkingen en lacht om haar reactie. De vrouw kijkt angstig. Welke beoordeling past het beste?"},{"casus":true,"juist":2,"opties":["Schrijf alleen jouw conclusie op dat het seksuele intimidatie was.","Wacht op een aangifte, want zonder aangifte is er geen bruikbaar bewijs.","Beschrijf precies wat je zag en hoorde, waaronder de woorden, plaats, tijd, afstand, herhaling en zichtbare reactie.","Vraag eerst om een bekentenis, want zonder bekentenis kan de zaak niet doorgaan."],"thema":"Casus","uitleg":"Dit is het juiste antwoord. Leg de feiten duidelijk en controleerbaar vast. Volgens artikel 344, tweede lid, Sv kan één proces-verbaal van een opsporingsambtenaar voldoende bewijs zijn. Het proces-verbaal moet dan wel aan de wettelijke eisen voldoen. Een aangifte, camerabeeld of bekentenis is niet altijd nodig.","vraag":"Praktijkcasus. Je hebt het gedrag uit de vorige casus zelf gezien en gehoord. Er is geen aangifte en geen camerabeeld. Hoe maak je een bruikbaar proces-verbaal?"}],"eindtoetsDrempel":80,"kaderLabel":"Artikel 429ter Sr","opleiding":"Seksuele straatintimidatie","peildatum":"21 september 2026","subtitel":"SEKSUELE STRAATINTIMIDATIE — E-LEARNING VOOR OPSPORINGSAMBTENAREN","topics":[{"icoon":"megafoon","id":"m1","kader":"Opleiding","nr":1,"pages":[{"html":"<h2 class=\"ptitle\">Leerdoelen</h2><p class=\"pintro\">Wat je na dit onderwerp kunt.</p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>weet je hoe deze opleiding is opgebouwd;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>ken je de leerdoelen en weet je hoe de toetsen zijn opgebouwd;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>weet je wat van je wordt verwacht om het certificaat te behalen.</span></li></ul>","kind":"lo","titel":"Leerdoelen"},{"html":"<h2 class=\"ptitle\">Welkom</h2><div class=\"main\"><p>Welkom bij de opleiding Seksuele straatintimidatie. Je leert in deze opleiding drie dingen. Je leert het delict van artikel 429ter Sr herkennen. Je leert wat dit delict juridisch betekent. En je leert hoe je een situatie in de praktijk goed beoordeelt en vastlegt.</p><p>Je sluit de opleiding af met een eindtoets. Haal je de eindtoets, dan krijg je een certificaat.</p></div>","kind":"theory","titel":"Welkom"},{"html":"<h2 class=\"ptitle\">Opzet van de opleiding</h2><div class=\"main\"><p>De opleiding bestaat uit acht onderwerpen. Je begint met deze introductie. Daarna volgen zes inhoudelijke onderwerpen. Het laatste onderwerp is een samenvatting. Daarna maak je de eindtoets.</p><p>Elk inhoudelijk onderwerp begint met de leerdoelen. Daarna krijg je korte stukken theorie. Die wisselen af met wetsartikelen, rechtspraak, praktijkvoorbeelden en kennisvragen. Je voortgang wordt bewaard op dit apparaat. Je kunt dus later verdergaan waar je gebleven was.</p></div>","kind":"theory","titel":"Opzet van de opleiding"},{"html":"<div class=\"figcap\">Opzet van de opleiding</div><figure class=\"illu\"><svg viewBox=\"0 0 560 356\" role=\"img\" aria-labelledby=\"lr-t lr-d\" font-family=\"'Outfit',system-ui,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n<title id=\"lr-t\">Opbouw van de opleiding</title>\n<desc id=\"lr-d\">De route: introductie, zes inhoudelijke onderwerpen, samenvatting, de eindtoets (ten minste tachtig procent) en het certificaat. De voortgang wordt bewaard, zodat je later kunt verdergaan.</desc>\n<rect x=\"70\" y=\"14\" width=\"420\" height=\"44\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/><text x=\"280\" y=\"41\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Introductie</text>\n<line x1=\"280\" y1=\"58\" x2=\"280\" y2=\"72\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/><path d=\"M273 66l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<rect x=\"70\" y=\"74\" width=\"420\" height=\"44\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/><text x=\"280\" y=\"101\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Zes inhoudelijke onderwerpen</text>\n<line x1=\"280\" y1=\"118\" x2=\"280\" y2=\"132\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/><path d=\"M273 126l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<rect x=\"70\" y=\"134\" width=\"420\" height=\"44\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/><text x=\"280\" y=\"161\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Samenvatting</text>\n<line x1=\"280\" y1=\"178\" x2=\"280\" y2=\"192\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/><path d=\"M273 186l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<rect x=\"70\" y=\"194\" width=\"420\" height=\"44\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw)\" stroke-width=\"2.2\"/><text x=\"280\" y=\"221\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Eindtoets · ten minste 80%</text>\n<line x1=\"280\" y1=\"238\" x2=\"280\" y2=\"252\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/><path d=\"M273 246l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<rect x=\"70\" y=\"254\" width=\"420\" height=\"44\" rx=\"12\" fill=\"var(--groen-licht)\" stroke=\"var(--groen)\" stroke-width=\"2\"/><text x=\"280\" y=\"281\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"var(--groen)\">Certificaat</text>\n<text x=\"280\" y=\"330\" text-anchor=\"middle\" class=\"il-note\" font-style=\"italic\" fill=\"var(--tekst-mid)\">Je voortgang wordt bewaard; je kunt later verdergaan.</text>\n</svg></figure>","kind":"figuur","titel":"Opzet van de opleiding"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>Acht onderwerpen. Daarna volgt de eindtoets. Haal je die, dan krijg je een certificaat.</li><li>Zes inhoudelijke onderwerpen gaan over de achtergrond, de wettelijke bestanddelen, de context, de rechtspraak, het bewijs en het proces-verbaal.</li><li>Theorie, wet, rechtspraak, praktijk en toetsing wisselen elkaar af.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"}],"titel":"Introductie","type":"intro","vragen":[]},{"icoon":"balans","id":"m2","kader":"Art. 429ter Sr","nr":2,"pages":[{"html":"<h2 class=\"ptitle\">Leerdoelen</h2><p class=\"pintro\">Wat je na dit onderwerp kunt.</p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen waarom seksuele intimidatie in het openbaar apart strafbaar is gesteld;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen welke problemen volgens de wetgever aanleiding waren voor de nieuwe wet;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>in grote lijnen uitleggen wat het doel van artikel 429ter Sr is en welke norm de wet duidelijk maakt;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>het verschil uitleggen tussen het doel van de wet en de wettelijke bestanddelen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen waarom je de context en het bewijs zorgvuldig moet beoordelen.</span></li></ul>","kind":"lo","titel":"Leerdoelen"},{"html":"<h2 class=\"ptitle\">Inleiding</h2><div class=\"main\"><p>Seksuele intimidatie in het openbaar is een zelfstandige overtreding. Die overtreding staat in artikel 429ter Sr. Dit artikel is in het Wetboek van Strafrecht gekomen door de Wet seksuele misdrijven.<sup class=\"fn\">1</sup> Het artikel geldt sinds 1 juli 2024.<sup class=\"fn\">2</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Stb. 2024, 59 (Wet seksuele misdrijven).</li><li>Stb. 2024, 61 (inwerkingtredingsbesluit).</li></ol></div>","kind":"theory","titel":"Inleiding"},{"html":"<h2 class=\"ptitle\">Inleiding (vervolg)</h2><div class=\"main\"><p>Dit onderwerp gaat over de achtergrond en het doel van de strafbaarstelling. De delictsomschrijving is de omschrijving van het strafbare feit in de wet. In het volgende onderwerp behandelen we deze delictsomschrijving en de bestanddelen één voor één.</p></div>","kind":"theory","titel":"Inleiding (vervolg)"},{"html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Een herkenbare situatie</h2><p class=\"lees\">Je surveilleert in een drukke winkelstraat. Iemand maakt steeds opmerkingen tegen een voorbijganger. Diegene blijft ook opvallend dicht bij haar lopen. Je ziet dat de voorbijganger zich zichtbaar ongemakkelijk voelt. De vraag is dan: welke rol speelt het strafrecht in zo'n situatie?</p>","kind":"casus","titel":"Een herkenbare situatie"},{"html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Een herkenbare situatie — betekenis</h2><div class=\"kaart k-voorbeeld\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/></svg></span><span class=\"kaart-lab\">Voorbeeld</span></div><div class=\"kaart-t\">Betekenis voor de praktijk</div><div class=\"kaart-b\"><p>In dit onderwerp geven we nog geen juridisch eindoordeel over deze situatie. Je leert hier eerst de achtergrond en het doel van de strafbaarstelling. Dat is het kader. In de volgende onderwerpen toets je zulke situaties aan de bestanddelen en aan de context.</p></div></div>","kind":"casus","titel":"Een herkenbare situatie — betekenis"},{"html":"<h2 class=\"ptitle\">Achtergrond in de samenleving</h2><div class=\"main\"><p>Veel mensen krijgen te maken met seksuele intimidatie. Dat gebeurt in de openbare ruimte en online. Tegelijk beseffen steeds meer mensen in de samenleving hoe vaak dit voorkomt en hoe schadelijk het is.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 10.</li></ol></div>","kind":"theory","titel":"Achtergrond in de samenleving"},{"html":"<h2 class=\"ptitle\">Achtergrond in de samenleving (vervolg)</h2><div class=\"main\"><p>De toelichting onderbouwt dit met cijfers van het Centraal Bureau voor de Statistiek. Die cijfers laten zien dat straatintimidatie vaak voorkomt. Vooral jonge vrouwen krijgen ermee te maken.<sup class=\"fn\">1</sup> Let op: het gaat om straatintimidatie zoals mensen die zelf hebben ervaren. Dat is niet hetzelfde als een bewezen strafbaar feit in de zin van artikel 429ter Sr.</p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 5–6.</li></ol></div>","kind":"theory","titel":"Achtergrond in de samenleving (vervolg)"},{"html":"<h2 class=\"ptitle\">Achtergrond in de samenleving (vervolg)</h2><div class=\"main\"><p>De wetgever gaat uit van een sociale norm. Die norm is: iedereen moet zich vrij en ongehinderd in het openbaar kunnen bewegen, zonder angst voor ongewenste seksuele toenadering. Seksuele intimidatie tast die sociale veiligheid aan.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 10.</li></ol></div>","kind":"theory","titel":"Achtergrond in de samenleving (vervolg)"},{"html":"<h2 class=\"ptitle\">Waarom een aparte strafbaarstelling?</h2><div class=\"main\"><p>Vóór deze wet had seksuele intimidatie in de openbare ruimte geen duidelijke, eigen plaats in het Wetboek van Strafrecht. Daarom moesten verschillende wetsartikelen worden gebruikt om dit gedrag te vervolgen.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 10.</li></ol></div>","kind":"theory","titel":"Waarom een aparte strafbaarstelling?"},{"html":"<h2 class=\"ptitle\">Waarom een aparte strafbaarstelling? (vervolg)</h2><div class=\"main\"><p>Er zijn ook regelingen in het civiele recht en het arbeidsrecht. Volgens de wetgever losten die regels het probleem niet goed genoeg op. Ook maakten ze niet duidelijk waarom dit gedrag strafbaar moest zijn.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 11.</li></ol></div>","kind":"theory","titel":"Waarom een aparte strafbaarstelling? (vervolg)"},{"html":"<h2 class=\"ptitle\">Waarom een aparte strafbaarstelling? (vervolg)</h2><div class=\"main\"><p>Ook regels van gemeenten boden geen goede oplossing. Rotterdam had straatintimidatie verboden in de lokale verordening. Het gerechtshof Den Haag oordeelde dat deze regel onverbindend was. Dat betekent dat de regel niet mocht worden toegepast. Iemand kon daarom niet op basis van deze regel worden gestraft.</p><p>Het hof gaf daarvoor twee redenen. Ten eerste beperkt zo’n verbod de vrijheid van meningsuiting. Alleen de regering en het parlement mogen samen zo’n beperking in een wet vastleggen. Een gemeente mag dit dus niet zelf regelen. Ten tweede was uit de tekst niet duidelijk genoeg welk gedrag precies verboden was.</p><p>Daarom kon seksuele straatintimidatie niet goed worden aangepakt met alleen een regel van de gemeente.</p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Hof Den Haag 19 december 2019, ECLI:NL:GHDHA:2019:3293.</li></ol></div>","kind":"theory","titel":"Waarom een aparte strafbaarstelling? (vervolg)"},{"html":"<h2 class=\"ptitle\">Waarom een aparte strafbaarstelling? (vervolg)</h2><div class=\"main\"><p>De wetgever legt uit dat alleen regels van gemeenten geen goede juridische oplossing boden.<sup class=\"fn\">1</sup></p><p>Het Wetboek van Strafrecht is een wet in formele zin. Dat betekent dat de regering en het parlement deze wet samen hebben gemaakt. Daarom koos de wetgever voor een aparte strafbaarstelling die in heel Nederland geldt.<sup class=\"fn\">2</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 11.</li><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 26.</li></ol></div>","kind":"theory","titel":"Waarom een aparte strafbaarstelling? (vervolg)"},{"html":"<h2 class=\"ptitle\">Juridisch kader</h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span class=\"kaart-lab\">Juridisch kader</span></div><div class=\"kaart-t\">Artikel 429ter Sr · Wetboek van Strafrecht</div><div class=\"kaart-b\"><p class=\"law-intro\">Artikel 429ter Sr is de strafbaarstelling van seksuele intimidatie in het openbaar. Dit is het artikel waarmee je als opsporingsambtenaar in de praktijk werkt. Het geldt sinds 1 juli 2024.</p><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/></svg></span><span>Wettekst</span></div><p class=\"wet law-text\">«Degene die <mark class=\"law-part\">in het openbaar</mark> een ander <mark class=\"law-part\">indringend seksueel benadert</mark> door middel van <mark class=\"law-part\">opmerkingen, gebaren, geluiden of aanrakingen</mark> op een wijze die <mark class=\"law-part\">vreesaanjagend, vernederend, kwetsend of onterend</mark> is te achten, wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete van de derde categorie.»<sup class=\"fn\">1</sup></p></div><div class=\"law-grid\"><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span>Wat betekent dit?</span></div><p>Het gaat om een overtreding. Het artikel staat in het Derde Boek, Titel II, van het Wetboek van Strafrecht.</p></section><section class=\"law-mini\"><div class=\"law-mini-head\"><span class=\"law-mini-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/></svg></span><span>Belangrijk voor de praktijk</span></div><p>Het artikel beschrijft welk gedrag onder bepaalde voorwaarden strafbaar kan zijn. Het kan bijvoorbeeld gaan om opmerkingen, gebaren, geluiden of aanrakingen. Niet elke seksuele opmerking of gedraging is dus automatisch strafbaar. Daarvoor moet aan alle bestanddelen van artikel 429ter Sr zijn voldaan.</p></section></div><div class=\"law-definition\"><span class=\"law-definition-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><p><strong>Bestanddelen</strong> zijn de onderdelen die aanwezig moeten zijn voordat er sprake is van het delict. We leggen ze in het volgende onderwerp stap voor stap uit.</p></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Artikel 429ter Sr (Wetboek van Strafrecht), geldend vanaf 1 juli 2024; Stb. 2024, 59.</li></ol></div>","kind":"kader","titel":"Juridisch kader"},{"html":"<h2 class=\"ptitle\">Wettelijke inbedding</h2><div class=\"main\"><p>Artikel 429ter Sr is een overtreding. Het artikel staat in het Derde Boek, Titel II, van het Wetboek van Strafrecht. Die titel gaat over overtredingen betreffende de openbare orde.<sup class=\"fn\">1</sup></p><p>Het artikel geldt sinds 1 juli 2024. Een apart besluit bepaalde deze ingangsdatum.<sup class=\"fn\">2</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 26.</li><li>Stb. 2024, 61 (inwerkingtredingsbesluit).</li></ol></div>","kind":"theory","titel":"Wettelijke inbedding"},{"html":"<h2 class=\"ptitle\">Doel van de strafbaarstelling</h2><div class=\"main\"><p>De wetgever wil met de strafbaarstelling een norm nadrukkelijk duidelijk maken. Die norm is: seksueel intimiderend gedrag in de openbare ruimte is niet aanvaardbaar.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 26.</li></ol></div>","kind":"theory","titel":"Doel van de strafbaarstelling"},{"html":"<h2 class=\"ptitle\">Doel van de strafbaarstelling (vervolg)</h2><div class=\"main\"><p>Het artikel maakt strafrechtelijk optreden mogelijk als aan de wettelijke voorwaarden is voldaan. Daarnaast heeft deze strafbaarstelling twee andere functies.</p><p>De wetgever maakt er duidelijk mee dat seksueel intimiderend gedrag in het openbaar niet wordt geaccepteerd en strafbaar kan zijn. Dit heet de normerende functie: de wet maakt de norm duidelijk. Ook moet de strafbaarstelling mensen ontmoedigen om dit gedrag te vertonen. Dit heet de preventieve functie: de wet probeert het gedrag te voorkomen. Het artikel geeft dus een signaal aan mogelijke daders. De wetgever hoopt dat mensen zich hier meer bewust van worden. Dat kan op termijn helpen om gedrag te veranderen. Zo kan er minder seksuele intimidatie komen.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 12.</li></ol></div>","kind":"theory","titel":"Doel van de strafbaarstelling (vervolg)"},{"html":"<h2 class=\"ptitle\">Doel van de strafbaarstelling (vervolg)</h2><div class=\"main\"><p>Een strafbaarstelling werkt alleen als er in de praktijk ook echt wordt opgetreden tegen strafbaar gedrag. De regering vindt effectieve handhaving daarom van groot belang. Door op te treden laat je zien dat dit gedrag niet wordt geaccepteerd. Zo krijgt het artikel betekenis in de praktijk en worden mensen ervan weerhouden om dit gedrag te vertonen.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 50.</li></ol></div>","kind":"theory","titel":"Doel van de strafbaarstelling (vervolg)"},{"html":"<h2 class=\"ptitle\">Beschermd belang</h2><div class=\"main\"><p>Een strafbepaling wil een bepaald belang beschermen. Artikel 429ter Sr beschermt de vrijheid en veiligheid van mensen in de openbare ruimte.<sup class=\"fn\">1</sup><sup class=\"fn\">2</sup> Het woord ‘verkeren’ betekent hier dat je ergens bent of je daar beweegt.</p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 116.</li><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 12.</li></ol></div>","kind":"theory","titel":"Beschermd belang"},{"html":"<h2 class=\"ptitle\">Beschermd belang (vervolg)</h2><div class=\"main\"><p>De kern van het verwijt is dat iemand in een openbare omgeving tegen zijn of haar wil als seksueel object wordt benaderd.<sup class=\"fn\">1</sup></p><p>De bescherming geldt in de fysieke openbare ruimte. Ze geldt ook in online omgevingen die voor een breed publiek toegankelijk zijn.<sup class=\"fn\">2</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 12.</li><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 13.</li></ol></div>","kind":"theory","titel":"Beschermd belang (vervolg)"},{"html":"<h2 class=\"ptitle\">Wanneer kan de strafbepaling gelden?</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Wanneer kan de strafbepaling gelden?</div><div class=\"kaart-b\"><p>Niet elke seksueel getinte opmerking of benadering is strafbaar. Met het bestanddeel «indringend» legt de wetgever een ondergrens vast. Er moet sprake zijn van een sterk opdringerige benadering met een intimiderend effect. Respectvol contact leggen of flirten valt daar niet onder.<sup class=\"fn\">1</sup> In het volgende onderwerp behandelen we de bestanddelen één voor één.</p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 46 en 49.</li></ol></div>","kind":"kaart","titel":"Wanneer kan de strafbepaling gelden?"},{"html":"<h2 class=\"ptitle\">Betekenis voor de opsporingsambtenaar</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Betekenis voor de opsporingsambtenaar</div><div class=\"kaart-b\"><p>De achtergrond en het doel van de strafbaarstelling komen niet in de plaats van de wettelijke bestanddelen. Je moet in iedere zaak apart vaststellen of aan de bestanddelen is voldaan.</p></div></div>","kind":"kaart","titel":"Betekenis voor de opsporingsambtenaar"},{"html":"<h2 class=\"ptitle\">Betekenis voor de opsporingsambtenaar (vervolg)</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Betekenis voor de opsporingsambtenaar</div><div class=\"kaart-b\"><p>De wetsgeschiedenis bestaat uit documenten waarin de wetgever de wet uitlegt. Daarin staat dat optreden vaak zal gebeuren bij heterdaad. Dat betekent dat een opsporingsambtenaar het feit ziet gebeuren. Dat geldt ook als een opsporingsambtenaar of buitengewoon opsporingsambtenaar het zelf waarneemt, en als er steun is van getuigen of camerabeelden.<sup class=\"fn\">1</sup> Leg de omstandigheden daarom zorgvuldig en feitelijk vast.</p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 12.</li></ol></div>","kind":"kaart","titel":"Betekenis voor de opsporingsambtenaar (vervolg)"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>Seksuele intimidatie in het openbaar is een zelfstandige overtreding in artikel 429ter Sr. Dat is geregeld in de Wet seksuele misdrijven. Het artikel geldt vanaf 1 juli 2024.</li><li>Er waren twee redenen voor de nieuwe wet. De bestaande regels waren niet voldoende. Ook mocht de lokale regel van Rotterdam niet worden toegepast.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>De bepaling beschermt het vrij en veilig verkeren in de openbare ruimte. De wet maakt de norm duidelijk en probeert dit gedrag te voorkomen.</li><li>De achtergrond en het doel van de wetgever zijn niet hetzelfde als de wettelijke bewijsvoorwaarden.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Vooruitblik: Wettelijke bestanddelen</h2><div class=\"main\"><p>Het volgende onderwerp heet wettelijke bestanddelen. Daarin halen we de delictsomschrijving uit elkaar. Je leert welke onderdelen je moet vaststellen.</p><p>Daarbij komen deze begrippen aan bod: «indringend», «seksueel benaderen», het geobjectiveerde criterium «vreesaanjagend, vernederend, kwetsend of onterend» en «in het openbaar».</p></div>","kind":"theory","titel":"Vooruitblik: Wettelijke bestanddelen"}],"titel":"Achtergrond en doel van de strafbaarstelling","type":"content","vragen":[{"artikel":"Art. 429ter Sr","juist":2,"kernregel":"Seksuele intimidatie in het openbaar had geen eigen plaats in het Wetboek van Strafrecht. Ook mocht de lokale regel van Rotterdam niet worden toegepast. Daarom kwam er een aparte strafbaarstelling.","opties":["Omdat de bestaande regels dit gedrag al helemaal strafbaar stelden, maar bijna nooit werden gebruikt.","Omdat gemeenten dit gedrag wel mochten verbieden, maar allemaal andere regels gebruikten.","Omdat het gedrag geen eigen plaats had in het Wetboek van Strafrecht en de lokale regel van Rotterdam niet mocht worden toegepast.","Omdat alleen de regering zonder het parlement nieuw gedrag strafbaar mag stellen."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is C. Seksuele intimidatie in het openbaar had geen duidelijke eigen plaats in het Wetboek van Strafrecht. Daardoor werden verschillende wetsartikelen gebruikt. Rotterdam had een eigen verbod in de lokale verordening. Het gerechtshof oordeelde dat deze regel onverbindend was. Dat betekent dat de regel niet mocht worden toegepast. Een beperking van de vrijheid van meningsuiting moet worden vastgelegd in een wet die de regering en het parlement samen maken.[[1]] In de andere antwoorden staat steeds iets dat niet klopt.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 10–11."],"vraag":"Waarom heeft de wetgever seksuele intimidatie in het openbaar apart strafbaar gesteld?","wet":"Wetboek van Strafrecht"},{"artikel":"Art. 429ter Sr","juist":0,"kernregel":"Artikel 429ter Sr is niet alleen bedoeld om strafbaar gedrag te bestraffen. De wet maakt ook de norm duidelijk en probeert dit gedrag te voorkomen.","opties":["De wet maakt de norm duidelijk en probeert het gedrag te voorkomen.","De wet heeft alleen een symbolische betekenis en is niet bedoeld om te handhaven.","De wet maakt het bewijs automatisch voldoende zodra iemand aangifte doet.","De wet verplicht het Openbaar Ministerie om iedere melding te vervolgen."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is A. De strafbaarstelling heeft een normerende en een preventieve functie. Normerend betekent dat de wet duidelijk maakt welk gedrag niet wordt geaccepteerd. Preventief betekent dat de wet probeert te voorkomen dat mensen dit gedrag vertonen.[[1]][[2]] Goed optreden in de praktijk helpt om deze norm duidelijk te maken.[[3]] De wet maakt het bewijs niet automatisch voldoende. Het Openbaar Ministerie is ook niet verplicht om iedere melding te vervolgen.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 12.","Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 26.","Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 50."],"vraag":"Welke andere doelen heeft artikel 429ter Sr naast het straffen van gedrag?","wet":"Wetboek van Strafrecht"},{"artikel":"Art. 429ter Sr","juist":3,"kernregel":"Artikel 429ter Sr beschermt de vrijheid en veiligheid van mensen in de openbare ruimte.","opties":["Dat het gezag in de openbare ruimte zonder problemen kan werken.","De eerbaarheid en de goede zeden als belangrijkste belangen van de oude zedendelicten.","Alleen de lichamelijke veiligheid tegen ongewenste seksuele aanrakingen.","Dat mensen zich vrij en veilig in de openbare ruimte kunnen bevinden en bewegen."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is D. Mensen moeten zich vrij en veilig in de openbare ruimte kunnen bevinden en bewegen. De kern van het verwijt is dat iemand daar tegen zijn of haar wil als seksueel object wordt benaderd.[[1]][[2]] Het gaat niet vooral om het gezag, de goede zeden of alleen om lichamelijke veiligheid. Ook opmerkingen, gebaren en geluiden kunnen namelijk onder de strafbepaling vallen.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 12.","Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 116."],"vraag":"Welk belang wil artikel 429ter Sr volgens de wetgever vooral beschermen?","wet":"Wetboek van Strafrecht"},{"artikel":"Art. 429ter Sr","juist":1,"kernregel":"Het doel van de wet bepaalt niet of een bepaalde situatie strafbaar is. Daarvoor moet aan alle wettelijke bestanddelen zijn voldaan.","opties":["Ja. Het gevoel van het slachtoffer is altijd voldoende om het gedrag strafbaar te maken.","Nee. Je moet in iedere zaak apart vaststellen of aan alle wettelijke bestanddelen is voldaan.","Gedeeltelijk. Het gevoel van het slachtoffer is beslissend als die persoon aangifte doet.","Nee. De verdachte is alleen strafbaar als hij of zij de bedoeling had om te intimideren."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is B. Het doel van de wet legt uit waarom dit gedrag strafbaar is gesteld. Voor een bepaalde zaak moet je alle wettelijke bestanddelen apart beoordelen. Er moet bijvoorbeeld sprake zijn van een indringende seksuele benadering.[[1]] Alleen het gevoel van het slachtoffer is niet beslissend. Een aangifte verandert dat niet. Ook hoef je niet te bewijzen dat de verdachte de bedoeling had om de ander te intimideren.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 46 en 49."],"vraag":"Een collega zegt: ‘Zodra iemand zich geïntimideerd voelt, is artikel 429ter Sr overtreden.’ Klopt dat?","wet":"Wetboek van Strafrecht"}]},{"icoon":"wet","id":"m3","kader":"Art. 429ter Sr","nr":3,"pages":[{"html":"<h2 class=\"ptitle\">Leerdoelen</h2><p class=\"pintro\">Wat je na dit onderwerp kunt.</p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>de wettelijke bestanddelen van artikel 429ter Sr benoemen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen wat «in het openbaar», «indringend» en «seksueel benaderen» inhouden;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>herkennen om welke gedragingen het kan gaan: opmerkingen, gebaren, geluiden en aanrakingen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen wat het geobjectiveerde criterium betekent: je beoordeelt het gedrag volgens algemene maatstaven;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>benoemen dat opzet of schuld niet hoeft te worden bewezen.</span></li></ul>","kind":"lo","titel":"Leerdoelen"},{"html":"<h2 class=\"ptitle\">Introductie: van achtergrond naar bestanddelen</h2><div class=\"main\"><p>Het vorige onderwerp ging over de achtergrond en het doel van de strafbaarstelling. In dit onderwerp halen we de delictsomschrijving uit elkaar. Je leert welke onderdelen aanwezig moeten zijn voordat er sprake is van het delict. Die onderdelen heten bestanddelen.</p><p>Alle bestanddelen moeten vervuld zijn. Ontbreekt er één bestanddeel, dan is het delict niet voltooid. Hierna bespreken we de bestanddelen één voor één.</p></div>","kind":"theory","titel":"Introductie: van achtergrond naar bestanddelen"},{"html":"<h2 class=\"ptitle\">Juridisch kader</h2><div class=\"kaart k-kader law-card\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><span class=\"kaart-lab\">Juridisch kader</span></div><div class=\"kaart-t\">Artikel 429ter Sr · Wetboek van Strafrecht</div><div class=\"kaart-b\"><div class=\"law-quote\"><div class=\"law-quote-head\"><span class=\"law-quote-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z\"/><path d=\"M18 3v18\"/></svg></span><span>Wettekst</span></div><p class=\"wet law-text\">«Degene die <mark class=\"law-part\">in het openbaar</mark> een ander <mark class=\"law-part\">indringend seksueel benadert</mark> door middel van <mark class=\"law-part\">opmerkingen, gebaren, geluiden of aanrakingen</mark> op een wijze die <mark class=\"law-part\">vreesaanjagend, vernederend, kwetsend of onterend</mark> is te achten, wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete van de derde categorie.»<sup class=\"fn\">1</sup></p></div><div class=\"law-definition\"><span class=\"law-definition-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4M10 12h5M10 16h5\"/></svg></span><p>Hierna bespreken we de bestanddelen van deze bepaling één voor één.</p></div></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Artikel 429ter Sr (Wetboek van Strafrecht), geldend vanaf 1 juli 2024.</li></ol></div>","kind":"kader","titel":"Juridisch kader"},{"html":"<h2 class=\"ptitle\">Bestanddeel 1: «in het openbaar»</h2><div class=\"main\"><p>Het bestanddeel «in het openbaar» gaat over de plaats waar het feit gebeurt. De juridische term daarvoor is pleegplaats. Denk aan de openbare weg, het openbaar vervoer of een gebouw dat voor het publiek toegankelijk is, zoals een winkel of een uitgaansgelegenheid.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 116.</li></ol></div>","kind":"theory","titel":"Bestanddeel 1: «in het openbaar»"},{"html":"<h2 class=\"ptitle\">Bestanddeel 1: «in het openbaar» (vervolg)</h2><div class=\"main\"><p>Dit bestanddeel geldt niet alleen op een fysieke plaats. Het kan ook gelden op internet. De online omgeving moet dan voor veel mensen toegankelijk zijn. Denk bijvoorbeeld aan een openbaar bericht op sociale media.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 116.</li></ol></div>","kind":"theory","titel":"Bestanddeel 1: «in het openbaar» (vervolg)"},{"html":"<h2 class=\"ptitle\">Bestanddeel 1: «in het openbaar» (vervolg)</h2><div class=\"main\"><p>Het gaat om fysieke en online plaatsen die voor veel mensen toegankelijk zijn. Een besloten of afgeschermde online groep is niet openbaar.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 54.</li></ol></div>","kind":"theory","titel":"Bestanddeel 1: «in het openbaar» (vervolg)"},{"html":"<h2 class=\"ptitle\">Bestanddeel 2: «een ander indringend seksueel benaderen»</h2><div class=\"main\"><p>Het woord «indringend» geeft aan wanneer de seksuele benadering ernstig genoeg kan zijn voor deze strafbepaling. De benadering moet een bepaalde intensiteit hebben. Dat betekent dat iemand op een sterk overheersende en opdringerige manier contact zoekt. Gewoon contact leggen en flirten vallen daar niet onder.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114.</li></ol></div>","kind":"theory","titel":"Bestanddeel 2: «een ander indringend seksueel benaderen»"},{"html":"<h2 class=\"ptitle\">Bestanddeel 2: «een ander indringend seksueel benaderen» (vervolg)</h2><div class=\"main\"><p>Eén keer nafluiten is op zichzelf nog geen indringende benadering. Dat geldt ook voor een compliment over iemands uiterlijk.<sup class=\"fn\">1</sup> Respectvol flirten valt er ook niet onder.<sup class=\"fn\">2</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 53.</li><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 46.</li></ol></div>","kind":"theory","titel":"Bestanddeel 2: «een ander indringend seksueel benaderen» (vervolg)"},{"html":"<h2 class=\"ptitle\">Bestanddeel 2: «een ander indringend seksueel benaderen» (vervolg)</h2><div class=\"main\"><p>Het bestanddeel «seksueel» betekent dat de handeling een seksuele lading heeft. Bij opmerkingen, gebaren of geluiden blijkt die seksuele lading meestal uit wat iemand zegt of doet. Het totaalbeeld is daarbij beslissend.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114.</li></ol></div>","kind":"theory","titel":"Bestanddeel 2: «een ander indringend seksueel benaderen» (vervolg)"},{"html":"<h2 class=\"ptitle\">Bestanddeel 2: «een ander indringend seksueel benaderen» (vervolg)</h2><div class=\"main\"><p>De benadering is gericht op «een ander». Dat kan één persoon zijn, maar ook meerdere personen tegelijk.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 49.</li></ol></div>","kind":"theory","titel":"Bestanddeel 2: «een ander indringend seksueel benaderen» (vervolg)"},{"html":"<h2 class=\"ptitle\">Bestanddeel 3: «door opmerkingen, gebaren, geluiden of aanrakingen»</h2><div class=\"main\"><p>De seksuele benadering gebeurt door opmerkingen, gebaren, geluiden of aanrakingen. Dat kan om één vorm gaan. Het kan ook om een combinatie van deze vormen gaan.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114.</li></ol></div>","kind":"theory","titel":"Bestanddeel 3: «door opmerkingen, gebaren, geluiden of aanrakingen»"},{"html":"<h2 class=\"ptitle\">Bestanddeel 3: «door opmerkingen, gebaren, geluiden of aanrakingen» (vervolg)</h2><div class=\"main\"><p>Bij geluiden kun je denken aan het nafluiten van een ander. Ook het zogenoemde sissen of klakken hoort hierbij. Bij aanrakingen gaat het om korte gedragingen met weinig lichamelijk contact.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 115.</li></ol></div>","kind":"theory","titel":"Bestanddeel 3: «door opmerkingen, gebaren, geluiden of aanrakingen» (vervolg)"},{"html":"<h2 class=\"ptitle\">Bestanddeel 3: «door opmerkingen, gebaren, geluiden of aanrakingen» (vervolg)</h2><div class=\"main\"><p>Het aanraken van seksuele lichaamsdelen valt niet onder deze overtreding. Zo'n aanraking kan wel onder een zwaarder delict vallen, zoals aanranding.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114-115.</li></ol></div>","kind":"theory","titel":"Bestanddeel 3: «door opmerkingen, gebaren, geluiden of aanrakingen» (vervolg)"},{"html":"<h2 class=\"ptitle\">Bestanddeel 4: «vreesaanjagend, vernederend, kwetsend of onterend» (geobjectiveerd)</h2><div class=\"main\"><p>De benadering moet gebeuren op een manier die «vreesaanjagend, vernederend, kwetsend of onterend is te achten». Dit criterium is geobjectiveerd. Dat betekent dat je het gedrag beoordeelt volgens algemene maatstaven.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 115.</li></ol></div>","kind":"theory","titel":"Bestanddeel 4: «vreesaanjagend, vernederend, kwetsend of onterend» (geobjectiveerd)"},{"html":"<h2 class=\"ptitle\">Bestanddeel 4: «vreesaanjagend, vernederend, kwetsend of onterend» (geobjectiveerd) (vervolg)</h2><div class=\"main\"><p>Je beoordeelt volgens algemene maatstaven of de benadering intimiderend is. Het is niet nodig dat de dader dit zo heeft bedoeld. Ook hoef je niet te bewijzen dat het slachtoffer de benadering zelf zo heeft ervaren. Het genoemde gevolg hoeft niet echt te zijn ontstaan.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 47 en p. 55.</li></ol></div>","kind":"theory","titel":"Bestanddeel 4: «vreesaanjagend, vernederend, kwetsend of onterend» (geobjectiveerd) (vervolg)"},{"html":"<h2 class=\"ptitle\">Context kleurt de bestanddelen in</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Context kleurt de bestanddelen in</div><div class=\"kaart-b\"><p>Inhoud en context beïnvloeden elkaar. Is de inhoud op zichzelf niet genoeg? Dan kan de context de benadering alsnog strafbaar maken.<sup class=\"fn\">1</sup> Omstandigheden zoals de duur, hoe vaak het gebeurt en de plaats spelen daarbij een rol.<sup class=\"fn\">2</sup></p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 117.</li><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 47.</li></ol></div>","kind":"kaart","titel":"Context kleurt de bestanddelen in"},{"html":"<h2 class=\"ptitle\">Context kleurt de bestanddelen in (vervolg)</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Context kleurt de bestanddelen in</div><div class=\"kaart-b\"><p>Neem dezelfde gedraging op twee plekken. Op een plein bij daglicht valt die gedraging niet onder de delictsomschrijving. In een smal steegje in het donker kan dezelfde gedraging wél een indringende seksuele benadering zijn.<sup class=\"fn\">1</sup> De uitgebreide contextbeoordeling behandelen we in het volgende onderwerp.</p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 54.</li></ol></div>","kind":"kaart","titel":"Context kleurt de bestanddelen in (vervolg)"},{"html":"<h2 class=\"ptitle\">Geen opzet of schuld nodig; strafmaat</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Geen opzet of schuld nodig; strafmaat</div><div class=\"kaart-b\"><p>Artikel 429ter Sr is een overtreding. De wet noemt opzet en schuld niet als bestanddeel. Je hoeft opzet of schuld daarom niet te bewijzen.<sup class=\"fn\">1</sup></p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114.</li></ol></div>","kind":"kaart","titel":"Geen opzet of schuld nodig; strafmaat"},{"html":"<h2 class=\"ptitle\">Geen opzet of schuld nodig; strafmaat (vervolg)</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Geen opzet of schuld nodig; strafmaat</div><div class=\"kaart-b\"><p>De straf is ten hoogste drie maanden hechtenis of een geldboete van de derde categorie. De wetgever heeft bewust voor dit maximum gekozen. Het ligt hoger dan bij sommige andere overtredingen die overlast geven in de openbare ruimte.<sup class=\"fn\">1</sup></p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114.</li></ol></div>","kind":"kaart","titel":"Geen opzet of schuld nodig; strafmaat (vervolg)"},{"html":"<div class=\"figcap\">Bestanddelen-checklist</div><figure class=\"illu\"><svg viewBox=\"0 0 560 408\" role=\"img\" aria-labelledby=\"bd-t bd-d\" font-family=\"'Outfit',system-ui,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n<title id=\"bd-t\">Wettelijke bestanddelen van artikel 429ter Sr</title>\n<desc id=\"bd-d\">Er zijn vier bestanddelen. Ze moeten alle vier de bestanddelen vervuld zijn. Eén: in het openbaar. Twee: een ander indringend seksueel benaderen. Drie: door opmerkingen, gebaren, geluiden of aanrakingen. Vier: de benadering is volgens algemene maatstaven vreesaanjagend, vernederend, kwetsend óf onterend. Zijn alle vier de bestanddelen vervuld, dan is het delict voltooid. Ontbreekt er één bestanddeel, dan is het delict niet voltooid.</desc>\n<rect x=\"20\" y=\"14\" width=\"520\" height=\"56\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.7\"/><circle cx=\"50\" cy=\"42\" r=\"15\" fill=\"var(--blauw)\"/><text x=\"50\" y=\"47\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--wit)\">1</text><text x=\"78\" y=\"39\" font-size=\"21\" font-weight=\"600\" fill=\"currentColor\">In het openbaar</text><text x=\"78\" y=\"60\" class=\"il-sub\" fill=\"var(--tekst-mid)\">fysiek of online</text>\n<rect x=\"20\" y=\"78\" width=\"520\" height=\"56\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.7\"/><circle cx=\"50\" cy=\"106\" r=\"15\" fill=\"var(--blauw)\"/><text x=\"50\" y=\"111\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--wit)\">2</text><text x=\"78\" y=\"103\" font-size=\"21\" font-weight=\"600\" fill=\"currentColor\">Indringend seksueel benaderen</text><text x=\"78\" y=\"124\" class=\"il-sub\" fill=\"var(--tekst-mid)\">een zekere intensiteit; niet elk contact</text>\n<rect x=\"20\" y=\"142\" width=\"520\" height=\"56\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.7\"/><circle cx=\"50\" cy=\"170\" r=\"15\" fill=\"var(--blauw)\"/><text x=\"50\" y=\"175\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--wit)\">3</text><text x=\"78\" y=\"167\" font-size=\"21\" font-weight=\"600\" fill=\"currentColor\">Door een gedraging</text><text x=\"78\" y=\"188\" class=\"il-sub4\" fill=\"var(--tekst-mid)\">opmerkingen · gebaren · geluiden · aanrakingen</text>\n<rect x=\"20\" y=\"206\" width=\"520\" height=\"56\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.7\"/><circle cx=\"50\" cy=\"234\" r=\"15\" fill=\"var(--blauw)\"/><text x=\"50\" y=\"239\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--wit)\">4</text><text x=\"78\" y=\"231\" font-size=\"21\" font-weight=\"600\" fill=\"currentColor\">Geobjectiveerd criterium</text><text x=\"78\" y=\"252\" class=\"il-sub4\" fill=\"var(--tekst-mid)\">vreesaanjagend · vernederend · kwetsend · onterend</text>\n<line x1=\"280\" y1=\"262\" x2=\"280\" y2=\"300\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/>\n<path d=\"M273 294l7 8 7-8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<rect x=\"198\" y=\"269\" width=\"164\" height=\"26\" rx=\"13\" fill=\"var(--wit)\" stroke=\"var(--grijs-mid)\" stroke-width=\"1.5\"/>\n<text x=\"280\" y=\"286\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--tekst-mid)\">alle vier de bestanddelen vervuld</text>\n<rect x=\"20\" y=\"308\" width=\"520\" height=\"64\" rx=\"14\" fill=\"var(--groen-licht)\" stroke=\"var(--groen)\" stroke-width=\"2\"/>\n<circle cx=\"58\" cy=\"340\" r=\"19\" fill=\"var(--groen)\"/>\n<path d=\"M67 334l-11 11-5-5\" fill=\"none\" stroke=\"var(--wit)\" stroke-width=\"2.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<text x=\"90\" y=\"335\" font-size=\"22\" font-weight=\"800\" fill=\"var(--groen)\">Delict voltooid</text>\n<text x=\"90\" y=\"359\" class=\"il-sub\" fill=\"var(--tekst-mid)\">art. 429ter Sr · strafbaar</text>\n<line x1=\"28\" y1=\"384\" x2=\"40\" y2=\"396\" stroke=\"var(--rood)\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>\n<line x1=\"40\" y1=\"384\" x2=\"28\" y2=\"396\" stroke=\"var(--rood)\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>\n<text x=\"54\" y=\"395\" class=\"il-note\" fill=\"var(--rood)\">Ontbreekt er één bestanddeel, dan is het delict niet voltooid.</text>\n</svg></figure>","kind":"figuur","titel":"Bestanddelen-checklist"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-t\">Bestanddelen-checklist</div><div class=\"kaart-b\"><ul class=\"punten\"><li>«In het openbaar» geldt ook voor een online omgeving die toegankelijk is voor een breed publiek.</li><li>De seksuele benadering kan bestaan uit opmerkingen, gebaren, geluiden of aanrakingen. Het kan gaan om één van deze gedragingen of om een combinatie. De benadering kan op één of meer personen zijn gericht.</li><li>Alle bestanddelen moeten aanwezig zijn; opzet of schuld hoeft niet te worden bewezen.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Vooruitblik: Contextbeoordeling</h2><div class=\"main\"><p>Het volgende onderwerp heet Contextbeoordeling. Daarin lees je hoe je de omstandigheden van een situatie beoordeelt. Zo bepaal je of aan de bestanddelen is voldaan.</p><p>Dit onderwerp geeft je de bestanddelen. Hoe je duur, frequentie, plaats en andere omstandigheden weegt, komt in het volgende onderwerp aan bod. Er bestaat daarvoor geen regel die in elke situatie dezelfde uitkomst geeft.</p></div>","kind":"theory","titel":"Vooruitblik: Contextbeoordeling"}],"titel":"Wettelijke bestanddelen","type":"content","vragen":[{"artikel":"Art. 429ter Sr","juist":3,"kernregel":"Het delict is pas voltooid als alle bestanddelen van artikel 429ter Sr aanwezig zijn.","opties":["Zodra de benadering vreesaanjagend is, zijn automatisch alle bestanddelen aanwezig.","Het delict is voltooid na iedere seksuele opmerking die in het openbaar wordt gemaakt.","Een indringende benadering is genoeg, ook als de benadering niet seksueel is.","Alle bestanddelen moeten aanwezig zijn. Ontbreekt er één, dan is het delict niet voltooid."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is D. Het delict kent vier bestanddelen. Het gedrag vindt plaats in het openbaar. De verdachte benadert een ander indringend en seksueel. Dit gebeurt door opmerkingen, gebaren, geluiden of aanrakingen. De benadering is volgens algemene maatstaven vreesaanjagend, vernederend, kwetsend óf onterend.[[1]] Alle bestanddelen moeten aanwezig zijn. De andere antwoorden laten één of meer bestanddelen weg.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114."],"vraag":"Welke stelling over de bestanddelen van artikel 429ter Sr is juist?","wet":"Wetboek van Strafrecht"},{"artikel":"Art. 429ter Sr","juist":0,"kernregel":"Het criterium is geobjectiveerd. Je beoordeelt het gedrag volgens algemene maatstaven. De bedoeling van de verdachte en de persoonlijke ervaring van het slachtoffer zijn niet beslissend.","opties":["Je beoordeelt het gedrag volgens algemene maatstaven. De bedoeling van de verdachte en de persoonlijke ervaring van het slachtoffer zijn niet beslissend.","Het slachtoffer moet laten zien dat hij of zij zich door het gedrag echt geïntimideerd voelde.","De verdachte moet de bedoeling hebben gehad om de ander te intimideren.","De persoonlijke mening van de opsporingsambtenaar bepaalt of het gedrag intimiderend was."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is A. Het criterium is geobjectiveerd. Dit betekent dat je het gedrag beoordeelt volgens algemene maatstaven. Je hoeft niet te bewijzen dat de verdachte de ander wilde intimideren. Ook hoef je niet te bewijzen dat het slachtoffer zich echt geïntimideerd voelde.[[1]][[2]] De persoonlijke mening van de opsporingsambtenaar is ook niet beslissend.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 115.","Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 47 en 55."],"vraag":"Wat betekent het dat het criterium «vreesaanjagend, vernederend, kwetsend of onterend is te achten» geobjectiveerd is?","wet":"Wetboek van Strafrecht"},{"artikel":"Art. 429ter Sr","juist":2,"kernregel":"‘In het openbaar’ kan ook gaan over een online omgeving die voor veel mensen toegankelijk is.","opties":["Nee. ‘In het openbaar’ gaat alleen over fysieke plaatsen.","Ja. Ieder bericht op sociale media is openbaar, ook als maar enkele mensen het kunnen zien.","Ja. De online omgeving moet dan voor veel mensen toegankelijk zijn en vergelijkbaar zijn met een openbare plaats.","Ja. Ook een besloten groep is openbaar zodra meer dan twee mensen kunnen meelezen."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is C. ‘In het openbaar’ gaat niet alleen over fysieke plaatsen. Het kan ook gaan over een online omgeving. Die omgeving moet voor veel mensen toegankelijk zijn en vergelijkbaar zijn met een openbare plaats.[[1]] Een besloten groep is niet openbaar, ook niet als meerdere mensen kunnen meelezen.[[2]]","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 116.","Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 54."],"vraag":"Kan artikel 429ter Sr ook gelden voor gedrag op sociale media?","wet":"Wetboek van Strafrecht"},{"artikel":"Art. 429ter Sr","juist":1,"kernregel":"Eén keer nafluiten is op zichzelf geen indringende seksuele benadering. De omstandigheden kunnen dit oordeel wel veranderen.","opties":["Ja. Eén keer nafluiten op straat is altijd een indringende seksuele benadering.","Nee, niet altijd. Eén keer nafluiten is op zichzelf niet indringend, maar de omstandigheden kunnen dat oordeel veranderen.","Nee. Nafluiten kan alleen strafbaar zijn als de verdachte de ander ook aanraakt.","Ja. Het is strafbaar zodra de aangesproken persoon laat merken het niet prettig te vinden."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is B. Het woord ‘indringend’ geeft een ondergrens aan. Eén keer nafluiten of een compliment over iemands uiterlijk is op zichzelf nog geen indringende seksuele benadering.[[1]] De plaats, het tijdstip en andere omstandigheden kunnen het oordeel veranderen.[[2]] Een aanraking is niet vereist. Ook de persoonlijke ervaring van de aangesproken persoon is niet beslissend.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 53.","Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 54."],"vraag":"Een collega zegt dat één keer nafluiten altijd strafbaar is volgens artikel 429ter Sr. Klopt dat?","wet":"Wetboek van Strafrecht"},{"artikel":"Art. 429ter Sr","juist":3,"kernregel":"Artikel 429ter Sr is een overtreding en noemt opzet en schuld niet als bestanddeel. Je hoeft opzet of schuld daarom niet te bewijzen.","opties":["Ja. Je moet bewijzen dat de verdachte de ander wilde intimideren.","Ja. Je moet alleen bewijzen dat de verdachte ernstig onvoorzichtig was.","Ja. Het is genoeg dat de verdachte bewust het risico nam dat het gedrag seksueel was.","Nee. Artikel 429ter Sr noemt opzet en schuld niet als bestanddeel."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is D. Artikel 429ter Sr is een overtreding. Opzet en schuld staan niet als bestanddeel in deze strafbepaling.[[1]] Je hoeft daarom niet te bewijzen wat de verdachte dacht of bedoelde. Het gedrag dat naar buiten toe zichtbaar en hoorbaar is, staat centraal.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114."],"vraag":"Moet voor een overtreding van artikel 429ter Sr opzet of schuld worden bewezen?","wet":"Wetboek van Strafrecht"},{"artikel":"Art. 429ter Sr","juist":1,"kernregel":"Een eenmalige opmerking op afstand is zonder andere omstandigheden niet indringend genoeg voor artikel 429ter Sr.","opties":["Ja. Iedere seksuele opmerking in het openbaar is een voltooid delict.","Nee. Zonder andere omstandigheden is deze ene opmerking op afstand niet indringend genoeg.","Ja. De zichtbare reactie van de vrouw is op zichzelf beslissend.","Nee. Alleen omdat niet kan worden bewezen dat de man haar wilde intimideren."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is B. Alle bestanddelen moeten aanwezig zijn. Eén daarvan is een indringende seksuele benadering. Een eenmalige opmerking op afstand is zonder andere omstandigheden niet indringend genoeg. De context kan het oordeel veranderen, bijvoorbeeld bij herhaling, volgen of een dreigende plaats.[[1]] Zulke omstandigheden ontbreken hier. Het persoonlijke gevoel van het slachtoffer is niet beslissend. De bedoeling van de verdachte hoeft niet te worden bewezen.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 46, 49 en 53."],"vraag":"Praktijkcasus. Op een druk marktplein roept een man één keer een seksuele opmerking naar een vrouw. Hij staat op enkele meters afstand en loopt daarna door. Er zijn geen andere bijzondere omstandigheden. Is aan alle bestanddelen van artikel 429ter Sr voldaan?","wet":"Wetboek van Strafrecht"}]},{"icoon":"oog","id":"m4","kader":"Art. 429ter Sr","nr":4,"pages":[{"html":"<h2 class=\"ptitle\">Leerdoelen</h2><p class=\"pintro\">Wat je na dit onderwerp kunt.</p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen waarom de omstandigheden belangrijk zijn bij de beoordeling van artikel 429ter Sr;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>noemen welke omstandigheden meetellen, zoals de duur, hoe vaak het gebeurt, de plaats en de omgeving;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen wat wordt bedoeld met «communicerende vaten»: de inhoud en de context beïnvloeden elkaar;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>herkennen dat hetzelfde gedrag door de omstandigheden wel of niet strafbaar kan zijn;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen waarom de omstandigheden zorgvuldig moeten worden vastgelegd.</span></li></ul>","kind":"lo","titel":"Leerdoelen"},{"html":"<h2 class=\"ptitle\">Introductie: van bestanddelen naar context</h2><div class=\"main\"><p>In het vorige onderwerp heb je de bestanddelen behandeld. Je kunt niet vooraf voor iedere situatie bepalen of aan die bestanddelen is voldaan. Dat hangt af van alle omstandigheden.</p><p>In dit onderwerp lees je hoe je de context weegt. De rechtspraak en de bewijsvoering komen pas in latere onderwerpen aan bod.</p></div>","kind":"theory","titel":"Introductie: van bestanddelen naar context"},{"html":"<h2 class=\"ptitle\">Inhoud en context: communicerende vaten</h2><div class=\"main\"><p>Bij de vraag of er sprake is van een strafbare seksuele benadering tellen twee dingen mee: de inhoud van de benadering en de context waarin die plaatsvindt.</p><p>De wetgever noemt die twee «communicerende vaten». Dat betekent dat ze elkaar beïnvloeden. Is de inhoud op zichzelf niet genoeg? Dan kan de context de benadering alsnog strafbaar maken.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 117.</li></ol></div>","kind":"theory","titel":"Inhoud en context: communicerende vaten"},{"html":"<div class=\"figcap\">Inho
