<script>window.__DATA__={"subtitel":"SEKSUELE STRAATINTIMIDATIE — E-LEARNING VOOR OPSPORINGSAMBTENAREN","opleiding":"Seksuele straatintimidatie","kaderLabel":"Art. 429ter Sr — Referentie-opleiding","version":"1.0","drempel":70,"eindtoetsDrempel":80,"peildatum":"31 juli 2026","totaalVragen":25,"eindtoets":[{"thema":"Achtergrond","casus":false,"vraag":"Welk belang beschermt artikel 429ter Sr volgens de wetgever in de kern?","opties":["De openbare orde en het ongestoord functioneren van het gezag in de publieke ruimte.","Het vrij en veilig kunnen verkeren in de openbare ruimte.","De eerbaarheid en de goede zeden, zoals die aan de klassieke zedendelicten ten grondslag liggen.","De goede naam van de aangesproken persoon."],"juist":1,"uitleg":"Juist is B. De wetsgeschiedenis noemt als beschermd belang het vrij en veilig kunnen verkeren in de openbare ruimte. De kern van het verwijt is dat iemand in een publieke omgeving ongewild als seksueel object wordt benaderd (MvT, p. 116; Nota, p. 12). De andere antwoorden benoemen belangen die de wetgever hier niet centraal stelt."},{"thema":"Achtergrond","casus":false,"vraag":"Welke functie heeft de strafbaarstelling volgens de wetsgeschiedenis náást handhaving, en sinds wanneer geldt artikel 429ter Sr?","opties":["Een uitsluitend symbolische functie; het artikel geldt sinds 1 januari 2024.","Een schadevergoedingsfunctie; het artikel geldt sinds 1 juli 2025.","Een normerende en preventieve functie; het artikel geldt sinds 1 juli 2024.","Een functie die het openbaar ministerie tot vervolging verplicht; het artikel geldt sinds 1 juli 2024."],"juist":2,"uitleg":"Juist is C. De strafbaarstelling heeft naast handhaving een normerende en preventieve functie. Er gaat een signaal van uit. En bewustwording kan bijdragen aan gedragsverandering (Nota, p. 12 en p. 50; MvT, p. 26). Artikel 429ter Sr is in werking getreden op 1 juli 2024 (Stb. 2024, 61). De andere antwoorden bevatten een onjuiste datum of functie. Van een vervolgingsplicht is geen sprake, gelet op het opportuniteitsbeginsel."},{"thema":"Wettelijke bestanddelen","casus":false,"vraag":"Wat geldt voor de bestanddelen van artikel 429ter Sr?","opties":["Eén vervuld bestanddeel, bijvoorbeeld een vreesaanjagende opmerking, is voldoende.","Alleen een fysieke aanraking kan het delict opleveren.","Uitsluitend gedrag met bewezen opzet op intimidatie valt eronder.","Alle bestanddelen moeten aanwezig zijn; ontbreekt er één, dan is het delict niet voltooid."],"juist":3,"uitleg":"Juist is D. Het delict kent meerdere bestanddelen: in het openbaar, een ander indringend seksueel benaderen, door opmerkingen, gebaren, geluiden of aanrakingen, op een geobjectiveerd vreesaanjagende, vernederende, kwetsende of onterende wijze. Die bestanddelen moeten alle aanwezig zijn (MvT, p. 114). De andere antwoorden lichten één element eruit. Of ze beperken het delict ten onrechte tot aanrakingen. Of ze stellen een opzeteis die bij deze overtreding niet geldt."},{"thema":"Wettelijke bestanddelen","casus":false,"vraag":"Kan het bestanddeel «in het openbaar» ook zien op gedrag online?","opties":["Nee, «in het openbaar» ziet uitsluitend op de fysieke openbare ruimte.","Ja, mits de online omgeving voor een breed publiek toegankelijk is en met een openbare plaats gelijk te stellen is.","Ja, elke uiting op sociale media valt eronder, ongeacht de toegankelijkheid.","Ja, ook in een besloten, afgeschermde chatgroep."],"juist":1,"uitleg":"Juist is B. «In het openbaar» is niet beperkt tot de fysieke wereld. Het geldt ook online. De omgeving moet dan wel voor een breed publiek toegankelijk zijn en daarmee met een openbare plaats gelijk te stellen zijn (MvT, p. 116). De andere antwoorden miskennen de online-reikwijdte of rekken die te ver op. Een besloten of afgeschermde omgeving is juist niet openbaar (Nota, p. 54)."},{"thema":"Context","casus":false,"vraag":"Wat bedoelt de wetgever met «communicerende vaten» bij de beoordeling?","opties":["Inhoud en context worden volledig los van elkaar beoordeeld.","Alleen de context telt; de inhoud van de uiting doet niet ter zake.","Inhoud en context beïnvloeden elkaar; is de inhoud op zichzelf onvoldoende, dan kan de context strafbaarheid alsnog vestigen.","Alleen de inhoud telt; de context kan het oordeel niet meer wijzigen."],"juist":2,"uitleg":"Juist is C. De wetgever noemt inhoud en context «communicerende vaten». Ze beïnvloeden elkaar. Een inhoud die op zichzelf onvoldoende is, kan door de context alsnog tot strafbaarheid leiden (MvT, p. 117). De andere antwoorden ontkennen die wisselwerking."},{"thema":"Context","casus":false,"vraag":"Een collega stelt dat dezelfde gedraging altijd op dezelfde manier moet worden beoordeeld. Wat is juist?","opties":["Nee: de context kan bepalend zijn — een gedraging die op een druk plein bij daglicht niet als indringende seksuele benadering geldt, kan dat in een donker steegje wél zijn.","Ja: de omstandigheden mogen bij de beoordeling geen rol spelen.","Nee, maar dat geldt uitsluitend wanneer er letsel is ontstaan.","Nee, maar dat geldt uitsluitend wanneer de dader aantoonbaar opzet had."],"juist":0,"uitleg":"Juist is A. De wetgever geeft dit voorbeeld zelf. Een gedraging geldt op een plein bij daglicht niet als indringende seksuele benadering. In een smal steegje in het donker kan diezelfde gedraging dat wél zijn (Nota, p. 54). De andere antwoorden miskennen de rol van de context. Of ze voegen een eis van letsel of opzet toe die de wet niet stelt."},{"thema":"Jurisprudentie","casus":false,"vraag":"Wat leert de eerste gepubliceerde strafzaak onder artikel 429ter Sr (Rb Rotterdam, 2 oktober 2024) over het bewijs?","opties":["Zonder aangifte van het slachtoffer kan geen veroordeling volgen.","Alleen camerabeelden gelden als voldoende bewijs.","Naast het proces-verbaal is ten minste één onafhankelijk steunbewijs vereist.","De eigen waarneming van opsporingsambtenaren, vastgelegd in een proces-verbaal, kan op zichzelf voldoende bewijs vormen."],"juist":3,"uitleg":"Juist is D. In ECLI:NL:RBROT:2024:9612 berustte de veroordeling op twee processen-verbaal van opsporingsambtenaren die in burger surveilleerden. Een aangifte en camerabeelden ontbraken. De eigen waarneming kan dus het dragende bewijsmiddel zijn. De andere antwoorden stellen bewijseisen die de wet niet kent."},{"thema":"Jurisprudentie","casus":false,"vraag":"In de zaak Rb Midden-Nederland (7 oktober 2024) kwalificeerde de rechter een expliciet seksuele opmerking tegen twee agentes als vernederend, kwetsend en onterend, en niet als vreesaanjagend. Wat leert dit?","opties":["Artikel 429ter Sr kent meerdere gevolgvarianten; vrees bij het slachtoffer is niet vereist.","Zonder vrees bij het slachtoffer kan de bepaling niet worden overtreden.","De rechter is gebonden aan de in de tenlastelegging gekozen kwalificatie.","De variant «vernederend» geldt alleen wanneer het slachtoffer een ambtenaar in functie is."],"juist":0,"uitleg":"Juist is A. Artikel 429ter Sr kent meerdere gevolgvarianten: vreesaanjagend, vernederend, kwetsend of onterend. Vrees bij het slachtoffer is dus geen vereiste (ECLI:NL:RBMNE:2024:5727). De andere antwoorden zijn onjuist. Het delict kan ook zonder vrees worden overtreden. De rechter is niet gebonden aan de tenlastelegging. En de kwalificatie hangt niet af van de hoedanigheid van het slachtoffer."},{"thema":"Bewijs","casus":false,"vraag":"Wat moet je bij artikel 429ter Sr bewijzen?","opties":["Dat de verdachte opzet had op intimidatie.","Dat het slachtoffer zich daadwerkelijk geïntimideerd voelde.","Dat de gedraging een stelselmatig karakter had.","De bestanddelen van het delict; opzet of schuld hoeft niet te worden bewezen, want het is een overtreding."],"juist":3,"uitleg":"Juist is D. Artikel 429ter Sr is een overtreding. Je bewijst de bestanddelen. Bewijs van opzet of schuld is niet vereist (MvT, p. 114). De andere antwoorden leggen ten onrechte een opzeteis op. Of ze verwarren het bewijs met de subjectieve beleving van het slachtoffer, terwijl het criterium geobjectiveerd is. Of ze voegen een stelselmatigheidseis toe die de wet niet stelt."},{"thema":"Bewijs","casus":false,"vraag":"Welke bewijsmiddelen komen in de bevestigde rechtspraak over artikel 429ter Sr voor?","opties":["Uitsluitend een bekennende verklaring van de verdachte.","Onder meer de eigen waarneming van de opsporingsambtenaar, een aangifte of getuigenverklaring en een bekentenis.","Uitsluitend een deskundigenrapport.","Uitsluitend camerabeelden."],"juist":1,"uitleg":"Juist is B. In de bevestigde uitspraken dragen verschillende bewijsmiddelen het bewijs: de eigen waarneming (Rb Rotterdam), een aangifte (Rb Midden-Nederland) en een bekennende verklaring (Rb Amsterdam). Ook schriftelijke bescheiden, zoals camerabeelden, kunnen als wettig bewijsmiddel dienen. De andere antwoorden beperken het bewijs ten onrechte tot één middel."},{"thema":"Proces-verbaal","casus":false,"vraag":"Hoe leg je je waarneming het beste vast in een proces-verbaal?","opties":["Feitelijk: de letterlijke opmerking of gedraging, plaats, tijdstip, context en de zichtbare reactie — de kwalificatie laat je aan de rechter.","Kort, met je juridische conclusie, bijvoorbeeld «hij intimideerde haar».","Alleen met de personalia van de verdachte.","Alleen met de gekozen gevolgvariant, bijvoorbeeld «vreesaanjagend»."],"juist":0,"uitleg":"Juist is A. Beschrijf de feiten zo concreet mogelijk. De toetsing aan de bestanddelen en de kwalificatie zijn aan de rechter. De andere antwoorden schrijven een conclusie op zonder de dragende feiten. Of ze laten de kern weg: de gedraging en de context."},{"thema":"Proces-verbaal","casus":false,"vraag":"Wat geldt voor een verkort proces-verbaal (tik-proces-verbaal) bij dit delict?","opties":["Verkort betekent dat niet alle bestanddelen hoeven te worden vastgelegd.","Het tik-proces-verbaal is wettelijk voorgeschreven in het Wetboek van Strafvordering.","Een tik-proces-verbaal mag uitsluitend bij een bekennende verdachte worden gebruikt.","Ook verkort moeten alle bestanddelen herkenbaar zijn; bij complexe of betwiste zaken kies je een uitgebreid proces-verbaal."],"juist":3,"uitleg":"Juist is D. Verkort betekent niet minder zorgvuldig. Alle bestanddelen moeten gedekt blijven (MvT, p. 114). Bij complexe of betwiste situaties past een uitgebreid proces-verbaal beter. Voor het tik-proces-verbaal als vorm bestaat geen officiële bron. Het is een praktijkwerkwijze. De vorm is niet wettelijk voorgeschreven en niet gebonden aan een bekentenis."},{"thema":"Casus","casus":true,"vraag":"Praktijkcasus. Het is 's avonds laat. In een verlaten portiek blokkeert een man kort de doorgang van een onbekende vrouw. Hij maakt van dichtbij herhaald seksuele opmerkingen en lacht om haar reactie. Zij oogt angstig. Wat is juridisch het meest juist?","opties":["Niet strafbaar, omdat er geen aanraking heeft plaatsgevonden.","Mogelijk strafbaar onder artikel 429ter Sr: in het openbaar, een indringende seksuele benadering door opmerkingen die naar algemene maatstaven intimiderend is, waarbij de context (tijdstip, plaats, herhaling en nabijheid) dat oordeel inkleurt.","Alleen strafbaar wanneer de vrouw aangifte doet.","Alleen strafbaar wanneer wordt bewezen dat de man haar wilde intimideren."],"juist":1,"uitleg":"Juist is B. De feiten wijzen op alle bestanddelen: in het openbaar, een indringende seksuele benadering door opmerkingen, op een naar algemene maatstaven intimiderende wijze. De context kleurt dat in: het tijdstip, de verlaten plaats, de herhaling en de nabijheid (MvT, p. 114-117). De andere antwoorden voegen eisen toe die de wet niet stelt. Een aanraking, een aangifte of opzet zijn geen voorwaarde. De eindbeoordeling is aan de rechter; dit is een praktijkvoorbeeld."},{"thema":"Casus","casus":true,"vraag":"Praktijkcasus. Je hebt de gedraging uit de vorige casus zelf waargenomen. Er is geen aangifte en geen camerabeeld. Hoe zorg je dat je proces-verbaal bruikbaar is?","opties":["Je noteert enkel je conclusie dat het intimidatie was.","Je wacht op een aangifte, omdat er anders geen bewijs is.","Je legt feitelijk vast wat je zag en hoorde — de letterlijke opmerkingen, de plaats, het tijdstip, de nabijheid, de herhaling en haar reactie; je eigen waarneming kan het bewijs dragen.","Je vraagt de verdachte eerst om een bekentenis, omdat de zaak anders niet doorgaat."],"juist":2,"uitleg":"Juist is C. Bij een overtreding kan het proces-verbaal van één opsporingsambtenaar het bewijs dragen (art. 344 lid 2 Sv). Dat gebeurde ook in de eerste strafzaak (Rb Rotterdam). Beslissend is dat je de feiten concreet en toetsbaar vastlegt en de kwalificatie aan de rechter laat. De andere antwoorden schrijven een conclusie op zonder feiten. Of ze stellen eisen die de wet niet kent, zoals een aangifte of een bekentenis."}],"aantalOnderwerpen":6,"topics":[{"id":"m1","nr":1,"titel":"Introductie","kader":"Opleiding","icoon":"megafoon","type":"intro","pages":[{"titel":"Leerdoelen","kind":"lo","html":"<h2 class=\"ptitle\">Leerdoelen</h2><p class=\"pintro\">Wat je na dit onderwerp kunt.</p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>weet je hoe deze opleiding is opgebouwd;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>ken je de leerdoelen en de opzet van de toetsing;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>weet je wat van je wordt verwacht om het certificaat te behalen.</span></li></ul>"},{"titel":"Welkom","kind":"theory","html":"<h2 class=\"ptitle\">Welkom</h2><div class=\"main\"><p>Welkom bij de opleiding Seksuele straatintimidatie. Je leert in deze opleiding drie dingen. Je leert het delict van artikel 429ter Sr herkennen. Je leert wat dit delict juridisch betekent. En je leert hoe je een situatie in de praktijk goed beoordeelt en vastlegt.</p><p>Je sluit de opleiding af met een eindtoets. Haal je de eindtoets, dan krijg je een certificaat.</p></div>"},{"titel":"Opzet van de opleiding","kind":"theory","html":"<h2 class=\"ptitle\">Opzet van de opleiding</h2><div class=\"main\"><p>De opleiding bestaat uit acht onderwerpen. Je begint met deze introductie. Daarna volgen zes inhoudelijke onderwerpen. Het laatste onderwerp is een samenvatting. Daarna maak je de eindtoets.</p><p>Elk inhoudelijk onderwerp begint met de leerdoelen. Daarna krijg je korte stukken theorie. Die wisselen af met wetsartikelen, rechtspraak, praktijkvoorbeelden en kennisvragen. Je voortgang wordt bewaard op dit apparaat. Je kunt dus later verdergaan waar je gebleven was.</p></div>"},{"titel":"Opzet van de opleiding","kind":"figuur","html":"<div class=\"figcap\">Opzet van de opleiding</div><figure class=\"illu\"><svg viewBox=\"0 0 560 356\" role=\"img\" aria-labelledby=\"lr-t lr-d\" font-family=\"'Outfit',system-ui,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n<title id=\"lr-t\">Opbouw van de opleiding</title>\n<desc id=\"lr-d\">De route: introductie, zes inhoudelijke onderwerpen, samenvatting, de eindtoets (ten minste tachtig procent) en het certificaat. De voortgang wordt bewaard, zodat je later kunt verdergaan.</desc>\n<rect x=\"70\" y=\"14\" width=\"420\" height=\"44\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/><text x=\"280\" y=\"41\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Introductie</text>\n<line x1=\"280\" y1=\"58\" x2=\"280\" y2=\"72\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/><path d=\"M273 66l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<rect x=\"70\" y=\"74\" width=\"420\" height=\"44\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/><text x=\"280\" y=\"101\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Zes inhoudelijke onderwerpen</text>\n<line x1=\"280\" y1=\"118\" x2=\"280\" y2=\"132\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/><path d=\"M273 126l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<rect x=\"70\" y=\"134\" width=\"420\" height=\"44\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/><text x=\"280\" y=\"161\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Samenvatting</text>\n<line x1=\"280\" y1=\"178\" x2=\"280\" y2=\"192\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/><path d=\"M273 186l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<rect x=\"70\" y=\"194\" width=\"420\" height=\"44\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw)\" stroke-width=\"2.2\"/><text x=\"280\" y=\"221\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Eindtoets · ten minste 80%</text>\n<line x1=\"280\" y1=\"238\" x2=\"280\" y2=\"252\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/><path d=\"M273 246l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<rect x=\"70\" y=\"254\" width=\"420\" height=\"44\" rx=\"12\" fill=\"var(--groen-licht)\" stroke=\"var(--groen)\" stroke-width=\"2\"/><text x=\"280\" y=\"281\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"var(--groen)\">Certificaat</text>\n<text x=\"280\" y=\"330\" text-anchor=\"middle\" class=\"il-note\" font-style=\"italic\" fill=\"var(--tekst-mid)\">Je voortgang wordt bewaard; je kunt later verdergaan.</text>\n</svg></figure>"},{"titel":"Kort samengevat","kind":"onthoud","html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>Acht onderwerpen. Daarna volgt de eindtoets. Haal je die, dan krijg je een certificaat.</li><li>Zes inhoudelijke onderwerpen behandelen achtergrond, wettelijke bestanddelen, context, jurisprudentie, bewijs en proces-verbaal.</li><li>Theorie, wet, rechtspraak, praktijk en toetsing wisselen elkaar af.</li></ul></div></div>"}],"vragen":[]},{"id":"m2","nr":2,"titel":"Achtergrond en doel van de strafbaarstelling","kader":"Art. 429ter Sr","icoon":"balans","type":"content","pages":[{"titel":"Leerdoelen","kind":"lo","html":"<h2 class=\"ptitle\">Leerdoelen</h2><p class=\"pintro\">Wat je na dit onderwerp kunt.</p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen waarom seksuele intimidatie in het openbaar afzonderlijk strafbaar is gesteld;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>de maatschappelijke achtergrond beschrijven die de wetgever als aanleiding noemt;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>het doel en de normerende functie van artikel 429ter Sr op hoofdlijnen benoemen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>onderscheid maken tussen de bedoeling van de wetgever en de wettelijke bestanddelen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen waarom een zorgvuldige beoordeling van context en bewijs van belang is.</span></li></ul>"},{"titel":"Inleiding","kind":"theory","html":"<h2 class=\"ptitle\">Inleiding</h2><div class=\"main\"><p>Seksuele intimidatie in het openbaar is een zelfstandige overtreding. Die overtreding staat in artikel 429ter Sr. Dit artikel is in het Wetboek van Strafrecht gekomen door de Wet seksuele misdrijven.<sup class=\"fn\">1</sup> Het artikel geldt sinds 1 juli 2024.<sup class=\"fn\">2</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Stb. 2024, 59 (Wet seksuele misdrijven).</li><li>Stb. 2024, 61 (inwerkingtredingsbesluit).</li></ol></div>"},{"titel":"Inleiding (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Inleiding (vervolg)</h2><div class=\"main\"><p>Dit onderwerp gaat over de achtergrond en het doel van de strafbaarstelling. De delictsomschrijving en de afzonderlijke bestanddelen behandelen we in het volgende onderwerp.</p></div>"},{"titel":"Een herkenbare situatie","kind":"casus","html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Een herkenbare situatie</h2><p class=\"lees\">Je surveilleert in een drukke winkelstraat. Iemand maakt steeds opmerkingen tegen een voorbijganger. Diegene blijft ook opvallend dicht bij haar lopen. Je ziet dat de voorbijganger zich zichtbaar ongemakkelijk voelt. De vraag is dan: welke rol speelt het strafrecht in zo'n situatie?</p>"},{"titel":"Een herkenbare situatie — betekenis","kind":"casus","html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Een herkenbare situatie — betekenis</h2><div class=\"kaart k-voorbeeld\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/></svg></span><span class=\"kaart-lab\">Voorbeeld</span></div><div class=\"kaart-t\">Betekenis voor de praktijk</div><div class=\"kaart-b\"><p>In dit onderwerp geven we nog geen juridisch eindoordeel over deze situatie. Je leert hier eerst de achtergrond en het doel van de strafbaarstelling. Dat is het kader. In de volgende onderwerpen toets je zulke situaties aan de bestanddelen en aan de context.</p></div></div>"},{"titel":"Maatschappelijke achtergrond","kind":"theory","html":"<h2 class=\"ptitle\">Maatschappelijke achtergrond</h2><div class=\"main\"><p>Veel mensen krijgen te maken met seksuele intimidatie. Dat gebeurt in de openbare ruimte en online. Dat staat in de memorie van toelichting. Tegelijk groeit in de samenleving het besef hoe vaak dit voorkomt en hoe schadelijk het is.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 10.</li></ol></div>"},{"titel":"Maatschappelijke achtergrond (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Maatschappelijke achtergrond (vervolg)</h2><div class=\"main\"><p>De toelichting onderbouwt dit met cijfers van het Centraal Bureau voor de Statistiek. Die cijfers laten zien dat straatintimidatie vaak voorkomt. Vooral jonge vrouwen krijgen ermee te maken.<sup class=\"fn\">1</sup> Let op: het gaat om straatintimidatie zoals mensen die zelf hebben ervaren. Dat is niet hetzelfde als een bewezen strafbaar feit in de zin van artikel 429ter Sr.</p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 5–6.</li></ol></div>"},{"titel":"Maatschappelijke achtergrond (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Maatschappelijke achtergrond (vervolg)</h2><div class=\"main\"><p>De wetgever gaat uit van een sociale norm. Die norm is: iedereen moet zich vrij en ongehinderd in het openbaar kunnen bewegen, zonder angst voor ongewenste seksuele toenadering. Seksuele intimidatie tast die sociale veiligheid aan.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 10.</li></ol></div>"},{"titel":"Waarom een afzonderlijke strafbaarstelling?","kind":"theory","html":"<h2 class=\"ptitle\">Waarom een afzonderlijke strafbaarstelling?</h2><div class=\"main\"><p>Vóór deze wet had seksuele intimidatie in de openbare ruimte geen duidelijke, eigen plaats in het Wetboek van Strafrecht. Vervolging liep daardoor via verschillende, uiteenlopende bepalingen.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 10.</li></ol></div>"},{"titel":"Waarom een afzonderlijke strafbaarstelling? (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Waarom een afzonderlijke strafbaarstelling? (vervolg)</h2><div class=\"main\"><p>Er zijn ook regelingen in het civiele recht en het arbeidsrecht. Die dekten het probleem volgens de wetgever onvoldoende. Ze maakten het strafrechtelijke verwijt ook niet duidelijk.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 11.</li></ol></div>"},{"titel":"Waarom een afzonderlijke strafbaarstelling? (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Waarom een afzonderlijke strafbaarstelling? (vervolg)</h2><div class=\"main\"><p>Ook een lokale aanpak bood geen voldoende basis. Rotterdam had een bepaling over straatintimidatie in een verordening. Het gerechtshof Den Haag oordeelde dat die bepaling onverbindend was. Een beperking van de vrijheid van meningsuiting moet namelijk bij wet in formele zin worden geregeld. Daar kwam bij dat de bepaling onvoldoende voorzienbaar was.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Hof Den Haag 19 december 2019, ECLI:NL:GHDHA:2019:3293.</li></ol></div>"},{"titel":"Waarom een afzonderlijke strafbaarstelling? (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Waarom een afzonderlijke strafbaarstelling? (vervolg)</h2><div class=\"main\"><p>De wetgever verwijst in de toelichting naar deze problematiek.<sup class=\"fn\">1</sup></p><p>Mede daarom koos de wetgever voor een zelfstandige strafbaarstelling in het Wetboek van Strafrecht.<sup class=\"fn\">2</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 11.</li><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 26.</li></ol></div>"},{"titel":"Juridisch kader","kind":"kader","html":"<h2 class=\"ptitle\">Juridisch kader</h2><div class=\"kaart k-kader\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3h9l3 3v15H6z\"/><path d=\"M9 8h6M9 12h6M9 16h4\"/></svg></span><span class=\"kaart-lab\">Juridisch kader</span></div><div class=\"kaart-t\">Artikel 429ter Sr · Wetboek van Strafrecht</div><div class=\"kaart-b\"><p class=\"wet\">«Degene die in het openbaar een ander indringend seksueel benadert door middel van opmerkingen, gebaren, geluiden of aanrakingen op een wijze die vreesaanjagend, vernederend, kwetsend of onterend is te achten, wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete van de derde categorie.»<sup class=\"fn\">1</sup> Het gaat om een overtreding. Het artikel staat in het Derde Boek, Titel II, van het Wetboek van Strafrecht. De afzonderlijke bestanddelen werken we in het volgende onderwerp uit.</p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Artikel 429ter Sr (Wetboek van Strafrecht), geldend vanaf 1 juli 2024; Stb. 2024, 59.</li></ol></div>"},{"titel":"Wettelijke inbedding","kind":"theory","html":"<h2 class=\"ptitle\">Wettelijke inbedding</h2><div class=\"main\"><p>Artikel 429ter Sr is een overtreding. Het artikel staat in het Derde Boek, Titel II, van het Wetboek van Strafrecht. Die titel gaat over overtredingen betreffende de openbare orde.<sup class=\"fn\">1</sup></p><p>Het artikel is op 1 juli 2024 in werking getreden. Dat is geregeld in een apart inwerkingtredingsbesluit.<sup class=\"fn\">2</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 26.</li><li>Stb. 2024, 61 (inwerkingtredingsbesluit).</li></ol></div>"},{"titel":"Doel van de strafbaarstelling","kind":"theory","html":"<h2 class=\"ptitle\">Doel van de strafbaarstelling</h2><div class=\"main\"><p>De wetgever wil met de strafbaarstelling een norm inscherpen. Die norm is: seksueel intimiderend gedrag in de openbare ruimte is niet aanvaardbaar.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 26.</li></ol></div>"},{"titel":"Doel van de strafbaarstelling (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Doel van de strafbaarstelling (vervolg)</h2><div class=\"main\"><p>Het artikel maakt strafrechtelijk optreden mogelijk. Daarnaast heeft het een normerende en preventieve functie. Van de strafbaarstelling gaat een signaal uit naar mogelijke daders. En meer bewustwording kan op termijn bijdragen aan gedragsverandering.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 12.</li></ol></div>"},{"titel":"Doel van de strafbaarstelling (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Doel van de strafbaarstelling (vervolg)</h2><div class=\"main\"><p>De regering benadrukt dat effectieve handhaving van groot belang is voor die normerende en preventieve werking.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 50.</li></ol></div>"},{"titel":"Beschermd belang","kind":"theory","html":"<h2 class=\"ptitle\">Beschermd belang</h2><div class=\"main\"><p>Het beschermde belang is het vrij en veilig kunnen verkeren in de openbare ruimte.<sup class=\"fn\">1</sup><sup class=\"fn\">2</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 116.</li><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 12.</li></ol></div>"},{"titel":"Beschermd belang (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Beschermd belang (vervolg)</h2><div class=\"main\"><p>De kern van het strafrechtelijk verwijt is dat iemand in een publieke omgeving ongewild als seksueel object wordt benaderd.<sup class=\"fn\">1</sup></p><p>De bescherming geldt in de fysieke openbare ruimte. Ze geldt ook in online omgevingen die voor een breed publiek toegankelijk zijn.<sup class=\"fn\">2</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 12.</li><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 13.</li></ol></div>"},{"titel":"Reikwijdte op hoofdlijnen","kind":"kaart","html":"<h2 class=\"ptitle\">Reikwijdte op hoofdlijnen</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Reikwijdte op hoofdlijnen</div><div class=\"kaart-b\"><p>Niet elke seksueel getinte opmerking of benadering is strafbaar. Met het bestanddeel «indringend» legt de wetgever een ondergrens vast. Er moet sprake zijn van een sterk opdringerige benadering met een intimiderend effect. Respectvol contact leggen of flirten valt daar niet onder.<sup class=\"fn\">1</sup> De afzonderlijke bestanddelen behandelen we in het volgende onderwerp.</p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 46 en 49.</li></ol></div>"},{"titel":"Betekenis voor de opsporingsambtenaar","kind":"kaart","html":"<h2 class=\"ptitle\">Betekenis voor de opsporingsambtenaar</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Betekenis voor de opsporingsambtenaar</div><div class=\"kaart-b\"><p>De achtergrond en het doel van de strafbaarstelling komen niet in de plaats van de wettelijke bestanddelen. Je moet die bestanddelen in elke concrete zaak apart vaststellen.</p></div></div>"},{"titel":"Betekenis voor de opsporingsambtenaar (vervolg)","kind":"kaart","html":"<h2 class=\"ptitle\">Betekenis voor de opsporingsambtenaar (vervolg)</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Betekenis voor de opsporingsambtenaar</div><div class=\"kaart-b\"><p>Volgens de wetsgeschiedenis zal strafrechtelijk optreden vooral spelen bij heterdaad. Dat geldt ook als een opsporingsambtenaar of buitengewoon opsporingsambtenaar het zelf waarneemt. En als er steun is van getuigen of camerabeelden.<sup class=\"fn\">1</sup> Leg de omstandigheden daarom zorgvuldig en feitelijk vast.</p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 12.</li></ol></div>"},{"titel":"Kort samengevat","kind":"onthoud","html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>Seksuele intimidatie in het openbaar is een zelfstandige overtreding in artikel 429ter Sr. Dat is geregeld in de Wet seksuele misdrijven. Het artikel geldt vanaf 1 juli 2024.</li><li>De aanleiding was tweeledig: de bestaande bepalingen schoten tekort en de lokale aanpak werd onverbindend verklaard.</li></ul></div></div>"},{"titel":"Kort samengevat","kind":"onthoud","html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>De bepaling beschermt het vrij en veilig verkeren in de openbare ruimte en heeft een normerende en preventieve functie.</li><li>De achtergrond en het doel van de wetgever zijn niet hetzelfde als de wettelijke bewijsvoorwaarden.</li></ul></div></div>"},{"titel":"Vooruitblik: Wettelijke bestanddelen","kind":"theory","html":"<h2 class=\"ptitle\">Vooruitblik: Wettelijke bestanddelen</h2><div class=\"main\"><p>Het volgende onderwerp heet Wettelijke bestanddelen. Daarin halen we de delictsomschrijving uit elkaar. Je leert welke onderdelen je moet vaststellen.</p><p>Daarbij komen deze begrippen aan bod: «indringend», «seksueel benaderen», het geobjectiveerde criterium «vreesaanjagend, vernederend, kwetsend of onterend» en «in het openbaar».</p></div>"}],"vragen":[{"soort":"Kennisvraag","vraag":"Waarom heeft de wetgever seksuele intimidatie in het openbaar áfzonderlijk strafbaar gesteld in het Wetboek van Strafrecht?","opties":["Omdat de bestaande openbare-ordebepalingen dit gedrag al bestreken, maar in de praktijk nauwelijks werden gehandhaafd.","Omdat een gemeentelijke verordening dit gedrag wél rechtsgeldig mocht verbieden, maar de uiteenlopende lokale regelingen tot ongewenste rechtsongelijkheid tussen gemeenten leidden.","Omdat het gedrag geen eigen plaats had in het Wetboek van Strafrecht en een lokale, verordeningsgebonden aanpak onverbindend werd geacht.","Omdat uitsluitend de wetgever, en niet de gemeenteraad, een reeds bestaande gedraging strafbaar mag stellen."],"juist":2,"uitleg":"Het juiste antwoord is C. In de memorie van toelichting staat dat seksuele intimidatie in de openbare ruimte geen duidelijke eigen plaats had in het Wetboek van Strafrecht. De vervolging verliep daardoor versnipperd. Daar kwam bij dat een lokale aanpak via een verordening, zoals die van Rotterdam, onverbindend werd geacht. Een beperking van de vrijheid van meningsuiting moet namelijk bij formele wet worden geregeld.[[1]] De andere antwoorden bevatten telkens een onjuist element. De bestaande openbare-ordebepalingen dekten dit gedrag juist niet voldoende. De lokale verordening werd niet gepasseerd wegens rechtsongelijkheid, maar wegens onverbindendheid. En beslissend was niet de bevoegdheidsverdeling op zichzelf, maar het ontbreken van een eigen strafbaarstelling.","kernregel":"De wetgever heeft seksuele straatintimidatie zelfstandig strafbaar gesteld omdat het gedrag geen eigen plaats in het Wetboek van Strafrecht had en een beperking van grondrechten bij formele wet moet worden geregeld.","artikel":"Art. 429ter Sr","wet":"Wetboek van Strafrecht","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 10–11."]},{"soort":"Kennisvraag","vraag":"Welke functie heeft artikel 429ter Sr volgens de wetsgeschiedenis náást de mogelijkheid om strafrechtelijk op te treden?","opties":["Een normerende en preventieve functie: er gaat een signaal van uit dat aan bewustwording en gedragsverandering kan bijdragen.","Een louter symbolische functie, zonder zelfstandige betekenis naast de strafrechtelijke handhaving.","Een functie die de bewijslast verlicht, doordat na aangifte van intimidatie wordt uitgegaan.","Een functie die het openbaar ministerie tot vervolging verplicht zodra van een feit melding wordt gemaakt."],"juist":0,"uitleg":"Het juiste antwoord is A. Naast de handhavingsfunctie heeft de strafbaarstelling een normerende en preventieve functie. Van de bepaling gaat een signaal uit naar (potentiële) daders. Een toenemende bewustwording kan op termijn bijdragen aan gedragsverandering.[[1]][[2]] De regering benadrukt dat effectieve handhaving van belang is voor die normerende werking.[[3]] De andere antwoorden vinden geen steun in de wetsgeschiedenis. De functie is niet louter symbolisch. De bepaling verlicht of verschuift de bewijslast niet. En van een vervolgingsplicht is geen sprake, gelet op het opportuniteitsbeginsel.","kernregel":"Artikel 429ter Sr strekt niet uitsluitend tot bestraffing, maar vervult tevens een normerende en preventieve functie.","artikel":"Art. 429ter Sr","wet":"Wetboek van Strafrecht","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 12.","Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 26.","Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 50."]},{"soort":"Kennisvraag","vraag":"Wat beschermt de strafbaarstelling volgens de wetgever in de kern?","opties":["De openbare orde en het ongestoord functioneren van het gezag in de publieke ruimte.","De eerbaarheid en de goede zeden, zoals die aan de klassieke zedendelicten ten grondslag liggen.","De lichamelijke integriteit van de betrokkene tegen ongewenste seksuele aanrakingen.","Het vrij en veilig kunnen verkeren in de openbare ruimte, zowel fysiek als online."],"juist":3,"uitleg":"Het juiste antwoord is D. De wetsgeschiedenis noemt als beschermd belang het vrij en veilig kunnen verkeren in de openbare ruimte. De kern van het strafrechtelijke verwijt is dat iemand in een publieke omgeving ongewild als seksueel object wordt benaderd.[[1]][[2]] De andere antwoorden benoemen belangen die hier niet centraal staan. Het gaat niet in de eerste plaats om de openbare orde of het gezag. Het gaat ook niet om de eerbaarheid en de goede zeden als zodanig. En het gaat niet alleen om de lichamelijke integriteit, want ook opmerkingen, gebaren en geluiden vallen onder de bepaling.","kernregel":"De strafbaarstelling beschermt het vrij en veilig kunnen verkeren in de openbare ruimte.","artikel":"Art. 429ter Sr","wet":"Wetboek van Strafrecht","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 12.","Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 116."]},{"soort":"Praktijkcasus","vraag":"Een collega zegt: «De wetgever wilde straatintimidatie aanpakken, dus zodra iemand zich geïntimideerd voelt, is artikel 429ter Sr overtreden.» Wat is hierop juist?","opties":["Dat klopt: nu het criterium is geobjectiveerd, volstaat voor strafbaarheid dat het slachtoffer zich in de gegeven situatie daadwerkelijk geïntimideerd heeft gevoeld.","Dat klopt niet: de bedoeling van de wetgever komt niet in de plaats van de bestanddelen, die per geval afzonderlijk moeten worden vastgesteld.","Dat klopt gedeeltelijk: het gevoel van het slachtoffer is beslissend, mits van het feit aangifte is gedaan.","Dat klopt niet: strafbaarheid vergt bovendien dat de dader opzet op de intimidatie had."],"juist":1,"uitleg":"Het juiste antwoord is B. De achtergrond en het doel van de wetgever verklaren waaróm er een strafbaarstelling is gekomen. Ze bepalen niet of een concreet geval strafbaar is. Daarvoor moet je de wettelijke bestanddelen afzonderlijk vaststellen. De wet trekt bovendien een ondergrens: er moet sprake zijn van een indringende seksuele benadering. Respectvol contact of flirten valt daar niet onder.[[1]] De andere antwoorden zijn onjuist. Het enkele gevoel van het slachtoffer is niet beslissend, ook niet na aangifte, want het criterium is geobjectiveerd. En opzet op intimidatie is niet nodig, omdat het om een overtreding gaat.","kernregel":"De bedoeling van de wetgever verklaart de strafbaarstelling, maar strafbaarheid in een concreet geval vergt dat alle wettelijke bestanddelen zijn vervuld.","artikel":"Art. 429ter Sr","wet":"Wetboek van Strafrecht","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 46 en 49."]}]},{"id":"m3","nr":3,"titel":"Wettelijke bestanddelen","kader":"Art. 429ter Sr","icoon":"wet","type":"content","pages":[{"titel":"Leerdoelen","kind":"lo","html":"<h2 class=\"ptitle\">Leerdoelen</h2><p class=\"pintro\">Wat je na dit onderwerp kunt.</p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>de wettelijke bestanddelen van artikel 429ter Sr benoemen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen wat «in het openbaar», «indringend» en «seksueel benaderen» inhouden;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>de gedragsvormen (opmerkingen, gebaren, geluiden, aanrakingen) herkennen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen dat het criterium «vreesaanjagend, vernederend, kwetsend of onterend» geobjectiveerd is;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>benoemen dat opzet of schuld niet hoeft te worden bewezen.</span></li></ul>"},{"titel":"Introductie: van achtergrond naar bestanddelen","kind":"theory","html":"<h2 class=\"ptitle\">Introductie: van achtergrond naar bestanddelen</h2><div class=\"main\"><p>Het vorige onderwerp ging over de achtergrond en het doel van de strafbaarstelling. In dit onderwerp halen we de delictsomschrijving uit elkaar. Je leert welke onderdelen aanwezig moeten zijn voordat er sprake is van het delict. Die onderdelen heten bestanddelen.</p><p>Alle bestanddelen moeten vervuld zijn. Ontbreekt er één bestanddeel, dan is het delict niet voltooid. Hierna bespreken we de bestanddelen één voor één.</p></div>"},{"titel":"Juridisch kader","kind":"kader","html":"<h2 class=\"ptitle\">Juridisch kader</h2><div class=\"kaart k-kader\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3h9l3 3v15H6z\"/><path d=\"M9 8h6M9 12h6M9 16h4\"/></svg></span><span class=\"kaart-lab\">Juridisch kader</span></div><div class=\"kaart-t\">Artikel 429ter Sr · Wetboek van Strafrecht</div><div class=\"kaart-b\"><p class=\"wet\">«Degene die in het openbaar een ander indringend seksueel benadert door middel van opmerkingen, gebaren, geluiden of aanrakingen op een wijze die vreesaanjagend, vernederend, kwetsend of onterend is te achten, wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete van de derde categorie.»<sup class=\"fn\">1</sup> Hierna halen we deze bepaling uit elkaar in de afzonderlijke bestanddelen.</p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Artikel 429ter Sr (Wetboek van Strafrecht), geldend vanaf 1 juli 2024.</li></ol></div>"},{"titel":"Bestanddeel 1: «in het openbaar»","kind":"theory","html":"<h2 class=\"ptitle\">Bestanddeel 1: «in het openbaar»</h2><div class=\"main\"><p>Het bestanddeel «in het openbaar» gaat over de pleegplaats. Denk aan de openbare weg, het openbaar vervoer of een gebouw dat voor het publiek toegankelijk is, zoals een winkel of een uitgaansgelegenheid.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 116.</li></ol></div>"},{"titel":"Bestanddeel 1: «in het openbaar» (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Bestanddeel 1: «in het openbaar» (vervolg)</h2><div class=\"main\"><p>Het bestanddeel geldt niet alleen voor de fysieke wereld. Ook een online omgeving valt eronder. Die omgeving moet dan wel toegankelijk zijn voor een breed publiek. Je kunt haar daardoor gelijkstellen met een openbare plaats. Denk aan openbare sociale media.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 116.</li></ol></div>"},{"titel":"Bestanddeel 1: «in het openbaar» (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Bestanddeel 1: «in het openbaar» (vervolg)</h2><div class=\"main\"><p>Het gaat om fysieke én digitale plaatsen waar iedereen in beginsel mag komen. Besloten of afgeschermde omgevingen vallen daar niet onder.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 54.</li></ol></div>"},{"titel":"Bestanddeel 2: «een ander indringend seksueel benaderen»","kind":"theory","html":"<h2 class=\"ptitle\">Bestanddeel 2: «een ander indringend seksueel benaderen»</h2><div class=\"main\"><p>Het bestanddeel «indringend» geeft de ondergrens van de strafbaarheid aan. De seksuele benadering moet een zekere intensiteit hebben. Dat wil zeggen: iemand zoekt op een sterk overheersende, opdringerige manier contact. Gewoon contact leggen en flirten vallen daar niet onder.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114.</li></ol></div>"},{"titel":"Bestanddeel 2: «een ander indringend seksueel benaderen» (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Bestanddeel 2: «een ander indringend seksueel benaderen» (vervolg)</h2><div class=\"main\"><p>Eén keer nafluiten is op zichzelf nog geen indringende benadering. Dat geldt ook voor een compliment over iemands uiterlijk.<sup class=\"fn\">1</sup> Respectvol flirten valt er evenmin onder.<sup class=\"fn\">2</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 53.</li><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 46.</li></ol></div>"},{"titel":"Bestanddeel 2: «een ander indringend seksueel benaderen» (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Bestanddeel 2: «een ander indringend seksueel benaderen» (vervolg)</h2><div class=\"main\"><p>Het bestanddeel «seksueel» betekent dat de handeling een seksuele lading heeft. Bij opmerkingen, gebaren of geluiden blijkt die lading meestal uit de gebruikte taal. Het totaalbeeld is daarbij doorslaggevend.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114.</li></ol></div>"},{"titel":"Bestanddeel 2: «een ander indringend seksueel benaderen» (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Bestanddeel 2: «een ander indringend seksueel benaderen» (vervolg)</h2><div class=\"main\"><p>De benadering is gericht op «een ander». Dat kan één persoon zijn, maar ook meerdere personen tegelijk.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 49.</li></ol></div>"},{"titel":"Bestanddeel 3: «door opmerkingen, gebaren, geluiden of aanrakingen»","kind":"theory","html":"<h2 class=\"ptitle\">Bestanddeel 3: «door opmerkingen, gebaren, geluiden of aanrakingen»</h2><div class=\"main\"><p>De seksuele benadering gebeurt door opmerkingen, gebaren, geluiden of aanrakingen. Dat kan om één vorm gaan. Het kan ook om een combinatie van deze vormen gaan.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114.</li></ol></div>"},{"titel":"Bestanddeel 3: «door opmerkingen, gebaren, geluiden of aanrakingen» (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Bestanddeel 3: «door opmerkingen, gebaren, geluiden of aanrakingen» (vervolg)</h2><div class=\"main\"><p>Bij geluiden kun je denken aan het nafluiten van een ander. Ook het zogenoemde sissen of klakken hoort hierbij. Bij aanrakingen gaat het om kortdurende gedragingen met een geringe fysieke component.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 115.</li></ol></div>"},{"titel":"Bestanddeel 3: «door opmerkingen, gebaren, geluiden of aanrakingen» (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Bestanddeel 3: «door opmerkingen, gebaren, geluiden of aanrakingen» (vervolg)</h2><div class=\"main\"><p>Het aanraken van seksuele lichaamsdelen valt niet onder deze overtreding. Zo'n aanraking kan wel onder een zwaarder delict vallen, zoals aanranding.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114-115.</li></ol></div>"},{"titel":"Bestanddeel 4: «vreesaanjagend, vernederend, kwetsend of onterend» (geobjectiveerd)","kind":"theory","html":"<h2 class=\"ptitle\">Bestanddeel 4: «vreesaanjagend, vernederend, kwetsend of onterend» (geobjectiveerd)</h2><div class=\"main\"><p>De benadering moet plaatsvinden op een wijze die «vreesaanjagend, vernederend, kwetsend of onterend is te achten». Dit criterium is geobjectiveerd.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 115.</li></ol></div>"},{"titel":"Bestanddeel 4: «vreesaanjagend, vernederend, kwetsend of onterend» (geobjectiveerd) (vervolg)","kind":"theory","html":"<h2 class=\"ptitle\">Bestanddeel 4: «vreesaanjagend, vernederend, kwetsend of onterend» (geobjectiveerd) (vervolg)</h2><div class=\"main\"><p>Je beoordeelt of de benadering naar algemene maatstaven intimiderend is. Het is niet nodig dat de dader dit zo heeft bedoeld. Het is ook niet nodig dat een concreet slachtoffer de benadering zo heeft ervaren. En het gevolg hoeft niet te zijn ingetreden.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 47 en p. 55.</li></ol></div>"},{"titel":"Context kleurt de bestanddelen in","kind":"kaart","html":"<h2 class=\"ptitle\">Context kleurt de bestanddelen in</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Context kleurt de bestanddelen in</div><div class=\"kaart-b\"><p>Inhoud en context werken op elkaar in. Is de inhoud op zichzelf onvoldoende, dan kan de context de strafbaarheid alsnog vestigen.<sup class=\"fn\">1</sup> Factoren als duur, frequentie en pleegplaats spelen daarbij een rol.<sup class=\"fn\">2</sup></p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 117.</li><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 47.</li></ol></div>"},{"titel":"Context kleurt de bestanddelen in (vervolg)","kind":"kaart","html":"<h2 class=\"ptitle\">Context kleurt de bestanddelen in (vervolg)</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Context kleurt de bestanddelen in</div><div class=\"kaart-b\"><p>Neem dezelfde gedraging op twee plekken. Op een plein bij daglicht blijft die gedraging buiten de delictsomschrijving. In een smal steegje in het donker kan zij wél een indringende seksuele benadering opleveren.<sup class=\"fn\">1</sup> De uitgebreide contextbeoordeling behandelen we in het volgende onderwerp.</p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 54.</li></ol></div>"},{"titel":"Geen opzet of schuld nodig; strafmaat","kind":"kaart","html":"<h2 class=\"ptitle\">Geen opzet of schuld nodig; strafmaat</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Geen opzet of schuld nodig; strafmaat</div><div class=\"kaart-b\"><p>Artikel 429ter Sr is een overtreding. Je hoeft daarom geen subjectieve bestanddelen te bewijzen, zoals opzet of schuld.<sup class=\"fn\">1</sup></p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114.</li></ol></div>"},{"titel":"Geen opzet of schuld nodig; strafmaat (vervolg)","kind":"kaart","html":"<h2 class=\"ptitle\">Geen opzet of schuld nodig; strafmaat (vervolg)</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Geen opzet of schuld nodig; strafmaat</div><div class=\"kaart-b\"><p>De straf is ten hoogste drie maanden hechtenis of een geldboete van de derde categorie. De wetgever heeft dat strafmaximum bewust hoger gesteld dan bij sommige andere overlastovertredingen in de publieke ruimte.<sup class=\"fn\">1</sup></p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114.</li></ol></div>"},{"titel":"Bestanddelen-checklist","kind":"figuur","html":"<div class=\"figcap\">Bestanddelen-checklist</div><figure class=\"illu\"><svg viewBox=\"0 0 560 408\" role=\"img\" aria-labelledby=\"bd-t bd-d\" font-family=\"'Outfit',system-ui,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n<title id=\"bd-t\">Wettelijke bestanddelen van artikel 429ter Sr</title>\n<desc id=\"bd-d\">Vier bestanddelen die alle vier vervuld moeten zijn: in het openbaar; indringend seksueel benaderen; door opmerkingen, gebaren, geluiden of aanrakingen; en geobjectiveerd vreesaanjagend, vernederend, kwetsend of onterend. Zijn alle vier vervuld, dan is het delict voltooid; ontbreekt er één, dan niet.</desc>\n<rect x=\"20\" y=\"14\" width=\"520\" height=\"56\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.7\"/><circle cx=\"50\" cy=\"42\" r=\"15\" fill=\"var(--blauw)\"/><text x=\"50\" y=\"47\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--wit)\">1</text><text x=\"78\" y=\"39\" font-size=\"21\" font-weight=\"600\" fill=\"currentColor\">In het openbaar</text><text x=\"78\" y=\"60\" class=\"il-sub\" fill=\"var(--tekst-mid)\">fysiek of online</text>\n<rect x=\"20\" y=\"78\" width=\"520\" height=\"56\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.7\"/><circle cx=\"50\" cy=\"106\" r=\"15\" fill=\"var(--blauw)\"/><text x=\"50\" y=\"111\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--wit)\">2</text><text x=\"78\" y=\"103\" font-size=\"21\" font-weight=\"600\" fill=\"currentColor\">Indringend seksueel benaderen</text><text x=\"78\" y=\"124\" class=\"il-sub\" fill=\"var(--tekst-mid)\">een zekere intensiteit; niet elk contact</text>\n<rect x=\"20\" y=\"142\" width=\"520\" height=\"56\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.7\"/><circle cx=\"50\" cy=\"170\" r=\"15\" fill=\"var(--blauw)\"/><text x=\"50\" y=\"175\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--wit)\">3</text><text x=\"78\" y=\"167\" font-size=\"21\" font-weight=\"600\" fill=\"currentColor\">Door een gedraging</text><text x=\"78\" y=\"188\" class=\"il-sub4\" fill=\"var(--tekst-mid)\">opmerkingen · gebaren · geluiden · aanrakingen</text>\n<rect x=\"20\" y=\"206\" width=\"520\" height=\"56\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.7\"/><circle cx=\"50\" cy=\"234\" r=\"15\" fill=\"var(--blauw)\"/><text x=\"50\" y=\"239\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--wit)\">4</text><text x=\"78\" y=\"231\" font-size=\"21\" font-weight=\"600\" fill=\"currentColor\">Geobjectiveerd criterium</text><text x=\"78\" y=\"252\" class=\"il-sub4\" fill=\"var(--tekst-mid)\">vreesaanjagend · vernederend · kwetsend · onterend</text>\n<line x1=\"280\" y1=\"262\" x2=\"280\" y2=\"300\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/>\n<path d=\"M273 294l7 8 7-8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<rect x=\"198\" y=\"269\" width=\"164\" height=\"26\" rx=\"13\" fill=\"var(--wit)\" stroke=\"var(--grijs-mid)\" stroke-width=\"1.5\"/>\n<text x=\"280\" y=\"286\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--tekst-mid)\">alle vier vervuld</text>\n<rect x=\"20\" y=\"308\" width=\"520\" height=\"64\" rx=\"14\" fill=\"var(--groen-licht)\" stroke=\"var(--groen)\" stroke-width=\"2\"/>\n<circle cx=\"58\" cy=\"340\" r=\"19\" fill=\"var(--groen)\"/>\n<path d=\"M67 334l-11 11-5-5\" fill=\"none\" stroke=\"var(--wit)\" stroke-width=\"2.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<text x=\"90\" y=\"335\" font-size=\"22\" font-weight=\"800\" fill=\"var(--groen)\">Delict voltooid</text>\n<text x=\"90\" y=\"359\" class=\"il-sub\" fill=\"var(--tekst-mid)\">art. 429ter Sr · strafbaar</text>\n<line x1=\"28\" y1=\"384\" x2=\"40\" y2=\"396\" stroke=\"var(--rood)\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>\n<line x1=\"40\" y1=\"384\" x2=\"28\" y2=\"396\" stroke=\"var(--rood)\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>\n<text x=\"54\" y=\"395\" class=\"il-note\" fill=\"var(--rood)\">Ontbreekt er één bestanddeel, dan is het delict niet voltooid.</text>\n</svg></figure>"},{"titel":"Kort samengevat","kind":"onthoud","html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-t\">Bestanddelen-checklist</div><div class=\"kaart-b\"><ul class=\"punten\"><li>«In het openbaar» omvat ook een voor een breed publiek toegankelijke online omgeving.</li><li>De seksuele benadering kan bestaan uit opmerkingen, gebaren, geluiden of aanrakingen. Dat kan afzonderlijk of gecombineerd. De benadering kan op één of meer personen zijn gericht.</li><li>Alle bestanddelen moeten aanwezig zijn; opzet of schuld hoeft niet te worden bewezen.</li></ul></div></div>"},{"titel":"Vooruitblik: Contextbeoordeling","kind":"theory","html":"<h2 class=\"ptitle\">Vooruitblik: Contextbeoordeling</h2><div class=\"main\"><p>Het volgende onderwerp heet Contextbeoordeling. Daarin lees je hoe je de omstandigheden van het geval weegt. Zo bepaal je of aan de bestanddelen is voldaan.</p><p>Dit onderwerp geeft je de bestanddelen. De weging van duur, frequentie, plaats en overige omstandigheden komt in het volgende onderwerp aan bod. Een vaste beslisregel daarover geeft dit onderwerp nog niet.</p></div>"}],"vragen":[{"soort":"Kennisvraag","vraag":"Welke stelling over de bestanddelen van artikel 429ter Sr is juist?","opties":["Zodra de benadering vreesaanjagend is, is aan het delict voldaan.","Het delict is voltooid zodra in het openbaar een seksueel getinte opmerking wordt gemaakt.","Voor voltooiing volstaat een indringende benadering, ook zonder seksueel karakter.","Alle bestanddelen moeten zijn vervuld; ontbreekt er één, dan is het delict niet voltooid."],"juist":3,"uitleg":"Het juiste antwoord is D. Het delict kent meerdere bestanddelen: het handelen in het openbaar, het indringend seksueel benaderen van een ander, door middel van opmerkingen, gebaren, geluiden of aanrakingen, en wel op een naar objectieve maatstaven vreesaanjagende, vernederende, kwetsende of onterende wijze. Al deze bestanddelen moeten vervuld zijn. Ontbreekt er één, dan is het delict niet voltooid.[[1]] De andere antwoorden lichten telkens één element uit het geheel of laten een bestanddeel weg. Een vreesaanjagend karakter alléén is niet genoeg. Een enkele opmerking in het openbaar ook niet. En een indringende benadering zonder seksueel karakter valt buiten de bepaling.","kernregel":"Het delict is pas voltooid wanneer alle bestanddelen van artikel 429ter Sr zijn vervuld.","artikel":"Art. 429ter Sr","wet":"Wetboek van Strafrecht","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114."]},{"soort":"Kennisvraag","vraag":"Wat betekent het dat het criterium «vreesaanjagend, vernederend, kwetsend of onterend is te achten» geobjectiveerd is?","opties":["Beoordeeld wordt of de benadering naar algemene maatstaven intimiderend is, los van daderbedoeling of slachtofferbeleving.","Het slachtoffer moet aannemelijk maken dat het zich daadwerkelijk geïntimideerd heeft gevoeld.","De dader moet ten minste voorwaardelijk opzet op de intimidatie hebben gehad.","Beslissend is de persoonlijke indruk die de betrokken opsporingsambtenaar ter plaatse van de situatie heeft gekregen, gelet op diens ervaring met dergelijke gedragingen."],"juist":0,"uitleg":"Het juiste antwoord is A. Het criterium is geobjectiveerd. Beslissend is of de benadering naar algemene maatstaven intimiderend is. Je hoeft niet te bewijzen dat de dader dit heeft beoogd. Je hoeft ook niet te bewijzen dat een concreet slachtoffer de benadering daadwerkelijk zo heeft ervaren.[[1]][[2]] De andere antwoorden stellen ten onrechte een subjectieve eis of een opzeteis. Of ze beperken de maatstaf tot de persoonlijke indruk van de opsporingsambtenaar. Er geldt juist een algemene, objectieve maatstaf.","kernregel":"Het geobjectiveerde criterium toetst of de benadering naar algemene maatstaven intimiderend is, los van daderbedoeling of slachtofferbeleving.","artikel":"Art. 429ter Sr","wet":"Wetboek van Strafrecht","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 115.","Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 47 en 55."]},{"soort":"Kennisvraag","vraag":"Kan artikel 429ter Sr ook van toepassing zijn bij gedrag op sociale media?","opties":["Nee, 'in het openbaar' ziet uitsluitend op de fysieke openbare ruimte.","Ja, elke uiting op sociale media valt zonder meer onder de bepaling, ongeacht of het bericht door een breed publiek dan wel slechts door enkele volgers kan worden gezien.","Ja, mits de online omgeving voor een breed publiek toegankelijk is en met een openbare plaats gelijk te stellen is.","Ja, ook in een besloten groep, zolang meer dan twee personen kunnen meelezen."],"juist":2,"uitleg":"Het juiste antwoord is C. Het bestanddeel 'in het openbaar' is niet beperkt tot de fysieke wereld. Ook gedrag in een online omgeving valt eronder. Die omgeving moet dan wel voor een breed publiek toegankelijk zijn en daarmee met een openbare plaats gelijk te stellen zijn.[[1]] De andere antwoorden zijn onjuist. De bepaling is niet beperkt tot de fysieke openbare ruimte. Ze geldt ook niet voor iedere uiting, ongeacht de toegankelijkheid. En ze ziet niet op een besloten omgeving; die is ook bij meerdere meelezers niet openbaar.[[2]]","kernregel":"Het bestanddeel 'in het openbaar' omvat ook een online omgeving die voor een breed publiek toegankelijk is.","artikel":"Art. 429ter Sr","wet":"Wetboek van Strafrecht","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 116.","Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 54."]},{"soort":"Praktijkcasus","vraag":"Een collega stelt dat eenmalig nafluiten zonder meer strafbaar is onder artikel 429ter Sr. Wat is juist?","opties":["Ja, eenmalig nafluiten op straat vormt steeds een indringende seksuele benadering, ongeacht de plaats, het tijdstip of de overige omstandigheden van het geval.","Niet zonder meer: eenmalig nafluiten levert op zichzelf geen indringende benadering op, al kunnen de omstandigheden dat anders maken.","Nee, nafluiten valt buiten de bepaling, tenzij het gepaard gaat met een aanraking.","Ja, zodra de aangesprokene laat blijken het nafluiten niet te waarderen."],"juist":1,"uitleg":"Het juiste antwoord is B. Het bestanddeel 'indringend' markeert een ondergrens. Eén keer nafluiten of een compliment over iemands uiterlijk levert op zichzelf nog geen indringende seksuele benadering op.[[1]] De omstandigheden van het geval, zoals de plaats en het tijdstip, kunnen dat oordeel wel anders maken.[[2]] De andere antwoorden zijn onjuist. Niet elk nafluiten is zonder meer strafbaar. Het is ook niet pas strafbaar bij een aanraking. En dat de aangesprokene het nafluiten niet waardeert, is op zichzelf niet beslissend: het criterium is geobjectiveerd.","kernregel":"Eenmalig nafluiten is op zichzelf geen indringende seksuele benadering, maar de omstandigheden kunnen dat anders maken.","artikel":"Art. 429ter Sr","wet":"Wetboek van Strafrecht","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 53.","Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 54."]},{"soort":"Kennisvraag","vraag":"Moet voor een overtreding van artikel 429ter Sr opzet of schuld worden bewezen?","opties":["Ja, opzet op de intimidatie moet worden bewezen.","Alleen bewuste schuld in de zin van aanmerkelijke onvoorzichtigheid moet worden aangetoond.","Ja, voorwaardelijk opzet op het seksuele karakter van de gedraging volstaat.","Nee; als overtreding vergt de bepaling geen bewijs van opzet of schuld."],"juist":3,"uitleg":"Het juiste antwoord is D. Artikel 429ter Sr is een overtreding. Je hoeft daarom geen subjectieve bestanddelen te bewijzen, zoals opzet of schuld.[[1]] De andere antwoorden stellen ten onrechte een opzeteis of een schuldeis. Dat gebeurt in de vorm van opzet op de intimidatie, aanmerkelijke onvoorzichtigheid of voorwaardelijk opzet op het seksuele karakter. Bij deze overtreding staat het geobjectiveerde, uiterlijk waarneembare gedrag centraal.","kernregel":"Als overtreding vergt artikel 429ter Sr geen bewijs van opzet of schuld.","artikel":"Art. 429ter Sr","wet":"Wetboek van Strafrecht","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114."]},{"soort":"Praktijkcasus","vraag":"Praktijkcasus. Op een druk marktplein roept een man één keer een langslopende vrouw na. Hij staat op enkele meters afstand en maakt een seksueel getinte opmerking. Daarna loopt hij door. Verdere omstandigheden ontbreken. Is op grond van deze feiten aan alle bestanddelen van artikel 429ter Sr voldaan?","opties":["Ja: een enkele seksueel getinte opmerking in het openbaar levert reeds een voltooid delict op, ongeacht de verdere omstandigheden.","Nee: een eenmalige opmerking op afstand, zonder bijkomende omstandigheden, haalt de ondergrens van een indringende seksuele benadering niet.","Ja, doorslaggevend is dat de aangesproken vrouw zich blijkens haar reactie daadwerkelijk geïntimideerd voelde.","Nee, doorslaggevend is dat opzet op de intimidatie in dit geval niet kan worden bewezen."],"juist":1,"uitleg":"Het juiste antwoord is B. Voor een voltooid delict moeten álle bestanddelen zijn vervuld. Daar hoort een indringende seksuele benadering bij. Het bestanddeel 'indringend' markeert een ondergrens. Een eenmalige opmerking op afstand blijft daaronder als bijkomende omstandigheden ontbreken. Denk bij die omstandigheden aan herhaling, achtervolgen of een besloten of dreigende situatie.[[1]] De context kan dat oordeel anders maken, maar die bijkomende omstandigheden ontbreken hier. De andere antwoorden zijn onjuist. Een enkele seksueel getinte opmerking is niet genoeg. De subjectieve beleving van het slachtoffer is niet beslissend, want het criterium is geobjectiveerd. En het ontbreken van opzet is niet de reden, omdat opzet bij deze overtreding niet hoeft te worden bewezen.","kernregel":"Een eenmalige opmerking op afstand, zonder bijkomende omstandigheden, haalt de ondergrens van de indringende seksuele benadering niet.","artikel":"Art. 429ter Sr","wet":"Wetboek van Strafrecht","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 46, 49 en 53."]}]},{"id":"m4","nr":4,"titel":"Contextbeoordeling","kader":"Art. 429ter Sr","icoon":"oog","type":"content","pages":[{"titel":"Leerdoelen","kind":"lo","html":"<h2 class=\"ptitle\">Leerdoelen</h2><p class=\"pintro\">Wat je na dit onderwerp kunt.</p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen waarom de context bepalend is bij de beoordeling van artikel 429ter Sr;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>de omstandigheden benoemen die de beoordeling inkleuren (duur, frequentie, pleegplaats, omgeving);</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen dat inhoud en context «communicerende vaten» zijn;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>herkennen dat dezelfde gedraging afhankelijk van de context wél of niet strafbaar kan zijn;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen waarom de omstandigheden zorgvuldig moeten worden vastgelegd.</span></li></ul>"},{"titel":"Introductie: van bestanddelen naar context","kind":"theory","html":"<h2 class=\"ptitle\">Introductie: van bestanddelen naar context</h2><div class=\"main\"><p>In het vorige onderwerp heb je de bestanddelen behandeld. Of aan die bestanddelen is voldaan, kun je niet in het algemeen vaststellen. Dat hangt af van de omstandigheden van het geval.</p><p>In dit onderwerp lees je hoe je de context weegt. De rechtspraak en de bewijsvoering komen pas in latere onderwerpen aan bod.</p></div>"},{"titel":"Inhoud en context: communicerende vaten","kind":"theory","html":"<h2 class=\"ptitle\">Inhoud en context: communicerende vaten</h2><div class=\"main\"><p>Bij de vraag of sprake is van een strafbare seksuele benadering tellen twee dingen mee: de inhoud van de benadering en de context waarin die plaatsvindt.</p><p>De wetgever noemt die twee «communicerende vaten». Is de inhoud op zichzelf onvoldoende, dan kan de context de strafbaarheid alsnog vestigen.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 117.</li></ol></div>"},{"titel":"Inhoud en context: communicerende vaten","kind":"figuur","html":"<div class=\"figcap\">Inhoud en context: communicerende vaten</div><figure class=\"illu\"><svg viewBox=\"0 0 560 434\" role=\"img\" aria-labelledby=\"ctx-t ctx-d\" font-family=\"'Outfit',system-ui,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n<title id=\"ctx-t\">Contextbeoordeling: inhoud en context als communicerende vaten</title>\n<desc id=\"ctx-d\">De inhoud van de uiting en de context beïnvloeden elkaar. Voorbeelden van omstandigheden — duur, herhaling, afstand, plaats, tijdstip, reactie op afwijzing en kwetsbare positie — wegen samen mee. Geen enkele omstandigheid is op zichzelf beslissend; het totaalbeeld van inhoud en context bepaalt de beoordeling naar algemene maatstaven.</desc>\n<rect x=\"20\" y=\"14\" width=\"520\" height=\"66\" rx=\"14\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<text x=\"44\" y=\"42\" font-size=\"20\" font-weight=\"700\" fill=\"currentColor\">Inhoud van de uiting</text>\n<text x=\"44\" y=\"66\" class=\"il-sub\" fill=\"var(--tekst-mid)\">woorden · gebaren · aanrakingen</text>\n<line x1=\"280\" y1=\"80\" x2=\"280\" y2=\"118\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/>\n<path d=\"M275 88l5 -6l5 6\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<path d=\"M275 112l5 6l5 -6\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<rect x=\"188\" y=\"87\" width=\"184\" height=\"24\" rx=\"12\" fill=\"var(--wit)\" stroke=\"var(--grijs-mid)\" stroke-width=\"1.5\"/>\n<text x=\"280\" y=\"103\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--blauw-licht)\">communicerende vaten</text>\n<rect x=\"20\" y=\"120\" width=\"520\" height=\"150\" rx=\"14\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<text x=\"44\" y=\"150\" font-size=\"20\" font-weight=\"700\" fill=\"currentColor\">Context en omstandigheden (voorbeelden)</text>\n<circle cx=\"44\" cy=\"180\" r=\"3.5\" fill=\"var(--blauw-licht)\"/><text x=\"58\" y=\"185\" class=\"il-sub\" fill=\"var(--tekst-mid)\">duur</text>\n<circle cx=\"44\" cy=\"208\" r=\"3.5\" fill=\"var(-
