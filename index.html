ud en context: communicerende vaten</div><figure class=\"illu\"><svg viewBox=\"0 0 560 434\" role=\"img\" aria-labelledby=\"ctx-t ctx-d\" font-family=\"'Outfit',system-ui,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n<title id=\"ctx-t\">Contextbeoordeling: inhoud en context als communicerende vaten</title>\n<desc id=\"ctx-d\">De inhoud van de uiting en de context beïnvloeden elkaar. Verschillende omstandigheden wegen samen mee. Voorbeelden zijn: de duur, de herhaling, de afstand, de plaats, het tijdstip, de reactie op een afwijzing en een kwetsbare positie. Geen enkele omstandigheid is op zichzelf beslissend. Je beoordeelt het totaalbeeld van de inhoud en de context volgens algemene maatstaven.</desc>\n<rect x=\"20\" y=\"14\" width=\"520\" height=\"66\" rx=\"14\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<text x=\"44\" y=\"42\" font-size=\"20\" font-weight=\"700\" fill=\"currentColor\">Inhoud van de uiting</text>\n<text x=\"44\" y=\"66\" class=\"il-sub\" fill=\"var(--tekst-mid)\">woorden · gebaren · aanrakingen</text>\n<line x1=\"280\" y1=\"80\" x2=\"280\" y2=\"118\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/>\n<path d=\"M275 88l5 -6l5 6\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<path d=\"M275 112l5 6l5 -6\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<rect x=\"188\" y=\"87\" width=\"184\" height=\"24\" rx=\"12\" fill=\"var(--wit)\" stroke=\"var(--grijs-mid)\" stroke-width=\"1.5\"/>\n<text x=\"280\" y=\"103\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--blauw-licht)\">communicerende vaten</text>\n<rect x=\"20\" y=\"120\" width=\"520\" height=\"150\" rx=\"14\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<text x=\"44\" y=\"150\" font-size=\"20\" font-weight=\"700\" fill=\"currentColor\">Context en omstandigheden (voorbeelden)</text>\n<circle cx=\"44\" cy=\"180\" r=\"3.5\" fill=\"var(--blauw-licht)\"/><text x=\"58\" y=\"185\" class=\"il-sub\" fill=\"var(--tekst-mid)\">duur</text>\n<circle cx=\"44\" cy=\"208\" r=\"3.5\" fill=\"var(--blauw-licht)\"/><text x=\"58\" y=\"213\" class=\"il-sub\" fill=\"var(--tekst-mid)\">herhaling</text>\n<circle cx=\"44\" cy=\"236\" r=\"3.5\" fill=\"var(--blauw-licht)\"/><text x=\"58\" y=\"241\" class=\"il-sub\" fill=\"var(--tekst-mid)\">afstand</text>\n<circle cx=\"300\" cy=\"180\" r=\"3.5\" fill=\"var(--blauw-licht)\"/><text x=\"314\" y=\"185\" class=\"il-sub\" fill=\"var(--tekst-mid)\">plaats · tijdstip</text>\n<circle cx=\"300\" cy=\"208\" r=\"3.5\" fill=\"var(--blauw-licht)\"/><text x=\"314\" y=\"213\" class=\"il-sub\" fill=\"var(--tekst-mid)\">reactie op afwijzing</text>\n<circle cx=\"300\" cy=\"236\" r=\"3.5\" fill=\"var(--blauw-licht)\"/><text x=\"314\" y=\"241\" class=\"il-sub\" fill=\"var(--tekst-mid)\">kwetsbare positie</text>\n<line x1=\"280\" y1=\"270\" x2=\"280\" y2=\"300\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/>\n<path d=\"M273 294l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<rect x=\"20\" y=\"306\" width=\"520\" height=\"64\" rx=\"14\" fill=\"var(--oranje-licht)\" stroke=\"var(--oranje)\" stroke-width=\"2\"/>\n<circle cx=\"58\" cy=\"338\" r=\"15\" fill=\"none\" stroke=\"var(--oranje)\" stroke-width=\"2.5\"/><circle cx=\"58\" cy=\"338\" r=\"4\" fill=\"var(--oranje)\"/>\n<text x=\"92\" y=\"331\" font-size=\"21\" font-weight=\"700\" fill=\"currentColor\">Totaalbeeld</text>\n<text x=\"92\" y=\"356\" class=\"il-sub\" fill=\"var(--tekst-mid)\">naar algemene maatstaven beoordeeld</text>\n<text x=\"280\" y=\"394\" text-anchor=\"middle\" class=\"il-note\" font-style=\"italic\" fill=\"var(--tekst-mid)\">Geen enkele omstandigheid is op zichzelf beslissend;</text>\n<text x=\"280\" y=\"416\" text-anchor=\"middle\" class=\"il-note\" font-style=\"italic\" fill=\"var(--tekst-mid)\">het totaalbeeld bepaalt de beoordeling.</text>\n</svg></figure>","kind":"figuur","titel":"Inhoud en context: communicerende vaten"},{"html":"<h2 class=\"ptitle\">Welke omstandigheden wegen mee?</h2><div class=\"main\"><p>Verschillende omstandigheden kunnen de beoordeling beïnvloeden. Denk aan de duur van de seksuele benadering en hoe vaak deze plaatsvindt. Kijk ook naar de vorm van de benadering. En aan de omgeving of situatie waarin de benadering plaatsvindt.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 117.</li></ol></div>","kind":"theory","titel":"Welke omstandigheden wegen mee?"},{"html":"<h2 class=\"ptitle\">Welke omstandigheden wegen mee? (vervolg)</h2><div class=\"main\"><p>Ook de Nota naar aanleiding van het verslag noemt de duur, hoe vaak het gebeurt en de plaats waar het gebeurt. Deze omstandigheden tellen mee bij de beoordeling.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 47.</li></ol></div>","kind":"theory","titel":"Welke omstandigheden wegen mee? (vervolg)"},{"html":"<div class=\"figcap\">Zelfde gedraging, andere context</div><figure class=\"illu\"><svg viewBox=\"0 0 560 300\" role=\"img\" aria-labelledby=\"cx2-t cx2-d\" font-family=\"'Outfit',system-ui,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n<title id=\"cx2-t\">Zelfde gedraging, andere context</title>\n<desc id=\"cx2-d\">Een gedraging die op een druk plein bij daglicht meestal geen indringende seksuele benadering oplevert, kan dat in een verlaten, donker steegje wel zijn. Dezelfde gedraging; de context bepaalt de uitkomst.</desc>\n<rect x=\"20\" y=\"20\" width=\"250\" height=\"196\" rx=\"14\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<circle cx=\"145\" cy=\"66\" r=\"16\" fill=\"none\" stroke=\"var(--oranje)\" stroke-width=\"2.2\"/>\n<g stroke=\"var(--oranje)\" stroke-width=\"2.2\" stroke-linecap=\"round\"><line x1=\"145\" y1=\"40\" x2=\"145\" y2=\"46\"/><line x1=\"145\" y1=\"86\" x2=\"145\" y2=\"92\"/><line x1=\"119\" y1=\"66\" x2=\"125\" y2=\"66\"/><line x1=\"165\" y1=\"66\" x2=\"171\" y2=\"66\"/><line x1=\"127\" y1=\"48\" x2=\"131\" y2=\"52\"/><line x1=\"159\" y1=\"80\" x2=\"163\" y2=\"84\"/><line x1=\"163\" y1=\"48\" x2=\"159\" y2=\"52\"/><line x1=\"131\" y1=\"80\" x2=\"127\" y2=\"84\"/></g>\n<text x=\"145\" y=\"128\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Plein · daglicht</text>\n<text x=\"145\" y=\"150\" text-anchor=\"middle\" class=\"il-sub\" fill=\"var(--tekst-mid)\">druk, zichtbaar</text>\n<text x=\"145\" y=\"190\" text-anchor=\"middle\" class=\"il-note\" fill=\"var(--tekst-mid)\">meestal geen delict</text>\n<rect x=\"290\" y=\"20\" width=\"250\" height=\"196\" rx=\"14\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<path d=\"M425 54a16 16 0 1 0 10 26a13 13 0 0 1 -10 -26z\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/>\n<text x=\"415\" y=\"128\" text-anchor=\"middle\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Steegje · donker</text>\n<text x=\"415\" y=\"150\" text-anchor=\"middle\" class=\"il-sub\" fill=\"var(--tekst-mid)\">verlaten</text>\n<text x=\"415\" y=\"190\" text-anchor=\"middle\" class=\"il-note\" font-weight=\"700\" fill=\"var(--oranje)\">kan wél een delict zijn</text>\n<text x=\"280\" y=\"250\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"800\" fill=\"var(--zilver)\">≠</text>\n<text x=\"280\" y=\"284\" text-anchor=\"middle\" class=\"il-note\" font-style=\"italic\" fill=\"currentColor\">Dezelfde gedraging; de context bepaalt de uitkomst.</text>\n</svg></figure>","kind":"figuur","titel":"Zelfde gedraging, andere context"},{"html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Niet alleen de woorden tellen</h2><p class=\"lees\">Bij de beoordeling kijk je niet alleen naar wat iemand zegt. Ook de manier waarop, de herhaling, de afstand, het volgen en de omstandigheden kunnen van belang zijn.</p><div class=\"irow\"><div class=\"irow-b\"><p><b>Vraag jezelf als BOA af:</b></p><p><em>“Wat zie en hoor ik precies, en wat maakt deze situatie anders?”</em></p></div></div>","kind":"casus","titel":"Niet alleen de woorden tellen"},{"html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Zelfde gedraging, andere context (vervolg)</h2><p class=\"lees\">Sommige gedragingen zijn op een plein bij daglicht geen indringende seksuele benadering. In een smal steegje in het donker kunnen ze dat wél zijn.<sup class=\"fn\">1</sup><sup class=\"fn\">2</sup></p><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 54.</li><li>Vergelijk Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 117-118.</li></ol></div>","kind":"casus","titel":"Zelfde gedraging, andere context (vervolg)"},{"html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Zelfde gedraging, andere context — betekenis</h2><div class=\"kaart k-voorbeeld\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/></svg></span><span class=\"kaart-lab\">Voorbeeld</span></div><div class=\"kaart-t\">Betekenis voor de praktijk</div><div class=\"kaart-b\"><p>Praktijkvoorbeeld: welke omstandigheden zou je hier vastleggen om de context te kunnen beoordelen? Leg de feiten en omstandigheden zorgvuldig vast. Het OM beoordeelt daarna de zaak en beslist over de afdoening. Hoe die afdoening werkt, komt bij Bewijs en proces-verbaal aan bod.</p></div></div>","kind":"casus","titel":"Zelfde gedraging, andere context — betekenis"},{"html":"<h2 class=\"ptitle\">Context en het geobjectiveerde criterium</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Context en het geobjectiveerde criterium</div><div class=\"kaart-b\"><p>Let op: het criterium is geobjectiveerd. De context helpt je bepalen of de benadering naar algemene maatstaven intimiderend is. Je hoeft dus niet te bewijzen dat het slachtoffer zich echt geïntimideerd heeft gevoeld.<sup class=\"fn\">1</sup></p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 47.</li></ol></div>","kind":"kaart","titel":"Context en het geobjectiveerde criterium"},{"html":"<h2 class=\"ptitle\">Leg de omstandigheden vast</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Leg de omstandigheden vast</div><div class=\"kaart-b\"><p>De context kan bepalend zijn. Leg de omstandigheden daarom feitelijk en volledig vast. Noteer bijvoorbeeld de plaats, het tijdstip, de duur, hoe vaak het gebeurde, de manier van benaderen en de zichtbare reactie. Hoe je dit in een proces-verbaal verwerkt, komt in een later onderwerp aan bod.</p><p>Let op: dit is praktijkuitleg. De wetgever zegt dit niet letterlijk zo.</p></div></div>","kind":"kaart","titel":"Leg de omstandigheden vast"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>Je beoordeelt de bestanddelen aan de hand van de omstandigheden van het geval.</li><li>Inhoud en context zijn communicerende vaten: ze beïnvloeden elkaar.</li><li>De duur, hoe vaak het gebeurt, de plaats en de omgeving tellen mee.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>Dezelfde gedraging kan door de context wél of niet strafbaar zijn.</li><li>Leg de omstandigheden zorgvuldig en feitelijk vast.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Vooruitblik: Rechtspraak</h2><div class=\"main\"><p>In het volgende onderwerp zie je hoe rechters de bestanddelen en de context in echte zaken toepassen.</p><p>Zo krijg je een beeld van waar de grens in de praktijk ligt. Er bestaat geen regel die in iedere situatie dezelfde uitkomst geeft.</p></div>","kind":"theory","titel":"Vooruitblik: Rechtspraak"}],"titel":"Contextbeoordeling","type":"content","vragen":[{"artikel":"Art. 429ter Sr","juist":0,"kernregel":"De inhoud van het gedrag en de omstandigheden beïnvloeden elkaar. De wetgever noemt dit ‘communicerende vaten’.","opties":["De inhoud en de omstandigheden beïnvloeden elkaar. De omstandigheden kunnen ervoor zorgen dat gedrag toch strafbaar is.","Alleen de inhoud van de uiting telt. De omstandigheden kunnen het oordeel niet veranderen.","Alleen de omstandigheden tellen. De inhoud van de uiting is niet belangrijk.","De rechter beoordeelt de inhoud en de omstandigheden volledig los van elkaar."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is A. De wetgever noemt de inhoud en de omstandigheden ‘communicerende vaten’. Dit betekent dat ze elkaar beïnvloeden. Een uiting die op zichzelf niet voldoende is, kan door de omstandigheden toch onder de strafbepaling vallen.[[1]] De andere antwoorden houden geen rekening met deze wisselwerking.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 117."],"vraag":"Wat bedoelt de wetgever met «communicerende vaten» bij artikel 429ter Sr?","wet":"Wetboek van Strafrecht"},{"artikel":"Art. 429ter Sr","juist":2,"kernregel":"Onder andere de duur, hoe vaak het gebeurde, de vorm van het gedrag en de plaats tellen mee.","opties":["Alleen het aantal mensen dat aanwezig was.","Alleen het strafblad van de verdachte.","Onder andere de duur, hoe vaak het gebeurde, de vorm van het gedrag en de plaats.","Alleen de vraag of de betrokken personen vóór het incident een relatie hadden."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is C. De wetsgeschiedenis noemt onder andere de duur, hoe vaak het gebeurde, de vorm van het gedrag en de plaats of omgeving.[[1]][[2]] De rechter beoordeelt verschillende omstandigheden samen. Eén omstandigheid is meestal niet alleen beslissend.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 117.","Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 47."],"vraag":"Welke omstandigheden tellen volgens de wetsgeschiedenis mee bij de beoordeling?","wet":"Wetboek van Strafrecht"},{"artikel":"Art. 429ter Sr","juist":1,"kernregel":"Door de omstandigheden kan hetzelfde gedrag in de ene situatie wel en in de andere situatie niet onder artikel 429ter Sr vallen.","opties":["Nee. Hetzelfde gedrag krijgt altijd dezelfde beoordeling.","Ja. De plaats, het tijdstip en andere omstandigheden kunnen het oordeel veranderen.","Ja, maar alleen als de aangesproken persoon letsel of schade heeft.","Nee. Alleen de woorden van de verdachte bepalen of het gedrag strafbaar is."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is B. De wetgever geeft hiervan een voorbeeld. Op een plein bij daglicht is bepaald gedrag mogelijk niet indringend. Hetzelfde gedrag kan in een smal steegje in het donker wel indringend zijn.[[1]] Letsel is geen vereiste. Ook zijn niet alleen de gebruikte woorden beslissend.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 54."],"vraag":"Kan dezelfde gedraging in de ene situatie wél en in de andere niet onder artikel 429ter Sr vallen?","wet":"Wetboek van Strafrecht"},{"artikel":"Art. 429ter Sr","juist":3,"kernregel":"De omstandigheden helpen bij de beoordeling volgens algemene maatstaven. De persoonlijke ervaring van het slachtoffer is niet beslissend.","opties":["De omstandigheden bewijzen hoe het slachtoffer zich persoonlijk voelde.","Door de omstandigheden moet ook opzet worden bewezen.","De persoonlijke indruk van de opsporingsambtenaar vervangt de algemene maatstaven.","De omstandigheden helpen om het gedrag volgens algemene maatstaven te beoordelen."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is D. De omstandigheden helpen bepalen of de benadering volgens algemene maatstaven intimiderend is. Je hoeft niet te bewijzen hoe het slachtoffer de situatie persoonlijk heeft beleefd.[[1]] Ook hoef je geen opzet te bewijzen. De persoonlijke mening van de opsporingsambtenaar is niet beslissend.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 7 (Nota naar aanleiding van het verslag), p. 47."],"vraag":"Welke rol spelen de omstandigheden bij het geobjectiveerde criterium?","wet":"Wetboek van Strafrecht"}]},{"icoon":"book","id":"m5","kader":"Art. 429ter Sr","nr":5,"pages":[{"html":"<h2 class=\"ptitle\">Leerdoelen</h2><p class=\"pintro\">Wat je na dit onderwerp kunt.</p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen hoe rechters de bestanddelen van artikel 429ter Sr in echte zaken toepassen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen dat de rechter het gedrag volgens algemene maatstaven beoordeelt. Dit heet een geobjectiveerd criterium;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen welke rol de context speelt in de beoordeling door de rechter;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen welke waarde de waarnemingen van opsporingsambtenaren als bewijs kunnen hebben;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen wat kwalificatie en tenlastelegging betekenen en waarom deze van elkaar kunnen verschillen.</span></li></ul>","kind":"lo","titel":"Leerdoelen"},{"html":"<h2 class=\"ptitle\">Inleiding: waarom rechtspraak lezen?</h2><div class=\"main\"><p>Artikel 429ter Sr geldt sinds 1 juli 2024. Kort nadat het artikel in werking trad, zijn op rechtspraak.nl de eerste strafzaken gepubliceerd. Die uitspraken laten zien hoe rechters de bestanddelen en de context in echte zaken toepassen. Die bestanddelen en die context ken je uit de vorige onderwerpen.</p></div>","kind":"theory","titel":"Inleiding: waarom rechtspraak lezen?"},{"html":"<h2 class=\"ptitle\">Inleiding: waarom rechtspraak lezen? (vervolg)</h2><div class=\"main\"><p>De uitspraken hierna zijn officieel gepubliceerd. Je herkent ze aan het ECLI-nummer. Samen vormen deze uitspraken de rechtspraak. Rechtspraak is een bron naast de wettekst en de wetsgeschiedenis. De wetsgeschiedenis bestaat uit documenten waarin de wetgever de wet uitlegt. Andere rechters hoeven zich niet aan een uitspraak van een rechtbank te houden. Zo'n uitspraak laat zien hoe de bepaling is toegepast. Het is geen vaste beslisregel.</p></div>","kind":"theory","titel":"Inleiding: waarom rechtspraak lezen? (vervolg)"},{"html":"<div class=\"figcap\">Inleiding: waarom rechtspraak lezen?</div><figure class=\"illu\"><svg viewBox=\"0 0 560 372\" role=\"img\" aria-labelledby=\"tl-t tl-d\" font-family=\"'Outfit',system-ui,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n<title id=\"tl-t\">Eerste gepubliceerde strafzaken over artikel 429ter Sr</title>\n<desc id=\"tl-d\">Artikel 429ter Sr geldt sinds 1 juli 2024. Daarna zijn onder meer drie uitspraken gepubliceerd. De rechtbank Rotterdam op 2 oktober 2024: de eerste strafzaak. De rechtbank Midden-Nederland op 7 oktober 2024: de kwalificatie vernederend. De rechtbank Amsterdam op 21 februari 2025: een uitspraak van de meervoudige kamer.</desc>\n<line x1=\"44\" y1=\"40\" x2=\"44\" y2=\"300\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/>\n<circle cx=\"44\" cy=\"66\" r=\"8\" fill=\"var(--blauw)\"/>\n<rect x=\"72\" y=\"34\" width=\"468\" height=\"66\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<text x=\"92\" y=\"64\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Rb Rotterdam — 2 okt 2024</text><text x=\"92\" y=\"86\" class=\"il-sub\" fill=\"var(--tekst-mid)\">eerste strafzaak</text>\n<circle cx=\"44\" cy=\"166\" r=\"8\" fill=\"var(--blauw)\"/>\n<rect x=\"72\" y=\"134\" width=\"468\" height=\"66\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<text x=\"92\" y=\"164\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Rb Midden-Nederland — 7 okt 2024</text><text x=\"92\" y=\"186\" class=\"il-sub\" fill=\"var(--tekst-mid)\">kwalificatie: vernederend</text>\n<circle cx=\"44\" cy=\"266\" r=\"8\" fill=\"var(--blauw)\"/>\n<rect x=\"72\" y=\"234\" width=\"468\" height=\"66\" rx=\"12\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.8\"/>\n<text x=\"92\" y=\"264\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Rb Amsterdam — 21 feb 2025</text><text x=\"92\" y=\"286\" class=\"il-sub\" fill=\"var(--tekst-mid)\">meervoudige kamer</text>\n<text x=\"280\" y=\"344\" text-anchor=\"middle\" class=\"il-note\" font-style=\"italic\" fill=\"var(--tekst-mid)\">Eerste gepubliceerde strafzaken sinds 1 juli 2024.</text>\n</svg></figure>","kind":"figuur","titel":"Inleiding: waarom rechtspraak lezen?"},{"html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Rb Rotterdam 2 oktober 2024: de eerste strafzaak</h2><p class=\"lees\">De kantonrechter van de rechtbank Rotterdam beoordeelde op 2 oktober 2024 de eerste strafzaak onder artikel 429ter Sr.<sup class=\"fn\">1</sup> Op het Schouwburgplein pakte de verdachte een voor hem wildvreemde vrouw bij de heupen vast.</p><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Rb Rotterdam 2 oktober 2024, ECLI:NL:RBROT:2024:9612.</li></ol></div>","kind":"casus","titel":"Rb Rotterdam 2 oktober 2024: de eerste strafzaak"},{"html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Rb Rotterdam 2 oktober 2024: de eerste strafzaak (vervolg)</h2><p class=\"lees\">Het bewijs bestond uit twee processen-verbaal. Die waren opgemaakt door opsporingsambtenaren die in burger surveilleerden. Een aangifte en camerabeelden ontbraken. De kantonrechter legde een geldboete op van € 280, waarvan € 180 voorwaardelijk.</p>","kind":"casus","titel":"Rb Rotterdam 2 oktober 2024: de eerste strafzaak (vervolg)"},{"html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Rb Rotterdam 2 oktober 2024: de eerste strafzaak — betekenis</h2><div class=\"kaart k-voorbeeld\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/></svg></span><span class=\"kaart-lab\">Voorbeeld</span></div><div class=\"kaart-t\">Betekenis voor de praktijk</div><div class=\"kaart-b\"><p>Dit is de eerste gepubliceerde strafzaak onder de nieuwe bepaling. Dat is belangrijk voor de praktijk. De waarnemingen van de opsporingsambtenaren vormden op zichzelf voldoende bewijs. Een aangifte van het slachtoffer is dus niet nodig.<sup class=\"fn\">1</sup> In deze zaak keek de rechter ook of het optreden niet zwaarder was dan nodig. Dit heet proportionaliteit. Daarbij ging het vooral om het verschil tussen undercoverinzet en lokinzet. Wat betekent dit voor jouw werk? Je eigen, feitelijke waarneming kan het bewijs zijn waarop de zaak rust. Leg die waarneming daarom nauwkeurig vast.</p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Rb Rotterdam 2 oktober 2024, ECLI:NL:RBROT:2024:9612.</li></ol></div>","kind":"casus","titel":"Rb Rotterdam 2 oktober 2024: de eerste strafzaak — betekenis"},{"html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Rb Midden-Nederland 7 oktober 2024: kwalificatie «vernederend»</h2><p class=\"lees\">De kantonrechter van de rechtbank Midden-Nederland beoordeelde op 7 oktober 2024 een andere zaak. De verdachte maakte daarin een expliciet seksuele opmerking tegen twee politieagentes die aan het werk waren.<sup class=\"fn\">1</sup></p><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Rb Midden-Nederland 7 oktober 2024, ECLI:NL:RBMNE:2024:5727.</li></ol></div>","kind":"casus","titel":"Rb Midden-Nederland 7 oktober 2024: kwalificatie «vernederend»"},{"html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Rb Midden-Nederland 7 oktober 2024: kwalificatie «vernederend» (vervolg)</h2><p class=\"lees\">De rechter beoordeelde het gedrag als vernederend, kwetsend en onterend. De rechter vond het gedrag niet ook vreesaanjagend.</p>","kind":"casus","titel":"Rb Midden-Nederland 7 oktober 2024: kwalificatie «vernederend» (vervolg)"},{"html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Rb Midden-Nederland 7 oktober 2024: kwalificatie «vernederend» — betekenis</h2><div class=\"kaart k-voorbeeld\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/></svg></span><span class=\"kaart-lab\">Voorbeeld</span></div><div class=\"kaart-t\">Betekenis voor de praktijk</div><div class=\"kaart-b\"><p>Artikel 429ter Sr noemt vier mogelijke kenmerken: vreesaanjagend, vernederend, kwetsend of onterend. Eén van deze kenmerken kan voldoende zijn. Het is dus niet nodig dat het slachtoffer bang wordt. Beschrijf feitelijk wat er is gezegd of gedaan. Zo kan de rechter de passende kwalificatie kiezen.<sup class=\"fn\">1</sup></p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Rb Midden-Nederland 7 oktober 2024, ECLI:NL:RBMNE:2024:5727.</li></ol></div>","kind":"casus","titel":"Rb Midden-Nederland 7 oktober 2024: kwalificatie «vernederend» — betekenis"},{"html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Rb Amsterdam 21 februari 2025: meervoudige kamer</h2><p class=\"lees\">De meervoudige kamer van de rechtbank Amsterdam deed op 21 februari 2025 uitspraak in een zaak met meerdere feiten. Artikel 429ter Sr was daar één van.<sup class=\"fn\">1</sup> Een meervoudige kamer bestaat uit drie rechters. De bepaling kan dus onderdeel zijn van een bredere strafzaak.</p><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Rb Amsterdam 21 februari 2025, ECLI:NL:RBAMS:2025:1220.</li></ol></div>","kind":"casus","titel":"Rb Amsterdam 21 februari 2025: meervoudige kamer"},{"html":"<span class=\"q-soort\">Voorbeeld</span><h2 class=\"ptitle\">Rb Amsterdam 21 februari 2025: meervoudige kamer — betekenis</h2><div class=\"kaart k-voorbeeld\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/></svg></span><span class=\"kaart-lab\">Voorbeeld</span></div><div class=\"kaart-t\">Betekenis voor de praktijk</div><div class=\"kaart-b\"><p>Uit deze uitspraak volgen twee punten. Ook een meervoudige kamer past de bepaling toe. Een overtreding kan ook onderdeel zijn van een strafzaak met meerdere feiten.<sup class=\"fn\">1</sup> Een zorgvuldig proces-verbaal bevat de feiten die nodig zijn om de zaak te beoordelen.</p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Rb Amsterdam 21 februari 2025, ECLI:NL:RBAMS:2025:1220.</li></ol></div>","kind":"casus","titel":"Rb Amsterdam 21 februari 2025: meervoudige kamer — betekenis"},{"html":"<h2 class=\"ptitle\">Over de aangehaalde rechtspraak</h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg></span><span class=\"kaart-lab\">Let op</span></div><div class=\"kaart-t\">Over de aangehaalde rechtspraak</div><div class=\"kaart-b\"><p>In deze opleiding gebruiken we alleen uitspraken die officieel zijn gepubliceerd en gecontroleerd. De leerpunten hierna zijn gebaseerd op de wettekst, de parlementaire geschiedenis en die bevestigde rechtspraak.</p></div></div>","kind":"kaart","titel":"Over de aangehaalde rechtspraak"},{"html":"<h2 class=\"ptitle\">De rode draad in de rechtspraak</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">De rode draad in de rechtspraak</div><div class=\"kaart-b\"><p>Uit de bevestigde uitspraken en de wetsgeschiedenis komen vier vaste punten naar voren. Let op: dit is een samenvatting voor de praktijk. Het is geen aparte rechtsregel. Punt 1: de rechter gebruikt een geobjectiveerd criterium. Dat wil zeggen: hij toetst aan algemene maatstaven. Hij kijkt dus niet naar de beleving van het slachtoffer of de bedoeling van de dader.<sup class=\"fn\">1</sup></p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 117.</li></ol></div>","kind":"kaart","titel":"De rode draad in de rechtspraak"},{"html":"<h2 class=\"ptitle\">De rode draad in de rechtspraak (vervolg)</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">De rode draad in de rechtspraak</div><div class=\"kaart-b\"><p>Punt 2: waarnemingen van opsporingsambtenaren kunnen voldoende bewijs opleveren, ook zonder aangifte.<sup class=\"fn\">1</sup> Punt 3: de omstandigheden beïnvloeden de ernst en de juridische beoordeling.<sup class=\"fn\">2</sup></p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Rb Rotterdam 2 oktober 2024, ECLI:NL:RBROT:2024:9612.</li><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 117.</li></ol></div>","kind":"kaart","titel":"De rode draad in de rechtspraak (vervolg)"},{"html":"<h2 class=\"ptitle\">De rode draad in de rechtspraak (vervolg)</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">De rode draad in de rechtspraak</div><div class=\"kaart-b\"><p>Punt 4: de rechter bepaalt de kwalificatie. Dit is de juridische naam van het bewezen feit. De kwalificatie kan beperkter zijn dan de tenlastelegging. De tenlastelegging is de omschrijving van het feit waarvan het Openbaar Ministerie de verdachte beschuldigt. Een voorbeeld is de kwalificatie vernederend, kwetsend en onterend in plaats van vreesaanjagend.<sup class=\"fn\">1</sup></p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Rb Midden-Nederland 7 oktober 2024, ECLI:NL:RBMNE:2024:5727.</li></ol></div>","kind":"kaart","titel":"De rode draad in de rechtspraak (vervolg)"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>De eerste strafzaken onder artikel 429ter Sr zijn vanaf oktober 2024 gepubliceerd. De eerste zaak was bij de rechtbank Rotterdam.<sup class=\"fn\">1</sup></li><li>Waarnemingen van opsporingsambtenaren kunnen voldoende bewijs opleveren. Voor een veroordeling is niet altijd een aangifte nodig.<sup class=\"fn\">1</sup></li><li>De rechter toetst de bestanddelen zelf en kiest zelf de kwalificatie. Soms stelt hij die beperkter vast dan de tenlastelegging.<sup class=\"fn\">2</sup></li></ul></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Rb Rotterdam 2 oktober 2024, ECLI:NL:RBROT:2024:9612.</li><li>Rb Midden-Nederland 7 oktober 2024, ECLI:NL:RBMNE:2024:5727.</li></ol></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>De omstandigheden beïnvloeden de ernst en de juridische beoordeling. Denk aan plaats, tijdstip en reactie.<sup class=\"fn\">1</sup></li><li>Het bestanddeel «in het openbaar» is ruim. Het geldt ook voor ruimten die voor het publiek toegankelijk zijn.<sup class=\"fn\">1</sup></li></ul></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 116-117.</li></ol></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Vooruitblik: Bewijs en proces-verbaal</h2><div class=\"main\"><p>In de uitspraken zag je welk bewijs de rechter gebruikte. Voorbeelden zijn eigen waarnemingen van opsporingsambtenaren, aangiften en bekentenissen.</p><p>In het volgende onderwerp leer je hoe je die bewijsmiddelen zelf opbouwt en vastlegt in een proces-verbaal.</p></div>","kind":"theory","titel":"Vooruitblik: Bewijs en proces-verbaal"}],"titel":"Rechtspraak","type":"content","vragen":[{"artikel":"Art. 429ter Sr","juist":2,"kernregel":"Waarnemingen van opsporingsambtenaren kunnen voldoende bewijs opleveren als de gedraging van de verdachte en de omstandigheden zorgvuldig in het proces-verbaal worden vastgelegd.","opties":["Zonder aangifte van het slachtoffer kan de rechter de verdachte niet veroordelen, ook niet als opsporingsambtenaren de gedraging zelf hebben waargenomen.","Naast het proces-verbaal van opsporingsambtenaren is altijd nog een ander, onafhankelijk bewijsmiddel nodig, zoals een getuigenverklaring of camerabeelden.","Waarnemingen van opsporingsambtenaren kunnen voldoende bewijs opleveren als de gedraging van de verdachte en de omstandigheden zorgvuldig in het proces-verbaal worden vastgelegd.","Alleen camerabeelden kunnen bij dit delict voldoende bewijs opleveren, omdat de rechter anders niet zelf kan zien wat er precies op straat is gebeurd."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is C. In deze zaak was de veroordeling gebaseerd op twee processen-verbaal van opsporingsambtenaren. Er was geen aangifte en er waren geen camerabeelden.[[1]] Een aangifte of camerabeeld is dus niet altijd nodig. Volgens artikel 344, tweede lid, Sv kan één proces-verbaal van een opsporingsambtenaar voldoende bewijs zijn. Het proces-verbaal moet dan wel aan de wettelijke eisen voldoen.","voetnoten":["Rb Rotterdam 2 oktober 2024, ECLI:NL:RBROT:2024:9612."],"vraag":"In de eerste gepubliceerde zaak over artikel 429ter Sr bestond het bewijs uit twee processen-verbaal. Er was geen aangifte en er waren geen camerabeelden. Wat leert deze zaak?","wet":"Rechtspraak"},{"artikel":"Art. 429ter Sr","juist":0,"kernregel":"Artikel 429ter Sr noemt vier mogelijke kenmerken. Vrees bij het slachtoffer is niet vereist.","opties":["Artikel 429ter Sr noemt vier mogelijke kenmerken. Het slachtoffer hoeft dus niet bang te zijn.","Zonder angst bij het slachtoffer kan artikel 429ter Sr nooit worden overtreden.","De rechter moet altijd dezelfde juridische beoordeling gebruiken als het Openbaar Ministerie.","Het kenmerk ‘vernederend’ geldt alleen als het slachtoffer een ambtenaar is."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is A. De rechter vond de opmerking vernederend, kwetsend en onterend, maar niet vreesaanjagend.[[1]] Artikel 429ter Sr noemt vier mogelijke kenmerken. Het gedrag hoeft niet aan alle vier te voldoen. Het slachtoffer hoeft dus niet bang te zijn. De rechter bepaalt zelf welke juridische beoordeling bij de bewezen feiten past.","voetnoten":["Rb Midden-Nederland 7 oktober 2024, ECLI:NL:RBMNE:2024:5727."],"vraag":"De rechter noemde een seksuele opmerking vernederend, kwetsend en onterend, maar niet vreesaanjagend. Wat betekent dit?","wet":"Rechtspraak"},{"artikel":"Art. 429ter Sr","juist":3,"kernregel":"De opsporingsambtenaar legt de feiten vast. Het OM beoordeelt daarna de zaak en beslist over de afdoening. Het OM kan seponeren, een strafbeschikking opleggen of de zaak aan de rechter voorleggen.","opties":["De opsporingsambtenaar bepaalt dit en schrijft alleen het juridische eindoordeel op.","Het Openbaar Ministerie bepaalt dit en de opsporingsambtenaar neemt dat oordeel zonder controle over.","Een proces-verbaal zonder juridisch eindoordeel is altijd ongeldig.","De opsporingsambtenaar legt de feiten en waarnemingen vast. Het OM beoordeelt daarna de zaak en beslist over de afdoening."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is D. De opsporingsambtenaar beschrijft zo duidelijk en volledig mogelijk wat hij of zij heeft waargenomen. Het OM beoordeelt daarna de zaak en beslist over de afdoening. Het OM kan seponeren, een strafbeschikking opleggen of de zaak aan de rechter voorleggen. Met een strafbeschikking kan het OM bijvoorbeeld een geldboete of taakstraf opleggen. De verdachte kan tegen een strafbeschikking in verzet gaan. Het OM beoordeelt de zaak dan opnieuw en kan de strafbeschikking intrekken of wijzigen. Blijft het verzet bestaan, dan wordt de zaak aan de rechter voorgelegd. De rechter beoordeelt de strafzaak dan opnieuw. Alleen een juridisch oordeel zonder de bijbehorende feiten is niet voldoende.","voetnoten":[],"vraag":"Wat gebeurt er met jouw proces-verbaal nadat je de feiten en omstandigheden hebt vastgelegd?","wet":"Wetboek van Strafvordering"},{"artikel":"Art. 429ter Sr","juist":1,"kernregel":"‘In het openbaar’ omvat ook plaatsen die voor het publiek toegankelijk zijn, zoals een winkel.","opties":["Nee. ‘In het openbaar’ gaat alleen over de openbare weg en het openbaar vervoer.","Ja. Een winkel of uitgaansgelegenheid kan een voor het publiek toegankelijke plaats zijn.","Ja, maar alleen als er camerabeelden van het gedrag zijn.","Nee. Door het huisrecht van de eigenaar is zo’n plaats nooit openbaar."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is B. ‘In het openbaar’ gaat niet alleen over de openbare weg. Het kan ook gaan om een winkel, uitgaansgelegenheid of andere plaats die voor het publiek toegankelijk is.[[1]] Camerabeelden zijn geen voorwaarde. Het huisrecht van de eigenaar zorgt er niet voor dat zo’n plaats nooit openbaar kan zijn.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 116."],"vraag":"Kan artikel 429ter Sr gelden in een winkel of uitgaansgelegenheid die voor het publiek toegankelijk is?","wet":"Wetboek van Strafrecht"},{"artikel":"Art. 429ter Sr","juist":2,"kernregel":"Een uitspraak van een rechtbank laat zien hoe de wet is toegepast. Andere rechters zijn niet aan die uitspraak gebonden.","opties":["Ja. Iedere uitspraak van een rechtbank is een bindende regel voor latere zaken.","Ja. Andere rechtbanken moeten de uitspraak volgen, maar gerechtshoven niet.","Nee. De uitspraak laat zien hoe een rechter de wet toepast, maar bindt andere rechters niet.","Ja. Een nieuwe uitspraak staat altijd boven de wettekst en de wetsgeschiedenis."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is C. Een uitspraak laat zien hoe een rechter de bestanddelen en omstandigheden in een bepaalde zaak beoordeelt. Andere rechters hoeven die uitspraak niet te volgen. Een uitspraak van een rechtbank is dus geen vaste regel voor alle latere zaken. De wettekst en de wetsgeschiedenis blijven belangrijke bronnen.","voetnoten":["Rb Amsterdam 21 februari 2025, ECLI:NL:RBAMS:2025:1220."],"vraag":"Moeten andere rechters een uitspraak van een rechtbank altijd volgen?","wet":"Rechtspraak"}]},{"icoon":"document","id":"m6","kader":"Art. 429ter Sr","nr":6,"pages":[{"html":"<h2 class=\"ptitle\">Leerdoelen</h2><p class=\"pintro\">Wat je na dit onderwerp kunt.</p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen wat je bij artikel 429ter Sr precies moet bewijzen (de bestanddelen, geen opzet of schuld);</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>noemen welke soorten bewijs in de rechtspraak zijn gebruikt, zoals een eigen waarneming, een aangifte, een getuigenverklaring en een bekentenis;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>je eigen waarneming duidelijk en met controleerbare feiten vastleggen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>de context en omstandigheden zo beschrijven dat de rechter de bestanddelen kan toetsen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>veelgemaakte fouten in een proces-verbaal herkennen en voorkomen.</span></li></ul>","kind":"lo","titel":"Leerdoelen"},{"html":"<h2 class=\"ptitle\">Wat moet je bewijzen?</h2><div class=\"main\"><p>Artikel 429ter Sr is een overtreding. Voor het bewijs betekent dit dat je geen opzet of schuld hoeft aan te tonen. Je onderzoekt de feiten die van buitenaf waarneembaar zijn. Je beoordeelt de benadering volgens algemene maatstaven. Dit heet een geobjectiveerde beoordeling.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114.</li></ol></div>","kind":"theory","titel":"Wat moet je bewijzen?"},{"html":"<h2 class=\"ptitle\">Wat moet je bewijzen? (vervolg)</h2><div class=\"main\"><p>Het bewijs gaat over de vier bestanddelen die je eerder hebt geleerd. Eén: het gedrag vond plaats in het openbaar. Twee: de verdachte benaderde een ander indringend en seksueel. Drie: dit gebeurde door opmerkingen, gebaren, geluiden of aanrakingen. Vier: de benadering was volgens algemene maatstaven vreesaanjagend, vernederend, kwetsend óf onterend.</p></div>","kind":"theory","titel":"Wat moet je bewijzen? (vervolg)"},{"html":"<h2 class=\"ptitle\">Het wettelijk kader: bewijsmiddelen en proces-verbaal</h2><div class=\"main\"><p>Opsporingsambtenaren leggen hun bevindingen vast in een proces-verbaal. Artikel 152 Sv bepaalt dat opsporingsambtenaren zo snel mogelijk proces-verbaal opmaken van wat zij hebben opgespoord en onderzocht. Dit wordt de verbaliseringsplicht genoemd.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Wetboek van Strafvordering, art. 152 (proces-verbaalplicht), art. 339 (wettige bewijsmiddelen) en art. 344 lid 2 (proces-verbaal van één opsporingsambtenaar).</li></ol></div>","kind":"theory","titel":"Het wettelijk kader: bewijsmiddelen en proces-verbaal"},{"html":"<h2 class=\"ptitle\">Het wettelijk kader: bewijsmiddelen en proces-verbaal (vervolg)</h2><div class=\"main\"><p>Het Wetboek van Strafvordering noemt welke middelen de rechter als bewijs mag gebruiken. Dit heet een gesloten bewijsstelsel. De wettige bewijsmiddelen zijn:</p><ul class=\"opsom\"><li>de eigen waarneming van de rechter;</li><li>de verklaring van de verdachte;</li><li>de verklaring van een getuige;</li><li>de verklaring van een deskundige;</li><li>schriftelijke bescheiden.</li></ul><p>De wet noemt verschillende soorten schriftelijke stukken. Een proces-verbaal van een opsporingsambtenaar is zo’n schriftelijk stuk. Dit stelsel staat in artikel 339 Sv.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Wetboek van Strafvordering, art. 152 (proces-verbaalplicht), art. 339 (wettige bewijsmiddelen) en art. 344 lid 2 (proces-verbaal van één opsporingsambtenaar).</li></ol></div>","kind":"theory","titel":"Het wettelijk kader: bewijsmiddelen en proces-verbaal (vervolg)"},{"html":"<h2 class=\"ptitle\">Het wettelijk kader: bewijsmiddelen en proces-verbaal (vervolg)</h2><div class=\"main\"><p>Volgens artikel 344, tweede lid, Sv kan het bewijs van een strafbaar feit worden aangenomen op basis van het proces-verbaal van één opsporingsambtenaar. Dit geldt als het proces-verbaal aan de wettelijke eisen voldoet. Er is dan voor dit punt niet altijd extra bewijs nodig.</p></div>","kind":"theory","titel":"Het wettelijk kader: bewijsmiddelen en proces-verbaal (vervolg)"},{"html":"<h2 class=\"ptitle\">Het wettelijk kader: bewijsmiddelen en proces-verbaal (vervolg)</h2><div class=\"main\"><p>Het proces-verbaal is in de praktijk vaak belangrijk bewijs. Daarom moet je de feiten duidelijk, volledig en controleerbaar vastleggen. De rechter moet daarmee kunnen beoordelen of aan de bestanddelen is voldaan.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Wetboek van Strafvordering, art. 152 (proces-verbaalplicht), art. 339 (wettige bewijsmiddelen) en art. 344 lid 2 (proces-verbaal van één opsporingsambtenaar).</li></ol></div>","kind":"theory","titel":"Het wettelijk kader: bewijsmiddelen en proces-verbaal (vervolg)"},{"html":"<div class=\"figcap\">Welke bewijsmiddelen gebruikt de rechter in de praktijk?</div><figure class=\"illu wide\"><svg viewBox=\"0 0 720 468\" role=\"img\" aria-labelledby=\"bw-t bw-d\" font-family=\"'Outfit',system-ui,sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n<title id=\"bw-t\">Bewijsopbouw bij artikel 429ter Sr</title>\n<desc id=\"bw-d\">Bij een onderzoek kunnen verschillende informatiebronnen belangrijk zijn. Denk aan de eigen waarneming van de opsporingsambtenaar, verklaringen van het slachtoffer en getuigen, camera- of bodycambeelden en de verklaring van de verdachte. De rechter gebruikt alleen de wettige bewijsmiddelen uit artikel 339 Sv. Niet iedere informatiebron is rechtstreeks een wettig bewijsmiddel. Een opsporingsambtenaar kan bijvoorbeeld beschrijven wat op camerabeelden is waargenomen. De rechter beoordeelt de waarde van al het bewijs samen. De opsporingsambtenaar legt de feiten vast. De rechter beoordeelt het bewijs. Kernregel: leg vast wat je zelf ziet en hoort en maak onderscheid tussen waarneming, verklaring en conclusie.</desc>\n<rect x=\"20\" y=\"16\" width=\"330\" height=\"72\" rx=\"11\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.6\"/><circle cx=\"50\" cy=\"52\" r=\"14\" fill=\"var(--blauw-licht)\"/><text x=\"50\" y=\"57\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--wit)\">1</text><text x=\"74\" y=\"47\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Eigen waarneming</text><text x=\"74\" y=\"69\" class=\"il-sub\" fill=\"var(--tekst-mid)\">woorden, gebaren, afstand</text>\n<rect x=\"370\" y=\"16\" width=\"330\" height=\"72\" rx=\"11\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.6\"/><circle cx=\"400\" cy=\"52\" r=\"14\" fill=\"var(--blauw-licht)\"/><text x=\"400\" y=\"57\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--wit)\">2</text><text x=\"424\" y=\"47\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Slachtofferverklaring</text><text x=\"424\" y=\"69\" class=\"il-sub\" fill=\"var(--tekst-mid)\">waargenomen; woorden</text>\n<rect x=\"20\" y=\"96\" width=\"330\" height=\"72\" rx=\"11\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.6\"/><circle cx=\"50\" cy=\"132\" r=\"14\" fill=\"var(--blauw-licht)\"/><text x=\"50\" y=\"137\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--wit)\">3</text><text x=\"74\" y=\"127\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Getuigenverklaring</text><text x=\"74\" y=\"149\" class=\"il-sub\" fill=\"var(--tekst-mid)\">wat zij zelf zagen</text>\n<rect x=\"370\" y=\"96\" width=\"330\" height=\"72\" rx=\"11\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.6\"/><circle cx=\"400\" cy=\"132\" r=\"14\" fill=\"var(--blauw-licht)\"/><text x=\"400\" y=\"137\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--wit)\">4</text><text x=\"424\" y=\"127\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Camera-/bodycam</text><text x=\"424\" y=\"149\" class=\"il-sub\" fill=\"var(--tekst-mid)\">gedraging, duur, context</text>\n<rect x=\"20\" y=\"176\" width=\"330\" height=\"72\" rx=\"11\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.6\"/><circle cx=\"50\" cy=\"212\" r=\"14\" fill=\"var(--blauw-licht)\"/><text x=\"50\" y=\"217\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--wit)\">5</text><text x=\"74\" y=\"207\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Verklaring verdachte</text><text x=\"74\" y=\"229\" class=\"il-sub\" fill=\"var(--tekst-mid)\">erkenning, ontkenning</text>\n<rect x=\"370\" y=\"176\" width=\"330\" height=\"72\" rx=\"11\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.6\"/><circle cx=\"400\" cy=\"212\" r=\"14\" fill=\"var(--blauw-licht)\"/><text x=\"400\" y=\"217\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--wit)\">6</text><text x=\"424\" y=\"207\" class=\"il-main\" font-weight=\"700\" fill=\"currentColor\">Overige informatie</text><text x=\"424\" y=\"229\" class=\"il-sub\" fill=\"var(--tekst-mid)\">locatie, tijdstip, data</text>\n<line x1=\"185\" y1=\"256\" x2=\"535\" y2=\"256\" stroke=\"var(--blauw-licht)\" stroke-width=\"1.6\"/>\n<line x1=\"360\" y1=\"256\" x2=\"360\" y2=\"272\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/>\n<path d=\"M353 266l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<rect x=\"20\" y=\"274\" width=\"680\" height=\"58\" rx=\"13\" fill=\"var(--grijs-licht)\" stroke=\"var(--blauw)\" stroke-width=\"2.2\"/>\n<text x=\"360\" y=\"302\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"currentColor\">Opbouw bewijs</text>\n<text x=\"360\" y=\"323\" text-anchor=\"middle\" class=\"il-sub\" fill=\"var(--tekst-mid)\">rechter beoordeelt alles samen</text>\n<line x1=\"360\" y1=\"332\" x2=\"360\" y2=\"348\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\"/>\n<path d=\"M353 342l7 8l7 -8\" fill=\"none\" stroke=\"var(--blauw-licht)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<rect x=\"220\" y=\"352\" width=\"280\" height=\"44\" rx=\"11\" fill=\"var(--wit)\" stroke=\"var(--grijs-mid)\" stroke-width=\"1.6\"/>\n<g transform=\"translate(238,362) scale(0.75)\" stroke=\"var(--tekst-mid)\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v18M7 21h10\"/><path d=\"M12 6 5 8m7-2 7 2\"/><path d=\"M5 8 2.5 13a3 3 0 0 0 5 0L5 8Zm14 0-2.5 5a3 3 0 0 0 5 0L19 8Z\"/></g>\n<text x=\"272\" y=\"379\" font-size=\"15\" font-weight=\"600\" fill=\"var(--tekst-mid)\">Beoordeling door de rechter</text>\n<rect x=\"20\" y=\"406\" width=\"680\" height=\"52\" rx=\"11\" fill=\"var(--grijs-licht)\"/>\n<rect x=\"20\" y=\"406\" width=\"6\" height=\"52\" fill=\"var(--oranje)\"/>\n<text x=\"40\" y=\"430\" font-size=\"15\" font-weight=\"700\" fill=\"currentColor\">Leg vast wat je zelf ziet en hoort.</text>\n<text x=\"40\" y=\"450\" class=\"il-note\" fill=\"var(--tekst-mid)\">Maak onderscheid tussen waarneming, verklaring en conclusie.</text>\n</svg></figure>","kind":"figuur","titel":"Welke bewijsmiddelen gebruikt de rechter in de praktijk?"},{"html":"<h2 class=\"ptitle\">Welke bewijsmiddelen gebruikt de rechter in de praktijk?</h2><div class=\"main\"><p>In de praktijk vormen verschillende bewijsmiddelen samen het bewijs. Het overzicht laat de mogelijke bronnen zien. Op de volgende pagina zie je de bevestigde rechtspraak.</p></div>","kind":"theory","titel":"Welke bewijsmiddelen gebruikt de rechter in de praktijk?"},{"html":"<h2 class=\"ptitle\">De bewijsmiddelen in de bevestigde rechtspraak</h2><div class=\"main\"><p>Eigen waarneming — Rb Rotterdam 2 oktober 2024: veroordeling op twee processen-verbaal, zonder aangifte of camerabeelden.<sup class=\"fn\">1</sup></p><p>Aangifte of getuige — Rb Midden-Nederland 7 oktober 2024: een aangifte naast het proces-verbaal.<sup class=\"fn\">2</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Rb Rotterdam 2 oktober 2024, ECLI:NL:RBROT:2024:9612.</li><li>Rb Midden-Nederland 7 oktober 2024, ECLI:NL:RBMNE:2024:5727.</li></ol></div>","kind":"theory","titel":"De bewijsmiddelen in de bevestigde rechtspraak"},{"html":"<h2 class=\"ptitle\">De bewijsmiddelen in de bevestigde rechtspraak (vervolg)</h2><div class=\"main\"><p>Verklaring verdachte — Rb Amsterdam 21 februari 2025: de bekennende verklaring speelde een rol.<sup class=\"fn\">1</sup></p><p>Camerabeelden — leg vast wie de beelden heeft bekeken, wanneer dat gebeurde en wat daarop is waargenomen. De waarneming kan vervolgens via een wettig bewijsmiddel aan de rechter worden voorgelegd.<sup class=\"fn\">2</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Rb Amsterdam 21 februari 2025, ECLI:NL:RBAMS:2025:1220.</li><li>Wetboek van Strafvordering, art. 339 en 344 (schriftelijke bescheiden).</li></ol></div>","kind":"theory","titel":"De bewijsmiddelen in de bevestigde rechtspraak (vervolg)"},{"html":"<h2 class=\"ptitle\">Leg je eigen waarneming feitelijk vast</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Leg je eigen waarneming feitelijk vast</div><div class=\"kaart-b\"><p>Beschrijf zo feitelijk mogelijk wat je zelf hebt gezien en gehoord. Noteer daarbij:</p><ul class=\"opsom\"><li>de letterlijke opmerking of het gebaar;</li><li>de plaats en het tijdstip;</li><li>de afstand tot de betrokkene;</li><li>de duur en de frequentie;</li><li>de zichtbare reactie.</li></ul><p>Schrijf niet alleen een oordeel op, zoals ‘hij intimideerde haar’. Beschrijf de feiten waarop dat oordeel kan worden gebaseerd. Dit is praktijkuitleg.</p></div></div>","kind":"kaart","titel":"Leg je eigen waarneming feitelijk vast"},{"html":"<h2 class=\"ptitle\">Leg je eigen waarneming feitelijk vast (vervolg)</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6\"/></svg></span><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Jouw waarneming is het startpunt</div><div class=\"kaart-b\"><p>Jouw taak als opsporingsambtenaar is om waar te nemen, op te treden en de feiten en omstandigheden zorgvuldig vast te leggen. Beschrijf ook de context en de bevoegdheden die je hebt gebruikt. Het OM beoordeelt daarna de zaak en beslist over de afdoening. Het OM kan de zaak seponeren, een strafbeschikking opleggen of de zaak aan de rechter voorleggen. Met een strafbeschikking kan het OM bijvoorbeeld een geldboete of taakstraf opleggen. De verdachte kan tegen een strafbeschikking in verzet gaan. Het OM beoordeelt de zaak dan opnieuw en kan de strafbeschikking intrekken of wijzigen. Blijft het verzet bestaan, dan wordt de zaak aan de rechter voorgelegd. De rechter beoordeelt de strafzaak dan opnieuw.</p></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Openbaar Ministerie, Strafbeschikking (OMSB).</li><li>Openbaar Ministerie, Ik ben het niet eens met de strafbeschikking.</li></ol></div>","kind":"kaart","titel":"Leg je eigen waarneming feitelijk vast (vervolg)"},{"html":"<h2 class=\"ptitle\">Context en omstandigheden in het proces-verbaal</h2><div class=\"main\"><p>Uit de vorige onderwerpen weet je twee dingen. De inhoud en de omstandigheden beïnvloeden elkaar. Ook bepalen de plaats, het tijdstip en de reactie mee hoe het gedrag juridisch wordt beoordeeld.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 117.</li></ol></div>","kind":"theory","titel":"Context en omstandigheden in het proces-verbaal"},{"html":"<h2 class=\"ptitle\">Wat zag je precies?</h2><div class=\"main\"><p>Beschrijf niet alleen wat iemand zei of deed. Leg ook vast waar de personen zich bevonden en hoeveel ruimte er tussen hen was. Kon de betrokkene afstand nemen? Kon zij weggaan? Waren er andere personen aanwezig? En hoe reageerde zij op het gedrag?<br><br>Beschrijf wat je waarneemt. Trek in het proces-verbaal geen conclusie die je waarnemingen niet ondersteunen.</p></div>","kind":"theory","titel":"Wat zag je precies?"},{"html":"<h2 class=\"ptitle\">Veelgemaakte fouten</h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg></span><span class=\"kaart-lab\">Let op</span></div><div class=\"kaart-t\">Veelgemaakte fouten</div><div class=\"kaart-b\"><p>Hierna staan vijf fouten die in de praktijk vaak worden gemaakt bij het vastleggen. Let op: dit is praktijkuitleg. Het is geen zelfstandige rechtsregel.</p></div></div>","kind":"kaart","titel":"Veelgemaakte fouten"},{"html":"<h2 class=\"ptitle\">Veelgemaakte fouten (vervolg)</h2><p class=\"lead\">Bij het vastleggen worden veelal de onderstaande fouten gemaakt.</p><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg></span><span class=\"kaart-lab\">Let op</span></div><div class=\"kaart-t\">Let op!</div><div class=\"kaart-b\"><p>Deze fouten kunnen leiden tot een onvolledig proces-verbaal wat kan zorgen voor seponering of vrijspraak.</p></div></div><ul class=\"opsom fout-lijst\"><li><b>Juridische conclusie in plaats van feiten</b> Alleen een juridische conclusie opschrijven, zoals ‘het was intimidatie’, zonder de feiten waarop die conclusie is gebaseerd.</li><li><b>Letterlijke opmerking niet in eigen woorden opschrijven</b> De letterlijke opmerking niet opschrijven, maar deze alleen in eigen woorden navertellen. Dit heet parafraseren.</li><li><b>Context weglaten</b> De context weglaten, zoals plaats, tijdstip en reactie, terwijl die de kwalificatie mee kan bepalen.</li><li><b>Eigen waarneming en aannames door elkaar halen</b> Een eigen waarneming en een aanname door elkaar halen. Schrijf duidelijk op wat je zelf hebt gezien of gehoord en wat iemand anders heeft verklaard.</li><li><b>Camerabeelden onvoldoende beschrijven</b> Camerabeelden noemen zonder te beschrijven wie ze wanneer heeft bekeken en wat daarop te zien is.</li></ul><div class=\"kaart k-doel\"><div class=\"kaart-t\">Jouw doel</div><div class=\"kaart-b\"><p><b>Schrijf een volledig, feitelijk en controleerbaar proces-verbaal.</b></p><p>Zo help je het OM en/of de rechter om een juiste beslissing te nemen.</p></div></div>","kind":"kaart","titel":"Veelgemaakte fouten (vervolg)"},{"html":"<h2 class=\"ptitle\">Let op: bevoegdheid en afbakening</h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg></span><span class=\"kaart-lab\">Let op</span></div><div class=\"kaart-t\">Let op: bevoegdheid en afbakening</div><div class=\"kaart-b\"><p>Artikel 429ter Sr bepaalt wannéér gedrag onder de strafbaarstelling kan vallen. Het artikel bepaalt niet welke opsporingsbevoegdheid je in een bepaalde situatie hebt. Voor een buitengewoon opsporingsambtenaar hangt die bevoegdheid onder andere af van:</p><ul class=\"opsom\"><li>het domein;</li><li>de akte van opsporingsbevoegdheid;</li><li>de geldende aanwijzingen en werkafspraken.</li></ul><p>Deze e-learning geeft je geen extra bevoegdheden. Ze vervangt ook geen lokale instructie.</p></div></div>","kind":"kaart","titel":"Let op: bevoegdheid en afbakening"},{"html":"<h2 class=\"ptitle\">Let op: bevoegdheid en afbakening (vervolg)</h2><div class=\"kaart k-letop\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v4M12 17h.01\"/></svg></span><span class=\"kaart-lab\">Let op</span></div><div class=\"kaart-t\">Let op: bevoegdheid en afbakening</div><div class=\"kaart-b\"><p>Controleer bij twijfel je eigen bevoegdheid en werkwijze en schakel zo nodig de politie in.</p></div></div>","kind":"kaart","titel":"Let op: bevoegdheid en afbakening (vervolg)"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>Het bewijs gaat over de bestanddelen. Opzet of schuld hoef je niet aan te tonen.<sup class=\"fn\">1</sup></li><li>De wettige bewijsmiddelen zijn: de eigen waarneming van de rechter, verklaringen van de verdachte, getuigen en deskundigen, en schriftelijke stukken. Het proces-verbaal is een schriftelijk bescheid (art. 152 en 339 Sv). Volgens art. 344 lid 2 Sv kan het proces-verbaal van één opsporingsambtenaar het bewijs dragen: het kan op zichzelf voldoende bewijs zijn.<sup class=\"fn\">2</sup></li><li>In de bevestigde rechtspraak rust het bewijs op de eigen waarneming van de opsporingsambtenaar, de aangifte en de bekennende verklaring.</li></ul></div></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114.</li><li>Wetboek van Strafvordering, art. 152, 339 en 344 lid 2.</li></ol></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Kort samengevat</h2><div class=\"kaart k-onthoud\"><div class=\"kaart-h\"><span class=\"kaart-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/></svg></span><span class=\"kaart-lab\">Onthoud</span></div><div class=\"kaart-b\"><ul class=\"punten\"><li>Leg vooral de feiten en de omstandigheden vast. Het OM beoordeelt de zaak en beslist over de afdoening. Het kan seponeren, een strafbeschikking opleggen of de zaak aan de rechter voorleggen. Tegen een strafbeschikking kan de verdachte in verzet gaan. Komt de zaak bij de rechter, dan beoordeelt de rechter het bewijs en de juridische kwalificatie.</li><li>Vermijd de veelgemaakte fouten: een conclusie zonder feiten, parafrase, ontbrekende context en een aanname als waarneming.</li></ul></div></div>","kind":"onthoud","titel":"Kort samengevat"},{"html":"<h2 class=\"ptitle\">Vooruitblik: Proces-verbaal in de praktijk</h2><div class=\"main\"><p>In het volgende onderwerp ga je praktisch aan de slag met het proces-verbaal.</p><p>Je leert hoe je waarnemingen, verklaringen, context en relevante bewijsmiddelen duidelijk, feitelijk en controleerbaar vastlegt.</p></div>","kind":"theory","titel":"Vooruitblik: Proces-verbaal in de praktijk"}],"titel":"Bewijs en proces-verbaal","type":"content","vragen":[{"artikel":"Art. 429ter Sr","juist":1,"kernregel":"Leg de feiten en omstandigheden duidelijk en controleerbaar vast. Het OM beoordeelt daarna de zaak en beslist over de afdoening.","opties":["Alleen de conclusie dat de man de vrouw seksueel heeft geïntimideerd.","De letterlijke opmerkingen, het volgen, de plaats, het tijdstip, de afstand en de zichtbare reactie van de vrouw.","Alleen de persoonsgegevens van de verdachte en een verwijzing naar artikel 429ter Sr.","Alleen dat de situatie vreesaanjagend was, zonder de waargenomen feiten te beschrijven."],"soort":"Praktijkcasus","uitleg":"Het juiste antwoord is B. Beschrijf zo precies mogelijk wat je zelf zag en hoorde. Noteer de letterlijke opmerkingen, het volgen, de plaats, het tijdstip, de afstand en de zichtbare reactie. Met deze feiten kan het OM de zaak beoordelen. Wordt de zaak aan de rechter voorgelegd, dan kan de rechter de feiten en het bewijs beoordelen. Schrijf dus niet alleen een juridische conclusie op. Volgens artikel 344, tweede lid, Sv kan een goed proces-verbaal van één opsporingsambtenaar voldoende bewijs zijn.","voetnoten":["Wetboek van Strafvordering, art. 344 lid 2."],"vraag":"Praktijkcasus. Je ziet dat een man een onbekende vrouw kort volgt en twee keer een seksuele opmerking maakt. De vrouw gaat sneller lopen. Wat schrijf je in het proces-verbaal?","wet":"Wetboek van Strafvordering"},{"artikel":"Art. 429ter Sr","juist":2,"kernregel":"Bij artikel 429ter Sr kunnen verschillende soorten bewijs een rol spelen.","opties":["Alleen een bekentenis van de verdachte.","Alleen een aangifte van het slachtoffer.","Onder andere een eigen waarneming, een aangifte, een getuigenverklaring en een bekentenis.","Alleen camerabeelden, zonder dat iemand beschrijft wat daarop is waargenomen."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is C. In de besproken uitspraken gebruikte de rechter verschillende soorten bewijs. Het ging om eigen waarnemingen van opsporingsambtenaren, een aangifte en een bekennende verklaring. Camerabeelden kunnen informatie geven. Leg dan vast wie de beelden heeft bekeken en wat daarop is waargenomen. De rechter gebruikt uiteindelijk de wettige bewijsmiddelen die in artikel 339 Sv staan.","voetnoten":["Rb Rotterdam 2 oktober 2024, ECLI:NL:RBROT:2024:9612; Rb Midden-Nederland 7 oktober 2024, ECLI:NL:RBMNE:2024:5727."],"vraag":"Welke soorten bewijs kunnen een rol spelen bij artikel 429ter Sr?","wet":"Rechtspraak"},{"artikel":"Art. 429ter Sr","juist":2,"kernregel":"De omstandigheden tellen mee bij de juridische beoordeling. Beschrijf ze daarom feitelijk in het proces-verbaal.","opties":["Dat hoeft niet. Alleen de gedraging zelf telt.","Alleen om de privacy van het slachtoffer te beschermen.","Omdat deze omstandigheden meetellen bij de juridische beoordeling.","Alleen om later de hoogte van de straf te bepalen."],"soort":"Kennisvraag","uitleg":"Het juiste antwoord is C. De inhoud van het gedrag en de omstandigheden beïnvloeden elkaar. Zonder een duidelijke beschrijving kan de rechter de situatie niet volledig beoordelen.[[1]] De omstandigheden zijn dus niet alleen belangrijk voor de privacy of de hoogte van de straf.","voetnoten":["Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 117."],"vraag":"Waarom beschrijf je de plaats, het tijdstip en de reactie in het proces-verbaal?","wet":"Wetboek van Strafrecht"}]},{"icoon":"document","id":"m7","kader":"Art. 429ter Sr","nr":7,"pages":[{"html":"<h2 class=\"ptitle\">Leerdoelen</h2><p class=\"pintro\">Wat je na dit onderwerp kunt.</p><ul class=\"lo\"><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>uitleggen welke feiten en omstandigheden belangrijk zijn in een proces-verbaal over seksuele straatintimidatie;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>eigen waarnemingen, verklaringen en conclusies duidelijk van elkaar onderscheiden;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>de wettelijke bestanddelen met concrete feiten en omstandigheden onderbouwen;</span></li><li><span class=\"lo-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg></span><span>relevante context en bewijsmiddelen duidelijk en controleerbaar vastleggen.</span></li></ul>","kind":"lo","titel":"Leerdoelen"},{"html":"<span class=\"q-soort\">Praktijksituatie</span><h2 class=\"ptitle\">Geen voltooid delict? Toch kun je handelen</h2><div class=\"main ingr-casus-bron\"><p>Het is zaterdagavond rond 23.30 uur in een druk uitgaansgebied. Een vrouw loopt alleen richting het station.</p><p>Een man die haar niet kent, kijkt haar nadrukkelijk aan en zegt:</p><p class=\"uiting\">‘Zo, jij ziet er mooi uit vanavond.’</p><p>De vrouw reageert niet en loopt door. De man roept haar na:</p><p class=\"uiting\">‘Hé, ik praat tegen je!’</p><p>Hij blijft staan en loopt niet achter haar aan.</p><p>Jij staat als boa op ongeveer tien meter afstand en hoort de opmerkingen.</p></div><div class=\"kaart k-praktijk\"><div class=\"kaart-t\">Wat kun je doen?</div><div class=\"kaart-b\"><p>Je twijfelt of sprake is van een voltooid delict. Dat betekent niet automatisch dat je niets kunt doen.</p><ol class=\"stappen\"><li><b>Blijf waarnemen</b> Observeer wat er gebeurt. Wat zegt en doet de persoon? Stopt het gedrag of gaat hij door? Verandert de situatie?</li><li><b>Intervenieer</b> Beoordeel of optreden in deze situatie passend en veilig is. Maak duidelijk dat het gedrag is gezien.</li><li><b>Ga in gesprek</b> Ga in gesprek met de persoon. Leg uit wat je ziet en waarom dit gedrag niet wenselijk is. Geef duidelijk aan welke norm geldt en wat je van hem verwacht.</li><li><b>Leg vast</b> Leg relevante waarnemingen en gegevens vast, voor zover dat binnen je bevoegdheden en werkwijze mogelijk is.</li></ol><p class=\"noot\">Nieuwe gedragingen of omstandigheden kunnen aanleiding zijn om de situatie opnieuw te beoordelen.</p></div></div><div class=\"kaart k-onthoud\"><div class=\"kaart-lab\">Onthoud</div><div class=\"kaart-t\">Geen voltooid delict betekent niet automatisch: niets doen.</div><div class=\"kaart-b\"><p>Een passende interventie kan normerend en preventief werken en kan helpen voorkomen dat de situatie verder escaleert.</p></div></div>","kind":"casus","titel":"Geen voltooid delict? Toch kun je handelen"},{"html":"<h2 class=\"ptitle\">Van waarneming naar proces-verbaal</h2><div class=\"main\"><p>Een goed proces-verbaal maakt voor iemand die niet bij de situatie was duidelijk wat er is gebeurd. Beschrijf daarom wat je zelf zag en hoorde en leg de relevante omstandigheden vast.</p><p>Schrijf niet alleen dat sprake was van seksuele intimidatie. Beschrijf de feiten waarop die beoordeling kan worden gebaseerd.</p></div>","kind":"theory","titel":"Van waarneming naar proces-verbaal"},{"html":"<h2 class=\"ptitle\">Wat moet je duidelijk vastleggen?</h2><div class=\"main\"><p>Bij artikel 429ter Sr zijn de gedraging én de context belangrijk. Leg daarom de feiten en omstandigheden vast die nodig zijn om de zaak te kunnen beoordelen.</p><ul class=\"opsom\"><li>plaats en tijdstip;</li><li>wat je zelf zag en hoorde;</li><li>de letterlijke opmerkingen, voor zover mogelijk;</li><li>gebaren, geluiden, aanrakingen of ander gedrag;</li><li>afstand, duur en herhaling;</li><li>de relevante context en zichtbare reacties.</li></ul></div>","kind":"theory","titel":"Wat moet je duidelijk vastleggen?"},{"html":"<h2 class=\"ptitle\">Koppel feiten aan de bestanddelen</h2><div class=\"main\"><p>De wettelijke bestanddelen moeten uit de beschreven feiten en omstandigheden kunnen blijken. Schrijf daarom niet alleen een juridische conclusie op.</p><p>Maak duidelijk waar het gebeurde, welke seksuele benadering je waarnam, welke concrete gedragingen plaatsvonden en welke omstandigheden van belang waren voor de beoordeling volgens algemene maatstaven.<sup class=\"fn\">1</sup></p></div><div class=\"bronnen-blok\"><div class=\"bb-t\">Bronnen</div><ol class=\"bb-l\"><li>Kamerstukken II 2022/23, 36 222, nr. 3 (Memorie van toelichting), p. 114-117.</li></ol></div>","kind":"theory","titel":"Koppel feiten aan de bestanddelen"},{"html":"<h2 class=\"ptitle\">Eigen waarneming, verklaring of conclusie?</h2><div class=\"kaart k-praktijk\"><div class=\"kaart-h\"><span class=\"kaart-lab\">In de praktijk</span></div><div class=\"kaart-t\">Eigen waarneming, verklaring of conclusie?</div><div class=\"kaart-b\"><p>Maak steeds duidelijk waar de informatie vandaan komt.</p><ul class=\"punten\"><li><strong>Eigen waarneming:</strong> beschrijf wat je zelf zag of hoorde.</li><li><strong>Verklaring:</strong> vermeld wie iets heeft verklaard en wat die persoon heeft verklaard.</li><li><strong>Conclusie:</strong> zorg dat de feiten waarop een conclusie is gebaseerd in het proces-verbaal staan.</li></ul></div></div>","kind":"kaart","titel":"Eigen waarneming, verklaring of conclusie?"},{"html":"<h2 class=\"ptitle\">Van conclusie naar feiten</h2><div class=\"main\"><p><strong>Niet alleen:</strong> “De verdachte intimideerde de vrouw seksueel.”</p><p><strong>Wel feitelijk:</strong> “Ik hoorde dat de verdachte op korte afstand van de vrouw tweemaal een seksuele opmerking maakte. Ik zag dat hij achter haar bleef lopen en dat de vrouw haar pas versnelde.”</p><p>De feitelijke beschrijving maakt controleerbaar waarop de beoordeling is gebaseerd.</p></div>","kind":"theory","titel":"Van conclusie naar feiten"},{"html":"<h2 class=\"ptitle\">Praktijkvoorbeeld</h2><div class=\"main\"><p>Het voorbeeld hieronder is fictief. Het is geen officieel modelproces-verbaal. Het laat zien hoe je een waarneming feitelijk kunt beschrijven. Let op: bij iedere waarneming staat hoe je het weet. Heb je het gezien? Dan schrijf je «Ik zag». Heb je het gehoord? Dan schrijf je «Ik hoorde».</p><p class=\"pv-alinea\"><span class=\"pv-zin\">«Op [datum] omstreeks 23.30 uur bevond ik, verbalisant, mij op [locatie] te [plaats].</span><br><span class=\"pv-zin\">Deze locatie is een voor het publiek toegankelijke plaats.</span></p><p class=\"pv-alinea\"><span class=\"pv-zin\">Het was donker.</span><br><span class=\"pv-zin\">De straatverlichting was in werking.</span><br><span class=\"pv-zin\">Ik bevond mij in een uitgaansgebied waar op dat moment meerdere personen aanwezig waren.</span></p><p class=\"pv-alinea\"><span class=\"pv-zin\">Ik zag een vrouw in de richting van het station lopen.</span><br><span class=\"pv-zin\">Ik zag een man op ongeveer tien meter afstand van mij staan.</span><br><span class=\"pv-zin\">Ik had vrij en onbelemmerd zicht op de man en de vrouw.</span></p><p class=\"pv-alinea\"><span class=\"pv-zin\">Ik zag dat de man zijn hoofd in de richting van de
