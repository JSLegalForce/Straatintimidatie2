<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual polish — Seksuele straatintimidatie</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#f2f4f8}iframe{display:block}</style></head><body><iframe id="course" src="./?visual-polish=1" title="E-learning Seksuele straatintimidatie"></iframe><script>
const css=`/* JSLF VISUAL POLISH v3 */
:root{--page-max:1420px;--content-max:1180px;--reading:720px;--sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--sp5:24px;--sp6:32px;--sp7:40px;--sp8:48px}
main{width:min(calc(100% - 64px),var(--page-max))!important;max-width:var(--page-max)!important;padding:16px 0 28px!important}.status{width:min(100%,var(--content-max));margin:0 auto 12px!important}.card{width:min(100%,var(--content-max));margin-inline:auto;padding:32px 40px 28px!important;overflow:hidden;box-shadow:0 10px 34px rgba(26,42,94,.08)!important}.tophead{margin:0 0 24px!important;padding:0 0 16px!important;align-items:center!important}.itile{width:42px!important;height:42px!important}.tophead .ohint,.tophead .otitel{line-height:1.25}.main{max-width:none}.ptitle{font-size:clamp(1.45rem,1.7vw,1.8rem)!important;line-height:1.18!important;margin:0 0 20px!important}.pintro{max-width:var(--reading);margin:-8px 0 20px!important}.main>p,.main>.lees{max-width:var(--reading);font-size:1.06rem!important;line-height:1.62!important;margin-bottom:12px!important}.kaart{margin:16px 0 0!important;padding:16px 20px!important;box-shadow:none!important;border-color:#d9e0ed!important}.kaart-h{margin-bottom:8px!important}.kaart-b p,.kaart-b li{line-height:1.55!important}.k-kader{background:#f7f9fd!important}.k-praktijk{background:#f1f8f8!important}.k-onthoud{background:#eaf6ef!important}.k-letop{background:#fff8e8!important}.bronnen-blok{margin-top:24px!important;padding-top:16px!important;max-width:920px}.nav{width:min(100%,var(--reading));margin:28px 0 0!important;padding-top:20px!important;border-top:1px solid #e2e7f0;display:grid!important;grid-template-columns:auto 1fr auto!important;align-items:center!important;gap:16px!important}.nav .sp{display:block!important}.nav .btn:first-child{justify-self:start}.nav .btn:last-child{justify-self:end}.nav .btn{min-width:132px!important;min-height:46px}.short-page .main,.short-page .nav{max-width:var(--reading)}
@media(min-width:1000px){.paired-page .main{display:grid;grid-template-columns:1fr 1fr;gap:16px 32px;align-items:start}.paired-page .main>.ptitle,.paired-page .main>.pintro,.paired-page .main>p,.paired-page .main>.lees,.paired-page .main>.bronnen-blok{grid-column:1/-1}.paired-page .main>.kaart{margin-top:0!important}.paired-page .nav{width:100%;max-width:none}.law-page .main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,.8fr);gap:20px 32px;align-items:start}.law-page .main>.ptitle,.law-page .main>.pintro,.law-page .main>p:first-of-type{grid-column:1/-1}.law-page .main>.kaart:first-of-type{grid-column:1;grid-row:span 2;margin-top:0!important}.law-page .main>.kaart:nth-of-type(2),.law-page .main>.kaart:nth-of-type(3){grid-column:2;margin-top:0!important}.law-page .main>.kaart:nth-of-type(n+4),.law-page .main>.bronnen-blok{grid-column:1/-1}.law-page .nav{width:100%;max-width:none}.question-page{max-width:960px!important}.question-page .q-text{max-width:760px}.question-page .opts{display:grid!important;grid-template-columns:1fr 1fr;gap:10px 12px!important}.question-page .nav{width:100%;max-width:none}}
@media(min-width:700px) and (max-width:999px){main{width:min(calc(100% - 32px),900px)!important}.card{padding:26px 28px 24px!important}.nav{width:min(100%,760px)}}
@media(max-width:699px){main{width:100%!important;padding:10px 12px 22px!important}.status{margin-bottom:10px!important}.card{width:100%;padding:18px 16px 20px!important;border-radius:10px!important}.tophead{gap:10px!important;margin-bottom:18px!important;padding-bottom:14px!important;align-items:flex-start!important}.itile{width:38px!important;height:38px!important}.ptitle{font-size:1.34rem!important;margin-bottom:16px!important}.pintro{margin-bottom:16px!important}.main p,.lees,.kaart-b p,.kaart-b li{font-size:1rem!important;line-height:1.55!important}.kaart{padding:13px 14px!important;margin-top:12px!important}.bronnen-blok{margin-top:18px!important}.nav{width:100%;margin-top:20px!important;padding-top:16px!important;gap:8px!important}.nav .btn{min-width:0!important;min-height:48px;padding:12px 14px!important}.opts{grid-template-columns:1fr!important}.opt{min-height:48px}.bronnen-blok{overflow-wrap:anywhere}svg,img{max-width:100%;height:auto}}
@media(max-width:360px){main{padding-inline:8px!important}.card{padding-inline:13px!important}.nav{grid-template-columns:1fr 1fr!important}.nav .sp{display:none!important}.nav .btn{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}`;
function enhance(d){if(!d||!d.head)return;let st=d.getElementById('jslf-visual-polish');if(!st){st=d.createElement('style');st.id='jslf-visual-polish';st.textContent=css;d.head.appendChild(st)}const card=d.querySelector('#app > .card,main .card');if(!card)return;card.classList.remove('short-page','paired-page','law-page','question-page');const main=card.querySelector('.main');const text=(card.textContent||'').toLowerCase();if(card.querySelector('.q-text,.opts'))card.classList.add('question-page');else if(text.includes('artikel 429ter')&&(text.includes('wettekst')||text.includes('juridisch kader')))card.classList.add('law-page');else if(main){const cards=main.querySelectorAll(':scope > .kaart').length;const paras=main.querySelectorAll(':scope > p,:scope > .lees').length;const visual=!!main.querySelector('svg,figure,.illustratie');if(cards>=2&&!visual)card.classList.add('paired-page');else if(cards===0&&paras<=3&&!visual)card.classList.add('short-page')}d.querySelectorAll('svg').forEach(s=>s.setAttribute('focusable','false'))}
const f=document.getElementById('course');f.addEventListener('load',()=>{const d=f.contentDocument;enhance(d);new MutationObserver(()=>enhance(d)).observe(d.getElementById('app')||d.body,{childList:true,subtree:true})});
</script></body></html>
