<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JS Legal Force — premium visual</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#f2f4f8}iframe{display:block}</style></head><body><iframe id="course" src="./?layout=premium-9" title="E-learning Seksuele straatintimidatie"></iframe><script>
const css=`:root{--shell:1420px;--cardmax:1280px;--reading:860px}main{width:min(calc(100% - 56px),var(--shell))!important;max-width:var(--shell)!important;margin-inline:auto!important;padding:16px 0 30px!important}.status{width:min(100%,1040px);margin:0 auto 12px!important}.card{width:min(100%,1040px)!important;margin-inline:auto!important;padding:30px 42px 28px!important;overflow:hidden;box-shadow:0 12px 38px rgba(26,42,94,.09)!important}.tophead,.main,.nav{width:min(100%,var(--reading))!important;margin-left:auto!important;margin-right:auto!important}.tophead{margin-bottom:24px!important;padding-bottom:16px!important}.nav{margin-top:24px!important;padding-top:18px!important;border-top:1px solid #e2e7f0;display:grid!important;grid-template-columns:auto 1fr auto!important;gap:16px!important}.nav .btn{min-width:132px!important;min-height:46px}.kaart{margin-top:14px!important;padding:16px 20px!important}.ptitle{font-size:clamp(1.45rem,1.7vw,1.8rem)!important;line-height:1.18!important;margin-bottom:18px!important}.main p,.lees{line-height:1.58!important}.jslf-wide,.jslf-law,.jslf-paired{width:min(100%,1280px)!important}.jslf-wide .main,.jslf-law .main,.jslf-paired .main{width:100%!important}.jslf-wide .nav,.jslf-law .nav,.jslf-paired .nav{width:min(100%,900px)!important}.jslf-goals{width:min(100%,1080px)!important}.jslf-question{width:min(100%,1040px)!important}.jslf-question .main,.jslf-question .tophead,.jslf-question .nav,.jslf-goals .main,.jslf-goals .tophead,.jslf-goals .nav{width:min(100%,900px)!important}.pv-hero{display:grid;grid-template-columns:1fr 180px;gap:28px;align-items:center;background:linear-gradient(135deg,#f7f9fd,#eef4ff);border:1px solid #d9e3f4;border-radius:18px;padding:22px 24px;margin:0 0 20px}.pv-hero-copy strong{display:block;font-size:1.2rem;margin-bottom:6px}.pv-hero-copy span{color:#4a5578;line-height:1.5}.pv-person{height:180px;display:flex;align-items:flex-end;justify-content:center}.pv-person svg{height:100%;width:auto;max-width:180px}.pv-role{display:flex;align-items:center;gap:16px;background:#f7f9fd;border:1px solid #dce3ef;border-radius:15px;padding:15px 18px;margin:0 0 18px}.pv-role .pv-icon{width:72px;height:72px;flex:0 0 72px}.pv-role strong{display:block;font-size:1.05rem;margin-bottom:2px}.pv-role span{color:#4a5578;font-size:.94rem}.pv-icon{display:grid;place-items:center;border-radius:18px;background:#e9effb;color:#1a2a5e}.pv-icon svg{width:58%;height:58%}.pv-law .pv-icon{background:#eaf0ff}.pv-judge .pv-icon{background:#fff3d8}.pv-boa .pv-icon{background:#e8f5f4}.pv-ovj .pv-icon{background:#eef0f8}.pv-qmark{width:76px;height:76px;border-radius:22px;background:#eaf0ff;color:#1a2a5e;display:grid;place-items:center;font:800 42px/1 system-ui;margin:0 0 16px}.pv-feedback{display:flex;gap:16px;align-items:flex-start;margin:16px 0 0;padding:15px 18px;border-radius:14px}.pv-feedback.ok{background:#e6f4ed;color:#1a7a4a}.pv-feedback.no{background:#faeaea;color:#b52a2a}.pv-feedback .big{font:800 38px/1 system-ui}.pv-feedback div:last-child{color:#1a2a5e}.pv-process{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.pv-step{position:relative;text-align:center;padding:16px 10px;border:1px solid #dce3ef;border-radius:14px;background:#fff}.pv-step:not(:last-child)::after{content:'→';position:absolute;right:-14px;top:44%;z-index:2;color:#2d4099;font-weight:800}.pv-step .pv-icon{width:64px;height:64px;margin:0 auto 10px}.pv-step strong{font-size:.9rem}.pv-badge{display:inline-flex;align-items:center;gap:8px;font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#2d4099;margin-bottom:8px}.pv-badge .mini{width:28px;height:28px;border-radius:9px;background:#eaf0ff;display:grid;place-items:center}.pv-badge svg{width:16px;height:16px}.pv-question .q-text{font-size:1.18rem!important}.pv-question .opts{margin-top:8px}.pv-question .opt{padding:13px 15px!important}.fb-top svg{width:28px!important;height:28px!important}.fb{box-shadow:0 5px 18px rgba(26,42,94,.08)!important}
@media(min-width:1000px){.jslf-law .main{display:grid!important;grid-template-columns:minmax(0,1.55fr) minmax(310px,.85fr);gap:20px 30px;align-items:start}.jslf-law .main>.ptitle,.jslf-law .main>.pintro,.jslf-law .main>p:first-of-type,.jslf-law .main>.pv-role{grid-column:1/-1}.jslf-paired .main{display:grid!important;grid-template-columns:1fr 1fr;gap:18px 28px}.jslf-paired .main>.ptitle,.jslf-paired .main>.pintro,.jslf-paired .main>p,.jslf-paired .main>.lees,.jslf-paired .main>.bronnen-blok,.jslf-paired .main>.pv-role{grid-column:1/-1}}
@media(max-width:699px){main{width:100%!important;padding:10px 12px 22px!important}.status{width:100%!important}.card,.jslf-wide,.jslf-law,.jslf-paired,.jslf-goals,.jslf-question{width:100%!important;padding:18px 16px 20px!important}.tophead,.main,.nav,.jslf-question .main,.jslf-question .tophead,.jslf-question .nav,.jslf-goals .main,.jslf-goals .tophead,.jslf-goals .nav{width:100%!important}.pv-hero{grid-template-columns:1fr;padding:17px}.pv-person{height:140px;order:-1}.pv-role{align-items:flex-start;padding:13px}.pv-role .pv-icon{width:58px;height:58px;flex-basis:58px}.pv-process{grid-template-columns:1fr}.pv-step:not(:last-child)::after{content:'↓';right:50%;top:auto;bottom:-18px}.nav{gap:8px!important}.nav .btn{min-width:0!important}.opts{grid-template-columns:1fr!important}svg,img{max-width:100%;height:auto}}
@media(max-width:360px){main{padding-inline:8px!important}.card{padding-inline:13px!important}.nav{grid-template-columns:1fr 1fr!important}.nav .sp{display:none!important}.nav .btn{width:100%}}`;
const icons={book:`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3"><path d="M10 12h17c4 0 5 3 5 6v34c0-4-3-6-7-6H10z"/><path d="M54 12H37c-4 0-5 3-5 6v34c0-4 3-6 7-6h15z"/></svg>`,eye:`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 32s10-16 27-16 27 16 27 16-10 16-27 16S5 32 5 32z"/><circle cx="32" cy="32" r="7"/></svg>`,scale:`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3"><path d="M32 8v44M17 14h30M13 56h38"/><path d="M18 14 8 34h20L18 14zm28 0L36 34h20L46 14z"/><path d="M8 34c2 7 18 7 20 0M36 34c2 7 18 7 20 0"/></svg>`,file:`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3"><path d="M17 7h22l10 10v40H17z"/><path d="M39 7v12h12M24 30h18M24 38h18M24 46h13"/></svg>`,court:`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3"><path d="M7 24h50L32 7 7 24zM12 52h40M8 58h48M16 26v24M27 26v24M38 26v24M49 26v24"/></svg>`,chat:`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 12h46v32H29L17 54V44H9z"/><path d="M18 23h28M18 32h20"/></svg>`};
function roleHTML(kind,title,sub){const map={law:['book','Wat zegt de wet?'],boa:['eye','Jouw rol als opsporingsambtenaar'],ovj:['file','Van feiten naar dossier'],judge:['scale','Juridische beoordeling']};const [ic,def]=map[kind]||map.boa;return `<div class="pv-role pv-${kind}"><div class="pv-icon">${icons[ic]}</div><div><strong>${title||def}</strong><span>${sub||''}</span></div></div>`}
function classify(d){if(!d||!d.head)return;let st=d.getElementById('jslf-premium-v9');if(!st){st=d.createElement('style');st.id='jslf-premium-v9';st.textContent=css;d.head.appendChild(st)}const card=d.querySelector('#app > .card, main .card');if(!card)return;card.classList.remove('jslf-normal','jslf-goals','jslf-question','jslf-wide','jslf-law','jslf-paired','pv-question');const m=card.querySelector('.main');const text=(card.textContent||'').toLowerCase();if(card.querySelector('.q-text,.opts')){card.classList.add('jslf-question','pv-question');decorateQuestion(d,card,text);decorateFeedback(d,card);return}if(!m){card.classList.add('jslf-normal');return}const title=(m.querySelector('.ptitle')?.textContent||'').trim().toLowerCase();const directCards=m.querySelectorAll(':scope > .kaart').length;const realWide=!!m.querySelector(':scope > table,:scope > .table-wrap,:scope > figure,:scope > .illustratie,:scope > .infographic,:scope > .visual-wrap');if(title==='leerdoelen'||text.includes('wat je na dit onderwerp kunt'))card.classList.add('jslf-goals');else if(text.includes('artikel 429ter')&&(text.includes('wettekst')||text.includes('juridisch kader')))card.classList.add('jslf-law');else if(realWide)card.classList.add('jslf-wide');else if(directCards>=2)card.classList.add('jslf-paired');else card.classList.add('jslf-normal');decoratePage(d,m,text,title)}
function decoratePage(d,m,text,title){if(m.querySelector('.pv-role,.pv-hero,.pv-process'))return;let html='';if(title==='leerdoelen'||text.includes('leerdoelen'))html=roleHTML('boa','Wat ga je leren?','Kennis die je helpt om op straat te herkennen, beoordelen en vastleggen.');else if(text.includes('wettekst')||text.includes('artikel 429ter'))html=roleHTML('law','Artikel 429ter Sr','De wettelijke basis staat centraal. Wettekst en uitleg blijven duidelijk van elkaar gescheiden.');else if(text.includes('proces-verbaal')||text.includes('verbalis'))html=roleHTML('boa','Van waarneming naar proces-verbaal','Leg objectieve feiten, omstandigheden en bronnen zorgvuldig vast.');else if(text.includes('jurisprudent')||text.includes('rechter')||text.includes('rechtbank'))html=roleHTML('judge','Hoe wordt dit juridisch beoordeeld?','De rechter beoordeelt het bewijs en de concrete omstandigheden van de zaak.');else if(text.includes('officier van justitie')||text.includes('openbaar ministerie'))html=roleHTML('ovj','Van proces-verbaal naar het OM','Het dossier vormt de basis voor de verdere strafrechtelijke beoordeling.');else if(text.includes('bewijs')||text.includes('waarneming')||text.includes('camera'))html=roleHTML('boa','Kijk, luister en leg vast','Eigen waarneming, verklaringen en ander bewijs krijgen ieder een duidelijke plaats.');else if(text.includes('praktijk')||text.includes('context'))html=roleHTML('boa','Van wet naar praktijk','Kijk naar de concrete gedraging én de omstandigheden waarin die plaatsvindt.');if(html)m.insertAdjacentHTML('afterbegin',html);if((text.includes('bewijs')&&text.includes('rechter'))||(text.includes('proces-verbaal')&&text.includes('officier van justitie'))){m.insertAdjacentHTML('beforeend',`<div class="pv-process"><div class="pv-step"><div class="pv-icon">${icons.eye}</div><strong>Waarnemen</strong></div><div class="pv-step"><div class="pv-icon">${icons.file}</div><strong>Vastleggen</strong></div><div class="pv-step"><div class="pv-icon">${icons.file}</div><strong>OM</strong></div><div class="pv-step"><div class="pv-icon">${icons.scale}</div><strong>Rechter</strong></div></div>`)}}
function decorateQuestion(d,card,text){const q=card.querySelector('.q-text');if(!q)return;const host=q.parentElement;if(host.querySelector('.pv-qmark'))return;const situ=text.includes('situatie')||text.includes('boa')||text.includes('opsporingsambtenaar');host.insertAdjacentHTML('afterbegin',situ?roleHTML('boa','Praktijksituatie','Lees de feiten zorgvuldig. De visual geeft geen antwoord weg.'):`<div class="pv-qmark" aria-hidden="true">?</div>`)}
function decorateFeedback(d,card){card.querySelectorAll('.fb').forEach(f=>{if(f.dataset.pv)return;f.dataset.pv='1';const ok=f.classList.contains('ok');f.insertAdjacentHTML('afterbegin',`<div class="pv-feedback ${ok?'ok':'no'}"><div class="big">${ok?'✓':'×'}</div><div><strong>${ok?'Juist':'Nog niet juist'}</strong><br><span>${ok?'Bekijk waarom dit antwoord klopt.':'Bekijk het juiste antwoord en de uitleg.'}</span></div></div>`)})}
const f=document.getElementById('course');f.addEventListener('load',()=>{const d=f.contentDocument;classify(d);const target=d.getElementById('app')||d.body;new MutationObserver(()=>classify(d)).observe(target,{childList:true,subtree:true})});
</script></body></html>
