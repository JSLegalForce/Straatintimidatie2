<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive preview — Seksuele straatintimidatie</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#f2f4f8}iframe{display:block}</style></head><body><iframe id="course" src="./?responsive-preview=1" title="E-learning Seksuele straatintimidatie"></iframe><script>const css=`/* JSLF responsive preview */:root{--kolom:1180px!important;--content-readable:68ch;--gap-lg:clamp(16px,2vw,28px)}main{width:min(100% - 32px,var(--kolom))!important;max-width:var(--kolom)!important;padding:14px 0 28px!important}.card{padding:clamp(18px,2.2vw,30px) clamp(18px,3vw,38px)!important;overflow:hidden}.main{max-width:none}.main>p,.main>.lees{max-width:var(--content-readable)}.ptitle{font-size:clamp(1.35rem,2vw,1.65rem)!important}.tophead{margin-bottom:14px!important}.kaart{margin-top:10px!important;box-shadow:none!important;border-color:#d7deec!important}.nav{clear:both;padding-top:4px}.k-kader{background:#f5f7fc!important}.k-praktijk{background:#eff8f7!important}.k-onthoud{background:#eaf6ef!important}.k-letop{background:#fff8e8!important}@media(min-width:900px){.learning-page .main{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap-lg);align-items:start}.learning-page .main>*{grid-column:1/-1;margin-top:0}.learning-page .main>p,.learning-page .main>.lees{grid-column:1/9}.learning-page .main>.kaart:nth-of-type(2n+1):not(.k-letop):not(.k-onthoud){grid-column:1/7}.learning-page .main>.kaart:nth-of-type(2n):not(.k-letop):not(.k-onthoud){grid-column:7/-1}.learning-page .main>.k-letop,.learning-page .main>.k-onthoud,.learning-page .main>.bronnen-blok{grid-column:1/-1}.law-page .main{grid-template-columns:minmax(0,1.55fr) minmax(300px,.85fr)}.law-page .main>*{grid-column:auto}.law-page .main>.ptitle,.law-page .main>.pintro,.law-page .main>p:first-of-type{grid-column:1/-1;max-width:75ch}.law-page .main>.kaart:first-of-type{grid-column:1;grid-row:span 2;margin-top:0}.law-page .main>.kaart:nth-of-type(2),.law-page .main>.kaart:nth-of-type(3){grid-column:2;margin-top:0}.law-page .main>.kaart:nth-of-type(n+4),.law-page .main>.bronnen-blok{grid-column:1/-1}.question-page{max-width:920px;margin-inline:auto}.question-page .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.case-page .main{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.case-page .main>.ptitle,.case-page .main>.pintro,.case-page .main>.bronnen-blok{grid-column:1/-1}}@media(min-width:700px) and (max-width:899px){main{width:min(100% - 28px,860px)!important}.card{padding:22px 26px!important}}@media(max-width:699px){main{width:100%!important;padding:10px 12px 22px!important}.card{padding:17px 15px 19px!important}.ptitle{font-size:1.32rem!important}.main p,.lees,.kaart-b p,.kaart-b li{font-size:1rem!important;line-height:1.55!important}.kaart{padding:12px 14px!important}.btn{min-height:46px}.opts{grid-template-columns:1fr!important}.opt{min-height:48px}.bronnen-blok{overflow-wrap:anywhere}svg,img{max-width:100%;height:auto}}@media(max-width:360px){main{padding-inline:8px!important}.card{padding-inline:12px!important}.nav{flex-wrap:wrap}.nav .sp{display:none}.nav .btn{flex:1 1 46%}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}`;function enhance(d){if(!d||!d.head)return;let st=d.getElementById('jslf-responsive-preview');if(!st){st=d.createElement('style');st.id='jslf-responsive-preview';st.textContent=css;d.head.appendChild(st)}const card=d.querySelector('#app > .card,main .card');if(!card)return;card.classList.remove('learning-page','law-page','question-page','case-page');const t=(card.textContent||'').toLowerCase();if(card.querySelector('.q-text,.opts'))card.classList.add('question-page');else{card.classList.add('learning-page');if(t.includes('artikel 429ter')&&(t.includes('wettekst')||t.includes('juridisch kader')))card.classList.add('law-page');if(t.includes('praktijkcasus')||t.includes('situatie'))card.classList.add('case-page')}}const f=document.getElementById('course');f.addEventListener('load',()=>{const d=f.contentDocument;enhance(d);new MutationObserver(()=>enhance(d)).observe(d.getElementById('app')||d.body,{childList:true,subtree:true})});</script></body></html>
