<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Definitieve visual polish — Seksuele straatintimidatie</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#f2f4f8}iframe{display:block}</style></head><body><iframe id="course" src="./?visual-polish=6" title="E-learning Seksuele straatintimidatie"></iframe><script>
const css=`/* JSLF DEFINITIVE COMPOSITION v6 */
:root{--shell:1420px;--course:1180px;--reading:820px}
main{width:min(calc(100% - 56px),var(--shell))!important;max-width:var(--shell)!important;padding:16px 0 30px!important}.status{width:min(100%,var(--course));margin:0 auto 12px!important}.card{width:min(100%,var(--course));margin-inline:auto;padding:30px 40px 28px!important;overflow:hidden;box-shadow:0 10px 34px rgba(26,42,94,.08)!important}.tophead{margin:0 0 22px!important;padding:0 0 16px!important;align-items:center!important}.itile{width:42px!important;height:42px!important}.tophead .ohint,.tophead .otitel{line-height:1.25}.main{max-width:none}.ptitle{font-size:clamp(1.45rem,1.7vw,1.8rem)!important;line-height:1.18!important;margin:0 0 18px!important}.pintro{margin:0 0 18px!important}.main>p,.main>.lees{font-size:1.06rem!important;line-height:1.58!important;margin:0 0 14px!important}.kaart{margin:16px 0 0!important;padding:16px 20px!important;box-shadow:none!important;border-color:#d9e0ed!important}.kaart-h{margin-bottom:8px!important}.kaart-b p,.kaart-b li{line-height:1.52!important}.k-kader{background:#f7f9fd!important}.k-praktijk{background:#f1f8f8!important}.k-onthoud{background:#eaf6ef!important}.k-letop{background:#fff8e8!important}.bronnen-blok{margin-top:22px!important;padding-top:15px!important}.nav{margin-top:24px!important;padding-top:18px!important;border-top:1px solid #e2e7f0;display:grid!important;grid-template-columns:auto 1fr auto!important;align-items:center!important;gap:16px!important}.nav .sp{display:block!important}.nav .btn:first-child{justify-self:start}.nav .btn:last-child{justify-self:end}.nav .btn{min-width:132px!important;min-height:46px}
/* Normale pagina: ALLES onder de onderwerpheader vormt één gecentreerde leerzone. */
.card.center-page .main,.card.center-page .nav{width:min(100%,var(--reading))!important;margin-left:auto!important;margin-right:auto!important}.card.center-page .main>p,.card.center-page .main>.lees,.card.center-page .pintro{max-width:none!important}.card.center-page .bronnen-blok{max-width:100%}.card.center-page .main>p+p{margin-top:6px!important}
.wide-page .main,.wide-page .nav,.paired-page .main,.paired-page .nav,.law-page .main,.law-page .nav{width:100%!important}.wide-page .main>p,.wide-page .main>.lees,.wide-page .pintro{max-width:820px}
@media(min-width:1000px){.paired-page .main{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px;align-items:start}.paired-page .main>.ptitle,.paired-page .main>.pintro,.paired-page .main>p,.paired-page .main>.lees,.paired-page .main>.bronnen-blok{grid-column:1/-1}.paired-page .main>.kaart{margin-top:0!important}.law-page .main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.85fr);gap:20px 30px;align-items:start}.law-page .main>.ptitle,.law-page .main>.pintro,.law-page .main>p:first-of-type{grid-column:1/-1}.law-page .main>.kaart:first-of-type{grid-column:1;grid-row:span 2;margin-top:0!important}.law-page .main>.kaart:nth-of-type(2),.law-page .main>.kaart:nth-of-type(3){grid-column:2;margin-top:0!important}.law-page .main>.kaart:nth-of-type(n+4),.law-page .main>.bronnen-blok{grid-column:1/-1}.question-page{width:min(100%,960px)!important}.question-page .main,.question-page .nav{width:100%!important}.question-page .q-text{max-width:760px;margin-inline:auto}.question-page .opts{display:grid!important;grid-template-columns:1fr 1fr;gap:10px 12px!important}}
@media(min-width:700px) and (max-width:999px){main{width:min(calc(100% - 32px),920px)!important}.card{padding:25px 28px 24px!important}.card.center-page .main,.card.center-page .nav{width:min(100%,720px)!important}.paired-page .main,.law-page .main{display:block!important}.paired-page .main>.kaart,.law-page .main>.kaart{margin-top:14px!important}}
@media(max-width:699px){main{width:100%!important;padding:10px 12px 22px!important}.status{margin-bottom:10px!important}.card{width:100%;padding:18px 16px 20px!important;border-radius:10px!important}.tophead{gap:10px!important;margin-bottom:18px!important;padding-bottom:14px!important;align-items:flex-start!important}.itile{width:38px!important;height:38px!important}.ptitle{font-size:1.34rem!important;margin-bottom:15px!important}.main p,.lees,.kaart-b p,.kaart-b li{font-size:1rem!important;line-height:1.52!important}.kaart{padding:13px 14px!important;margin-top:12px!important}.bronnen-blok{margin-top:18px!important;overflow-wrap:anywhere}.card .main,.card .nav{width:100%!important;margin-left:auto!important;margin-right:auto!important}.nav{margin-top:20px!important;padding-top:16px!important;gap:8px!important}.nav .btn{min-width:0!important;min-height:48px;padding:12px 14px!important}.opts{grid-template-columns:1fr!important}.opt{min-height:48px}svg,img{max-width:100%;height:auto}}
@media(max-width:360px){main{padding-inline:8px!important}.card{padding-inline:13px!important}.nav{grid-template-columns:1fr 1fr!important}.nav .sp{display:none!important}.nav .btn{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}`;
function enhance(d){if(!d||!d.head)return;let st=d.getElementById('jslf-definitive-composition');if(!st){st=d.createElement('style');st.id='jslf-definitive-composition';st.textContent=css;d.head.appendChild(st)}const card=d.querySelector('#app > .card,main .card');if(!card)return;card.classList.remove('center-page','wide-page','paired-page','law-page','question-page');const main=card.querySelector('.main');const text=(card.textContent||'').toLowerCase();if(card.querySelector('.q-text,.opts')){card.classList.add('question-page','center-page')}else if(text.includes('artikel 429ter')&&(text.includes('wettekst')||text.includes('juridisch kader'))){card.classList.add('law-page')}else if(main){const cards=main.querySelectorAll(':scope > .kaart').length;const table=!!main.querySelector(':scope > table,:scope > .table-wrap');const substantialVisual=!!main.querySelector(':scope > figure,:scope > .illustratie,:scope > .infographic,:scope > .visual-wrap');if(cards>=2&&!substantialVisual&&!table)card.classList.add('paired-page');else if(substantialVisual||table)card.classList.add('wide-page');else card.classList.add('center-page')}else card.classList.add('center-page');d.querySelectorAll('svg').forEach(s=>s.setAttribute('focusable','false'))}
const f=document.getElementById('course');f.addEventListener('load',()=>{const d=f.contentDocument;enhance(d);new MutationObserver(()=>enhance(d)).observe(d.getElementById('app')||d.body,{childList:true,subtree:true})});
</script></body></html>
