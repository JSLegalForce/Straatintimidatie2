<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JS Legal Force — definitieve layoutcontrole</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#f2f4f8}iframe{display:block}</style></head><body><iframe id="course" src="./?layout=definitief-8" title="E-learning Seksuele straatintimidatie"></iframe><script>
const css=`/* JSLF DETERMINISTIC COURSE LAYOUT v8 */
:root{--shell:1420px;--cardmax:1280px;--reading:860px}
main{width:min(calc(100% - 56px),var(--shell))!important;max-width:var(--shell)!important;margin-inline:auto!important;padding:16px 0 30px!important}.status{width:min(100%,var(--cardmax));margin:0 auto 12px!important}.card{width:min(100%,var(--cardmax));margin-inline:auto!important;padding:30px 42px 28px!important;overflow:hidden;box-shadow:0 10px 34px rgba(26,42,94,.08)!important}.tophead{margin:0 0 24px!important;padding:0 0 16px!important;align-items:center!important}.itile{width:42px!important;height:42px!important}.tophead .ohint,.tophead .otitel{line-height:1.25}.main{max-width:none!important}.ptitle{font-size:clamp(1.45rem,1.7vw,1.8rem)!important;line-height:1.18!important;margin:0 0 18px!important}.pintro{margin:0 0 18px!important}.main p,.lees{line-height:1.58!important}.main>p{margin-bottom:14px!important}.kaart{margin:14px 0 0!important;padding:16px 20px!important;box-shadow:none!important;border-color:#d9e0ed!important}.kaart-h{margin-bottom:8px!important}.kaart-b p,.kaart-b li{line-height:1.52!important}.k-kader{background:#f7f9fd!important}.k-praktijk{background:#f1f8f8!important}.k-onthoud{background:#eaf6ef!important}.k-letop{background:#fff8e8!important}.bronnen-blok{margin-top:22px!important;padding-top:15px!important}.nav{margin-top:24px!important;padding-top:18px!important;border-top:1px solid #e2e7f0;display:grid!important;grid-template-columns:auto 1fr auto!important;align-items:center!important;gap:16px!important}.nav .sp{display:block!important}.nav .btn:first-child{justify-self:start}.nav .btn:last-child{justify-self:end}.nav .btn{min-width:132px!important;min-height:46px}
/* Short learning units are one deliberately centered composition. */
.jslf-normal{width:min(100%,1040px)!important}.jslf-normal .tophead,.jslf-normal .main,.jslf-normal .nav{width:min(100%,var(--reading))!important;margin-left:auto!important;margin-right:auto!important}.jslf-normal .tophead{margin-bottom:24px!important}.jslf-normal .main>p,.jslf-normal .main>.lees,.jslf-normal .pintro{max-width:none!important}.jslf-normal .bronnen-blok{max-width:100%!important}
.jslf-goals{width:min(100%,1080px)!important}.jslf-goals .tophead,.jslf-goals .main,.jslf-goals .nav{width:min(100%,900px)!important;margin-inline:auto!important}.jslf-goals .tophead{margin-bottom:24px!important}.jslf-goals ul.lo{width:100%!important}.jslf-goals ul.lo li{line-height:1.5!important;margin:10px 0!important}
.jslf-question{width:min(100%,1040px)!important}.jslf-question .tophead,.jslf-question .main,.jslf-question .nav{width:min(100%,900px)!important;margin-inline:auto!important}.jslf-question .tophead{margin-bottom:24px!important}.jslf-question .q-text{max-width:780px}.jslf-question .opts{width:100%}
.jslf-wide .main,.jslf-wide .nav,.jslf-law .main,.jslf-law .nav{width:100%!important}.jslf-wide .main>p,.jslf-wide .main>.lees,.jslf-wide .pintro{max-width:860px;margin-left:auto!important;margin-right:auto!important}
@media(min-width:1000px){.jslf-law .main{display:grid!important;grid-template-columns:minmax(0,1.55fr) minmax(310px,.85fr);gap:20px 30px;align-items:start}.jslf-law .main>.ptitle,.jslf-law .main>.pintro,.jslf-law .main>p:first-of-type{grid-column:1/-1;max-width:900px;margin-inline:auto!important;width:100%}.jslf-law .main>.kaart:first-of-type{grid-column:1;grid-row:span 2;margin-top:0!important}.jslf-law .main>.kaart:nth-of-type(2),.jslf-law .main>.kaart:nth-of-type(3){grid-column:2;margin-top:0!important}.jslf-law .main>.kaart:nth-of-type(n+4),.jslf-law .main>.bronnen-blok{grid-column:1/-1}.jslf-law .nav{width:min(100%,900px)!important;margin-inline:auto!important}.jslf-paired .main{display:grid!important;grid-template-columns:1fr 1fr;gap:18px 28px;align-items:start}.jslf-paired .main>.ptitle,.jslf-paired .main>.pintro,.jslf-paired .main>p,.jslf-paired .main>.lees,.jslf-paired .main>.bronnen-blok{grid-column:1/-1;max-width:900px;margin-left:auto!important;margin-right:auto!important;width:100%}.jslf-paired .main>.kaart{margin-top:0!important}.jslf-paired .nav{width:min(100%,900px)!important;margin-inline:auto!important}}
@media(min-width:700px) and (max-width:999px){main{width:min(calc(100% - 32px),940px)!important}.card{padding:25px 28px 24px!important}.jslf-normal,.jslf-goals,.jslf-question{width:100%!important}.jslf-normal .tophead,.jslf-normal .main,.jslf-normal .nav,.jslf-goals .tophead,.jslf-goals .main,.jslf-goals .nav,.jslf-question .tophead,.jslf-question .main,.jslf-question .nav{width:min(100%,760px)!important}.jslf-law .main,.jslf-paired .main{display:block!important}.jslf-law .main>.kaart,.jslf-paired .main>.kaart{margin-top:14px!important}}
@media(max-width:699px){main{width:100%!important;padding:10px 12px 22px!important}.status{margin-bottom:10px!important}.card,.jslf-normal,.jslf-goals,.jslf-question{width:100%!important;padding:18px 16px 20px!important;border-radius:10px!important}.tophead,.jslf-normal .tophead,.jslf-goals .tophead,.jslf-question .tophead{width:100%!important;gap:10px!important;margin-bottom:18px!important;padding-bottom:14px!important;align-items:flex-start!important}.itile{width:38px!important;height:38px!important}.ptitle{font-size:1.34rem!important;margin-bottom:15px!important}.main p,.lees,.kaart-b p,.kaart-b li{font-size:1rem!important;line-height:1.52!important}.kaart{padding:13px 14px!important;margin-top:12px!important}.bronnen-blok{margin-top:18px!important;overflow-wrap:anywhere}.card .main,.card .nav{width:100%!important;margin-inline:auto!important}.nav{margin-top:20px!important;padding-top:16px!important;gap:8px!important}.nav .btn{min-width:0!important;min-height:48px;padding:12px 14px!important}.opts{grid-template-columns:1fr!important}.opt{min-height:48px}svg,img{max-width:100%;height:auto}}
@media(max-width:360px){main{padding-inline:8px!important}.card{padding-inline:13px!important}.nav{grid-template-columns:1fr 1fr!important}.nav .sp{display:none!important}.nav .btn{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}`;
function classify(d){if(!d||!d.head)return;let st=d.getElementById('jslf-layout-v8');if(!st){st=d.createElement('style');st.id='jslf-layout-v8';st.textContent=css;d.head.appendChild(st)}const card=d.querySelector('#app > .card, main .card');if(!card)return;card.classList.remove('jslf-normal','jslf-goals','jslf-question','jslf-wide','jslf-law','jslf-paired');const m=card.querySelector('.main');const text=(card.textContent||'').toLowerCase();if(card.querySelector('.q-text,.opts')){card.classList.add('jslf-question');return}if(!m){card.classList.add('jslf-normal');return}const title=(m.querySelector('.ptitle')?.textContent||'').trim().toLowerCase();const directCards=m.querySelectorAll(':scope > .kaart').length;const realWide=!!m.querySelector(':scope > table,:scope > .table-wrap,:scope > figure,:scope > .illustratie,:scope > .infographic,:scope > .visual-wrap');if(title==='leerdoelen'||text.includes('wat je na dit onderwerp kunt')){card.classList.add('jslf-goals');return}if(text.includes('artikel 429ter')&&(text.includes('wettekst')||text.includes('juridisch kader'))){card.classList.add('jslf-law');return}if(realWide){card.classList.add('jslf-wide');return}if(directCards>=2){card.classList.add('jslf-paired');return}card.classList.add('jslf-normal')}
const f=document.getElementById('course');f.addEventListener('load',()=>{const d=f.contentDocument;classify(d);const target=d.getElementById('app')||d.body;new MutationObserver(()=>classify(d)).observe(target,{childList:true,subtree:true})});
</script></body></html>
