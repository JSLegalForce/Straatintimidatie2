name: Run responsive redesign
on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-responsive-redesign.yml']
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-responsive-redesign
          fetch-depth: 0
      - name: Apply responsive learning design
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* JSLF RESPONSIVE LEARNING DESIGN v2 */'
          if marker in s:
              print('already applied')
              raise SystemExit(0)
          css=r'''\n/* JSLF RESPONSIVE LEARNING DESIGN v2 */
:root{--kolom:1180px;--content-readable:68ch;--gap-lg:clamp(16px,2vw,28px)}
main{width:min(100% - 32px,var(--kolom));max-width:var(--kolom);padding:14px 0 28px}
.card{padding:clamp(18px,2.2vw,30px) clamp(18px,3vw,38px);overflow:hidden}
.main{max-width:none}.main>p,.main>.lees{max-width:var(--content-readable)}
.ptitle{font-size:clamp(1.35rem,2vw,1.65rem)}.tophead{margin-bottom:14px}.kaart{margin-top:10px}.bronnen-blok{clear:both}.nav{clear:both;padding-top:4px}
@media (min-width:900px){
 .learning-page .main{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap-lg);align-items:start}
 .learning-page .main>*{grid-column:1/-1;margin-top:0}
 .learning-page .main>p,.learning-page .main>.lees{grid-column:1/9}
 .learning-page .main>.kaart{grid-column:1/-1}
 .learning-page .main>.kaart:nth-of-type(2n+1):not(.k-letop):not(.k-onthoud){grid-column:1/7}
 .learning-page .main>.kaart:nth-of-type(2n):not(.k-letop):not(.k-onthoud){grid-column:7/-1}
 .learning-page .main>.k-letop,.learning-page .main>.k-onthoud,.learning-page .main>.bronnen-blok{grid-column:1/-1}
 .law-page .main{grid-template-columns:minmax(0,1.55fr) minmax(300px,.85fr)}
 .law-page .main>*{grid-column:auto}
 .law-page .main>.ptitle,.law-page .main>.pintro,.law-page .main>p:first-of-type{grid-column:1/-1;max-width:75ch}
 .law-page .main>.kaart:first-of-type{grid-column:1;grid-row:span 2;margin-top:0}
 .law-page .main>.kaart:nth-of-type(2),.law-page .main>.kaart:nth-of-type(3){grid-column:2;margin-top:0}
 .law-page .main>.kaart:nth-of-type(n+4),.law-page .main>.bronnen-blok{grid-column:1/-1}
 .law-page .wet{font-size:1.05rem;line-height:1.62}
 .question-page{max-width:920px;margin-inline:auto}.question-page .q-text{max-width:72ch}.question-page .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 .case-page .main{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .case-page .main>.ptitle,.case-page .main>.pintro,.case-page .main>.bronnen-blok{grid-column:1/-1}
}
.kaart{box-shadow:none;border-color:#d7deec}.kaart-h{margin-bottom:8px}
.k-kader{background:linear-gradient(135deg,#f7f9fd 0%,#f2f5fc 100%)}.k-praktijk{background:linear-gradient(135deg,#f2f9f8 0%,#edf7f6 100%)}.k-onthoud{background:linear-gradient(135deg,#eef8f2 0%,#e6f4ed 100%)}.k-letop{background:linear-gradient(135deg,#fffaf0 0%,#fff6df 100%)}
mark,.wet mark{background:#e4eafb;color:inherit;border-radius:4px;padding:.02em .18em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
@media (min-width:700px) and (max-width:899px){main{width:min(100% - 28px,860px)}.card{padding:22px 26px}.stats{grid-template-columns:repeat(3,1fr)}}
@media (max-width:699px){main{width:100%;padding:10px 12px 22px}.bar{padding:8px 10px}.bar .shield{width:32px;height:36px}.bar .shield svg{width:32px;height:36px}.substrip{font-size:.62rem;letter-spacing:.1em;padding:5px 10px}.card{padding:17px 15px 19px;border-radius:10px}.tophead{gap:10px;align-items:flex-start}.itile{width:36px;height:36px}.ptitle{font-size:1.32rem;line-height:1.2}.main p,.lees,.kaart-b p,.kaart-b li{font-size:1rem;line-height:1.55}.kaart{padding:12px 14px}.btn{min-height:46px}.nav{gap:8px;margin-top:14px}.nav .btn{padding:12px 10px}.status-row{font-size:.76rem}.opts{grid-template-columns:1fr!important}.opt{min-height:48px;padding:10px 11px}.bronnen-blok{overflow-wrap:anywhere}svg,img{max-width:100%;height:auto}}
@media (max-width:360px){main{padding-inline:8px}.card{padding-inline:12px}.bar .merk{font-size:1.05rem}.substrip{font-size:.56rem}.nav{flex-wrap:wrap}.nav .sp{display:none}.nav .btn{flex:1 1 46%}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
'''
          js=r'''\n<script>
(function(){function classify(){const card=document.querySelector('#app > .card, main .card');if(!card)return;card.classList.remove('learning-page','law-page','question-page','case-page');const text=(card.textContent||'').toLowerCase();if(card.querySelector('.q-text,.opts'))card.classList.add('question-page');else{card.classList.add('learning-page');if(text.includes('artikel 429ter')&&(text.includes('wettekst')||text.includes('juridisch kader')))card.classList.add('law-page');if(text.includes('praktijkcasus')||text.includes('situatie'))card.classList.add('case-page')}}const target=document.getElementById('app')||document.body;new MutationObserver(classify).observe(target,{childList:true,subtree:true});classify()})();
</script>\n'''
          s=s.replace('</style>',css+'\n</style>',1).replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Static QA
        run: |
          grep -q 'JSLF RESPONSIVE LEARNING DESIGN v2' index.html
          grep -q 'function setScreen' index.html
          grep -q 'eindtoets' index.html
          grep -q 'certificaat' index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('<style>')==s.count('</style>')
          assert s.count('<script')==s.count('</script>')
          assert '</html>' in s
          print('QA passed',len(s))
          PY
      - name: Commit to work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Apply responsive learning design across e-learning'
          git push origin ux-responsive-redesign
